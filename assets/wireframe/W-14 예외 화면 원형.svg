<svg viewBox="0 0 722 482" width="100%" style="max-width:722px;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard,-apple-system,sans-serif"><text x="1" y="22" font-size="12.5" font-weight="700" fill="#111111">W-14 예외 화면 원형 · 6종 공통 · 양 채널</text>
