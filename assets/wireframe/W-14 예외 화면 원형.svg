<text x="1" y="395" font-size="10.5" fill="#767676">· 선정축 ③신설 ④전역</text>
<text x="1" y="414" font-size="10.5" fill="#767676">· 122 H9 — AS-IS 명세에 오류·404 화면이 0건. 통째로 신설</text>
<text x="1" y="433" font-size="10.5" fill="#767676">· 원형 1개 + 유형별 문구·대안 행동만 갈린다 → 6종을 6화면으로 그리지 않는다</text>
<text x="1" y="452" font-size="10.5" fill="#767676">· ⚠️ 이 화면군의 실제 화면 수는 여기서 확정하지 않는다 — §7-1</text></svg>