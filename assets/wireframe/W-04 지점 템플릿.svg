<text x="1" y="517" font-size="10.5" fill="#767676">· ⛔ 이 템플릿이 성립하지 않으면 컨셉키워드 K2 실패. 지점마다 다른 골격을 만들면 L1-1이 16배로 불어난다</text>
<text x="1" y="536" font-size="10.5" fill="#767676">· 특성 모듈(FN-B06)이 "구조는 통일, 특성은 모듈" 의 실행 장치 — 더현대 서울 같은 플래그십의 표현 여지</text></svg>