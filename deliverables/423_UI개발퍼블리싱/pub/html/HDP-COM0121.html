<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 — 신청 내용은 보존됩니다 | 현대백화점</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>
<!-- 예외·안내형: Header 비제공 · History back 불가(레이어 전제) — 332 §6 사전 문구 그대로 -->
<main data-screen="HDP-COM0121" class="hd-wrap" style="max-width:480px">
  <div class="hd-except" role="alert">
    <p aria-hidden="true" style="font-size:var(--hd-t-display);color:var(--hd-state-error)">!</p>
    <h1 class="hd-except__title">결제가 완료되지 않았습니다.</h1>
    <p class="hd-except__body">신청 내용은 그대로 있습니다. 다시 시도해 주세요.</p>
    <div class="hd-except__actions">
      <button class="hd-btn hd-btn--primary">다시 시도</button>
      <button class="hd-btn hd-btn--cancel">신청 취소</button>
    </div>
  </div>
</main>
</body>
</html>
