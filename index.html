우</strong></td><td>C 30화면의 흐름만 설계. B 21화면은 &quot;H.Point 전환 후 별건&quot;으로 표기</td></tr><tr><td><strong>321 기능정의</strong></td><td>C 영역의 채널 동일 기능 집합 정의 (K3)</td></tr><tr><td><strong>341 화면명세서</strong></td><td>이 목록이 회원 영역의 커버리지 기준. <strong>A·B 38화면은 명세 대상 아님을 명시</strong></td></tr><tr><td><strong>911 변경관리</strong></td><td>B 21화면의 전환 후 처리는 별건 협의 대상</td></tr></tbody></table></div><h2>⚠️ 이 분류의 한계</h2><ol><li><strong>화면명(名)으로만 판정했다</strong> — 등급 C(캡처 0장)라 화면 안을 못 봤다. <code>_카드보유Y</code> 같은 조건부 화면명은 실제 기능을 추정한 것이다.</li><li><strong>경계 사례가 있다</strong> — <code>MMY1.3 본인확인</code>·<code>MMY1.3.1.1L 본인인증L</code>은 마이페이지 진입 인증이라 C로 뒀으나, H.Point 전환 시 함께 바뀔 가능성이 있다. <code>[확인필요]</code></li><li><strong>고객 확인 미수행</strong> — 이 분류는 시뮬레이션 결정이다. 실제 프로젝트라면 <strong>고객사 승인이 필요</strong>하다.</li></ol>", "bytes": 14583, "deliv": ""}, {"name": "_대조_방향성분석_V0.4.md", "path": "sim-project/200_Discover/240_분석종합및UX전략수립/_대조_방향성분석_V0.4.md", "html": "<h1>봉인 해제 대조 — <code>HDDS_방향성분석_V0.4_220915</code> vs 241·242·243</h1><blockquote>해제: 2026-08-06 · 조건 충족(실행계획서 §3 — &quot;240 분석종합·UX전략 생성 완료&quot;)<br>원본: PDF 11.6MB + PPTX 29.3MB · <strong>32슬라이드</strong> · 2022-09-15 (착수 9/19 <strong>이전</strong>, 1차 워크샵 9/23 이전)<br>대조 대상: 241 고객여정맵·분석시사점 · <strong>242 UX컨셉키워드</strong> · <strong>243 UX전략보고서</strong> (+126 범위정의서)</blockquote><hr><h2>0. 원본의 정체</h2><div class='tw'><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td>구성</td><td><strong>WEB 방향성 분석</strong>(S2~S25) + <strong>APP 방향성 분석</strong>(S26~S32)</td></tr><tr><td>방법</td><td><code>ASIS 채널별 Pain Point 분석 → 카테고리 그룹핑 → 도출한 개선 포인트 기준으로 벤치마킹</code> (S3 명시)</td></tr><tr><td>분석축</td><td><strong>메인 · 마이페이지 · IA · UI/구조</strong> 4개</td></tr><tr><td>시점</td><td>착수 <strong>4일 전</strong>. 요구사항정의서 V0.7(9/22)·1차 워크샵(9/23)보다 <strong>앞선다</strong></td></tr></tbody></table></div><p><strong>즉 이 문서는 241~243의 정답지가 아니라 그보다 앞선 「착수 직전 방향 제안」이다.</strong> 그럼에도 OSSP 240(분석종합·UX전략)이 산출해야 할 것을 실질적으로 담고 있어 대조가 성립한다.</p><h3>원본의 최종 방향 선언 (S25 · WEB)</h3><blockquote><strong>&quot;PC와 M.web의 일원화를 통해 두 채널을 이용하는 사용자에게 일관된 경험을 제공하여 유의미한 체류를 할 수 있는 아카이브(허브) 형성&quot;</strong><br><br>- 축1 <strong>일원화</strong> — 통일된 구조와 UI 개선 / IA 구조 통일 및 개선<br>- 축2 <strong>현대백화점만의 특화 서비스 강조 및 사용성 개선</strong></blockquote><hr><h2>1. 총평 — <strong>결론은 수렴, 프레이밍은 다르다</strong></h2><div class='tw'><table><thead><tr><th></th><th>원본</th><th>시뮬레이션 (242)</th></tr></thead><tbody><tr><td><strong>주축</strong></td><td><strong>일원화</strong> (어떻게)</td><td><strong>지점 기점</strong>(K1) + 템플릿(K2) (무엇을)</td></tr><tr><td>부축</td><td>특화 서비스 강조</td><td>계정 동등성(K3) · 예외 우선(K4)</td></tr></tbody></table></div><p><strong>가장 중요한 발견</strong>: 내가 만든 후보안 A(지점)/B(멤버십)/C(콘텐츠)는 전부 <strong>&quot;무엇을 중심에 두느냐&quot;</strong> 축이었다. 원본은 <strong>&quot;어떻게 통일할 것인가&quot;</strong> 를 축으로 삼았다. <strong>차원이 다르다.</strong></p><p>그런데 <strong>선택된 A+B 조합의 실질 내용은 원본의 일원화와 상당히 겹친다</strong> — K1(진입 통일) + K2(템플릿 통일) + K3(계정 통일)을 합치면 사실상 &quot;일원화&quot;다. <strong>결과는 같은 곳에 도착했으나 원본의 프레이밍이 더 단순하고 강하다.</strong></p><blockquote>원본의 &quot;일원화&quot;는 P1(채널 분리)·P2(반복 구조)·P4(회원 전환)를 한 단어로 관통한다. 내 K1(지점)은 P1의 <strong>진입 부분만</strong> 다루고 나머지를 K2·K3에 나눠 맡겼다. <strong>후보안 구성 단계에서 &quot;일원화 축&quot; 자체가 선택지에 없었다</strong> — 이것이 이번 대조의 최대 수확이다.</blockquote><hr><h2>2. 일치 — 독립적으로 같은 결론에 도달 (7건)</h2><div class='tw'><table><thead><tr><th>#</th><th>원본</th><th>시뮬레이션</th><th>판정</th></tr></thead><tbody><tr><td>M-1</td><td><strong>일원화가 최상위 방향</strong> (S25)</td><td>K1 진입 통일 + K3 계정 통일 + K2 템플릿 통일</td><td><strong>일치</strong> (분산 표현)</td></tr><tr><td>M-2</td><td>&quot;<strong>통일된 점포안내 템플릿 내에 점포별 특성 추가</strong>&quot; (S24·S25)</td><td>K2 &quot;한 번 만들고 지점마다 붙인다&quot;</td><td><strong>거의 동일</strong> — §3-1 참조</td></tr><tr><td>M-3</td><td>마이페이지 <strong>채널별 정보 결손</strong> — &quot;로그인 기록보기·회원등급차트는 PC web만 / U멤버십은 M.web만&quot; (S9)</td><td>122 A3 채널 동등성 결손 <strong>9건</strong> — 비밀번호 변경·차량번호·H.Point 전환</td><td><strong>같은 현상, 다른 사례</strong>. 원본=U멤버십, 시뮬=차량번호. <strong>로그인 기록보기는 양쪽 다 발견</strong></td></tr><tr><td>M-4</td><td><strong>채널별 메뉴명 불일치</strong> — 프리미엄서비스/우수고객프로그램, 수강신청/강좌찾기 (S15)</td><td>122 H4 브랜드 표기 불일치 — <code>PEER</code>/<code>피어</code>, <code>위마켓</code>/<code>위마캣</code></td><td><strong>같은 축, 다른 층위</strong>. 원본=메뉴명, 시뮬=브랜드명</td></tr><tr><td>M-5</td><td><strong>CH1985·문화센터 하위 메뉴 중복</strong> (S14)</td><td>241 O-7 &quot;같은 문화센터 정보가 두 메뉴 체계로 갈라짐&quot;</td><td><strong>일치</strong></td></tr><tr><td>M-6</td><td><strong>점포 분류 기준 모호</strong> — PC 4분류 vs M.web 2분류/4그룹핑 (S13)</td><td>워크숍 기반 지점 분류 변경 · K1 지점 컨텍스트 통일</td><td><strong>일치</strong></td></tr><tr><td>M-7</td><td><strong>지점선택 UI가 경로마다 다름</strong> (S21)</td><td>K1 &quot;지점 선택을 양 채널 공통 진입점으로&quot;</td><td><strong>일치</strong></td></tr></tbody></table></div><blockquote>M-3·M-4·M-5는 <strong>원본을 보지 않고 122 실측만으로 독립 발견</strong>했다. 화면명세서의 구조 컬럼만으로 채널 불일치를 잡아낼 수 있음이 확인됐다.</blockquote><hr><h2>3. 원본이 낫다 (4건)</h2><h3>3-1. K2의 trade-off를 잘못 잡았다</h3><div class='tw'><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td>원본 (S24)</td><td>&quot;통일된 점포안내 템플릿 내에 <strong>점포별 특성 추가</strong>&quot; — 구조는 통일, 특성은 살린다</td></tr><tr><td>시뮬 (K2 trade-off)</td><td>&quot;<strong>덜 중시</strong>: 지점별·카드별 개성 연출 · 특정 지점의 예외적 표현&quot;</td></tr></tbody></table></div><p><strong>원본이 옳다.</strong> 원본은 벤치마킹(신세계·롯데)에서 <em>&quot;기본적인 구조를 맞춘 후, 이벤트 모듈·아트&amp;컬처 모듈 등을 통해 점포 종류에 따른 차별화&quot;</em> 를 확인하고 <strong>통일과 개성을 동시에</strong> 잡았다. 내 K2는 개성을 포기 항목으로 적어 <strong>더현대 서울 같은 플래그십의 표현 여지를 스스로 닫았다.</strong> → <strong>242 수정 필요.</strong></p><h3>3-2. 메인 화면 분석이 통째로 없다</h3><p>원본 S4~S8은 메인을 집중 분석한다.</p><div class='tw'><table><thead><tr><th>원본이 짚은 것</th><th>시뮬</th></tr></thead><tbody><tr><td>맥락 없는 게이트성 썸네일 나열 → 오래 체류 못 함</td><td>❌</td></tr><tr><td><strong>로그인 전/후 관계없이 동일 콘텐츠 나열</strong></td><td>❌</td></tr><tr><td>더현대닷컴 게이트가 예상치 못하게 노출돼 <strong>불필요한 Depth로 느껴짐</strong></td><td>❌</td></tr><tr><td>의미 전달이 직관적이지 않은 프로모션 이미지</td><td>❌</td></tr></tbody></table></div><p><strong>시뮬레이션은 메인을 &quot;본화면 6개, 공수 비중 1.0%&quot;로만 다뤘다.</strong> 화면 수가 적어 중요도를 낮게 본 것인데, 실제로는 <strong>진입 지점이라 콘텐츠 구성이 전략의 핵심</strong>이다.</p><blockquote><strong>원인은 등급 C</strong>(캡처 0장)다. 화면명세서에는 화면 목록만 있고 <strong>화면 안의 콘텐츠 구성이 없다.</strong> 122가 &quot;메인은 화면 수가 아니라 모듈·컴포넌트 밀도로 공수가 결정되는 예외&quot;라고 적기는 했으나, <strong>그 밀도가 무엇인지는 볼 수 없었다.</strong></blockquote><h3>3-3. APP 트랙이 없다</h3><p>원본은 APP을 별도로 6슬라이드 분석했다 — 지점 정보를 모은 메인 · MY정보 접근성 · 하단 GNB · H.Point 바코드 · 블루투스 센싱 · 개인별 즐겨찾기. 시뮬레이션은 App 특화 4건을 <strong><code>[규모미상]</code>으로만</strong> 처리했다(126 S-3). 원본 S27이 근거 문서를 명시한다 — <code>&#x27;22.05.본사.커뮤.현대백화점 앱 UX.UI 개선_0524.pdf&#x27;</code>. <strong>그 문서는 인풋 동결 목록(I1~I8)에 없다.</strong></p><h3>3-4. &quot;유의미한 체류&quot;라는 목표를 못 세웠다</h3><div class='tw'><table><thead><tr><th></th><th>목표</th></tr></thead><tbody><tr><td>원본</td><td>일관된 경험 → <strong>유의미한 체류</strong> → <strong>아카이브(허브) 형성</strong></td></tr><tr><td>시뮬 (K1)</td><td><strong>오프라인 방문 유도</strong></td></tr></tbody></table></div><p><strong>방향이 다르다.</strong> 원본은 온라인 <strong>체류</strong>를, 나는 오프라인 <strong>유도</strong>를 지향했다. 내 근거는 121 S6(리오프닝)과 채널 성격(방문 유도)이었는데, 원본은 같은 채널을 <strong>아카이브·허브</strong>로 규정했다. 126 O-2(&quot;분산된 자사 채널의 허브 역할 강화&quot;)에서 이미 허브를 짚어놓고도 <strong>K1에서 방문 유도로 좁혔다.</strong></p><hr><h2>4. 시뮬레이션이 낫다 (5건)</h2><div class='tw'><table><thead><tr><th>#</th><th>시뮬</th><th>원본</th><th>왜 중요한가</th></tr></thead><tbody><tr><td><strong>B-1</strong></td><td><strong>K4 예외·오류 화면</strong> — 명세 0건, 카드신청 취소 경로 0건</td><td><strong>없음</strong> (32슬라이드 전체에 예외 처리 언급 0)</td><td>오픈 후 운영 비용에 직결. <strong>원본에 완전히 빠진 축</strong></td></tr><tr><td>B-2</td><td><strong>규모 3중 기준선</strong> 1,344 / 1,003 / <strong>574</strong> + 영역별 비중</td><td>없음</td><td>공수 산정의 근거. 원본은 방향 문서라 규모를 안 다룸</td></tr><tr><td>B-3</td><td><strong>H.Point 전환 리스크</strong> — PC 전용 + 212 G2 개인정보 동의 재획득</td><td>없음</td><td>전환일(23.1.1)이 오픈과 겹침. <strong>법적 리스크</strong></td></tr><tr><td>B-4</td><td><strong>회원 메뉴 경계 68화면 미결</strong></td><td>없음</td><td>원본이 9/15인데 이 이슈는 9/20 회신(#14)에서 나옴 — <strong>시점차</strong></td></tr><tr><td>B-5</td><td><strong>근거 한계 명시</strong> — 사용자 조사 0건, K1이 미검증 가정 위에 섰음</td><td>없음</td><td>원본은 벤치마킹 근거는 대지만 <strong>자기 한계는 안 적음</strong></td></tr></tbody></table></div><blockquote><strong>B-1이 가장 크다.</strong> 원본은 32슬라이드 내내 &quot;어떻게 잘 보여줄까&quot;를 다루고 <strong>&quot;안 될 때 어떻게 할까&quot;는 한 번도 다루지 않는다.</strong> 122 휴리스틱 평가(H9)가 없었다면 시뮬레이션도 못 잡았을 항목이다.</blockquote><hr><h2>5. ⚠️ 판정 정정 — 222 심층벤치마킹은 <strong>수행됐다</strong></h2><p>114 PDP §3에서 <strong>222를 &quot;원 프로젝트 수행 흔적 부재&quot;로 미수행 판정</strong>했다. <strong>틀렸다.</strong></p><p>원본에 벤치마킹이 <strong>실제로 수행돼 있다</strong> — S6~S8·S11~S12·S17~S18·S22~S24·S30~S31.</p><div class='tw'><table><thead><tr><th>벤치마킹 대상 (원본에서 확인)</th></tr></thead><tbody><tr><td>신세계백화점 PC/M.web · 롯데백화점 PC/M.web · 신세계면세점 PC/M.web · 롯데갤러리 · CJ ONE · 29cm APP · 이솝 PC/M.web · 현대카드 · 네이버 Na · 카카오페이 · H.Point PC/M.web · 이마트 · 롯데월드타워 APP · 현대식품관 APP/M.web</td></tr></tbody></table></div><p><strong>14개 이상 서비스를 화면 단위로 비교했다.</strong> 222 산출물이 별도 파일로 없었을 뿐, <strong>방향성분석 문서 안에 통합돼 있었다.</strong></p><h3>이것이 뜻하는 것</h3><div class='tw'><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td><strong>114 PDP 정정</strong></td><td>222 판정을 <code>제외(W)</code> → <strong><code>수행 — 240 산출물에 통합</code></strong> 으로 변경</td></tr><tr><td><strong>221 축소 판정은 유효</strong></td><td>221 서비스비교분석서(4단계 매트릭스)는 실제로 없다. 원본의 벤치마킹은 222(UI/UX 세부 비교)에 해당</td></tr><tr><td><strong>시점 제약은 실재</strong></td><td>원 프로젝트는 <strong>2022년 당시에 경쟁사 화면을 봤다.</strong> 시뮬레이션이 못 본 것은 스킬 결함이 아니라 <strong>4년 경과</strong> 때문</td></tr><tr><td><strong>U8 스냅샷 보존의 실증</strong></td><td>만약 당시 캡처가 아카이브에 남아 있었다면 시뮬레이션도 222를 수행할 수 있었다. <strong>221 표준에 신설한 「확인 스냅샷 보존」이 정확히 이 사고를 막는 규칙</strong>이다</td></tr></tbody></table></div><hr><h2>6. 정량 대조</h2><div class='tw'><table><thead><tr><th>축</th><th>원본</th><th>시뮬</th><th>일치</th></tr></thead><tbody><tr><td>최상위 방향</td><td>일원화 + 특화 서비스</td><td>지점 + 계정 동등성 (+템플릿·예외)</td><td><strong>부분</strong> — 결론 수렴, 프레이밍 상이</td></tr><tr><td>ASIS 분석축</td><td>메인 · 마이페이지 · IA · UI/구조</td><td>(메인 ❌) · 마이페이지 ✅ · IA ✅ · UI/구조 ✅</td><td><strong>3 / 4</strong></td></tr><tr><td>채널 불일치 지적</td><td>메뉴명 · 점포분류 · Depth·레벨 · UI · 마이페이지</td><td>브랜드명 · 접미관례 · 진입모델 · 계정기능 9건</td><td><strong>같은 축, 사례 상보</strong></td></tr><tr><td>벤치마킹</td><td><strong>14개+ 서비스</strong></td><td>❌ (시점 제약)</td><td><strong>0 / 14</strong></td></tr><tr><td>예외·오류 처리</td><td>❌</td><td>✅ K4</td><td>시뮬 우위</td></tr><tr><td>규모 정량</td><td>❌</td><td>✅ 3중 기준선</td><td>시뮬 우위</td></tr><tr><td>APP 트랙</td><td>✅ 6슬라이드</td><td>❌ <code>[규모미상]</code></td><td>원본 우위</td></tr><tr><td>근거 한계 명시</td><td>❌</td><td>✅</td><td>시뮬 우위</td></tr></tbody></table></div><hr><h2>7. 242·243에 반영할 수정 (봉인 해제 후속)</h2><blockquote>대조에서 드러난 <strong>명백한 개선점만</strong> 반영한다. 원본을 따라 쓰지 않는다 — 그러면 대조가 무의미해진다.</blockquote><div class='tw'><table><thead><tr><th>#</th><th>수정</th><th>근거</th></tr></thead><tbody><tr><td><strong>R-1</strong></td><td><strong>K2 trade-off 수정</strong> — &quot;지점별 개성 포기&quot; → <strong>&quot;구조는 통일, 특성은 모듈로 표현&quot;</strong></td><td>§3-1. 원본이 명백히 옳고, 벤치마킹 근거도 있다</td></tr><tr><td><strong>R-2</strong></td><td><strong>메인 분석 공백을 한계로 명시</strong> — 등급 C(캡처 0장)라 화면 내 콘텐츠 구성을 보지 못했음을 242·243에 기록</td><td>§3-2</td></tr><tr><td><strong>R-3</strong></td><td><strong>K1의 목표 진술 보완</strong> — &quot;오프라인 방문 유도&quot;에 <strong>&quot;허브·아카이브로서의 체류&quot;</strong> 를 병기. 126 O-2에 이미 있던 것</td><td>§3-4</td></tr><tr><td><strong>R-4</strong></td><td><strong>114 PDP 222 판정 정정</strong> — 미수행 → 240 산출물에 통합 수행</td><td>§5</td></tr><tr><td>—</td><td>K4·B-2~B-5는 <strong>유지</strong> — 원본에 없는 시뮬레이션 고유 기여</td><td>§4</td></tr></tbody></table></div><hr><h2>8. 스킬 검증 관점의 결론</h2><div class='tw'><table><thead><tr><th>질문</th><th>답</th></tr></thead><tbody><tr><td><strong>스킬만으로 원본 수준의 방향에 도달했는가</strong></td><td><strong>부분적으로.</strong> 최상위 결론(채널 통일)은 도달. 단 <strong>프레이밍이 약했고</strong>(무엇을 vs 어떻게), <strong>메인 분석이 통째로 빠졌다</strong></td></tr><tr><td><strong>무엇이 결정적 차이였나</strong></td><td>① <strong>원자료 등급</strong> — 캡처가 없어 화면 내 콘텐츠를 못 봄(메인 분석 실패의 직접 원인) ② <strong>벤치마킹 부재</strong> — 시점 제약</td></tr><tr><td><strong>표준이 원본을 넘어선 곳은</strong></td><td><strong>예외 처리(K4) · 규모 정량 · 법적 리스크 · 근거 한계 명시.</strong> 넷 다 <strong>고도화한 표준 규칙에서 나왔다</strong>(122 휴리스틱 세트 · 122 3중 기준선 · 212 규제 점검축 · 241 행별 채움 등급)</td></tr><tr><td><strong>가장 큰 교훈</strong></td><td><strong>후보안의 축을 잘못 잡으면 좋은 선택지가 아예 목록에 없다.</strong> A/B/C는 &quot;무엇을 중심에 두느냐&quot;였고, 원본의 &quot;어떻게 통일하느냐&quot;는 후보에 없었다. 242 표준에 <strong>축 설정 자체를 점검하는 절차</strong>가 필요하다</td></tr></tbody></table></div>", "bytes": 13168, "deliv": ""}, {"name": "고객여정맵.md", "path": "sim-project/200_Discover/240_분석종합및UX전략수립/고객여정맵.md", "html": "<h1>고객여정맵 (AS-IS) — 현대백화점 자사채널 [AI 생성]</h1><blockquote>입력: I4 워크숍 회의록 2건(2022-09-23 · 09-29) · 215 요구사항정의서(78건) · 122 AS-IS User Flow·휴리스틱(14건) · 212 정책요건(35+공백9) · 126 범위정의서(상충6) · 221 서비스비교분석서(축소) · 124 #22<br><strong>성격</strong>: 이 단계는 <strong>문제 정의</strong>다. 해결책·컨셉은 242에서. (OSSP 원문: &quot;문제해결보다 명확한 문제정의가 중요&quot;)</blockquote><hr><h2>0. 행별 채움 등급 — <strong>먼저 읽을 것</strong></h2><p>230 사용자분석이 <strong>전부 결손</strong>이다. 표준 §「사용자 조사가 결손일 때」에 따라 행마다 채움 가능성을 판정했다.</p><div class='tw'><table><thead><tr><th>행</th><th>등급</th><th>근거 / 결손 사유</th></tr></thead><tbody><tr><td>액터·시나리오</td><td>◐ <strong>대리</strong></td><td>124 #22 인구통계뿐. <strong>행동변수 없음</strong></td></tr><tr><td>태스크 플로우</td><td>● 확보</td><td>122 AS-IS User Flow</td></tr><tr><td>행동</td><td>◐ <strong>대리</strong></td><td>관찰 없음 → <strong>문서상 가능 경로</strong>로 대체. <strong>실제 행동 아님</strong></td></tr><tr><td>생각·니즈</td><td>◐ <strong>조건부</strong></td><td>사용자 발화 0건. <strong>발주처 니즈만 별도 행으로 분리</strong></td></tr><tr><td><strong>감정(만족도 곡선)</strong></td><td>✕ <strong>미확보</strong></td><td><strong>곡선을 그리지 않는다.</strong> 231·233·232 전부 부재</td></tr><tr><td>접점·채널</td><td>◐ 대리</td><td>접점은 122로 확보. <strong>빈도·이탈은 214 부재로 미확보</strong></td></tr><tr><td>개선기회</td><td>● 확보</td><td>122 휴리스틱 + 215 + 212 + 126 + 워크숍</td></tr></tbody></table></div><h3>결손 목록 (§4-B 분류)</h3><div class='tw'><table><thead><tr><th>미수행</th><th>분류</th><th>이 맵에서 못 하게 된 것</th></tr></thead><tbody><tr><td>231 현시스템 UT·심층인터뷰</td><td><strong>B 인간 활동 필수</strong></td><td>실제 행동·이탈 지점·감정</td></tr><tr><td>232 감성/이미지조사</td><td>개입대기</td><td>기대 이미지·감성 톤</td></tr><tr><td>233 사용자심층리서치</td><td><strong>B 인간 활동 필수</strong></td><td>맥락·동기</td></tr><tr><td>123 VOC</td><td><strong>C 원자료 부재</strong></td><td>불만의 정량 분포</td></tr><tr><td>214 이용로그</td><td>미확보</td><td>접점별 빈도·이탈률</td></tr></tbody></table></div><blockquote><strong>감정 곡선이 없는 여정맵</strong>이다. 아래 「구조적 마찰」은 감정의 대체물이 <strong>아니라</strong> 다른 종류의 증거다 — &quot;사용자가 답답해한다&quot;가 아니라 &quot;구조가 이렇게 되어 있다&quot;까지만 말한다.</blockquote><hr><h2>1. 액터 (대리) — 대표 사용자군</h2><div class='tw'><table><thead><tr><th>항목</th><th>값</th><th>출처</th></tr></thead><tbody><tr><td>연령</td><td><strong>30대 36.5% + 40대 33% = 약 70%</strong></td><td>124 #22 (고객 제공 실측)</td></tr><tr><td>성별</td><td><strong>여성 69.2%</strong></td><td>124 #22</td></tr><tr><td>행동변수</td><td><strong>미확보</strong> — 방문 빈도·목적·채널 선호·숙련도 전부 없음</td><td>231·233 부재</td></tr><tr><td>시나리오</td><td><strong>미확보</strong> — 실제 이용 시나리오를 관찰한 바 없음</td><td>231·233 부재</td></tr></tbody></table></div><p><strong>퍼소나 1인 = 맵 1개</strong> 원칙상 원래는 세그먼트를 나눠야 하나, <strong>군집 근거(행동변수)가 없어 하나의 대리 사용자군으로 작성</strong>한다. 311 퍼소나 정의(300 Define) 시점에도 이 제약은 유지된다 — 퍼소나 스킬 역시 리서치 근거를 요구하며, 개편형 표준 테일러링에서 311은 ○(제외)다.</p><p><strong>채널 성격</strong>: 커머스가 아니다. <strong>브랜딩·콘텐츠 아카이빙 + 그룹사 허브 + 기업정보(IR·ESG)</strong> (I1 제안서 · 126). 즉 이 여정의 종착점은 대개 <strong>구매가 아니라 오프라인 방문 또는 정보 획득</strong>이다.</p><hr><h2>2. 여정 단계 — 태스크 플로우 기반</h2><p>122의 주요 태스크 5종(T1~T5)을 사용자가 겪는 순서로 재배열했다. <strong>내부 프로세스가 아니라 이용 흐름</strong>이다.</p><figure class=\"uf-wrap\"><div class=\"uf-legend\"><span class=\"uf-lg\"><i class=\"uf-i uf-start\"></i>시작</span><span class=\"uf-lg\"><i class=\"uf-i uf-page\"></i>페이지</span><span class=\"uf-lg\"><i class=\"uf-i uf-data\"></i>데이터</span><span class=\"uf-lg\"><i class=\"uf-i uf-arrow\">→</i>유저가 이동하는 흐름</span><span class=\"uf-count\">노드 8 · 흐름 9</span></div><div class=\"uf-canvas\"><svg class=\"uf\" viewBox=\"0 0 2036 344\" width=\"100%\" preserveAspectRatio=\"xMinYMin meet\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"유저플로우\"><defs><marker id=\"ufa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#767676\"/></marker></defs><line x1=\"0\" y1=\"0\" x2=\"2036\" y2=\"0\" stroke=\"#E5E5E5\" stroke-width=\"1\"/><text x=\"28\" y=\"26\" font-size=\"11\" font-weight=\"700\" letter-spacing=\"0.06em\" fill=\"#767676\">여정 단계 — 태스크 플로우 기반</text><path d=\"M 540.0 76.0 L 716.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 956.0 76.0 L 1060.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 956.0 76.0 L 998.96 76.0 Q 1006.96 76.0 1006.96 84.0 L 1006.96 172.0 Q 1006.96 180.0 1014.96 180.0 L 1060.0 180.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 956.0 76.0 L 1014.56 76.0 Q 1022.56 76.0 1022.56 84.0 L 1022.56 276.0 Q 1022.56 284.0 1030.56 284.0 L 1060.0 284.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 1300.0 180.0 L 1344.0 180.0 Q 1352.0 180.0 1352.0 172.0 L 1352.0 84.0 Q 1352.0 76.0 1360.0 76.0 L 1404.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 1300.0 284.0 L 1344.0 284.0 Q 1352.0 284.0 1352.0 276.0 L 1352.0 84.0 Q 1352.0 76.0 1360.0 76.0 L 1404.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 1644.0 76.0 L 1748.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 1300.0 76.0 L 1344.0 76.0 Q 1352.0 76.0 1352.0 84.0 L 1352.0 172.0 Q 1352.0 180.0 1360.0 180.0 L 1404.0 180.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><rect x=\"1352.5\" y=\"158.0\" width=\"51.0\" height=\"19\" rx=\"9.5\" fill=\"#FFFFFF\" stroke=\"#E5E5E5\" stroke-width=\"1\"/><text x=\"1378.0\" y=\"171.5\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"#111111\">방문 유도</text><path d=\"M 1988.0 76.0 L 372.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><rect x=\"1161.9\" y=\"54.0\" width=\"36.2\" height=\"19\" rx=\"9.5\" fill=\"#FFFFFF\" stroke=\"#E5E5E5\" stroke-width=\"1\"/><text x=\"1180.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"#111111\">재방문</text><rect x=\"372.0\" y=\"46.0\" width=\"168\" height=\"60\" rx=\"30.0\" fill=\"#111111\"/><text x=\"456.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#FFFFFF\"><tspan x=\"456.0\" dy=\"0\">진입 · 메인 도착</tspan></text><rect x=\"716.0\" y=\"46.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"836.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"836.0\" dy=\"0\">목적 찾기 · 검색·메뉴 탐색</tspan></text><rect x=\"1060.0\" y=\"46.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1180.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1180.0\" dy=\"0\">지점·매장 확인 T1·T2</tspan></text><rect x=\"1060.0\" y=\"150.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1180.0\" y=\"184.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1180.0\" dy=\"0\">프로그램 탐색 T3</tspan></text><rect x=\"1060.0\" y=\"254.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1180.0\" y=\"288.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1180.0\" dy=\"0\">혜택 확인 T4</tspan></text><rect x=\"1404.0\" y=\"46.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1524.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1524.0\" dy=\"0\">신청·거래 T3·T4</tspan></text><rect x=\"1748.0\" y=\"46.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1868.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1868.0\" dy=\"0\">내역·회원관리 T5</tspan></text><polygon points=\"1430.4,150.0 1644.0,150.0 1617.6,210.0 1404.0,210.0\" fill=\"#F7F7F7\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1524.0\" y=\"184.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1524.0\" dy=\"0\">오프라인 방문 · 종료</tspan></text></svg></div></figure><hr><h2>3. 여정맵 본문</h2><h3>① 진입 — 메인 도착</h3><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>접점</strong></td><td>PC <code>PMA1</code> (본화면 5) / MWEB <code>MMA1</code> (본화면 5)</td></tr><tr><td><strong>행동</strong> <em>(문서상 경로)</em></td><td>PC는 GNB 32개 항목이 평면 노출된 메인. MWEB은 메인에서 <strong>전체메뉴(MAM)·지점선택(MSS)·이벤트(MEN)·패밀리앱(MFA)</strong> 로 갈라짐</td></tr><tr><td>생각·니즈</td><td><strong>미확보</strong></td></tr><tr><td>감정</td><td><strong>✕</strong></td></tr><tr><td><strong>구조적 마찰</strong></td><td>PC 1st depth <strong>32</strong> vs MWEB <strong>6</strong> — 두 채널의 진입 모델이 근본적으로 다름 (122 H4)</td></tr><tr><td><strong>개선기회</strong></td><td><strong>O-1</strong> 채널 진입 모델 불일치. 한 사용자가 두 채널을 번갈아 쓸 때 멘탈모델이 이어지지 않는다</td></tr></tbody></table></div><h3>② 목적 찾기 — 검색·메뉴 탐색</h3><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>접점</strong></td><td>검색 PC <code>PSE</code>(고유 3) / MWEB <code>MSE</code>(고유 3) · 전체메뉴 <code>MAM</code>(1) · 사이트맵(PC only)</td></tr><tr><td><strong>행동</strong> <em>(문서상 경로)</em></td><td>MWEB은 <strong>모든 경로가 전체메뉴를 경유</strong>. 검색결과는 <strong>어디서 들어오든 같은 화면</strong></td></tr><tr><td>생각·니즈</td><td><strong>미확보</strong></td></tr><tr><td>감정</td><td><strong>✕</strong></td></tr><tr><td><strong>구조적 마찰</strong></td><td>진입 경로 분산 <strong>PC 18 / MWEB 21 → 화면 1개</strong>(122 §1) · MWEB depth 7+ <strong>44%</strong> vs PC 11% · <strong>최근본·즐겨찾기 화면 0건</strong>(양 채널)</td></tr><tr><td><strong>개선기회</strong></td><td><strong>O-2</strong> 검색결과가 진입 문맥을 반영하지 않는다 — 브랜드 19곳에서 들어와도 동일 화면 (122 H2)&lt;br&gt;<strong>O-3</strong> MWEB 전체메뉴 경유가 구조적으로 1단계를 더 만든다 (122 H7)&lt;br&gt;<strong>O-4</strong> 1,003화면 규모에서 재방문 지원 장치가 없다 (122 H6)</td></tr></tbody></table></div><h3>③ 지점·매장 확인 (T1·T2)</h3><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>접점</strong></td><td>지점안내 <code>PSI</code>·<code>MSI</code> — <strong>본화면 132 = 공수 비중 23.0%</strong>(고유 192) · 브랜드 <code>PBR</code>·<code>MBR</code>(고유 41)</td></tr><tr><td><strong>행동</strong> <em>(문서상 경로)</em></td><td>지점 선택 → 층별안내·행사안내·오시는길. MWEB은 메인에서 지점선택(MSS)으로도 직행</td></tr><tr><td>생각·니즈</td><td><strong>미확보</strong></td></tr><tr><td>감정</td><td><strong>✕</strong></td></tr><tr><td><strong>구조적 마찰</strong></td><td>지점수 × 하위페이지 곱셈 구조 · <strong>브랜드 표기가 채널마다 다름</strong>(<code>PEER</code>/<code>피어</code>, <code>위마켓</code>/<code>위마캣</code>) (122 H4)</td></tr><tr><td><strong>개선기회</strong></td><td><strong>O-5</strong> 동일 브랜드가 채널마다 다른 이름으로 노출된다. 검색·기억·구전 모두에 걸린다&lt;br&gt;<strong>O-6</strong> 지점 하위 구조가 템플릿화되지 않아 지점이 늘 때마다 화면이 곱해진다 (더현대 대구 신규 예정 — 워크숍 1차)</td></tr><tr><td><strong>발주처 니즈</strong> <em>(사용자 니즈 아님)</em></td><td>지점 분류 변경 — <code>현대백화점&gt;대구점</code> → <code>더현대&gt;대구점</code> (워크숍 2차) · 지점정보 LNB에서 <strong>행사안내를 상단 노출</strong> (워크숍 1차) · 더현대/백화점/아울렛 <strong>분류 게이트 화면은 불필요</strong> (워크숍 1차)</td></tr></tbody></table></div><h3>④ 프로그램 탐색 (T3 — 문화센터·공연·전시)</h3><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>접점</strong></td><td><code>PCU</code>·<code>MCU</code> — 본화면 64(고유 135)</td></tr><tr><td><strong>행동</strong> <em>(문서상 경로)</em></td><td>강좌찾기(T1) → 강좌 상세 → 신청. 장바구니 경유 우회로 존재(<code>PCU1.1.5.4</code>, depth 7)</td></tr><tr><td>생각·니즈</td><td><strong>미확보</strong></td></tr><tr><td>감정</td><td><strong>✕</strong></td></tr><tr><td><strong>구조적 마찰</strong></td><td>CH1985·문화센터가 <strong>이원 구조</strong>로 병존 · 이용안내 화면이 <strong>채널별로 다르게 노출</strong>(워크숍 2차 지적)</td></tr><tr><td><strong>개선기회</strong></td><td><strong>O-7</strong> 같은 문화센터 정보가 두 메뉴 체계로 갈라져 있어 어디서 찾아야 하는지가 구조로 답해지지 않는다</td></tr><tr><td><strong>발주처 니즈</strong></td><td>CH1985·문화센터 <strong>이원 구조 유지</strong>(압구정 본점 확장 예정이라 없앨 수 없음 — 워크숍 1차) · 이용안내→<strong>지점안내</strong>로 메뉴명 변경 · E-카달로그 메뉴 삭제</td></tr></tbody></table></div><h3>⑤ 혜택 확인 (T4 — 카드·상품권·멤버십·VIP)</h3><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>접점</strong></td><td><code>PCA</code>·<code>MCA</code> — <strong>본화면 171 = 공수 비중 29.8%</strong>(고유 343). <strong>최대 영역</strong></td></tr><tr><td><strong>행동</strong> <em>(문서상 경로)</em></td><td>카드소개 → 자세히보기 → 신청. VIP프로그램은 PC/MWEB 구조가 다름</td></tr><tr><td>생각·니즈</td><td><strong>미확보</strong></td></tr><tr><td>감정</td><td><strong>✕</strong></td></tr><tr><td><strong>구조적 마찰</strong></td><td>VIP 등급 6종·혜택 12종·마일리지 예외 20여 항목의 <strong>고밀도 정보</strong>(212) · 화면 수 대비 <strong>요건 밀도 낮음</strong>(본화면 171 vs 요건 14건) → 반복 구조</td></tr><tr><td><strong>개선기회</strong></td><td><strong>O-8</strong> 최대 볼륨 영역인데 요건 밀도가 낮다 — 화면이 많은 게 아니라 <strong>같은 구조가 반복</strong>되고 있다&lt;br&gt;<strong>O-9</strong> VIP 혜택 정보의 밀도가 화면 구조로 정리되지 않으면 등급 변경·혜택 개편 때마다 화면을 손봐야 한다 (212 정책 갱신 주기)</td></tr></tbody></table></div><h3>⑥ 신청·거래 (T3·T4)</h3><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>접점</strong></td><td>수강신청 <code>S1→S2→S3</code> · 카드신청 <code>S1→S2→S3</code></td></tr><tr><td><strong>행동</strong> <em>(문서상 경로)</em></td><td>수강: 수강정보 확인S1 → 결제정보 입력S2(유료/무료 분기) → 완료S3. <strong>S1에서 나의회원이 없으면 <code>나의회원추가L</code>로 나갔다 복귀</strong></td></tr><tr><td>생각·니즈</td><td><strong>미확보</strong></td></tr><tr><td>감정</td><td><strong>✕</strong></td></tr><tr><td><strong>구조적 마찰</strong></td><td><strong>정원 초과가 사후 처리</strong>(<code>MCU1.2.1.2.1 수강 인원 초과F</code>) — 사전 경고 화면 없음 · <strong>카드신청 64화면 중 취소·이전 경로 0건</strong> · <strong>오류·404 화면이 명세에 0건</strong>(양 채널)</td></tr><tr><td><strong>개선기회</strong></td><td><strong>O-10</strong> 거래 흐름에 <strong>예외 경로가 정의돼 있지 않다.</strong> 실패·중단·복구 상황의 화면이 통째로 없다 (122 H9, 심각도 상)&lt;br&gt;<strong>O-11</strong> 결제 흐름 중간에 회원등록이 끼어든다 — 태스크가 중첩된다 (122 H3·H5)</td></tr></tbody></table></div><h3>⑦ 내역·회원관리 (T5)</h3><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>접점</strong></td><td>로그인 <code>PLO</code>(26)·<code>MLO</code>(10) · 마이페이지 <code>PMY</code>(19)·<code>MMY</code>(13) — 고유 <strong>68화면</strong></td></tr><tr><td><strong>행동</strong> <em>(문서상 경로)</em></td><td>로그인 → 마이페이지 → 회원정보·내역. <strong>채널에 따라 할 수 있는 일이 다름</strong></td></tr><tr><td>생각·니즈</td><td><strong>미확보</strong></td></tr><tr><td>감정</td><td><strong>✕</strong></td></tr><tr><td><strong>구조적 마찰</strong></td><td><strong>채널 동등성 결손 9건</strong>(122 A3) — 모바일에서 <strong>비밀번호를 바꿀 수 없고</strong>, PC에서 <strong>차량번호를 등록할 수 없다</strong>. <strong>H.Point 통합회원 전환이 PC에서만 가능</strong></td></tr><tr><td><strong>개선기회</strong></td><td><strong>O-12</strong> 같은 계정인데 채널마다 할 수 있는 일이 다르다. 사용자가 &quot;어디서 되는지&quot;를 학습해야 한다&lt;br&gt;<strong>O-13</strong> <strong>H.Point 전환(23.1.1)이 PC 전용</strong> — 모바일 이용자는 전환 경로 자체가 없다. 212 정책공백 <strong>G2(개인정보 동의 재획득)</strong> 와 직결</td></tr><tr><td><strong>발주처 니즈</strong></td><td>마이페이지 개선 시 <strong>PC·MWEB 일원화 필요</strong>(워크숍 1차) · 단 <strong>&#x27;로그인 기록 보기&#x27;는 PC에서만 노출</strong>(워크숍 1차) — ⚠️ 두 결정이 서로 어긋난다(§4 I-2)</td></tr></tbody></table></div><hr><h2>4. 발주처 니즈 — 별도 기록 (사용자 니즈와 섞지 않음)</h2><p>표준 §「니즈의 출처를 섞지 않는다」에 따라 분리했다. <strong>아래는 전부 고객사가 원한 것이지, 사용자가 말한 것이 아니다.</strong></p><div class='tw'><table><thead><tr><th>#</th><th>발주처 니즈</th><th>출처</th><th>사용자 근거</th></tr></thead><tbody><tr><td>B-1</td><td><strong>메인 상단에 채널(SNS) 메뉴 부각</strong> — &quot;AS-IS 하단에 있어 부각되지 않으니 TO-BE에서 상위로. <strong>고객사측에서 SNS를 중시</strong>&quot;</td><td>워크숍 1차</td><td><strong>없음</strong></td></tr><tr><td>B-2</td><td>MWEB 네비게이션 바 삭제, <strong>PC와 통일된 톤앤매너</strong></td><td>워크숍 1차</td><td>없음 (122 H4와 방향은 일치)</td></tr><tr><td>B-3</td><td>지점정보 LNB에서 <strong>행사안내 상단 노출</strong></td><td>워크숍 1차</td><td>없음</td></tr><tr><td>B-4</td><td>Sounds Forest·ALT.1 <strong>콘텐츠 내재화</strong> (현재 마이크로사이트)</td><td>워크숍 1차</td><td>없음</td></tr><tr><td>B-5</td><td>VIP프로그램 <strong>구조 통일 필요(PC/MWEB 동일)</strong></td><td>워크숍 1차</td><td>없음</td></tr><tr><td>B-6</td><td>로딩 화면에 캐릭터 <strong>&#x27;흰디&#x27;</strong> 활용 고려</td><td>워크숍 2차</td><td>없음</td></tr><tr><td>B-7</td><td>마이페이지 <strong>PC·MWEB 일원화</strong></td><td>워크숍 1차</td><td>없음 (122 A3와 방향 일치)</td></tr></tbody></table></div><blockquote><strong>B-1이 전형적 사례다.</strong> &quot;SNS를 상위로&quot;는 고객사의 중시 사항이지, <em>사용자가 SNS를 찾다 못 찾았다</em>는 관찰이 아니다. 여정맵 「생각·니즈」에 넣었다면 하류가 사용자 근거로 오인했을 것이다.<br><br><strong>B-2·B-7은 122 실측(H4·A3)과 방향이 일치</strong>한다 — 발주처 니즈지만 구조 근거가 뒷받침한다. 이 구분이 242 컨셉의 우선순위 근거가 된다.</blockquote><hr><h2>5. 맵 전체의 한계</h2><div class='tw'><table><thead><tr><th>#</th><th>한계</th><th>결과</th></tr></thead><tbody><tr><td>1</td><td><strong>감정 곡선 없음</strong></td><td>&quot;어디가 가장 힘든가&quot;를 사용자 관점에서 순위 매길 수 없다. 구조적 마찰로만 상대 비교 가능</td></tr><tr><td>2</td><td><strong>행동이 문서상 경로</strong></td><td>실제로 그 경로를 쓰는지, 어디서 이탈하는지 모른다 (214 부재)</td></tr><tr><td>3</td><td><strong>사용자 발화 0건</strong></td><td>개선기회 13건이 전부 <strong>구조·정책·발주처 근거</strong>에서 나왔다. 사용자가 말한 문제는 하나도 없다</td></tr><tr><td>4</td><td><strong>세그먼트 미분화</strong></td><td>행동변수가 없어 1개 맵. 지점 방문객과 문화센터 수강생의 여정이 다를 수 있으나 확인 불가</td></tr></tbody></table></div><blockquote><strong>한계 3이 이 프로젝트의 구조적 특성이다.</strong> 요구 78건도, 개선기회 13건도 사용자 목소리에 닿아 있지 않다. 242 UX컨셉은 이 위에서 세워진다는 것을 명시해야 한다.</blockquote>", "bytes": 13300, "deliv": ""}, {"name": "분석시사점.md", "path": "sim-project/200_Discover/240_분석종합및UX전략수립/분석시사점.md", "html": "<h1>분석시사점 · 이슈 정리 — Co-Analysis [AI 생성]</h1><blockquote><strong>성격</strong>: 문제 정의까지. <strong>해결책·컨셉은 242.</strong> (OSSP 원문 준수)</blockquote><hr><h2>1. 개요</h2><div class='tw'><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td>입력 분석</td><td>122 AS-IS(휴리스틱 14) · 215 요구(78) · 212 정책(35+공백9) · 126 범위(상충6) · 221 서비스분석(축소) · 121 환경분석(시사점7)</td></tr><tr><td><strong>워크숍</strong></td><td><strong>1차 2022-09-23</strong> (14:00~17:10, 고객사 2 + 수행사 7) · <strong>2차 2022-09-28</strong> (14:00~16:00, 고객사 1 + 수행사 6)</td></tr><tr><td>워크숍 성격</td><td><strong>범위 산정·요건 협의</strong> 중심. Co-Analysis(분석 결과 공유·시사점 도출) 형식은 아님</td></tr><tr><td>결손</td><td>231 UT · 232 감성 · 233 필드 · 123 VOC · 214 로그 — <strong>사용자 조사 전체</strong></td></tr></tbody></table></div><h3>분석자 관점 명시 (reflexivity)</h3><p>이 종합의 관점은 <strong>구조 중심</strong>이다. 근거의 대부분이 화면 구조·정책 문서·발주처 발언이고, <strong>사용자 발화가 0건</strong>이다. 따라서 도출된 시사점은 <em>&quot;사용자가 겪는 문제&quot;</em>가 아니라 <em>&quot;구조가 그렇게 되어 있어 문제가 될 수 있는 지점&quot;</em>이다. 이 편향을 보정하려면 231이 필요하고, 231은 §4-B B분류(인간 활동 필수)라 이 프로젝트에서 채워지지 않는다.</p><h3>⚠️ 워크숍의 성격에 대한 관찰</h3><p>OSSP 241은 <strong>&quot;다양한 분석결과를 공유하고 의미 있는 분석시사점을 도출하기 위한 협력디자인 과정&quot;</strong>을 상정한다. 그런데 실제 워크숍 2회는 <strong>요구사항정의서를 놓고 항목별 범위(개선/리디자인/스킨변경/유지)를 확정하는 자리</strong>였다.</p><p>즉 <strong>문제 정의 워크숍이 아니라 범위 협상 워크숍</strong>이었다. 이건 결함이 아니라 실태 기록이다 — 아래 시사점 중 워크숍 근거 항목은 <strong>범위 결정의 부산물</strong>로 드러난 것이지 워크숍에서 문제로 제기된 것이 아니다.</p><hr><h2>2. 테마별 시사점 (affinity 군집)</h2><p>관찰·이슈 카드를 상향식으로 묶은 결과 <strong>5개 테마</strong>로 수렴했다.</p><h3>T-A. 두 채널이 하나의 서비스로 작동하지 않는다 — <strong>심각도 상</strong></h3><div class='tw'><table><thead><tr><th>근거</th><th>내용</th></tr></thead><tbody><tr><td>122 H4</td><td>PC 1st depth 32 (GNB 평면) vs MWEB 6 (전체메뉴 허브) — 진입 모델 상이</td></tr><tr><td>122 H4</td><td>브랜드 표기 불일치 — <code>PEER</code>/<code>피어</code>, <code>BASH</code>/<code>바쉬 (BASH)</code>, <strong><code>위마켓</code>/<code>위마캣</code></strong>(오기 의심)</td></tr><tr><td>122 H4</td><td>화면ID 접미 관례가 채널마다 다름 (<code>P</code>는 PC only, <code>F</code>는 MWEB only)</td></tr><tr><td>122 A3</td><td><strong>채널 동등성 결손 9건</strong> — 모바일에서 비밀번호 변경 불가, PC에서 차량번호 등록 불가</td></tr><tr><td>122 A4</td><td>웹접근성 안내가 <strong>PC에만</strong> 존재</td></tr><tr><td>워크숍 1차</td><td>&quot;MWEB 네비게이션 바 삭제, <strong>PC와 통일된 톤앤매너</strong>&quot; · &quot;마이페이지 <strong>일원화 필요</strong>&quot; · &quot;VIP프로그램 <strong>구조 통일 필요</strong>&quot;</td></tr><tr><td>워크숍 1차</td><td>단 <strong>&quot;&#x27;로그인 기록 보기&#x27;는 PC에서만 노출&quot;</strong> — 통일 방침과 어긋남</td></tr></tbody></table></div><p><strong>문제 진술</strong>: <em>두 채널을 번갈아 쓰는 사용자가, 같은 계정으로 같은 일을 할 수 없고 같은 이름으로 같은 대상을 찾을 수 없다.</em> 발주처도 통일을 원하지만(B-2·B-5·B-7), <strong>개별 결정에서는 채널 차이를 유지하는 판단이 함께 내려지고 있다.</strong></p><h3>T-B. 규모의 정체가 화면 수가 아니라 반복 구조다 — <strong>심각도 상</strong></h3><div class='tw'><table><thead><tr><th>근거</th><th>내용</th></tr></thead><tbody><tr><td>122 §1</td><td>명세 행 1,344 / 고유 화면 1,003 / <strong>본화면 574</strong> — 최대 2.34배 차이</td></tr><tr><td>122 §1</td><td>진입 경로 재사용 341행(25%) — 검색결과 화면 하나에 <strong>최대 21개 경로</strong></td></tr><tr><td>122 §1</td><td>종속 화면(레이어·탭·팝업) <strong>43%</strong></td></tr><tr><td>215 · 122</td><td>카드/멤버십 <strong>본화면 171(29.8%) vs 요건 14건</strong> — 요건 밀도 최저</td></tr><tr><td>132 §2</td><td>지점안내 <strong>본화면 132(23.0%)</strong> — 카드와 합쳐 <strong>52.8%</strong></td></tr><tr><td>워크숍 1차</td><td>더현대 대구 신규 예정 · 브랜드 추가 입점 예정 · ESG 콘텐츠 1p 추가 예정</td></tr></tbody></table></div><p><strong>문제 진술</strong>: <em>화면이 1,344개라서 큰 게 아니라, 같은 구조가 반복돼서 커졌다.</em> 그리고 <strong>지점·브랜드가 늘 때마다 같은 방식으로 또 커진다</strong> — 워크숍에서 확인된 증설 예정만 3건이다.</p><h3>T-C. 실패했을 때 갈 곳이 없다 — <strong>심각도 상</strong></h3><div class='tw'><table><thead><tr><th>근거</th><th>내용</th></tr></thead><tbody><tr><td>122 H9</td><td><strong>오류·에러·404 화면이 명세에 0건</strong> (양 채널, 1,003화면 규모)</td></tr><tr><td>122 H5</td><td>수강 정원 초과가 <strong>사후 처리</strong>(<code>수강 인원 초과F</code>) — 사전 경고 없음</td></tr><tr><td>122 H3</td><td>카드신청 64화면 중 <strong>취소·이전 경로 0건</strong></td></tr><tr><td>122 H10</td><td>도움말이 산재(PC 4 / MWEB 3), <strong>통합 고객센터 화면 없음</strong></td></tr><tr><td>212</td><td>정책 공백 9건 중 <strong>G3 수강 취소·환불 표시</strong></td></tr></tbody></table></div><p><strong>문제 진술</strong>: <em>정상 경로만 설계돼 있다.</em> 실패·중단·복구는 화면 정의 자체가 없어, 사용자가 막히면 어디로 가는지 시스템이 답하지 않는다.</p><h3>T-D. 회원 체계 전환이 설계 위에 걸쳐 있다 — <strong>심각도 상</strong></h3><div class='tw'><table><thead><tr><th>근거</th><th>내용</th></tr></thead><tbody><tr><td>121 S4</td><td><strong>H.Point 통합 전환 2023-01-01</strong> — 오픈(23.1Q)과 근접</td></tr><tr><td>122 A3</td><td><strong>H.Point 통합회원 전환 화면이 PC에만 존재</strong> — 모바일 전환 경로 없음</td></tr><tr><td>212 G2</td><td><strong>개인정보 동의 재획득</strong> — 전환 시점의 법적 리스크 (정책 공백)</td></tr><tr><td>124 #14</td><td>&quot;현대백화점 회원 관련 메뉴 <strong>제외</strong>&quot; — 단 로그인 진입 동선은 별도 확인</td></tr><tr><td>126 C-1</td><td>그 제외 선언 뒤에 <strong>로그인·마이페이지 고유 68화면</strong>(전체 6.8%)이 경계 미정으로 걸려 있음</td></tr></tbody></table></div><p><strong>문제 진술</strong>: <em>가장 큰 미확정 덩어리가 회원 영역이다.</em> 제외인지 포함인지가 화면 단위로 정해지지 않은 채, 전환 일정이 오픈과 겹친다.</p><h3>T-E. 요건이 계속 움직인다 — <strong>심각도 중</strong></h3><div class='tw'><table><thead><tr><th>근거</th><th>내용</th></tr></thead><tbody><tr><td>워크숍 1차</td><td>&quot;<strong>요건 클로징 10월 중순 예정</strong>&quot;</td></tr><tr><td>워크숍 2차</td><td>&quot;10월 중순 이후 요건 클로징(예정된 운영 변경 건)&quot; · &quot;<strong>이후 운영 상 진행되면서 변경되는 요건에 대한 협의 진행 필요</strong>&quot;</td></tr><tr><td>워크숍 2차</td><td>브랜드 추가 입점(10월) · 전시/공연 페이지 개선(운영사, 10월 중) · ESG 콘텐츠 1p(12월) · 채팅상담→챗봇 변경(12~1월)</td></tr><tr><td>워크숍 2차</td><td>더현대 대구 <strong>업무 R&amp;R 협의 필요</strong></td></tr><tr><td>124</td><td>모호 2건 · 무응답 4건 — <strong>3건이 하류 착수 조건</strong></td></tr><tr><td>126 C-3</td><td>제외 선언한 층별안내가 현행 명세에 8건 실재</td></tr></tbody></table></div><p><strong>문제 진술</strong>: <em>설계 대상이 설계 중에 바뀐다.</em> 운영 변경이 프로젝트와 병행되고, 그 변경분이 언제 어떤 형태로 들어올지 확정돼 있지 않다.</p><hr><h2>3. 핵심 이슈 목록</h2><div class='tw'><table><thead><tr><th>#</th><th>이슈</th><th>테마</th><th>심각도</th><th>하류</th></tr></thead><tbody><tr><td>I-1</td><td>채널 진입 모델 불일치 — 통일 여부가 IA 최대 분기점</td><td>T-A</td><td>상</td><td>242 · 322</td></tr><tr><td>I-2</td><td><strong>통일 방침과 개별 결정이 어긋남</strong> (§4 상세)</td><td>T-A</td><td>상</td><td>242 · 911</td></tr><tr><td>I-3</td><td>채널 동등성 결손 9건</td><td>T-A</td><td>상</td><td>215 · 322 · 341</td></tr><tr><td>I-4</td><td>브랜드 표기 채널 불일치 (<code>위마켓</code>/<code>위마캣</code> 오기 의심)</td><td>T-A</td><td>중</td><td>332 컨텐츠가이드</td></tr><tr><td>I-5</td><td>2대 영역(카드 29.8% + 지점 23.0% = 52.8%) 템플릿화 여부</td><td>T-B</td><td>상</td><td>322 · 411</td></tr><tr><td>I-6</td><td>검색결과가 진입 문맥 무반영 (최대 21경로 → 화면 1)</td><td>T-B</td><td>중</td><td>322</td></tr><tr><td>I-7</td><td>재방문 지원 장치 0건 (최근본·즐겨찾기)</td><td>T-B</td><td>중</td><td>321</td></tr><tr><td>I-8</td><td><strong>예외·오류 화면 명세 0건</strong></td><td>T-C</td><td>상</td><td>321 · 341</td></tr><tr><td>I-9</td><td>거래 흐름에 취소·복구 경로 없음</td><td>T-C</td><td>상</td><td>312 · 342</td></tr><tr><td>I-10</td><td>도움말 산재, 통합 고객센터 부재</td><td>T-C</td><td>중</td><td>322</td></tr><tr><td>I-11</td><td>H.Point 전환이 PC 전용 + 동의 재획득 공백</td><td>T-D</td><td>상</td><td>212 · 341</td></tr><tr><td>I-12</td><td>회원 메뉴 제외 경계 미정 (68화면)</td><td>T-D</td><td>상</td><td>126 · 322</td></tr><tr><td>I-13</td><td>요건 변동 — 운영 변경 4건 병행</td><td>T-E</td><td>중</td><td>911</td></tr><tr><td>I-14</td><td><strong>사용자 근거 0건</strong> — 요구 78건·개선기회 13건 전부 비사용자 출처</td><td>전체</td><td>상</td><td>242</td></tr></tbody></table></div><hr><h2>4. 상충 · 미결 (봉합하지 않음)</h2><h3>I-2 상세 — 통일 방침과 개별 결정의 어긋남</h3><p>워크숍 기록에서 <strong>같은 자리에서 상반된 결정</strong>이 확인된다.</p><div class='tw'><table><thead><tr><th></th><th>통일 방향</th><th>개별 결정</th></tr></thead><tbody><tr><td>마이페이지</td><td>&quot;개선 시 <strong>일원화된 구성 필요</strong> (PC, MWEB)&quot; (1차)</td><td>&quot;<strong>&#x27;로그인 기록 보기&#x27;는 PC에서만 노출</strong>&quot; (1차)</td></tr><tr><td><strong>VIP프로그램</strong></td><td>&quot;<strong>VIP프로그램 구조 통일 필요</strong>(PC/MWEB 동일)&quot; (1차)</td><td>1차: &quot;프리미엄서비스&gt;VIP프로그램 범위 <strong>개선→스킨변경</strong>(PC/MWEB 동일)&quot; → <strong>2차: &quot;[MWEB] VIP프로그램 범위 스킨변경→개선, 원페이지를 2Tab 구조로 개선&quot;</strong></td></tr></tbody></table></div><p><strong>VIP프로그램이 특히 문제다.</strong> 1차에서 양 채널을 스킨변경으로 내리며 &quot;구조 통일 필요&quot;라 했는데, 2차에서 <strong>MWEB만 개선으로 올려 2Tab 구조로 바꾼다.</strong> PC는 스킨변경 그대로다 → <strong>결과적으로 구조가 통일되는 게 아니라 더 벌어진다.</strong></p><p>이 상충은 215 <code>[확인필요 13]</code>으로 이미 등록돼 있었고, <strong>워크숍 원문으로 확정</strong>됐다.</p><h3>그 외 미결</h3><div class='tw'><table><thead><tr><th>#</th><th>미결</th><th>확인 주체</th></tr></thead><tbody><tr><td>1</td><td>회원 메뉴 제외의 화면 단위 경계 (68화면)</td><td>고객사</td></tr><tr><td>2</td><td>층별안내(8화면)·IR예약(1화면) 존치/개선 여부</td><td>고객사</td></tr><tr><td>3</td><td>더현대 대구 업무 R&amp;R</td><td>PM ↔ 고객사 (워크숍 2차)</td></tr><tr><td>4</td><td>10월 중순 이후 운영 변경분의 반영 방식</td><td>PM ↔ 고객사 (워크숍 2차)</td></tr><tr><td>5</td><td>AS-IS 캡처본·화면ID <strong>고객 최종 검수</strong></td><td>고객사 (워크숍 2차)</td></tr><tr><td>6</td><td>접근성 &quot;준수 수준&quot; 정의</td><td>PM ↔ 고객사</td></tr><tr><td>7</td><td><code>위마켓</code>/<code>위마캣</code> 정식 브랜드명</td><td>고객사</td></tr></tbody></table></div><hr><h2>5. 다음 단계 (242 입력)</h2><p>242 UX컨셉은 아래를 <strong>관통하는 방향</strong>을 찾아야 한다. 여기서 해결책을 제시하지 않는다.</p><div class='tw'><table><thead><tr><th>242가 반드시 다뤄야 할 것</th><th>근거</th></tr></thead><tbody><tr><td><strong>채널 통일의 수준</strong> — 어디까지 같게 하고 어디를 다르게 둘 것인가</td><td>T-A · I-1·I-2·I-3</td></tr><tr><td><strong>반복 구조의 처리</strong> — 2대 영역 52.8%를 템플릿으로 볼 것인가</td><td>T-B · I-5</td></tr><tr><td><strong>실패 경로의 지위</strong> — 예외를 공통 자산으로 볼 것인가</td><td>T-C · I-8·I-9</td></tr><tr><td><strong>회원 전환기의 설계 태도</strong> — 전환 전/후 어느 쪽 기준인가</td><td>T-D · I-11·I-12</td></tr><tr><td><strong>변동 흡수 구조</strong> — 증설·운영 변경을 구조가 흡수할 수 있는가</td><td>T-B·T-E · I-13</td></tr></tbody></table></div><blockquote>⚠️ <strong>242에 넘기는 경고</strong>: 위 5개는 전부 <strong>구조 근거</strong>에서 나왔다. <strong>사용자가 무엇을 원하는지에 대한 근거는 이 문서에 없다</strong>(I-14). 242의 컨셉키워드는 이 한계를 명시한 상태로 세워져야 하고, 231이 확보되면 재검토 대상이다.</blockquote>", "bytes": 10960, "deliv": ""}], "asis_html": "<h2>🔓 HDDS_방향성분석_V0.4_220915.pdf / .pptx — <strong>봉인 해제</strong></h2><p><code>.pdf 11.6MB + .pptx 29.3MB · 32슬라이드 · 2022-09-15</code> — <strong>2026-08-06 해제 · 대조 완료</strong></p><h3>원본 구성</h3><div class='tw'><table><thead><tr><th>구획</th><th>슬라이드</th><th>내용</th></tr></thead><tbody><tr><td>WEB 방향성</td><td>S2~S25</td><td>ASIS Pain Point(메인·마이페이지·IA·UI/구조) → 벤치마킹 → 개선 방향성</td></tr><tr><td>APP 방향성</td><td>S26~S32</td><td>ASIS 메인 분석 → 벤치마킹 → 개선 방향성</td></tr></tbody></table></div><p><strong>원본의 최종 방향 (S25)</strong>: <em>&quot;PC와 M.web의 <strong>일원화</strong>를 통해 두 채널을 이용하는 사용자에게 일관된 경험을 제공하여 <strong>유의미한 체류를 할 수 있는 아카이브(허브) 형성</strong>&quot;</em></p><h3>대조 결과 — 상세는 <code>_대조_방향성분석_V0.4.md</code></h3><div class='tw'><table><thead><tr><th></th><th>건수</th><th>내용</th></tr></thead><tbody><tr><td><strong>일치</strong></td><td>7</td><td>일원화 방향 · 점포 템플릿 통일 · 마이페이지 채널 결손 · 채널별 명칭 불일치 · CH1985 중복 · 점포 분류 모호 · 지점선택 UI 불일치</td></tr><tr><td><strong>원본 우위</strong></td><td>4</td><td>K2 trade-off 오설정 · <strong>메인 콘텐츠 분석 전무</strong> · APP 트랙 부재 · &quot;체류/허브&quot; 목표 누락</td></tr><tr><td><strong>시뮬 우위</strong></td><td>5</td><td><strong>예외·오류 처리(K4)</strong> · 규모 3중 기준선 · H.Point 법적 리스크 · 범위 경계 68화면 · 근거 한계 명시</td></tr><tr><td><strong>판정 정정</strong></td><td>1</td><td><strong>222 심층벤치마킹은 수행됐다</strong> — 방향성분석에 통합(14개+ 서비스). 114 PDP C-5 판정 취소</td></tr></tbody></table></div><h3>핵심 차이 — 축의 차원</h3><p>원본은 <strong>「어떻게 통일할 것인가」</strong>(방식 축)를 주축으로 삼았고, 시뮬레이션 후보안 A/B/C는 전부 <strong>「무엇을 중심에 둘 것인가」</strong>(대상 축)였다. <strong>차원이 달라 원본의 축이 후보 목록에 없었다.</strong> 선택된 A+B 조합의 실질 내용은 원본의 일원화와 수렴하나, 프레이밍은 원본이 더 단순하고 강하다.</p><p>→ 242 스킬에 <strong>「방향 후보의 축 차원 점검」</strong>을 신설해 재발을 막았다(v0.1.0-c2202500.1).</p><h3>반영한 수정 (R-1~R-4)</h3><ul><li><strong>R-1</strong> K2 trade-off — &quot;지점별 개성 포기&quot; → <strong>&quot;구조는 통일, 특성은 모듈로 표현&quot;</strong></li><li><strong>R-2</strong> 메인 분석 공백을 등급 C(캡처 0장)의 한계로 242·243에 명시</li><li><strong>R-3</strong> K1 목표에 <strong>&quot;허브·아카이브로서의 체류&quot;</strong> 병기</li><li><strong>R-4</strong> 114 PDP의 222 판정 정정</li></ul>", "inbox": {"required": ["UT결과(231 vinylc_usability-test)", "감성/이미지조사(232 vinylc_emotional-image-research)", "사용자 심층리서치 결과(233 vinylc_field-research-plan)", "요구사항정의서(215 vinylc_requirements-definition)", "서비스비교분석서·벤치마킹보고서(221·222)", "AS-IS User Flow(122 vinylc_as-is-analysis, 태스크 플로우 골격)", "워크숍 진행기록=회의록(vinylc_meeting-minutes 재사용)", ".ax-project.yaml (vinylc_project-init)", "고객여정맵·분석시사점(241 vinylc_analysis-synthesis)", "요구사항정의서(215 vinylc_requirements-definition)", "감성/이미지조사 무드보드(232 vinylc_emotional-image-research)", "범위정의서(126 vinylc_scope-definition)", ".ax-project.yaml (vinylc_project-init)", "UX컨셉키워드(242 vinylc_ux-concept)", "고객여정맵·분석시사점(241 vinylc_analysis-synthesis)", "요구사항정의서(215 vinylc_requirements-definition)", "범위정의서(126 vinylc_scope-definition)", "서비스비교분석·벤치마킹(221·222, 해결대안 사례 근거)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/200_Discover/240_분석종합및UX전략수립", "body_html": "<h1>240 분석종합 및 UX전략수립 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_analysis-synthesis · vinylc_ux-concept · vinylc_ux-strategy-report</code>  → 로컬 포크 위치 <code>.claude/skills/vinylc_analysis-synthesis/SKILL.md</code></p><p>이 작업에 배치된 스킬은 <strong>프로젝트 로컬 포크</strong>라 수정할 수 있다. 수정 시 <code>.claude/skills/README.md</code> 규칙을 따른다.</p><h2>투입 인풋</h2><ul><li>215 요구사항정의서</li><li>121 환경분석</li><li>122 AS-IS</li><li>212 정책요건</li></ul><h2>산출물</h2><ul><li><code>_개입요청_UX컨셉방향_후보안.md</code></li></ul><h2>AS-IS 대조</h2><ul><li>상태: <strong>봉인</strong></li><li>원본: HDDS_방향성분석_V0.4_220915.pdf</li><li>🔒 방향 확정 전까지 봉인. 후보 A(지점기점)/B(멤버십기점)/C(콘텐츠기점) 중 선택 필요.</li></ul><h2>이후 어디에 쓰이나</h2><ul><li>311 퍼소나 · 312 유저플로우</li><li>331 와이어프레임 · 334 시안</li><li>351 스타일가이드 — 톤&amp;매너</li></ul><h2>스킬 고도화 (241 실행 시 수행)</h2><p><code>vinylc_analysis-synthesis</code> <strong>v0.1.0-draft → v0.1.0-c2202500.1</strong></p><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>행별 채움 등급</strong> 신설</td><td>원 스킬은 &quot;선행 분석 없으면 지어내지 말고 요청&quot;만 규정 → <strong>231·232·233·123·214가 전부 없는 이 프로젝트에서는 작업이 &quot;요청 후 중단&quot;으로 끝난다.</strong> 여정맵 7행에 <code>●확보/◐대리/✕미확보</code>를 판정하고 ✕는 비워 두도록 고정</td></tr><tr><td>2</td><td><strong>구조적 마찰 지표</strong> 신설</td><td>감정 곡선을 그리지 않으면서 &quot;어디가 힘든가&quot;를 근거로 말하는 대체축(경로 깊이·진입 경로 분산·휴리스틱 위반·예외 부재·채널 결손). <strong>감정이라 부르지 않는다</strong></td></tr><tr><td>3</td><td><strong>니즈의 출처를 섞지 않는다</strong> 신설</td><td>워크숍에서 나온 요구를 「생각·니즈」에 넣으면 <strong>발주처 니즈가 사용자 근거로 오인</strong>된다. 실측 사례: &quot;메인 상단에 SNS 부각&quot;은 고객사 중시 사항이지 사용자 관찰이 아님</td></tr></tbody></table></div><p><strong>전사 환류 판단</strong>: 3건 유효. 특히 3번은 사용자조사가 <strong>있는</strong> 프로젝트에서도 필요한 상시 규율.</p><h2>결손 유지 (사용자 지시 · §4-B)</h2><p>원 프로젝트가 없이 진행한 것은 그대로 둔다. 데스크 리서치처럼 실전에서도 AI가 할 수 있는 작업만 추가.</p><div class='tw'><table><thead><tr><th>미수행</th><th>분류</th><th>유지</th></tr></thead><tbody><tr><td>231 UT·심층인터뷰</td><td>B 인간 활동 필수</td><td>✅</td></tr><tr><td>232 감성/이미지조사</td><td>개입대기</td><td>✅</td></tr><tr><td>233 사용자심층리서치</td><td>B 인간 활동 필수</td><td>✅</td></tr><tr><td>123 VOC</td><td>C 원자료 부재</td><td>✅</td></tr><tr><td>214 이용로그</td><td>미확보</td><td>✅</td></tr></tbody></table></div><p><strong>241은 A 분류</strong> — 워크숍 회의록(I4)·기존 산출물을 종합하는 데스크 작업이라 실전에서도 AI가 수행 가능.</p><h2>도출된 인사이트</h2><p><strong>워크숍이 Co-Analysis가 아니었다.</strong> OSSP 241은 &quot;분석결과를 공유하고 시사점을 도출하는 협력디자인&quot;을 상정하는데, 실제 워크숍 2회(9/23·9/28)는 <strong>요구사항정의서를 놓고 항목별 범위를 확정하는 협상 자리</strong>였다. 결함이 아니라 실태 기록이다 — 시사점이 워크숍에서 제기된 게 아니라 <strong>범위 결정의 부산물</strong>로 드러났다.</p><p><strong>통일 방침과 개별 결정이 같은 자리에서 어긋난다.</strong> 1차 워크숍에서 &quot;VIP프로그램 구조 통일 필요(PC/MWEB 동일)&quot;라 하고 양 채널을 스킨변경으로 내렸는데, 2차에서 <strong>MWEB만 개선으로 올려 2Tab 구조로 바꾼다.</strong> PC는 그대로다 → 구조가 통일되는 게 아니라 <strong>더 벌어진다.</strong> 마이페이지도 같은 패턴(&quot;일원화 필요&quot; ↔ &quot;로그인 기록 보기는 PC에서만&quot;). 215 <code>[확인필요 13]</code>이 워크숍 원문으로 확정됐다.</p><p><strong>개선기회 13건·요구 78건 중 사용자 목소리에 닿은 것이 0건이다.</strong> 전부 구조·정책·발주처 출처다. 242 컨셉은 이 위에서 세워진다.</p><h2>봉인 해제 대조 (2026-08-06)</h2><p><code>HDDS_방향성분석_V0.4_220915</code> 32슬라이드 열람 — 조건 충족(240 생성 완료).</p><div class='tw'><table><thead><tr><th></th><th>건수</th><th>핵심</th></tr></thead><tbody><tr><td>일치</td><td>7</td><td>일원화 방향 · 점포 템플릿 · 마이페이지 결손 · 명칭 불일치 · CH1985 중복 등</td></tr><tr><td>원본 우위</td><td>4</td><td>K2 trade-off 오설정 · <strong>메인 콘텐츠 분석 전무</strong> · APP 트랙 · &quot;체류/허브&quot; 목표</td></tr><tr><td>시뮬 우위</td><td>5</td><td><strong>예외 처리(K4)</strong> · 규모 3중 기준선 · H.Point 법적 리스크 · 범위 경계 · 근거 한계 명시</td></tr><tr><td>판정 정정</td><td>1</td><td><strong>222는 수행됐다</strong> — 방향성분석에 통합(14개+ 서비스)</td></tr></tbody></table></div><p><strong>반영</strong>: R-1(K2 trade-off) · R-2(메인 공백 명시) · R-3(K1 목표 보완) · R-4(114 PDP 정정)</p><h2>242 스킬 고도화 2건</h2><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜</th></tr></thead><tbody><tr><td>1</td><td><strong>개수·명명 규칙 고정</strong> (3~5개 · 동사구 · 4필드 · 고아 점검 심각도 분기)</td><td>미완성 항목이 <strong>즉석 규칙 창작</strong>을 부른다(221 등급 앵커에서 실측). 242도 같은 위험</td></tr><tr><td>2</td><td><strong>방향 후보의 축 차원 점검</strong></td><td><strong>봉인 해제에서 발견.</strong> 후보 3안을 전부 대상 축으로만 세워 원 프로젝트의 방식 축(일원화)이 목록에 없었다. <strong>선택자는 없는 선택지를 고를 수 없다</strong></td></tr></tbody></table></div><h2>도출된 인사이트</h2><p><strong>결론은 수렴했으나 프레이밍이 약했다.</strong> 원본은 &quot;일원화&quot; 한 단어로 P1·P2·P4를 관통한다. 시뮬레이션은 K1(진입)·K2(템플릿)·K3(계정)로 나눠 맡겼고, 합치면 같은 것인데 축이 흩어져 있다. <strong>후보안 구성 단계의 문제</strong>였다 — A/B/C가 전부 &quot;무엇을 중심에&quot;였고 &quot;어떻게 통일할 것인가&quot;는 후보가 아니었다.</p><p><strong>등급 C의 대가가 메인에서 드러났다.</strong> 원본은 메인에 5슬라이드를 썼다(게이트성 썸네일 나열 · 로그인 전/후 동일 콘텐츠 · 불필요한 Depth). 시뮬레이션은 메인을 &quot;본화면 6개, 1.0%&quot;로만 봤다. <strong>화면명세서에는 화면 안이 없다.</strong> 122의 등급 C 판정이 여기서 실제 비용으로 나타났다.</p><p><strong>스킬 고도화가 원본을 넘어선 지점을 만들었다.</strong> 시뮬 우위 5건 중 4건이 고도화 규칙에서 나왔다 — K4(122 휴리스틱 세트) · 규모 3중(122) · 법적 리스크(212 규제 점검축) · 근거 한계(241 행별 채움 등급). <strong>고도화 없이는 원본 대비 열위였을 것이다.</strong></p><h2>사용자 결정 기록 (2026-08-06)</h2><div class='tw'><table><thead><tr><th>#</th><th>결정 사항</th><th>선택</th><th>영향</th></tr></thead><tbody><tr><td>D-1</td><td>방향 축</td><td><strong>A 지점(주) + B 회원·혜택(부)</strong></td><td>K1~K4 도출</td></tr><tr><td>D-2</td><td>회원 메뉴 개편 경계 68화면</td><td><strong>부분 — C 회원정보관리만</strong></td><td><strong>30화면</strong>(개략 23 → 재분류 30). K3 축소 성립</td></tr><tr><td>D-3</td><td>VIP프로그램 채널 상충</td><td><strong>PC도 2Tab 통일</strong> (등급 스킨변경→개선)</td><td>공수 증가</td></tr><tr><td>D-4</td><td>마이페이지 &#x27;로그인 기록 보기&#x27;</td><td><strong>PC 전용 유지 + 사유 기록</strong></td><td>의도적 차이로 확정</td></tr></tbody></table></div><h3>결정이 "240 결정 D-2·D-3·D-4"], "outputs": ["유저플로우.md"], "asis_state": "봉인", "asis_file": "07.와이어프레임 · 03.IA (TO-BE 설계 정답지)", "asis_note": "🔒 322 IA·331 와이어프레임 생성 전까지 봉인 유지. 유저플로우 원본은 별도 파일이 없고 IA·와이어프레임에 흡수돼 있을 가능성 — 322 완료 시 함께 대조.", "meta_html": "<h2>12. ⚠️ 이 산출물의 한계</h2><div class='tw'><table><thead><tr><th>#</th><th>한계</th><th>결과</th></tr></thead><tbody><tr><td>1</td><td><strong>퍼소나 없음</strong> (311 제외 + 리서치 부재)</td><td>「과업 흐름」이지 「사용자 흐름」이 아니다. 사용자가 이 순서로 움직이는지 미검증</td></tr><tr><td>2</td><td><strong>Co-Creative 워크숍 미실시</strong></td><td>OSSP는 <em>&quot;반드시 수기 스케치로 다양한 안을 발산&quot;</em> 을 규정한다. <strong>발산 없이 하나의 안으로 수렴</strong>했다 — 스킬의 부분 스킬 규정상 워크숍은 사람 몫</td></tr><tr><td>3</td><td><strong>231 UT 없음</strong></td><td>스킬이 &quot;데이터 기반 확정의 최선은 UT&quot;라 규정. 전 흐름이 가정</td></tr><tr><td>4</td><td><strong>214 로그 없음</strong></td><td>실제로 어느 경로를 많이 쓰는지 모른다 — 흐름 간 우선순위를 못 매김</td></tr><tr><td>5</td><td>UF-07 규모 미상</td><td>예외 화면 수가 확정 안 됨 → 132 재산정 미완</td></tr></tbody></table></div><blockquote><strong>한계 2가 OSSP 규정과의 실질 미준수다.</strong> 시뮬레이션이라 TFT 워크숍을 열 수 없었고, 그 결과 <strong>발산 단계 없이 수렴안만 있다.</strong> 실제 프로젝트라면 이 문서는 워크숍 <strong>입력 초안</strong>이지 결과물이 아니다.</blockquote>", "skill_info": [{"name": "vinylc_user-flow", "version": "0.1.0-c2202500.1", "local": false}], "docs": [{"name": "유저플로우.md", "path": "sim-project/300_Define/310_사용자모델링/312_유저플로우설계/유저플로우.md", "html": "<h1>유저플로우 (TO-BE) — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>입력: 242 UX컨셉키워드(K1~K4) · 243 UX전략 V0.4 · 241 여정맵·분석시사점 · 215 요구사항정의서(78) · <strong>122 AS-IS User Flow</strong> · 240 결정 D-2·D-3·D-4<br>표기: <code>sim-project/_순서도-표기규약.md</code><br>⚠️ <strong>이 산출물은 321·322·331·341의 상류 SSOT다.</strong> 여기서 빠진 흐름은 하류가 그대로 상속해 누락한다. 확정 후 변경 시 하류 반영 필요.</blockquote><hr><h2>0. 형식·분할 기준 판정 (먼저 한다)</h2><h3>0-1. 흐름 형식</h3><div class='tw'><table><thead><tr><th>후보</th><th>판정</th></tr></thead><tbody><tr><td>task flow (단일 경로)</td><td>✕ — 분기가 실재한다(정원 초과·유료/무료·인증 상태)</td></tr><tr><td><strong>user flow (분기 있는 흐름)</strong></td><td>✅ <strong>채택</strong></td></tr><tr><td>wireflow (화면 러프스케치 결합)</td><td>✕ — 규모 965화면. 화면 단위는 331·341의 몫</td></tr></tbody></table></div><h3>0-2. 분할 축 — <strong>퍼소나가 없다</strong></h3><p><code>311 퍼소나</code>는 <strong>개편형 표준 제외(○) + 리서치 근거 부재</strong>로 수행하지 않았다(114 PDP). 표준의 기본 분할 규칙(&quot;퍼소나당 한 플로우&quot;)을 쓸 수 없어, §「퍼소나가 없을 때」의 대체 축으로 판정했다.</p><div class='tw'><table><thead><tr><th>축</th><th>채택</th><th>사유</th></tr></thead><tbody><tr><td><strong>① 과업(task)</strong></td><td>✅ <strong>주 분할축</strong></td><td>122가 식별한 T1~T5가 그대로 출발점. 목표가 다르면 흐름이 다르다</td></tr><tr><td>② 인증 상태</td><td>◐ 부분</td><td>조회는 비회원 가능, 거래는 로그인 필요 — <strong>흐름 안의 전제 노드</strong>로 표현하고 흐름을 쪼개지는 않음</td></tr><tr><td><strong>③ 채널</strong></td><td>❌ <strong>배제</strong></td><td><strong>TO-BE가 채널 통일(K1·K3)이다. 채널로 나누면 분할 자체가 컨셉과 모순된다.</strong> AS-IS는 채널별로 갈렸으나 TO-BE는 하나다</td></tr><tr><td>④ 진입 맥락</td><td>❌ 배제</td><td>K1이 &quot;지점 컨텍스트를 유지&quot;이므로 진입이 달라도 흐름은 하나</td></tr></tbody></table></div><blockquote><strong>③ 배제가 이번 설계의 핵심 판단이다.</strong> 122 AS-IS는 PC/MWEB 진입 모델이 달라 사실상 두 개의 흐름이었다. TO-BE에서 <strong>흐름을 하나로 합치는 것 자체가 K1·K3의 실행</strong>이다.</blockquote><h3>0-3. ⚠️ 이 흐름의 성격</h3><p>퍼소나가 없으므로 <strong>이것은 「과업 흐름」이지 「사용자 흐름」이 아니다.</strong> 사용자가 실제로 이 순서로 움직이는지는 검증되지 않았다. 근거는 요구(215)·컨셉(242)·현행 구조(122)이며, <strong>231 UT가 확보되면 전 흐름이 재검토 대상</strong>이다.</p><hr><h2>1. 주요 이용흐름 (backbone)</h2><p>과업 축으로 7개. 좌→우 backbone 순.</p><div class='tw'><table><thead><tr><th>ID</th><th>흐름</th><th>목표</th><th>근거 태스크</th><th>주 컨셉</th></tr></thead><tbody><tr><td><strong>UF-01</strong></td><td>지점 정하고 들어가기</td><td>지점 컨텍스트 확립</td><td>(신설)</td><td><strong>K1</strong></td></tr><tr><td><strong>UF-02</strong></td><td>지점 정보 확인</td><td>층별·행사·오시는길 파악</td><td>T1</td><td>K1 · K2</td></tr><tr><td><strong>UF-03</strong></td><td>브랜드·매장 찾기</td><td>원하는 브랜드의 위치 확인</td><td>T2</td><td>K1</td></tr><tr><td><strong>UF-04</strong></td><td>문화센터 강좌 신청</td><td>강좌 수강 확정</td><td>T3</td><td>K4</td></tr><tr><td><strong>UF-05</strong></td><td>카드·멤버십 확인·신청</td><td>혜택 파악 / 카드 발급</td><td>T4</td><td>K2 · K4</td></tr><tr><td><strong>UF-06</strong></td><td>회원정보 관리</td><td>내 정보 확인·변경</td><td>T5</td><td><strong>K3</strong></td></tr><tr><td><strong>UF-07</strong></td><td>막혔을 때 (공통 예외)</td><td>실패에서 복구</td><td>(신설)</td><td><strong>K4</strong></td></tr></tbody></table></div><p><strong>UF-01·UF-07이 신설이다.</strong> UF-01은 K1(지점 기점)의 실행 장치이고, UF-07은 AS-IS에 오류 화면이 0건이라 통째로 새로 만든다.</p><hr><h2>2. UF-01 지점 정하고 들어가기 <code>신설</code></h2><figure class=\"uf-wrap\"><div class=\"uf-legend\"><span class=\"uf-lg\"><i class=\"uf-i uf-start\"></i>시작</span><span class=\"uf-lg\"><i class=\"uf-i uf-page\"></i>페이지</span><span class=\"uf-lg\"><i class=\"uf-i uf-branch\"></i>분기</span><span class=\"uf-lg\"><i class=\"uf-i uf-data\"></i>데이터</span><span class=\"uf-lg\"><i class=\"uf-i uf-arrow\">→</i>유저가 이동하는 흐름</span><span class=\"uf-count\">노드 8 · 흐름 9</span></div><div class=\"uf-canvas\"><svg class=\"uf\" viewBox=\"0 0 2380 240\" width=\"100%\" preserveAspectRatio=\"xMinYMin meet\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"유저플로우\"><defs><marker id=\"ufa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#767676\"/></marker></defs><line x1=\"0\" y1=\"0\" x2=\"2380\" y2=\"0\" stroke=\"#E5E5E5\" stroke-width=\"1\"/><text x=\"28\" y=\"26\" font-size=\"11\" font-weight=\"700\" letter-spacing=\"0.06em\" fill=\"#767676\">UF-01 지점 정하고 들어가기</text><path d=\"M 196.0 76.0 L 372.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 612.0 76.0 L 716.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><path d=\"M 940.0 76.0 L 1060.0 76.0\" fill=\"none\" stroke=\"#767676\" stroke-width=\"1.4\" marker-end=\"url(#ufa)\"/><rect x=\"989.3\" y=\"54.0\" width=\"21.4\" height=\"19\" rx=\"9.5\" fill=\"#FFFFFF\" stroke=\"#E5E5E5\" stroke-width=\"1\"/><text x=\"1000.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\" nchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"836.0\" dy=\"0\">결제 실패</tspan></text><rect x=\"716.0\" y=\"462.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"836.0\" y=\"496.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"836.0\" dy=\"0\">정원·재고 초과</tspan></text><rect x=\"716.0\" y=\"566.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"836.0\" y=\"600.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"836.0\" dy=\"0\">자격 미달</tspan></text><rect x=\"1060.0\" y=\"46.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1180.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1180.0\" dy=\"0\">통합 고객센터</tspan></text><rect x=\"1060.0\" y=\"150.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"1180.0\" y=\"184.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"1180.0\" dy=\"0\">직전 맥락으로 복귀</tspan></text></svg></div></figure><div class='tw'><table><thead><tr><th>구획</th><th>내용</th></tr></thead><tbody><tr><td><strong>성격</strong></td><td>개별 흐름이 아니라 <strong>전 흐름이 공유하는 공통 컴포넌트 집합</strong></td></tr><tr><td><strong>원칙</strong></td><td>모든 예외는 <strong><code>HM</code> 직전 맥락으로 복귀</strong> 또는 <strong><code>HC</code> 통합 고객센터</strong>로 닫힌다. 막다른 길을 만들지 않는다</td></tr><tr><td><strong>AS-IS 대비</strong></td><td><strong>전면 신설</strong> — AS-IS 명세에 오류·404 화면이 <strong>0건</strong>(122 H9)</td></tr><tr><td><strong>추적</strong></td><td>122 <strong>H9</strong>(오류 화면 0건) · <strong>H3</strong>(취소 경로) · <strong>H5</strong>(오류 예방) · <strong>H10</strong>(도움말 산재 → <code>HC</code> 단일 진입점) · 212 <strong>G3</strong>(수강 취소·환불 표시) · <strong>K4</strong></td></tr><tr><td><strong>⚠️ 규모</strong></td><td>이 흐름의 화면 수가 <strong><code>[규모미상]</code></strong>이다(132 §2-B R3). 321·341에서 확정해 132에 회신해야 한다</td></tr></tbody></table></div><blockquote><strong>K4의 실행 장치다.</strong> &quot;막혔을 때 갈 곳을 먼저 만든다&quot;가 이 흐름 하나로 구현된다. 개별 거래 흐름(UF-04·UF-05)의 예외 노드는 여기로 연결된다.</blockquote><hr><h2>9. 완전성(폐포) 점검</h2><p>각 흐름이 <strong>시작에서 종료까지 끊긴 곳·되돌아갈 수 없는 곳이 없는가.</strong></p><div class='tw'><table><thead><tr><th>흐름</th><th>전제</th><th>연결</th><th>사후</th><th>예외 복구</th><th>폐포</th></tr></thead><tbody><tr><td>UF-01</td><td>—</td><td>✅ C1 전달</td><td>✅ 세션 유지</td><td>✅ X1→S1</td><td>✅</td></tr><tr><td>UF-02</td><td>✅ C1</td><td>✅</td><td>✅ 오프라인 방문</td><td>✅ X2→L1</td><td>✅</td></tr><tr><td>UF-03</td><td>◐ 선택</td><td>✅</td><td>✅ 매장 위치</td><td>✅ X3→R2→R1</td><td>✅</td></tr><tr><td>UF-04</td><td>✅ 로그인 분기</td><td>✅</td><td>✅ 수강내역·취소</td><td>✅ WL→WS · EF→S2</td><td>✅</td></tr><tr><td>UF-05</td><td>✅ 본인확인</td><td>✅</td><td>✅ 완료·취소</td><td>✅ XA→CD · XB→CB</td><td>✅</td></tr><tr><td>UF-06</td><td>✅ 로그인·전환</td><td>✅</td><td>◐ 로그아웃 미표현</td><td>✅ XE→A2</td><td>◐</td></tr><tr><td>UF-07</td><td>—</td><td>✅ 전 흐름 수신</td><td>✅ HM·HC</td><td>—</td><td>✅</td></tr></tbody></table></div><p><strong>미폐포 1건</strong>: UF-06에 <strong>로그아웃 후 상태</strong>가 없다. 로그아웃은 B 인증진입(21화면, 이번 개편 제외)에 속해 흐름을 그릴 근거가 없다 → <code>[확인필요]</code>로 남긴다.</p><hr><h2>10. 추적 — 고아 점검</h2><h3>흐름 ↔ 컨셉</h3><div class='tw'><table><thead><tr><th>컨셉</th><th>커버 흐름</th></tr></thead><tbody><tr><td><strong>K1</strong> 「어느 점포인가」로 시작</td><td>UF-01 · UF-02 · UF-03</td></tr><tr><td><strong>K2</strong> 한 번 만들고 지점마다 붙인다</td><td>UF-02(지점 템플릿) · UF-05(혜택 데이터)</td></tr><tr><td><strong>K3</strong> 계정으로 할 수 있는 일을 채널이 가르지 않는다</td><td>UF-06</td></tr><tr><td><strong>K4</strong> 막혔을 때 갈 곳을 먼저 만든다</td><td><strong>UF-07</strong> + UF-04·UF-05 예외 노드</td></tr></tbody></table></div><p><strong>컨셉 고아 0건.</strong></p><h3>요구 ↔ 흐름 (78건)</h3><div class='tw'><table><thead><tr><th>분류</th><th>건수</th><th>처리</th></tr></thead><tbody><tr><td>흐름에 반영됨</td><td><strong>31</strong></td><td>위 각 흐름의 추적 행</td></tr><tr><td><strong>흐름 무관 — 화면 속성·범위 판정</strong></td><td><strong>28</strong></td><td><code>REQ-SI-008·009·010</code> 범위 하향, <code>REQ-CA-007·009·010·011</code>, <code>REQ-SC-009·010</code> 등. 흐름이 아니라 <strong>341 화면명세의 속성</strong>이다</td></tr><tr><td><strong>흐름 무관 — 전역 규칙</strong></td><td>9</td><td><code>REQ-CM-004</code> 용어 통일 · <code>REQ-CM-005</code> 해피니스 산스 · <code>REQ-CM-006</code> 흰디 · <code>REQ-CM-010</code> GA 태깅 → 332·351·353</td></tr><tr><td><strong>App 특화</strong></td><td>4</td><td><code>REQ-APP-*</code> — 앱 흐름은 이번 범위 밖(<code>[규모미상]</code>)</td></tr><tr><td><strong>보류</strong></td><td>6</td><td>215 §5 보류 14건 중 흐름 관련분</td></tr></tbody></table></div><blockquote><strong>&quot;흐름 무관 28건&quot;이 고아가 아니다.</strong> 화면의 작업 등급·속성을 정하는 요구는 유저플로우가 답할 성질이 아니다. 341로 이관을 명시한다.</blockquote><h3>321 기능정의로 넘길 신규 발견</h3><div class='tw'><table><thead><tr><th>#</th><th>발견</th><th>근거</th></tr></thead><tbody><tr><td>1</td><td><strong>잔여 정원 데이터</strong> — <code>G2</code>가 정원을 사전 표시하려면 실시간 데이터가 필요</td><td>UF-04</td></tr><tr><td>2</td><td><strong>대기 상태 조회</strong> <code>WS</code> — 대기 번호·예상 시점</td><td>UF-04</td></tr><tr><td>3</td><td><strong>검색 범위 확장</strong> <code>R2</code> — 지점 → 전 지점 전환</td><td>UF-03</td></tr><tr><td>4</td><td><strong>최근본·즐겨찾기</strong> — 122 H6, 이 흐름에 없음</td><td>242 §3 이관</td></tr><tr><td>5</td><td><strong>통합 고객센터</strong> <code>HC</code> — 산재한 도움말의 단일 진입점</td><td>122 H10</td></tr></tbody></table></div><hr><h2>11. AS-IS 대비 총괄</h2><div class='tw'><table><thead><tr><th>흐름</th><th>표기</th><th>무엇이 바뀌나</th></tr></thead><tbody><tr><td>UF-01</td><td><strong>신설</strong></td><td>채널별로 갈렸던 진입을 지점 컨텍스트로 통일</td></tr><tr><td>UF-02</td><td>개선</td><td>순서(행사안내 상단) · 지점 템플릿화 · 콘텐츠 내재화</td></tr><tr><td>UF-03</td><td>개선</td><td>검색결과가 진입 문맥을 반영</td></tr><tr><td>UF-04</td><td>개선</td><td>정원 사전 표시 · 대기 상태 조회 · 로그인 분기 이동 · 결제 실패 복구</td></tr><tr><td>UF-05</td><td>개선</td><td>혜택을 데이터로 · VIP 양 채널 2Tab · 신청 취소 경로</td></tr><tr><td>UF-06</td><td>개선</td><td>채널 결손 3건 해소 · 전환 경로 양 채널</td></tr><tr><td>UF-07</td><td><strong>신설</strong></td><td>예외 처리 전면 신설</td></tr></tbody></table></div><h3>해소되지 않는 AS-IS 문제</h3><div class='tw'><table><thead><tr><th>문제</th><th>이관</th></tr></thead><tbody><tr><td>122 <strong>H4</strong> 브랜드 표기 채널 불일치(<code>위마켓</code>/<code>위마캣</code>)</td><td><strong>332 컨텐츠가이드</strong> — 명칭 사전</td></tr><tr><td>122 <strong>H6</strong> 재방문 지원 장치 0건</td><td><strong>321 기능정의</strong></td></tr><tr><td>122 <strong>A4</strong> 웹접근성 안내 MWEB 부재</td><td><strong>354 접근성가이드</strong></td></tr><tr><td>122 <strong>A3</strong> 사이트맵 MWEB 부재</td><td><strong>322 IA</strong></td></tr></tbody></table></div><hr>", "bytes": 20851, "deliv": "312_유저플로우설계/유저플로우.html"}], "asis_html": "", "inbox": {"required": ["퍼소나(311 vinylc_persona)", "요구사항정의서(215 vinylc_requirements-definition)", "UX전략·컨셉(242·243 vinylc_ux-strategy-report/vinylc_ux-concept)", "고객여정맵·분석시사점(241 vinylc_analysis-synthesis)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/300_Define/310_사용자모델링/312_유저플로우설계", "body_html": "<h1>312 유저플로우설계 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_user-flow</code> v0.1.0-<strong>c2202500.1</strong> → 로컬 포크 <code>.claude/skills/vinylc_user-flow/SKILL.md</code></p><h2>스킬 고도화 (이번 작업에서 수행)</h2><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>「퍼소나가 없을 때 — 흐름 분할 기준」</strong> 신설</td><td>원 스킬의 분할 규칙이 <strong>&quot;퍼소나당 한 플로우&quot;</strong> 인데 <strong>311이 개편형 표준 제외(○) + 리서치 근거 부재</strong>로 없다. 기준이 통째로 사라진다. 대체 축 4종(과업·인증상태·채널·진입맥락) + <strong>&quot;TO-BE가 채널 통일이면 채널로 나누면 안 된다&quot;</strong> 함정 명시</td></tr><tr><td>2</td><td><strong>「개편형 — AS-IS 대비 표기」 + <code>depends_on</code>에 122 추가</strong></td><td>원 스킬 <code>depends_on</code>에 <strong>122 AS-IS User Flow가 없었다.</strong> 개편형 312는 백지가 아니라 기존 흐름을 고치는 것인데, AS-IS를 입력으로 안 받으면 무엇이 바뀌는지 표기할 수 없다. <code>유지/개선/신설/제거</code> 4표기 규정</td></tr></tbody></table></div><p><strong>해소된 미완성 항목</strong>: 표준서식 위치 미확정 → <strong>프로젝트 표기 규약</strong>(<code>_순서도-표기규약.md</code>)을 따르도록 정리 <strong>전사 환류 판단</strong>: 2건 유효. 특히 2번은 <strong>개편형이 바이널씨 주력 유형</strong>이라 영향이 크다</p><h2>산출물</h2><ul><li><code>유저플로우.md</code> — 주요 이용흐름 <strong>7개</strong> (노드 72 · 흐름 83). 순서도는 프로젝트 표기 규약(인라인 SVG)</li></ul><div class='tw'><table><thead><tr><th>ID</th><th>흐름</th><th>AS-IS 대비</th></tr></thead><tbody><tr><td>UF-01</td><td>지점 정하고 들어가기</td><td><strong>신설</strong></td></tr><tr><td>UF-02</td><td>지점 정보 확인</td><td>개선</td></tr><tr><td>UF-03</td><td>브랜드·매장 찾기</td><td>개선</td></tr><tr><td>UF-04</td><td>문화센터 강좌 신청</td><td>개선 (변경 4건)</td></tr><tr><td>UF-05</td><td>카드·멤버십 확인·신청</td><td>개선</td></tr><tr><td>UF-06</td><td>회원정보 관리 (C 30화면)</td><td>개선</td></tr><tr><td>UF-07</td><td>막혔을 때 — 공통 예외</td><td><strong>신설</strong></td></tr></tbody></table></div><h2>이후 어디에 쓰이나</h2><ul><li><strong>321 기능정의</strong> — 신규 발견 5건(잔여 정원 데이터·대기 상태 조회·검색 범위 확장·최근본/즐겨찾기·통합 고객센터)</li><li><strong>322 IA</strong> — 진입 모델 통일 · 템플릿 단위</li><li>331 와이어프레임 · 341 화면명세(흐름무관 요구 28건 이관)</li><li><strong>132</strong> — UF-07 예외 화면군 규모 확정 후 재산정</li></ul><h2>도출된 인사이트</h2><p><strong>채널로 흐름을 나누지 않는 것 자체가 설계였다.</strong> 122 AS-IS는 PC=GNB 평면 32 / MWEB=전체메뉴 허브로 사실상 두 개의 흐름이었다. TO-BE에서 <strong>흐름을 하나로 합치는 것이 K1·K3의 실행</strong>이다. 스킬의 분할 축 4종 중 「채널」을 배제한 판단이 이번 설계의 핵심이다.</p><p><strong>UF-01과 UF-07이 신설이다.</strong> 나머지 5개는 AS-IS를 고치는 것이지만, 이 둘은 없던 것을 만든다 — 지점 컨텍스트 확립 장치(K1)와 예외 처리 전면(K4). <strong>AS-IS 명세에 오류 화면이 0건</strong>이었으므로 UF-07은 통째로 새로 그린다.</p><p><strong>요구 78건 중 흐름에 걸리는 건 31건뿐이다.</strong> 28건이 화면의 작업 등급·속성을 정하는 요구라 유저플로우가 답할 성질이 아니다(341 이관). <strong>&quot;고아 28건&quot;이 아니라 &quot;층위가 다른 28건&quot;</strong> 임을 구분해 기록했다.</p><p><strong>OSSP 규정과의 실질 미준수 1건</strong>: 312는 <em>&quot;반드시 수기 스케치로 다양한 안을 발산&quot;</em> 하는 Co-Creative 워크숍을 규정하는데, 시뮬레이션이라 <strong>발산 없이 수렴안 하나만</strong> 만들었다. 실제 프로젝트라면 이 문서는 워크숍 <strong>입력 초안</strong>이지 결과물이 아니다.</p>"}, {"task_id": "321", "task_name": "기능상세정의", "skill": "vinylc_functional-spec", "skill_version": "0.1.0-c2202500.1", "skill_upgraded": "true", "state": "done", "verdict": "pass ● — 기능 106 · 컨텐츠 24 · 요구 고아 0. 단 215 [확인필요] 승계 누락 6건 발견·복구", "skill_loaded": "full", "next_use": ["322 IA — 기능 106·컨텐츠 24 핸드오프 스키마", "331 와이어프레임 — 예외 컴포넌트·지점 모듈", "332 컨텐츠가이드 — CT-20 용어사전·CT-21 오류메시지 사전", "341 화면명세 — FN-F06 PC전용 사유 기록", "354 접근성 — 122 A4", "132 — FG-H 규모는 331에서 확정"], "has_insight": "true", "todo": "34", "inputs": ["122 AS-IS 인벤토리(27영역)", "312 유저플로우(7흐름·노드72)", "215 요구사항정의서(78)", "242 UX컨셉 K1~K4", "212 정책요건(35+공백9)", "213 시스템요건(SYS-DAT 8군)", "126 범위정의서", "132 In-Scope 965/548", "240 결정 D-2·D-3·D-4"], "outputs": ["기능정의서.md"], "asis_state": "봉인", "asis_file": "03.IA (HDDS_IA xlsx) — 기능정의서 단독 파일 미확인, IA에 흡수 추정", "asis_note": "🔒 322 IA 생성 전까지 봉인 유지. 322 완료 시 함께 대조.", "meta_html": "<h2>2. 도출 방법 — <strong>두 갈래로 뽑았다</strong></h2><p>OSSP 321 원문은 <em>&quot;퍼소나·유저플로우에서 도출된 기능요구를 정리&quot;</em> 라고 규정한다. <strong>이 프로젝트에서는 그것만으로 부족했다.</strong></p><p>312 유저플로우가 다룬 요구는 <strong>78건 중 31건(40%)</strong> 이다. 나머지 47건은 흐름이 답할 성질이 아니었고(312 §10), 그보다 더 큰 문제는 <strong>AS-IS 965화면의 기존 기능 대부분이 유저플로우에 나타나지 않는다</strong>는 것이다. 유저플로우는 주요 이용흐름만 그리기 때문이다.</p><blockquote><strong>흐름 갈래만 쓰면 델타를 전체로 착각한다.</strong></blockquote><h3>2-1. 두 갈래</h3><div class='tw'><table><thead><tr><th>갈래</th><th>입력</th><th>도출</th><th>건수</th></tr></thead><tbody><tr><td><strong>① 인벤토리 갈래</strong></td><td>122 AS-IS 영역별 인벤토리(27영역)</td><td>현행 기능 — <strong>흐름에 없어도 존재하는 것</strong></td><td><strong>70</strong></td></tr><tr><td><strong>② 흐름 갈래</strong></td><td>312 유저플로우 · 215 요구 · 242 컨셉</td><td>변경·신설 기능 — <strong>무엇을 고치고 더하는가</strong></td><td><strong>36</strong></td></tr></tbody></table></div><p>①이 모집단이고 ②가 델타다. 겹치는 기능은 ①에 귀속시키고 변경 등급으로 델타를 표현했다.</p><h3>2-2. 변경 등급 (개편형 필수 표기)</h3><div class='tw'><table><thead><tr><th>등급</th><th>건수</th><th>비율</th><th>의미</th></tr></thead><tbody><tr><td><strong>유지</strong></td><td>26</td><td>25%</td><td>기능 자체는 손대지 않음. <strong>목록에서 빼지 않는다</strong> — 빠진 기능과 구별되지 않으므로</td></tr><tr><td><strong>개선</strong></td><td>41</td><td>39%</td><td>동작·규칙·범위가 바뀜</td></tr><tr><td><strong>신설</strong></td><td>34</td><td>32%</td><td>AS-IS에 없음. <strong>전건 근거 필수</strong></td></tr><tr><td><strong>제거</strong></td><td>3</td><td>3%</td><td>없애는 것도 결정이다. <strong>전건 근거 필수</strong></td></tr><tr><td><em>(등급 미정)</em></td><td>2</td><td></td><td>FN-F12 개인정보 동의 재획득 · FN-J04 MB 미연동 처리 — <strong>기능 존재 여부 자체가 미결</strong></td></tr><tr><td><strong>합계</strong></td><td><strong>106</strong></td><td></td><td></td></tr></tbody></table></div><p><strong>신설 34건 중 8건이 FG-H(예외·복구)다.</strong> 인벤토리 갈래로는 하나도 나오지 않는 영역이다. <strong>제거는 3건뿐이고 그중 2건이 &quot;삭제가 아니라 이동·숨김&quot;</strong> 이다(FN-D15 E-카탈로그는 강좌 화면에서 소구, FN-G06 VOC는 개발 숨김 처리). <strong>실제로 없어지는 기능은 FN-E16 카드발급기준·공지사항 1건</strong>이다.</p><h3>2-3. 입도(粒度) 기준 — 어디까지 쪼갰나</h3><p>기능 분해의 정지 조건을 <strong>&quot;322가 카드소팅할 수 있는 단위&quot;</strong> 로 잡았다. 그보다 잘게 쪼개면 화면 명세가 되고(340 침범), 굵게 두면 구조화 재료가 안 된다.</p><p>⚠️ <strong>이건 스킬 규칙이 아니라 이번 프로젝트의 판정이다.</strong> 스킬에 정지 조건이 없다 — 미완성 항목으로 기록했다.</p><hr><h2>9. ⚠️ 이 산출물의 한계</h2><div class='tw'><table><thead><tr><th>#</th><th>한계</th><th>결과</th></tr></thead><tbody><tr><td>1</td><td><strong>사용자 행동 근거 0</strong> (214 로그 부재)</td><td>기능 간 우선순위를 매길 수 없다. MoSCoW는 215에서 상속했으나 <strong>고객 진술 기반</strong>이다</td></tr><tr><td>2</td><td><strong>퍼소나·UT 없음</strong></td><td><code>[가정]</code> 2건(FN-A06·FN-C07)을 검증할 방법이 없다. 312의 한계가 그대로 상속됐다</td></tr><tr><td>3</td><td><strong>AS-IS 기능 전수 목록이 없다</strong></td><td>122가 규모 때문에 표본화했으므로 <strong>영역 단위 인벤토리로 대체</strong>했다. FG-B 192화면이 기능 10건으로 압축된 것이 정확한지는 원자료(I5) 대조가 필요하다</td></tr><tr><td>4</td><td><strong>기능 분해 입도가 판정이다</strong></td><td>&quot;322가 카드소팅할 수 있는 단위&quot;는 스킬 규칙이 아니라 이번 프로젝트의 결정이다. 다른 담당자는 다른 입도로 쪼갤 수 있다</td></tr><tr><td>5</td><td><strong>차단성 6건이 열려 있다</strong></td><td>322·341이 <code>[미확정]</code>으로 진행될 영역이 남는다</td></tr></tbody></table></div><h3>9-1. 한계 3에 대한 보충 — 압축률이 균일하지 않다</h3><div class='tw'><table><thead><tr><th>기능구분</th><th>화면</th><th>기능</th><th>화면/기능</th></tr></thead><tbody><tr><td>FG-E 카드·멤버십</td><td>343</td><td>17</td><td><strong>20.2</strong></td></tr><tr><td>FG-B 지점 정보</td><td>192</td><td>10</td><td>19.2</td></tr><tr><td>FG-G 서비스·이벤트</td><td>122</td><td>9</td><td>13.6</td></tr><tr><td>FG-D 문화센터</td><td>135</td><td>18</td><td>7.5</td></tr><tr><td>FG-I 기업정보</td><td>81</td><td>3</td><td><strong>27.0</strong></td></tr><tr><td>FG-F 회원(C)</td><td>30</td><td>12</td><td>2.5</td></tr></tbody></table></div><p><strong>FG-I 27.0과 FG-F 2.5의 차이가 13배다.</strong> 개편 강도가 다르기 때문이다(FG-I는 거의 유지, FG-F는 K3 주축) — <strong>의도된 비대칭</strong>이지만, FG-E 20.2는 재점검 여지가 있다. 343화면·요건 14건이라는 <strong>밀도 불일치</strong>를 241 T-B가 이미 지적했다.</p><hr><h2>10. 원본 대조 예고</h2><p>원본 프로젝트에 <strong>기능정의서 단독 파일이 확인되지 않는다.</strong> <code>12.UX_분석／기초설계/03.IA(HDDS_IA)</code>에 흡수돼 있을 가능성이 높다(312 유저플로우와 같은 양상).</p><p>🔒 <strong>봉인 유지.</strong> 322 IA 생성 후 함께 대조한다.</p><p>측정 지표: 기능 재현율 · 과잉률 · <strong>기능구분 체계 일치도</strong> · 컨텐츠 항목 일치도 · 누락 원인 분류.</p>", "skill_info": [{"name": "vinylc_functional-spec", "version": "0.1.0-c2202500.1", "local": false}], "docs": [{"name": "기능정의서.md", "path": "sim-project/300_Define/320_정보구조설계/321_기능상세정의/기능정의서.md", "html": "<h1>기능정의서 — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>입력: <strong>122 AS-IS 인벤토리</strong> · 312 유저플로우(7흐름) · 215 요구사항정의서(78) · 242 UX컨셉 K1~K4 · 212 정책요건 · 213 시스템요건 · 126 범위정의서 · 132 In-Scope 확정치 · 240 결정 D-2·D-3·D-4<br>범위 규율: <strong>화면·메뉴로 내려가지 않는다.</strong> &quot;무엇을 할 수 있어야 하는가&quot;까지 (OSSP 321 원문)<br>⚠️ <strong>이 문서는 322 IA·331 와이어프레임·341 화면명세의 상류 SSOT다.</strong> 기능이 바뀌면 하류가 상속한다.</blockquote><hr><h2>1. 개요·범위</h2><p>126 범위정의서 · 132 In-Scope 확정치를 기준선으로 한다.</p><div class='tw'><table><thead><tr><th>기준</th><th>값</th><th>출처</th></tr></thead><tbody><tr><td>AS-IS 고유 화면</td><td>1,003</td><td>122 §1 ②</td></tr><tr><td><strong>In-Scope 고유 화면</strong></td><td><strong>965</strong></td><td>132 V2 (회원 A 17 + B 21 = 38 제외)</td></tr><tr><td>In-Scope 본화면</td><td>548</td><td>132 V2</td></tr><tr><td>도출 기능</td><td><strong>106</strong></td><td>본 문서 §3</td></tr><tr><td>도출 컨텐츠</td><td><strong>24</strong></td><td>본 문서 §5</td></tr><tr><td>미정의사항</td><td><strong>34</strong> (차단성 ⛔ 7)</td><td>본 문서 §6·§7-1-1</td></tr></tbody></table></div><p><strong>대상</strong>: PC·Mobile Web(국문) + Admin(기획·퍼블리싱 한정). App 특화 4건은 범위 표기만. <strong>제외</strong>: 영·중·일문 · 타 ehyundai 도메인 · 솔루션 페이지 · IR 외부 시스템 · 회원 A 법정고지 17 / B 인증진입 21 (212 P-SCP · 240 D-2)</p><h3>1-1. 이 문서가 답하지 않는 것</h3><div class='tw'><table><thead><tr><th>질문</th><th>소관</th></tr></thead><tbody><tr><td>이 기능들이 어떤 구조로 묶이는가</td><td><strong>322 정보구조설계</strong></td></tr><tr><td>어느 화면에 어떻게 배치되는가</td><td>331 와이어프레임 · 341 화면명세서</td></tr><tr><td>어떤 컴포넌트·인터랙션으로 구현되는가</td><td>333 UI가이드 · 352 인터랙션가이드</td></tr></tbody></table></div><hr><h2>3. 기능 분해 트리</h2><p><strong>화면 구조가 아니라 기능 구조다.</strong> 이것을 구조로 재배열하는 것은 322의 몫이다.</p><h3>3-1. 기능구분 12군 — AS-IS 인벤토리 대조</h3><div class='tw'><table><thead><tr><th>기능구분</th><th>AS-IS 고유</th><th>In-Scope</th><th>기능</th><th>근거 영역(122)</th></tr></thead><tbody><tr><td><strong>FG-A</strong> 진입·컨텍스트</td><td>13</td><td>13</td><td>8</td><td>PMA 5 · MMA 5 · MSS 2 · MAM 1</td></tr><tr><td><strong>FG-B</strong> 지점 정보</td><td>192</td><td>192</td><td>10</td><td>PSI 91 · MSI 101</td></tr><tr><td><strong>FG-C</strong> 브랜드·매장·검색</td><td>47</td><td>47</td><td>7</td><td>PBR 19 · MBR 22 · PSE 3 · MSE 3</td></tr><tr><td><strong>FG-D</strong> 문화센터·공연·전시</td><td>135</td><td>135</td><td>18</td><td>PCU 85 · MCU 50</td></tr><tr><td><strong>FG-E</strong> 카드·상품권·멤버십</td><td>343</td><td>343</td><td>17</td><td>PCA 257 · MCA 86</td></tr><tr><td><strong>FG-F</strong> 회원·계정</td><td>68</td><td><strong>30</strong></td><td>12</td><td>PLO 26 · MLO 10 · PMY 19 · MMY 13 → <strong>C만</strong></td></tr><tr><td><strong>FG-G</strong> 서비스·이벤트·콘텐츠</td><td>122</td><td>122</td><td>9</td><td>PSC 71 · MSV 42 · MEN 9</td></tr><tr><td><strong>FG-H</strong> 예외·복구·고객지원</td><td><strong>0</strong></td><td>(신설)</td><td>9</td><td><strong>없음 — 122 H9 오류 화면 0건</strong></td></tr><tr><td><strong>FG-I</strong> 기업정보(IR·ESG·Footer)</td><td>81</td><td>81</td><td>3</td><td>PIV 20 · MIV 22 · PES 17 · MES 17 · PFO 5</td></tr><tr><td><strong>FG-L</strong> 앱 특화</td><td>2</td><td>(범위 표기)</td><td>4</td><td>MFA 2</td></tr><tr><td></td><td><strong>1,003</strong></td><td><strong>965</strong></td><td><strong>97</strong></td><td></td></tr><tr><td><strong>FG-J</strong> 운영·어드민 연동</td><td><em>횡단</em></td><td>—</td><td>4</td><td>Admin 고유 122 · CMS 17 (재계상 아님)</td></tr><tr><td><strong>FG-K</strong> 전역 공통 규칙</td><td><em>횡단</em></td><td>—</td><td>5</td><td>전 영역 (재계상 아님)</td></tr><tr><td></td><td></td><td></td><td><strong>106</strong></td><td></td></tr></tbody></table></div><p><strong>⚠️ FG-H가 0이다.</strong> AS-IS 인벤토리에 예외·오류 기능이 <strong>단 하나도 없다</strong>(122 H9). 인벤토리 갈래로는 절대 도출되지 않는 9개 기능이 흐름 갈래(312 UF-07 · K4)에서만 나왔다. <strong>두 갈래로 나눈 것의 직접적 효과다.</strong></p><p><strong>FG-J·FG-K는 횡단(cross-cutting)이라 화면 수를 더하지 않는다.</strong> 어드민 연동 233건은 다른 기능구분의 화면과 중복이므로 합계에 넣으면 이중계상이다.</p><h3>3-2. 트리</h3><pre>현대백화점 자사채널\n├─ FG-A 진입·컨텍스트 ················ K1 주축\n│   ├─ 지점 선택 · 컨텍스트 유지 · 미선택 유도\n│   └─ 전역 내비게이션 · 사이트맵\n├─ FG-B 지점 정보 ···················· K1 · K2\n│   ├─ 층별 · 행사 · 시설/오시는길\n│   ├─ 지점 템플릿 · 특성 모듈 · 내재화 콘텐츠\n│   └─ 미제공 안내 · 특수 랜딩\n├─ FG-C 브랜드·매장·검색 ············· K1\n│   ├─ 통합검색 · 범위 확장 · 빈 상태\n│   └─ 브랜드 목록/상세 · 매장 위치 · 명칭 단일화\n├─ FG-D 문화센터·공연·전시 ··········· K4\n│   ├─ 탐색: 강좌 찾기 · 잔여 정원 · 상세\n│   ├─ 거래: S1 확인 → S2 결제 → S3 완료 (+실패 복구)\n│   ├─ 대기: 신청 · 상태 조회\n│   └─ 사후: 나의 강좌 · 취소/환불\n├─ FG-E 카드·상품권·멤버십 ··········· K2 · K4\n│   ├─ 조회: 허브 · 카드 혜택 · VIP 등급 · 마일리지\n│   └─ 거래: S1 본인확인 → S2 입력 → S3 완료 (+자격/배송/취소)\n├─ FG-F 회원·계정 (C 30화면) ········· K3 주축\n│   ├─ 마이페이지 · 회원정보 · 비밀번호 · 차량번호 · 개인정보\n│   └─ H.Point 전환 · 전환 예외\n├─ FG-G 서비스·이벤트·콘텐츠\n├─ FG-H 예외·복구·고객지원 ··········· K4 · 전면 신설\n├─ FG-I 기업정보 ····················· K1 축 밖 (명시)\n├─ FG-J 운영·어드민 연동 ············· 횡단\n├─ FG-K 전역 공통 규칙 ··············· 횡단\n└─ FG-L 앱 특화 ······················ 범위 표기만</pre><hr><h2>4. 기능 상세 목록 (106건)</h2><p>표기: 등급 <code>유지</code>/<code>개선</code>/<code>신설</code>/<code>제거</code> · 상태 <code>확정</code>/<code>[가정]</code>/<code>미정의</code> · ⛔ = 하류 차단성</p><h3>FG-A 진입·컨텍스트 (8) — K1의 실행 장치</h3><div class='tw'><table><thead><tr><th>FN-ID</th><th>기능명</th><th>기능상세내용</th><th>컨텐츠</th><th>근거</th><th>등급</th><th>상태</th></tr></thead><tbody><tr><td><strong>FN-A01</strong></td><td>지점을 선택할 수 있다</td><td>지점 목록에서 직접 선택한다. <strong>더현대/백화점/아울렛 분류 게이트를 거치지 않는다</strong>(REQ-SI-002 제약). 분류는 목록 내 표시축으로만 쓴다</td><td>CT-01</td><td>UF-01 <code>S1</code> · REQ-SI-002·015·016 · <strong>K1</strong></td><td>개선</td><td>확정</td></tr><tr><td><strong>FN-A02</strong></td><td>선택 지점을 유지한다</td><td>선택 지점이 세션 내 모든 하위 영역에 전달된다. 검색·목록·상세가 이 값을 소비한다</td><td><strong>CT-03</strong></td><td>UF-01 <code>C1</code> · <strong>K1</strong> 설계함의②</td><td><strong>신설</strong></td><td>확정 — 유지 범위(세션/영구) 미정 → D1-1</td></tr><tr><td><strong>FN-A03</strong></td><td>메인에 지점 정보를 노출한다</td><td>선택 지점의 요약 정보(행사·영업시간 등)를 메인에 표시한다</td><td>CT-01·CT-02·CT-16</td><td>REQ-MA-002 · UF-01 <code>M2</code></td><td>개선</td><td>확정</td></tr><tr><td><strong>FN-A04</strong></td><td>지점 분류를 표시한다</td><td><code>현대백화점 &gt; 대구점</code> → <code>더현대 &gt; 대구점</code>. 명칭 변경 3건 포함</td><td>CT-01</td><td>REQ-SI-001 · P-TERM-09</td><td>개선</td><td>확정</td></tr><tr><td><strong>FN-A05</strong></td><td>컨텍스트 없이 진입하면 지점 선택으로 유도한다</td><td>지점 종속 영역에 컨텍스트 없이 도달한 경우 안내 후 지점 선택으로 되돌린다</td><td>CT-21</td><td>UF-01 <code>X1</code> · <strong>K1</strong></td><td><strong>신설</strong></td><td>확정</td></tr><tr><td><strong>FN-A06</strong></td><td>재방문 시 최근 지점을 제안한다</td><td>직전 선택 지점을 다음 방문의 기본값 후보로 제시한다</td><td>CT-03</td><td>UF-01 사후 · 122 <strong>H6</strong> 재방문 지원 0건</td><td><strong>신설</strong></td><td><strong><code>[가정]</code></strong> — 개인화 정책·동의 근거 없음 → D1-2</td></tr><tr><td><strong>FN-A07</strong></td><td>전역 내비게이션을 제공한다</td><td>MEGA GNB는 어드민 관리 대상, <strong>LNB는 제외</strong>. MWEB 하단 내비게이션 바를 삭제하고 PC와 톤&amp;매너를 통일한다</td><td>CT-23</td><td>REQ-CM-001·003 · <strong>K1</strong> 설계함의③</td><td>개선</td><td>확정</td></tr><tr><td><strong>FN-A08</strong></td><td>사이트맵을 제공한다</td><td>PC 사이트맵 범위 상향. <strong>MWEB에는 현재 없다</strong> — 채널 동등 관점에서 신설 판단 필요</td><td>—</td><td>REQ-FO-001 · 122 <strong>A3</strong> · 242 이관</td><td>개선</td><td>미정의 → D3-1 (<strong>322 IA</strong>)</td></tr></tbody></table></div><h3>FG-B 지점 정보 (10) — K2의 검증 지점</h3><div class='tw'><table><thead><tr><th>FN-ID</th><th>기능명</th><th>기능상세내용</th><th>컨텐츠</th><th>근거</th><th>등급</th><th>상태</th></tr></thead><tbody><tr><td><strong>FN-B01</strong></td><td>층별안내를 제공한다</td><td>지점별 층·매장 구성 조회. <strong>층별안내 레이어 솔루션은 범위 밖</strong>(P-SCP-02)</td><td>CT-02·CT-05</td><td>UF-02 <code>F1</code> · 122 PSI/MSI</td><td>유지</td><td>확정</td></tr><tr><td><strong>FN-B02</strong></td><td>행사안내 목록을 제공한다</td><td>지점별 진행 행사 목록. <strong>LNB에서 층별안내 다음 순서로 상단 배치</strong>. MWEB은 상단(이미지)·하단(리스트) 모두 CMS 관리</td><td>CT-02·CT-16</td><td>REQ-SI-004·008·010·011 · UF-02 <code>V1</code></td><td>개선</td><td>확정</td></tr><tr><td><strong>FN-B03</strong></td><td>행사안내 상세를 제공한다</td><td>현행 유지 — 범위 제외 확정</td><td>CT-16</td><td>REQ-SI-009</td><td>유지</td><td>확정</td></tr><tr><td><strong>FN-B04</strong></td><td>오시는길·시설 정보를 제공한다</td><td>위치·교통·주차·편의시설</td><td>CT-02</td><td>UF-02 <code>W1</code></td><td>유지</td><td>확정</td></tr><tr><td><strong>FN-B05</strong></td><td>지점을 템플릿 인스턴스로 생성한다</td><td><strong>신규 지점 추가 시 화면을 새로 만들지 않고 지점 데이터를 등록한다.</strong> 더현대 대구가 첫 검증 사례</td><td>CT-01·CT-02</td><td><strong>K2</strong> 설계함의①③ · REQ-SI-006 · 241 O-6</td><td><strong>신설</strong></td><td>확정 — ⛔ 이 기능이 성립하지 않으면 K2 실패</td></tr><tr><td><strong>FN-B06</strong></td><td>지점 특성을 모듈로 표현한다</td><td>템플릿 위에 이벤트 모듈·아트&amp;컬처 모듈 등을 선택 배치한다. <strong>구조는 통일하고 특성은 모듈로</strong></td><td>CT-02·CT-16</td><td><strong>K2</strong> trade-off(R-1) · REQ-SI-003</td><td><strong>신설</strong></td><td>확정 — 모듈 종류 미확정 → D3-2 (331)</td></tr><tr><td><strong>FN-B07</strong></td><td>내재화 콘텐츠를 제공한다</td><td>더현대 서울 <code>Sounds Forest</code>·<code>ALT.1</code> 2건을 마이크로사이트에서 본 채널로. <strong>각 1P · 인터랙션 없음</strong></td><td>CT-02</td><td>REQ-SI-005 · UF-02 <code>P1</code></td><td><strong>신설</strong></td><td>확정<
