<tr><td>P-MBR-01·02</td><td>로그인·마이페이지</td><td><strong>검증</strong></td><td>통합회원 여부 판정 후 진입 분기</td></tr><tr><td>P-MBR-03</td><td>로그인 레이어</td><td><strong>표시</strong>·<strong>검증</strong></td><td><code>H.Point Y / 통합 N</code> 케이스에 예외 레이어 노출</td></tr><tr><td>P-MBR-04·05</td><td>VIP프로그램·마이페이지</td><td><strong>표시</strong>·<strong>초기값</strong></td><td>로그인 등급에 따라 해당 등급 혜택을 기본 노출(초기값), 타 등급은 탐색으로</td></tr><tr><td>P-MBR-06</td><td>VIP프로그램</td><td><strong>표시</strong></td><td>연도·기간을 화면에 하드코딩하지 않음 → 어드민 값 표시</td></tr><tr><td>P-MBR-07·08</td><td>마일리지 안내</td><td><strong>계산</strong>·<strong>표시</strong></td><td>적립처×결제수단 매트릭스는 <strong>계산 규칙</strong>. 예외군 20여 항목은 표시 규칙. ⚠️ 계산 결과를 화면에서 산출하는지 백엔드 값을 받는지 미정 (§4 G4)</td></tr><tr><td>P-BRD-01</td><td>전 채널</td><td><strong>표시</strong></td><td>해피니스 산스 강제. 폰트 미로딩 시 폴백 규칙 필요 (§4 G6)</td></tr><tr><td>P-A11Y-01·02</td><td>전 채널</td><td><strong>검증</strong></td><td>KWCAG 지침 항목을 퍼블리싱 산출물 검수 기준으로 강제</td></tr><tr><td>P-OPS-03</td><td>233화면</td><td><strong>표시</strong></td><td>MB 미연동 화면은 정적 처리 — 갱신 불가 사실을 설계에 반영</td></tr><tr><td>P-SCP-01~05</td><td>IA·GNB·Footer</td><td><strong>표시</strong></td><td>제외 대상 링크·메뉴를 IA에서 제거하거나 외부 이동으로 표기</td></tr></tbody></table></div><h2>4. 정책 공백 (도출) — 212의 핵심</h2><p><strong>도출 방식</strong>: 정적 체크리스트가 아니라, <strong>범위·화면·기능이 전제하는 규칙을 역추적</strong>했다(표준 규정). 보완한 규제 정합 6축을 질문으로 사용했다.</p><div class='tw'><table><thead><tr><th>#</th><th>공백</th><th>왜 필요한가 (어느 화면·기능이 전제)</th><th>미결 시 리스크</th><th>참고안 <code>제안(미확정)</code></th><th>규제축</th></tr></thead><tbody><tr><td><strong>G1</strong></td><td>띄어쓰기 세부 규칙</td><td>P-TERM-08이 &quot;PC·MO 동일&quot;만 규정. 341 화면명세서·332 컨텐츠가이드가 문자열을 확정해야 함</td><td>채널·화면별 표기 불일치 → 오픈 후 수정 누적</td><td>국립국어원 표기 원칙 + 용어사전 1종으로 고정</td><td>표시·표기</td></tr><tr><td><strong>G2</strong></td><td>회원 이용약관·개인정보처리방침</td><td>로그인 진입 동선이 범위 내인데(P-MBR-02) 약관·방침 화면의 노출·동의 규칙이 없다. H.Point 전환 시 <strong>동의 재획득 필요 여부</strong> 불명</td><td>전환 시점에 동의 없는 상태로 서비스 제공 → 법적 리스크</td><td>전환 전 기존 동의 승계 가능 범위를 법무 확인 후 결정</td><td><strong>개인정보</strong></td></tr><tr><td><strong>G3</strong></td><td>문화센터 수강 신청·취소·환불 정책</td><td>REQ-CU-012 <code>온라인 신청 가이드</code>·수강신청 화면이 존재. 취소·환불 규칙이 화면에 표시돼야 함</td><td>결제·환불 관련 표시 의무 미준수</td><td>기존 오프라인 수강 정책을 온라인 화면 표기로 이관</td><td><strong>전자상거래</strong></td></tr><tr><td><strong>G4</strong></td><td>마일리지 계산 주체·정확도</td><td>P-MBR-07·08의 계산 규칙을 프론트가 계산하는지 백엔드 값을 표시만 하는지 미정</td><td>화면 계산 시 정책 변경마다 퍼블 수정. 값 불일치 시 고객 분쟁</td><td>표시 전용(백엔드 산출) 원칙 — 프론트 계산 금지</td><td>등급·혜택</td></tr><tr><td><strong>G5</strong></td><td>콘텐츠 게시 권한·승인 절차</td><td>P-OPS-03 어드민 233건이 있으나 <strong>누가 무엇을 승인해 게시하는지</strong> 규칙이 없다(D11 미확보)</td><td>어드민 설계 시 권한 모델을 임의 가정 → 재작업</td><td>어드민 모듈별 권한 등급 2단(작성·승인) 최소안</td><td>—</td></tr><tr><td><strong>G6</strong></td><td>웹폰트 폴백 규칙</td><td>P-BRD-01이 해피니스 산스를 강제하나, 미로딩·구형 브라우저(IE10) 시 대체 규칙이 없다</td><td>FOUT/FOIT로 표시 붕괴. IE10에서 폰트 미적용 가능</td><td>시스템 폰트 폴백 스택 지정 + 접근성 최소 가독성 확보</td><td>접근성</td></tr><tr><td><strong>G7</strong></td><td>등급 판정 데이터 연동 방식</td><td>P-MBR-09 TCP 라운지·등급별 혜택 노출이 등급 값을 전제</td><td>앱·웹 간 등급 불일치</td><td>H.Point 통합회원 기준 단일 소스</td><td>등급·혜택</td></tr><tr><td><strong>G8</strong></td><td>접근성 준수 <strong>수준의 판정 기준</strong></td><td>P-A11Y-01이 &quot;준수 수준&quot;이라 했으나 <strong>무엇을 충족하면 준수인지</strong> 기준이 없다(인증이 아니므로 심사 판정도 없음)</td><td>준수 여부 논쟁. 검수 불가</td><td>지침 22.1의 항목 중 <strong>필수 항목 전수 통과</strong>를 내부 기준으로 확정</td><td><strong>접근성</strong></td></tr><tr><td><strong>G9</strong></td><td>연도성 콘텐츠 갱신 주체</td><td>P-OPS-04가 매년 갱신을 규정하나 갱신 주체(고객 어드민 vs 수행사)가 미정</td><td>오픈 후 갱신 공백</td><td>어드민 연동 화면은 고객, 미연동은 별도 협의</td><td>—</td></tr></tbody></table></div><p><strong>규제축 점검 결과</strong>: 개인정보 1건(G2)·전자상거래 1건(G3)·접근성 2건(G6·G8)에서 공백이 나왔다. <strong>표시·표기 1건(G1)·등급혜택 2건(G4·G7)</strong>. 이용약관 축은 G2에 통합. → <strong>보완한 점검축이 공백 4건을 추가로 발견</strong>했다(초판에는 공백 섹션 자체가 없었다).</p><h2>5. 고객 결정 필요 목록</h2><div class='tw'><table><thead><tr><th>#</th><th>결정 사항</th><th>결정 주체</th><th>시급성</th><th>미결 시 막히는 작업</th></tr></thead><tbody><tr><td>1</td><td>G2 약관·개인정보 동의 재획득 필요 여부</td><td>고객사 법무·회원운영팀</td><td><strong>상</  한정)</li><li>규모 기준선: 현행 1,344화면 (122)</li><li><strong>설계로 내려가지 않음</strong>: 유저플로우·IA·화면요건은 300 Define 소관. 여기서는 &quot;무엇이 필요한가 + 우선순위 + 수용&quot;까지.</li></ul><h3>요구 항목 스키마 (표준 규정 8필드)</h3><p><code>요구ID · 구분(기능/비기능) · 출처 측 · 요구 서술 · 근거 · MoSCoW · 수용여부 · 검증방법</code></p><ul><li><strong>요구ID 불변</strong>: <code>REQ-{영역}-{일련}</code>. 폐기 시 삭제하지 않고 <code>폐기</code> 표기, 번호 재사용 금지.</li><li><strong>검증방법 압축 표기</strong>: 유형별 기본 검증방법을 아래에 정의하고, 표에서는 예외만 개별 기재한다. <em>(표준은 요구별 기재를 요구하나 70건 반복을 피하기 위한 압축 — 압축 사실을 명시한다.)</em></li></ul><div class='tw'><table><thead><tr><th>요구 유형</th><th>기본 검증방법</th></tr></thead><tbody><tr><td>메뉴명·용어 변경</td><td>화면명세서(341) 대조 + 퍼블 결과 육안 검수</td></tr><tr><td>메뉴 이동·삭제</td><td>IA(322) 노드 대조 + 링크 접근성 확인(삭제분은 숨김 처리 확인)</td></tr><tr><td>신규 화면</td><td>화면명세서 등재 + 화면설계서(342) 존재 + UI테스트케이스 통과</td></tr><tr><td>범위 변경(개선↔스킨)</td><td>산출물 체인 준수 확인(설계 유무·디자인 유무)</td></tr><tr><td>어드민 연동</td><td>어드민 모듈 매핑 표기 + 콘텐츠 갱신 경로 확인</td></tr><tr><td>비기능</td><td>§3에 항목별 개별 기재</td></tr></tbody></table></div><h2>2. 기능요구 목록</h2><p>출처 측 표기: <code>고객</code>=I3 기초질의/I4 회의록, <code>정책</code>=212, <code>시스템</code>=213, <code>AS-IS</code>=122 MoSCoW 근거는 우선순위 열에 병기.</p><h3>2-1. 공통 · 전 채널 (CM)</h3><div class='tw'><table><thead><tr><th>ID</th><th>요구 서술</th><th>출처</th><th>업무범위</th><th>MoSCoW</th><th>수용</th></tr></thead><tbody><tr><td>REQ-CM-001</td><td>MEGA GNB를 어드민 관리 대상에 포함하고 LNB는 제외한다</td><td>고객·시스템</td><td>개선</td><td><strong>Must</strong> (전 화면 진입 구조)</td><td>수용</td></tr><tr><td>REQ-CM-002</td><td>어드민·CMS 관리 영역 233건을 화면 속성으로 표기·목록화한다</td><td>시스템·AS-IS</td><td>개선</td><td><strong>Must</strong> (콘텐츠 갱신 경로 결정)</td><td>수용</td></tr><tr><td>REQ-CM-003</td><td>M.web AS-IS 네비게이션 바를 삭제하고 PC와 통일된 톤&amp;매너로 전환한다</td><td>고객</td><td>개선</td><td><strong>Must</strong> (채널 정합)</td><td>수용</td></tr><tr><td>REQ-CM-004</td><td>용어 통일안 8건을 전 채널에 적용한다</td><td>정책</td><td>개선</td><td><strong>Must</strong> (정책 확정분)</td><td>수용</td></tr><tr><td>REQ-CM-005</td><td>해피니스 산스를 적용한다. VIP 등급 로고(타이틀) 외 텍스트도 해피니스 산스 변경 허용</td><td>고객·정책</td><td>개선</td><td><strong>Must</strong> (계약 제약)</td><td>수용</td></tr><tr><td>REQ-CM-006</td><td>로딩 화면에 캐릭터 &#x27;흰디&#x27;를 활용한다</td><td>고객</td><td>신규</td><td>Could (현업 요청·필수 아님)</td><td><strong>보류</strong> — 디자인 자료 수급 대기</td></tr><tr><td>REQ-CM-010</td><td>기존 GA 태깅 체계(UA·GA4 병행)를 승계하고 변경 화면분을 개정한다</td><td>시스템</td><td>개선</td><td>Should</td><td>수용</td></tr></tbody></table></div><h3>2-2. 메인 (MA)</h3><div class='tw'><table><thead><tr><th>ID</th><th>요구 서술</th><th>출처</th><th>업무범위</th><th>MoSCoW</th><th>수용</th></tr></thead><tbody><tr><td>REQ-MA-001</td><td>안내 배너 레이어에 최대 5개까지 노출 가능하도록 개선한다 (범위 스킨변경→개선 상향)</td><td>고객</td><td>개선</td><td>Should</td><td>수용</td></tr><tr><td>REQ-MA-002</td><td>메인 화면에 지점 정보를 노출한다</td><td>고객·AS-IS</td><td>개선</td><td><strong>Must</strong></td><td>수용</td></tr><tr><td>REQ-MA-003</td><td>&#x27;서비스/콘텐츠 &gt; 채널&#x27; 메뉴를 삭제하고 메인에서 소구한다</td><td>고객</td><td>개선</td><td>Should</td><td>수용</td></tr></tbody></table></div><h3>2-3. 지점안내·지점정보 (SI) — 16건</h3><div class='tw'><table><thead><tr><th>ID</th><th>요구 서술</th><th>출처</th><th>업무범위</th><th>MoSCoW</th><th>수용</th></tr></thead><tbody><tr><td>REQ-SI-001</td><td>지점 분류를 변경한다: <code>현대백화점 &gt; 대구점</code> → <code>더현대 &gt; 대구점</code></td><td>고객</td><td>개선</td><td><strong>Must</strong></td><td>수용</td></tr><tr><td>REQ-SI-002</td><td>더현대/백화점/아울렛 분류 게이트 화면은 만들지 않는다</td><td>고객</td><td>유지</td><td>Won&#x27;t</td><td>제외(불필요 확정)</td></tr><tr><td>REQ-SI-003</td><td>더현대 지점안내 템플릿에 인터랙션을 적용한다</td><td>고객</td><td>개선</td><td>Could</td><td><strong>보류</strong> — 352 인터랙션가이드 확정 후</td></tr><tr><td>REQ-SI-004</td><td>지점정보 LNB에서 &#x27;행사안내&#x27;를 층별안내 다음 순서로 상단 배치한다</td><td>고객</td><td>개선</td><td>Should</td><td>수용</td></tr><tr><td>REQ-SI-005</td><td>더현대 서울 &#x27;Sounds Forest&#x27;·&#x27;ALT.1&#x27; 2개를 마이크로사이트에서 본 채널로 내재화한다(각 1P, 인터랙션 없음)</td><td>고객</td><td>신규</td><td><strong>Must</strong></td><td>수용</td></tr><tr><td>REQ-SI-006</td><td>더현대 대구 지점 콘텐츠를 추가한다</td><td>고객</td><td>신규</td><td><strong>Must</strong></td><td><strong>보류</strong> — 11월 용성(접근성)</td><td>KWCAG <strong>준수 수준</strong>으로 설계·구현한다. 기준 문서 = 웹 접근성 품질인증 표준심사 지침(22.1). <strong>인증 취득은 범위 제외</strong></td><td>정책(I3 #15)</td><td><strong>Must</strong></td><td>수용</td><td>354 접근성가이드 체크리스트 자가점검</td></tr><tr><td>NFR-04</td><td>유지보수성</td><td>어드민·CMS 연동 233건은 콘텐츠 갱신 경로를 문서에 명시한다. MB 미연동 화면은 정적 처리 여부를 결정한다</td><td>시스템(213)</td><td><strong>Must</strong></td><td>수용</td><td>화면명세서의 어드민 매핑 열 완전성 점검</td></tr><tr><td>NFR-05</td><td>유지보수성</td><td>VIP 기준·서비스 기간 등 <strong>연 단위 변경 데이터는 하드코딩하지 않고</strong> 어드민 갱신 대상으로 한다</td><td>정책(212)</td><td><strong>Must</strong></td><td>수용</td><td>하드코딩 잔존 여부 코드·화면 검수</td></tr><tr><td>NFR-06</td><td>이식성</td><td>개편 화면은 현행 JSP 구조(1 JSP 다화면 파라미터)와 정합해야 한다. <strong>화면ID:소스 1:1을 전제하지 않는다</strong></td><td>시스템(213)</td><td><strong>Must</strong></td><td>수용</td><td>341 화면명세서의 개발 인계 규격 검토</td></tr><tr><td>NFR-07</td><td>기능 적합성</td><td>국문 개편이 외국어 채널(영·중·일)에 영향을 주지 않아야 한다. 소스 공유 시 회귀 확인</td><td>시스템(213)</td><td>Should</td><td><strong>보류</strong> — 영향 범위 <code>[확인필요]</code></td><td>외국어 채널 주요 화면 회귀 검수</td></tr><tr><td>NFR-08</td><td>성능</td><td><code>구체화 필요</code> — 페이지 로드·응답 목표치가 인풋에 없다. 해피니스 산스 웹폰트 로딩 방식·용량이 성능에 영향</td><td>(없음)</td><td>Should</td><td><strong>보류</strong> — 목표치 미정</td><td>목표 확정 후 측정</td></tr><tr><td>NFR-09</td><td>보안</td><td>수행계획서에 보안관리 항목이 있으나 세부 요구는 <code>구체화 필요</code></td><td>고객(132 목차)</td><td>Should</td><td><strong>보류</strong></td><td>—</td></tr><tr><td>NFR-10</td><td>신뢰성</td><td><code>구체화 필요</code> — 가용성·장애 대응 목표가 인풋에 없다(운영은 계약 범위 밖)</td><td>(없음)</td><td>Won&#x27;t</td><td>제외(범위 밖)</td><td>—</td></tr></tbody></table></div><p><strong>모호어 처리 실적</strong>: &quot;빠르게&quot;·&quot;안정적으로&quot; 류 표현은 인풋에 없었다. 대신 <strong>목표치 자체가 없는 항목</strong>(NFR-08·09·10)을 <code>구체화 필요</code>로 남겼다 — 지어내지 않았다.</p><h2>4. 우선순위 종합 (MoSCoW 분포)</h2><div class='tw'><table><thead><tr><th>MoSCoW</th><th>기능</th><th>비기능</th><th>계</th><th>비율</th></tr></thead><tbody><tr><td><strong>Must</strong></td><td>24</td><td>6</td><td><strong>30</strong></td><td>41%</td></tr><tr><td>Should</td><td>27</td><td>4</td><td>31</td><td>42%</td></tr><tr><td>Could</td><td>14</td><td>0</td><td>14</td><td>19%</td></tr><tr><td>Won&#x27;t</td><td>2</td><td>1</td><td>3</td><td>4%</td></tr><tr><td><strong>합계</strong></td><td><strong>67</strong></td><td><strong>11</strong></td><td><strong>78</strong></td><td></td></tr></tbody></table></div><p><em>(V0.1의 70건에 비기능 10건 신설 + 중복 병합 2건 반영 = 78건)</em></p><p><strong>Must 항목의 성격</strong> — 30건 중 절반 이상이 <strong>채널 정합·정책 확정분·구조 재편</strong>이다. 즉 &quot;새 기능&quot;보다 <strong>일관성 확보</strong>가 이 프로젝트의 본질이다:</p><ul><li>채널 정합: CM-003 · SC-005 · CU-009 · NFR-01·02</li><li>정책 확정분: CM-004·005 · CA-013 · LO-001 · MY-001 · NFR-03·05</li><li>구조 재편: SI-001·005 · CU-001·007 · CA-005·006 · SC-001·004·006</li><li>신규 기능: APP-002·003·004 (앱 특화 3건뿐)</li></ul><p>⚠️ <strong>최종 우선순위 확정은 고객·기획PL 합의 대상</strong>이다. 위 MoSCoW는 근거 기반 제안이며 자동 확정이 아니다(표준 규정).</p><h2>5. 수용 / 보류 / 제외 결정</h2><div class='tw'><table><thead><tr><th>판정</th><th>건수</th><th>내역</th></tr></thead><tbody><tr><td><strong>수용</strong></td><td>61</td><td>근거·범위 확정분</td></tr><tr><td><strong>보류</strong></td><td>14</td><td>조건 미충족 — 아래</td></tr><tr><td><strong>제외</strong></td><td>3</td><td>SI-002·SI-009(불필요 확정) · NFR-10(범위 밖)</td></tr></tbody></table></div><h3>보류 14건의 조건 (고객 결정·수급 대기)</h3><div class='tw'><table><thead><tr><th>대기 사유</th><th>요구</th></tr></thead><tbody><tr><td><strong>자료·문구 수급 대기</strong></td><td>SI-006(대구 자료) · CA-008(문구) · CU-011(디자인·퍼블 파일) · BR-002(디자인 파일) · CM-006(흰디 자료)</td></tr><tr><td><strong>고객사 확인 대기</strong></td><td>CU-008 · CA-004(어드민 영역) · CU-012(처리 방식) · CU-006(개발 검토)</td></tr><tr><td><strong>고객사 작업 진행 중</strong></td><td>SI-013(어드민 전환) · SI-016(운영 변경) · SC-012(챗봇 오픈) · BR-001(브랜드 추가) · ES-002(HTML 추가)</td></tr><tr><td><strong>기준 미확정</strong></td><td>NFR-01(IE 재확인) · NFR-02(호환 하한) · NFR-07·08·09</td></tr></tbody></table></div><p>→ <strong>보류가 14건</strong>이라는 사실 자체가 리스크다. 요건 클로징이 &quot;10월 중순 예정&quot;(I4)인데 <strong>보류 조건 다수가 11~1월에 걸려 있다.</strong> 설계·디자인 착수 후 요건이 확정되는 구조이므로 변경관리(911)가 상시 가동돼야 한다.</p><h2>6. 상충·중복 처리 기록</h2><h3>6-A. 분류 체계 상충 — 표준의 MoSCoW vs 현장의 업무범위</h3><div class='tw'><table><thead><tr><th></th><th>표준 규정</th><th>현장 실제</th></tr></thead><tbody><tr><td>분류</td><td>MoSCoW(Must/Should/Could/Won&#x27;t)</td><td>업무범위 6종(신규·개선·리디자인·스킨변경·유지·메뉴삭제) + 중요도 3단</td></tr><tr><td>의미</td><td><strong>언제 해야 하는가</strong>(우선순위)</td><td><strong>무엇을 어디까지 하는가</strong>(작업 종류·산출물 체인)</td></tr></tbody></table></div><p><strong>판정: 둘은 대체 관계가 아니라 직교(orthogonal)한다.</strong> 업무범위는 산출물 체인을 결정하고(리디자인=설계 없이 디자인만), MoSCoW는 순서를 결정한다. <strong>병존 표기가 맞다</strong> — 이번 재실행에서 두 축을 함께 넣었다. → <strong>표준 개선 제안</strong>: 215 표준에 &quot;고객사·프로젝트가 자체 작업 분류 체계를 쓰는 경우 MoSCoW와 병존시키고, 그 체계가 산출물 체인을 결정한다면 그것을 우선한다&quot;를 추가.</p><h3>6-B. 채널 간 범위 상충 — VIP프로그램</h3><ul><li><code>REQ-SC-010</code>: PC VIP프로그램 범위 <strong>하향</strong>(개선→스킨변경) — I4 1차WS</li><li><code>REQ-SC-006</code>: M.web VIP프로그램 범위 <strong>상향</strong>(스킨변경→개선, 원페이지→2Tab) — I4 2차WS</li><li><code>REQ-SC-005</code>: VIP프로그램 구조를 <strong>PC·M.web 통일</strong> — I4 1차WS</li></ul><p><strong>상충 내용</strong>: 구조를 통일하라면서 PC는 손대지 않고(스킨변경) MWEB만 2Tab으로 바꾸면 <strong>통일이 아니라 격차가 커진다.</strong> <strong>판정: 미해소 — 고객 확인 대상으로 올린다.</strong> [확인필요 #13 신설] 통일 기준이 ① MWEB의 2Tab을 PC에도 적용인지 ② PC 현행을 기준으로 MWEB을 맞추는지.</p><h3>6-C. 업계 담론 vs 고객 실측 상충 (121에서 이관)</h3><ul><li>업계: MZ(2030) 중심 전략 / 실측: 30대 36.5% + 40대 33% = 70%, 여성 69.2%</li></ul><p><strong>판정: 실측 우선.</strong> 요구사항정의서에는 반영 요구가 없으나 <strong>242 UX컨셉·334 시안의 타깃 판단에 직접 영향</strong>하므로 여기에 기록해 전달한다.</p><h3>6-D. 중복 병합 실적</h3><div class='tw'><table><thead><tr><th>병합 전</th><th>병합 후</th><th>사유</th></tr></thead><tbody><tr><td>공지사항 위치(1차WS 제안) + 공지사항 이동(2차WS 확정)</td><td><code>REQ-SC-003</code> 1건</td><td>같은 요구의 시계열 확정 — 최종본만 유지, 이력은 근거에 기재</td></tr><tr><td>용어통일 개별 8항목</td><td><code>REQ-CM-004</code> 1건 + 212 정책 참조</td><td>정책 문서가 상세를 보유 — 요구는 &quot;적용&quot;으로 병합</td></tr></tbody></table></div><h2>7. 추적 매트릭스 (RTM) — 고아 0 점검</h2><p>컬럼: <code>요구ID · 출처(211~214·126) · 업무범위 · MoSCoW · 수용 · 검증방법 · 대응화면ID(341) · 상태</code></p><h3>7-1. 출처 커버리지 (근거 없는 요구 = 고아 점검)</h3><div class='tw'><table><thead><tr><th>출처</th><th>요구 건수</th><th>고아</th></tr></thead><tbody><tr><td>고객(I3 기초질의 + I4 회의록)</td><td>56</td><td>0</td></tr><tr><td>정책(212)</td><td>11</td><td>0</td></tr><tr><td>시스템(213)</td><td>9</td><td>0</td></tr><tr><td>로그(214)</td><td><strong>0</strong></td><td>—</td></tr><tr><td>AS-IS(122)</td><td>3</td><td>0</td></tr><tr><td><strong>근거 없는 요구</strong></td><td><strong>0</strong></td><td>✅ <strong>고아 0 확인</strong></td></tr></tbody></table></div><h3>7-2. 역방향 커버리지 (커버되지 않은 근거 점검)</h3><div class='tw'><table><thead><tr><th>근거 산출물</th><th>요구로 전환됐는가</th></tr></thead><tbody><tr><td>212 정책요건정의서 6군</td><td>✅ 전 군 반영 (용어·회원등급·브랜드·접근성·운영·범위)</td></tr><tr><td>213 시스템요건 R-SYS 10건</td><td>⚠️ <strong>R-SYS-10(개발계 산출물 작성주체)은 요구로 전환 안 됨</strong> — 계약·행정 사안이라 요구사항이 아님. 132 수행계획서 이슈로 남김</td></tr><tr><td>214 로그분석</td><td>⛔ <strong>데이터 부재로 요구 도출 0건.</strong> 정량 근거가 필요한 요구(이탈 개선 등)를 만들 수 없었다</td></tr><tr><td>122 AS-IS 1,344화면</td><td>⚠️ 요건은 영역 단위로만 도출. <strong>화면 단위 커버리지는 341에서 점검</strong>(현재 미완)</td></tr><tr><td>126 범위정의서</td><td>✅ In/Out 경계가 수용·제외 판정에 반영</td></tr></tbody></table></div><p><strong>⚠️ 최대 공백: 214 로그분석 0건.</strong> GA 추출본이 없어 &quot;실제 사용 데이터에 근거한 요구&quot;가 하나도 없다. 요구 78건 전부가 <strong>고객 진술·정책·현행 구조</strong>에서 나왔고 <strong>사용자 행동 근거는 0</strong>이다. 이는 이 요구사항정의서의 구조적 한계다.</p><h3>7-3. 화면ID 연결 상태</h3><p><code>대응화면ID</code> 열은 <strong>341 화면명세서 작성 시점에 채운다.</strong> 122의 화면ID 체계(<code>{채널}{영역}{일련}</code>)가 추적키가 된다. 현재는 요구 단위까지만 확정 — 요구↔화면 매핑은 미완.</p><h2>8. [확인필요] 13건</h2><ol><li>요건 클로징 시점과 이후 운영 변경분 처리 방식</li><li>더현대 대구 업무 R&amp;R (마이크로사이트 vs 본 채널)</li><li>PC 문화센터 서브메인 어드민 관리 영역</li><li>PC 카드 서브메인 어드민 관리 영역</li><li>온라인 신청 가이드 처리 방식</li><li>앱 4건의 Native/Hybrid 구분</li><li>VIP 등급 판정 데이터 연동 방식</li><li>어드민 신규/변경 시 작업 범위 (I3 #19)</li><li>H.Point 전환 전/후 이중 시나리오 필요 여부</li><li>국문 개편의 외국어 채널 영향 범위</li><li>용어통일(2022-12 수급) 소급 반영 범위</li><li>개발계 산출물 8종 작성주체</li><li><strong>[신설] VIP프로그램 채널 통일 기준</strong> — §6-B 상충</li></ol><h2>9. [가정] 3건</h2><ol><li>업무범위 6종 분류를 I4 회의록에서 채택했다 — AS-IS 명세서의 판정 컬럼은 참조 제한 규약에 따라 미참조</li><li>MoSCoW 판정은 근거 기반 제안 — 고객 합의 전</li><li>요구 총계 78건은 회의록 2건(1·2차 워크샵) 기준. <strong>나머지 회의록 6건은 미분석</strong> — 추가 요구가 있을 수 있다</li></ol>", "bytes": 26361, "deliv": "215_요구사항정의/요구사항정의서.html"}], "asis_html": "<h2>🔒 요구사항정의서 V1.0 + 요구사항추적표 V1.0</h2><p><strong>봉인 유지 · 내용 미열람</strong> — Phase 200 생성이 끝났으므로 <strong>곧 공개 가능</strong></p><div class='tw'><table><thead><tr><th>파일</th><th>크기</th><th>일자</th></tr></thead><tbody><tr><td><code>…_요구사항정의서_V1.0_221014.xlsx</code></td><td>91,633 bytes</td><td>2022-10-14 (최종수정 2023-03-02)</td></tr><tr><td><code>…_요구사항추적표_V1.0_221014.xlsx</code></td><td>69,188 bytes</td><td>2022-10-14</td></tr></tbody></table></div><h3>회의록으로 확인된 원본의 진화 (내용 아님 · 버전 이력)</h3><pre>V0.7 (2022-09-22)  1차 워크샵 리뷰 기준\n   ↓  IA 개선사항·요건 질의\nV0.8 (2022-09-27)  고객 회신본 — 2차 워크샵 기준\n   ↓  업무범위 상향/하향 조정 다수\nV0.9              바이널씨 → 고객 전달 예정본\n   ↓\nV1.0 (2022-10-14)  확정본 · 최종수정 2023-03-02(운영 변경 반영)</pre><p>→ 원본은 <strong>4차례 개정 + 오픈 직전까지 갱신</strong>된 문서다. AI 산출물은 <strong>V0.1 수준 1회 작성</strong>이므로 성숙도가 다르다.</p><h3>공개 후 측정할 지표</h3><div class='tw'><table><thead><tr><th>지표</th><th>정의</th></tr></thead><tbody><tr><td>재현율</td><td>원본 요건 중 AI가 포착한 비율</td></tr><tr><td>과잉률</td><td>AI에만 있고 원본에 없는 요건</td></tr><tr><td>분류 일치도</td><td>업무범위 6종 판정 일치율</td></tr><tr><td>누락 원인</td><td>인풋 부재 / 회의록 미기재 / 스킬 한계</td></tr></tbody></table></div><p>⚠️ <strong>해석 주의</strong>: V0.1 vs V1.0 비교이므로 재현율이 낮게 나오는 것이 정상이다. 성숙도 차이를 감안해 읽어야 한다.</p>", "inbox": {"required": ["이해관계자인터뷰결과(211)", "정책요건정의서(212)", "시스템요건정의서(213)", "로그분석(214)", "범위정의서(126)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/200_Discover/210_자사고객요건분석/215_요구사항정의", "body_html": "<h1>215 요구사항정의 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_requirements-definition</code>  → 로컬 포크 위치 <code>.claude/skills/vinylc_requirements-definition/SKILL.md</code></p ] 2건</blockquote><h2>0. 왜 축소인가 — 221의 구조적 제약</h2><p>221의 정상 수행은 <strong>경쟁 서비스의 실제 화면을 보고 항목별로 평가</strong>하는 것이다. 이번 시뮬레이션에서는 세 가지가 모두 막힌다:</p><div class='tw'><table><thead><tr><th>제약</th><th>내용</th></tr></thead><tbody><tr><td><strong>① 시점</strong></td><td>평가 대상은 <strong>2022년 하반기 시점의 롯데·신세계 채널</strong>이어야 한다. 현재 접속 가능한 사이트는 2026년판이라 <strong>평가하면 시대착오 오염</strong>이 된다. 아카이브(web.archive.org 등) 캡처 없이는 불가</td></tr><tr><td><strong>② 고객 지정 대상 부재</strong></td><td>표준의 <code>depends_on</code>은 &quot;고객 지정 우수서비스/순위사이트(고객 제공)&quot;인데, <strong>아카이브에 해당 자료가 없다.</strong> 원 프로젝트에서 221을 수행했다는 흔적도 없음</td></tr><tr><td><strong>③ 검색으로 대체 불가</strong></td><td>2022년 백화점 홈페이지 개편 관련 기사를 검색했으나 <strong>구체적 개편 내용을 다룬 자료를 찾지 못했다</strong>(2019년 신세계닷컴 개편 기사만 확인). 화면 단위 비교의 근거가 되지 않음</td></tr></tbody></table></div><p>→ <strong>판정: 축소pass.</strong> 평가 프레임(§2)과 자사 현황(§3)까지 작성하고, 실제 경쟁사 평가는 [자료부재]로 남긴다. → <strong>실무 대응</strong>: 실제 프로젝트라면 이 시점에 <strong>고객사에 벤치마킹 대상 지정을 요청</strong>하거나, <strong>기획자가 직접 경쟁 채널을 캡처·평가</strong>해야 한다. 둘 다 사람의 작업이다.</p><h2>1. 비교 대상 후보 (미확정)</h2><div class='tw'><table><thead><tr><th>구분</th><th>후보</th><th>상태</th></tr></thead><tbody><tr><td>직접 경쟁</td><td>롯데백화점 공식 채널(lotteshopping.com) · 신세계백화점(shinsegae.com)</td><td>[자료부재] 2022년 시점 화면 없음</td></tr><tr><td>그룹 내 참조</td><td>더현대닷컴 · 현대백화점그룹</td><td>개편 범위 밖이나 <strong>톤&amp;매너 정합 대상</strong></td></tr><tr><td>유사 구조</td><td>지점·문화센터·VIP 프로그램을 가진 오프라인 기반 채널</td><td>[확인필요] 고객 지정 대상</td></tr></tbody></table></div><ul><li>확인된 사실: 롯데백화점 공식 채널도 <strong>지점별 쇼핑정보·매장안내·우수고객 제도·문화센터·웨딩센터·갤러리</strong> 구성을 갖는다 → <strong>영역 구성 자체는 업계 공통 패턴</strong>임을 시사. 다만 화면 단위 비교는 불가.</li></ul><h2>2. 평가 프레임 (등급 앵커 — 프로젝트 합의 필요)</h2><p>221의 핵심은 평가 축과 등급 기준이다. <strong>전사 표준 앵커가 확정되지 않았으므로</strong>(미결 논점 4) 프로젝트 합의값으로 잡는다.</p><div class='tw'><table><thead><tr><th>평가 축</th><th>세부 항목</th><th>본 프로젝트 관련성</th></tr></thead><tbody><tr><td><strong>A. 진입·탐색</strong></td><td>GNB/전체메뉴 구조, 지점 선택 방식, 검색 진입</td><td>REQ-CM-001·003, REQ-SI-001</td></tr><tr><td><strong>B. 지점 정보</strong></td><td>지점 목록·상세·층별안내·행사안내 구성, 템플릿화 수준</td><td>REQ-SI-003~016 (최대 영역)</td></tr><tr><td><strong>C. 멤버십·VIP</strong></td><td>등급 체계 노출, 혜택 표현, 마일리지 안내</td><td>REQ-CA-013·014</td></tr><tr><td><strong>D. 문화·콘텐츠</strong></td><td>강좌 탐색·신청 동선, 공연/전시 노출</td><td>REQ-CU-001~012</td></tr><tr><td><strong>E. 채널 정합</strong></td><td>PC↔Mobile Web 구조 일치도</td><td>REQ-SC-005, REQ-CU-009</td></tr><tr><td><strong>F. 접근성·표준</strong></td><td>KWCAG 준수 수준, 브라우저 지원</td><td>REQ-CM-008</td></tr></tbody></table></div><h3>등급 앵커 — <strong>OSSP 원문 4단계</strong> (표준 규정)</h3><div class='tw'><table><thead><tr><th>등급</th><th>판정 기준</th></tr></thead><tbody><tr><td><strong>뛰어남</strong></td><td>비교 대상 중 <strong>가장 나은 방식</strong>으로 과업 지원 (상대 평가 — 대상이 1개면 사용 안 함)</td></tr><tr><td><strong>보통</strong></td><td>업계 통상 수준 — 특별한 우위도 결함도 없음</td></tr><tr><td><strong>부족</strong></td><td>지원하나 <strong>과업 완수에 마찰</strong> — 단계 과다·정보 누락·경로 불명</td></tr><tr><td><strong>제공안함</strong></td><td>해당 컨텐츠·기능 없음</td></tr><tr><td><em>(미확인)</em></td><td><strong>등급이 아니라 상태.</strong> 추정으로 등급을 매기지 않는다</td></tr></tbody></table></div><blockquote>⚠️ <strong>초판은 여기서 <code>우수/보통/미흡</code> 3단계를 임의로 만들었다</strong> — OSSP 원문 4단계와 불일치. 표준의 앵커가 미확정이자 산출물이 즉석에서 자기 규칙을 지어낸 사례다. 표준 규정 보완으로 4단계를 고정했다.</blockquote><h3>매트릭스 골격 — 전부 <em>(미확인)</em></h3><div class='tw'><table><thead><tr><th>평가 축</th><th>자사</th><th>롯데</th><th>신세계</th></tr></thead><tbody><tr><td>A. 진입·탐색</td><td>§3 참조</td><td><em>(미확인)</em></td><td><em>(미확인)</em></td></tr><tr><td>B. 지점 정보</td><td>§3 참조</td><td><em>(미확인)</em></td><td><em>(미확인)</em></td></tr><tr><td>C. 멤버십·VIP</td><td>§3 참조</td><td><em>(미확인)</em></td><td><em>(미확인)</em></td></tr><tr><td>D. 문화·콘텐츠</td><td>§3 참조</td><td><em>(미확인)</em></td><td><em>(미확인)</em></td></tr><tr><td>E. 채널 정합</td><td>§3 참조</td><td><em>(미확인)</em></td><td><em>(미확인)</em></td></tr><tr><td>F. 접근성·표준</td><td>§3 참조</td><td><em>(미확인)</em></td><td><em>(미확인)</em></td></tr></tbody></table></div><p><strong>경쟁사 12셀 전부 미확인</strong>이다. 자사 열조차 등급을 매기지 않는다 — 비교 대상이 없으면 &quot;뛰어남/부족&quot;은 성립하지 않기 때문이다(상대 평가 규칙).</p><h2>3. 자사 현황 (122 실측 기반 — 비교의 기준선)</h2><p>경쟁사 평가는 못 하지만, <strong>자사 현황은 정량 확보</strong>돼 있다. 이후 비교가 가능해질 때의 기준선으로 남긴다.</p><div class='tw'><table><thead><tr><th>평가 축</th><th>자사 현황</th><th>관찰</th></tr></thead><tbody><tr><td>A. 진입·탐색</td><td>PC=GNB 기반 / MWEB=전체메뉴(MAM)·지점선택(MSS) 독립 화면</td><td><strong>PC와 MWEB의 진입 모델이 다르다.</strong> 통일 여부가 IA 설계 분기점</td></tr><tr><td>B. 지점 정보</td><td>고유 192 / <strong>본화면 132 = 공수 비중 23.0%</strong> (MWEB 101 · PC 91)</td><td>지점수×하위페이지 곱셈 구조. <strong>템플릿화 여지 최대</strong></td></tr><tr><td>C. 멤버십·VIP</td><td>고유 343 / <strong>본화면 171 = 공수 비중 29.8%</strong></td><td><strong>B와 합쳐 52.8%</strong> — 단일 편중이 아니라 2대 영역 구조</td></tr><tr><td>D. 문화·콘텐츠</td><td>고유 135 / 본화면 64 = 11.1%</td><td>CH1985·문화센터 이원 구조 유지 결정(REQ-CU-001)</td></tr><tr><td>E. 채널 정합</td><td>PC 12영역 vs MWEB 15영역 — <strong>1:1 대응 안 됨</strong></td><td>MWEB 전용 4영역, PC 전용 1영역</td></tr><tr><td>F. 접근성·표준</td><td>KWCAG 준수 수준 / IE10+ 지원</td><td>IE는 착수 시점에 이미 지원 종료(뉴스클리핑 ④)</td></tr></tbody></table></div><h2>4. 시사점 (242 UX컨셉·322 IA로 전달)</h2><p>경쟁 비교 없이도 <strong>자사 구조 자체에서 도출되는</strong> 개선 시사점:</p><ol><li><strong>채널 진입 모델 불일치</strong>가 가장 큰 구조 이슈 — PC GNB vs MWEB 허브형. 통일할지 채널 특성으로 유지할지 결정 필요.</li><li><strong>지점안내 템플릿화</strong>가 최대 효율 지점 — 본화면 132(23.0%)가 소수 템플릿으로 수렴 가능.</li><li><strong>카드·멤버십 영역의 화면 수 대비 요건 밀도가 낮음</strong>(본화면 171 vs 요건 14건) → 반복 구조. 여기도 템플릿 전략.</li><li><strong>B·C 두 영역이 공수의 52.8%</strong> — 별도 트랙은 카드 하나가 아니라 <strong>둘 다</strong> 필요(132 R-4).</li><li><strong>VIP·마일리지는 매년 변경되는 데이터</strong> → 화면이 아니라 어드민 갱신 구조로 설계.</li></ol><h2>5. [자료부재] · [확인필요]</h2><p><strong>[자료부재]</strong> — 사람 작업 필요</p><ol><li>2022년 시점 롯데백화점 공식 채널 화면</li><li>2022년 시점 신세계백화점 공식 채널 화면</li><li>고객 지정 벤치마킹 대상 목록</li><li>업계 순위·평가 사이트 자료</li></ol><p><strong>[확인필요]</strong></p><ol><li>고객사가 벤치마킹 대상을 지정할 것인지</li><li>평가 등급 앵커를 전사 표준으로 고정할지 프로젝트별로 둘지 (미결 논점 4)</li></ol><h2>6. 후속</h2><ul><li><strong>222 심층벤치마킹은 수행하지 않는다</strong> — 221이 대상을 확정하지 못했으므로 심층 분석의 입력이 없다. 원 프로젝트에도 수행 흔적 없음.</li><li>대상이 확보되면 이 문서의 §2 프레임에 평가 결과를 채워 정식 서비스비교분석서로 승격한다.</li></ul><h2>7. 스냅샷 보존 — 이 사고가 반복되지 않으려면</h2><p>이번 축소의 직접 원인은 <strong>2022년 시점 경쟁사 화면이 아무 데도 남아 있지 않다</strong>는 것이다. 당시 221을 수행하며 캡처를 남겼다면 지금 비교가 가능했다.</p><p>표준 규정에 <strong>「확인 스냅샷 보존」</strong>을 신설했다 — 앞으로 221을 수행할 때는 평가 근거로 <strong>확인 일자 · URL · 화면 캡처</strong>를 함께 남긴다.</p><blockquote>이 규칙은 <strong>앞으로의 사고만 막는다.</strong> 이미 사라진 2022년 화면은 복구할 수 없다.</blockquote><h2>출처</h2><ul><li><a href=\"https://www.lotteshopping.com/contents/shpgInfo?cstrCd=0001\" target=\"_blank\" rel=\"noopener\">쇼핑정보 — 롯데백화점</a> (영역 구성 확인 목적, 시점 2026 — 평가 근거로 사용하지 않음)</li><li><a href=\"https://www.metroseoul.co.kr/article/2019042900067\" target=\"_blank\" rel=\"noopener\">신세계백화점 홈페이지 &#x27;신세계닷컴&#x27; 개편 — 메트로신문 (2019-04-29)</a> (2019년 개편 사례, 참고)</li></ul>", "bytes": 8965, "deliv": "221_서비스분석/서비스비교분석서.html"}], "asis_html": "<h2>해당 산출물 없음</h2><p><code>원 프로젝트에 서비스비교분석·벤치마킹 산출물 없음</code></p><p>220 경쟁환경분석 활동 자체가 수행되지 않은 것으로 보인다. 아카이브에 관련 폴더·파일 없음.</p>", "inbox": {"required": ["뉴스클리핑·환경분석보고서(121 vinylc_environment-scan, 경쟁사 후보·시장 맥락)", "요구사항정의서(215, 있으면 평가기준 정합)", "고객 지정 우수서비스/순위사이트(고객 제공)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/200_Discover/220_경쟁환경분석/221_서비스분석", "body_html": "<h1>221 서비스분석 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_competitor-service-analysis</code>  → 로컬 포크 위치 <code>.claude/skills/vinylc_competitor-service-analysis/SKILL.md</code></p><p>이 작업에 배치된 스킬은 <strong>프로젝트 로컬 포크</strong>라 수정할 수 있다. 수정 시 <code>.claude/skills/README.md</code> 규칙을 따른다.</p><h2>투입 인풋</h2><ul><li>W 조건부 외부검색</li><li>121 환경분석</li><li>122 AS-IS</li><li>126 범위정의서</li></ul><h2>산출물</h2><ul><li><code>서비스비교분석서.md</code></li></ul><h2>AS-IS 대조</h2><ul><li>상태: <strong>원본없음</strong></li><li>원본: 해당 없음</li><li>원 프로젝트에 서비스비교분석·벤치마킹 산출물 없음 — 실제로 수행하지 않은 것으로 보인다. 축소 판정이 실행과 일치: &#x27;못 한 것&#x27;이 아니라 &#x27;안 하는 게 맞았던&#x27; 케이스.</li></ul><h2>이후 어디에 쓰이나</h2><ul><li>242 UX컨셉 — 차별화 지점</li></ul><h2>도출된 인사이트</h2><p>개편형 테일러링에서 221·222는 <strong>필수(●)</strong> 인데 원 프로젝트는 수행하지 않았다. OSSP가 필수로 규정한 활동이 현장에서 생략되는 패턴 — 전사 표준의 필수/선택 재조정 근거가 된다.</p><h2>스킬 고도화 (이번 작업에서 수행)</h2><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>등급 앵커 4단계 고정</strong></td><td>미완성 항목(&quot;앵커 미확정&quot;)이 실제 오작동을 냈다 — 초판이 <strong>임의로 <code>우수/보통/미흡</code> 3단계를 만들어</strong> OSSP 원문의 4단계(뛰어남/보통/부족/제공안함)를 벗어났다. <strong>미확정 항목을 만나면 스킬이 즉석에서 자기 규칙을 지어낸다</strong>는 것이 확인된 사례</td></tr><tr><td>2</td><td><strong>확인 스냅샷 보존</strong> 신설</td><td>221 축소의 직접 원인이 <strong>2022년 시점 경쟁사 화면 부재</strong>다. 스킬은 &quot;최신·실증 데이터&quot;와 &quot;주기적 갱신&quot;을 요구하면서 <strong>근거의 보존</strong>은 규정하지 않는다 — 갱신하려면 이전 스냅샷이 있어야 한다</td></tr></tbody></table></div><p><strong>전사 환류 판단</strong>: 2건 모두 유효 (레지스트리 반영 승인 대기)</p><h2>도출된 인사이트 (재실행본)</h2><p><strong>미확정 항목은 비워지는 게 아니라 지어내진다.</strong> 213·126은 미완성 항목 때문에 섹션이 <em>빠졌는데</em>, 221은 반대로 <strong>없는 규칙을 즉석에서 만들어 채웠다</strong>(3단계 앵커). 결손보다 이쪽이 더 위험하다 — 빠진 건 보이지만 지어낸 규칙은 정상처럼 보인다.</p><p><strong>122 재실측으로 이 문서의 수치도 바뀌었다.</strong> &quot;카드 321화면 = 39%&quot;는 행 기준이었고, 공수 기준(본화면)으로는 <strong>카드 29.8% + 지점안내 23.0% = 52.8%의 2대 영역 구조</strong>다. 시사점 &quot;카드만 별도 트랙&quot;이 &quot;둘 다&quot;로 수정됐다.</p><p><strong>축소의 원인은 스킬이 아니라 자료 보존 관행이다.</strong> 당시 캡처를 남겼다면 지금 비교가 가능했다. 스냅샷 보존 규칙은 앞으로의 사고만 막는다 — 사라진 2022년 화면은 복구할 수 없다.</p>"}, {"task_id": "222", "task_name": "심층벤치마킹", "skill": "vinylc_deep-benchmarking", "state": "skip", "exclusion_category": "C 원자료 부재", "verdict": "C 원자료 부재", "todo": "0", "inputs": [], "outputs": [], "asis_state": "미정", "asis_file": null, "asis_note": "", "meta_html": "", "skill_info": [{"name": "vinylc_deep-benchmarking", "version": "0.1.0-draft", "local": false}], "docs": [], "asis_html": "", "inbox": {"required": ["서비스비교분석서(221 vinylc_competitor-service-analysis, 우수 대상·핵심 항목)", "우수 서비스 화면 캡처/녹화(사람이 수집)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/200_Discover/220_경쟁환경분석/222_심층벤치마킹", "body_html": "<h1>222 심층벤치마킹 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_deep-benchmarking</code></p><p>아직 실행하지 않은 작업입니다. <code>_inputs/</code> 에 자료를 넣고 실행을 요청하세요.</p><h2>제외 판정 — C 원자료 부재</h2><blockquote>실행계획서 §4-B(2026-08-06 개정) 적용. 판정 기준: <strong>실전에서도 AI가 동일하게 수행할 수 있는 작업인가?</strong></blockquote><p>AI가 수행 가능한 데스크 리서치이나 <strong>평가 대상 화면이 남아 있지 않다</strong>. 221에서 같은 사유로 축소됐고, 221이 대상을 확정하지 못했으므로 222의 입력 자체가 없다.</p><p><strong>확보 시 수행 가능</strong> — 아카이브 캡처 또는 고객 지정 벤치마킹 대상이 들어오면 전환한다.</p><p><strong>필요 인풋</strong>: 2022년 시점 경쟁사(롯데·신세계) 화면 캡처</p>"}, {"task_id": "231", "task_name": "현시스템UT및심층인터뷰", "skill": "vinylc_usability-test", "state": "skip", "exclusion_category": "B 인간 활동 필수", "verdict": "B 인간 활동 필수", "todo": "0", "inputs": [], "outputs": [], "asis_state": "미정", "asis_file": null, "asis_note": "", "meta_html": "", "skill_info": [{"name": "vinylc_usability-test", "version": null, "local": false}], "docs": [], "asis_html": "", "inbox": {"required": [], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/200_Discover/230_사용자분석/231_현시스템UT및심층인터뷰", "body_html": "<h1>231 현시스템UT및심층인터뷰 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_usability-test</code></p><p>아직 실행하지 않은 작업입니다. <code>_inputs/</code> 에 자료를 넣고 실행을 요청하세요.</p><h2>제외 판정 — B 인간 활동 필수</h2><blockquote>실행계획서 §4-B(2026-08-06 개정) 적용. 판정 기준: <strong>실전에서도 AI가 동일하게 수행할 수 있는 작업인가?</strong></blockquote><p><strong>관찰 데이터의 원천이 없다.</strong> 사용자가 어디서 막혔는지를 지어내면 그 위에 세운 모든 판단이 허구가 된다.</p><p>122 휴리스틱 평가가 이 공백을 <strong>부분적으로만</strong> 메운다 — 구조 판정은 되지만 실제 사용자 행동은 알 수 없다.</p><p><strong>필요 인풋</strong>: UT 관찰 기록·참가자 발언</p>"}, {"task_id": "232", "task_name": "감성이미지조사", "skill": "vinylc_emotional-image-research", "state": "intervene", "verdict": "미실행", "todo": "0", "inputs": [], "outputs": [], "asis_state": "미정", "asis_file": null, "asis_note": "", "meta_html": "", "skill_info": [{"name": "vinylc_emotional-image-research", "version": "0.1.0-draft", "local": false}], "docs": [], : "7", "inputs": ["I4 워크숍 회의록 2건(220923·220929)", "215 요구사항정의서", "122 AS-IS 화면덤프·User Flow", "212 정책요건", "126 범위정의서", "221 서비스비교분석서", "121 환경분석"], "outputs": ["고객여정맵.md", "분석시사점.md", "UX컨셉키워드.md", "UX전략보고서.md", "_대조_방향성분석_V0.4.md", "_결정근거_회원영역_화면분류.md", "_개입요청_UX컨셉방향_후보안.md"], "asis_state": "대조완료", "asis_file": "HDDS_방향성분석_V0.4_220915.pdf", "asis_note": "🔓 2026-08-06 해제. 일치 7 / 원본 우위 4 / 시뮬 우위 5 / 판정 정정 1(222 수행됨). 축의 차원이 달랐다 — 원본=방식 축(일원화), 시뮬=대상 축(지점/멤버십/콘텐츠).", "meta_html": "", "skill_info": [{"name": "vinylc_analysis-synthesis", "version": "0.1.0-c2202500.1", "local": false}, {"name": "vinylc_ux-concept", "version": "0.1.0-c2202500.1", "local": false}, {"name": "vinylc_ux-strategy-report", "version": "0.1.0-draft", "local": false}], "docs": [{"name": "UX전략보고서.md", "path": "sim-project/200_Discover/240_분석종합및UX전략수립/UX전략보고서.md", "html": "<h1>UX전략보고서 — 현대백화점 자사채널(홈페이지) 개선 [AI 생성]</h1><blockquote><strong>버전 V0.4 · 상태: <code>승인 대기</code> (선결 2건 해소 · 규모 재산정 완료)</strong> — 최종 승인은 클라이언트 최고의사결정자. 표준이 확정하지 않는다.<br>📌 <strong>living document</strong> — 300 Define(유저플로우·IA·와이어프레임·프로토타이핑)을 거치며 갱신된다.<br>근거: 242 UX컨셉키워드 · 241 여정맵·분석시사점 · 215 요구사항정의서 · 126 범위정의서 · 122 AS-IS</blockquote><hr><h2>1. 배경·목적</h2><p>현대백화점 공식 홈페이지 PC·Mobile Web <strong>전 페이지의 UX/UI를 개선</strong>하는 프로젝트다(126 O-1). 계약 기간 7개월, <strong>23.1Q 오픈</strong> 목표.</p><p>이 채널은 커머스가 아니다. <strong>브랜딩·콘텐츠 아카이빙 + 그룹사 허브 + 기업정보(IR·ESG)</strong> 가 성격이며(I1 제안서·126), 사용자 여정의 종착점은 대개 <strong>구매가 아니라 오프라인 방문 또는 정보 획득</strong>이다(241 §1).</p><p>이 문서는 <strong>프로토타이핑 전에 방향을 선언하는 이정표</strong>다. 구체 화면 설계는 300 Define에서 다룬다.</p><hr><h2>2. 문제 요약 — 3분 안에 이해할 핵심</h2><p>현행 채널의 문제는 &quot;디자인이 낡았다&quot;가 아니다. <strong>구조가 두 갈래로 갈라져 있고, 반복으로 부풀어 있으며, 실패를 처리하지 않는다.</strong></p><div class='tw'><table><thead><tr><th>#</th><th>문제</th><th>실측</th></tr></thead><tbody><tr><td><strong>P1</strong></td><td><strong>두 채널이 하나의 서비스로 작동하지 않는다</strong></td><td>진입 구조 상이(PC 1st depth <strong>32</strong> vs MWEB <strong>6</strong>) · <strong>계정 기능 결손 9건</strong> — 모바일에서 비밀번호를 바꿀 수 없고 PC에서 차량번호를 등록할 수 없다 · 같은 브랜드가 채널마다 다른 이름(<code>위마켓</code>/<code>위마캣</code>)</td></tr><tr><td><strong>P2</strong></td><td><strong>화면이 많은 게 아니라 같은 구조가 반복된다</strong></td><td>명세 행 1,344 / 고유 1,003 / <strong>본화면 574</strong> · 지점안내 <strong>23.0%</strong> + 카드·멤버십 <strong>29.8%</strong> = <strong>52.8%</strong> · 카드 영역은 본화면 171인데 요건은 14건</td></tr><tr><td><strong>P3</strong></td><td><strong>막혔을 때 갈 곳이 없다</strong></td><td><strong>오류·404 화면이 명세에 0건</strong>(1,003화면 규모) · 카드신청 64화면 중 <strong>취소 경로 0건</strong> · 수강 정원 초과가 사후 처리</td></tr><tr><td><strong>P4</strong></td><td><strong>회원 체계 전환이 설계 위에 걸쳐 있다</strong></td><td>H.Point 통합 <strong>23.1.1</strong> — 오픈과 근접 · <strong>전환 화면이 PC에만 존재</strong> · 회원 메뉴 제외 경계 <strong>68화면 미정</strong></td></tr></tbody></table></div><blockquote>그리고 <strong>증설이 예정돼 있다</strong> — 더현대 대구 신규 · 브랜드 추가 입점 · ESG 콘텐츠 · 전시/공연 개선(워크숍 2차). 지금 구조로는 <strong>증설할 때마다 화면이 곱해진다.</strong></blockquote><hr><h2>3. UX 전략 방향 (비전)</h2><blockquote><strong>&quot;어느 점포인가&quot;에서 시작해, 한 번 만든 것을 지점마다 붙이고, 어느 채널에서든 같은 일을 할 수 있게 한다. 그리고 막혔을 때 갈 곳을 먼저 만든다.</strong></blockquote><p>두 개의 축으로 선다.</p><div class='tw'><table><thead><tr><th>축</th><th>내용</th><th>왜 이 축인가</th></tr></thead><tbody><tr><td><strong>주축 — 지점</strong></td><td>통일의 기준을 「어느 점포인가」로 둔다</td><td>채널 성격이 <strong>오프라인 방문 유도</strong>이고, MWEB은 <strong>이미 지점 기점 구조</strong>(<code>MSS</code>)를 갖고 있다. 지점안내가 공수의 23.0%</td></tr><tr><td><strong>부축 — 계정</strong></td><td>계정으로 할 수 있는 일을 채널이 가르지 않는다</td><td>결손 9건이 전부 계정 영역에 몰려 있고, <strong>H.Point 전환이 이 시기에 온다</strong></td></tr></tbody></table></div><p><strong>왜 하나가 아니라 둘인가</strong>: 지점(23.0%)과 카드·멤버십(29.8%)이 <strong>비등하다.</strong> 어느 하나만 축으로 삼으면 나머지 절반이 방치된다. 지점을 주축으로 두어 실행 리스크를 낮추고, 계정을 부축으로 두어 P1·P4를 함께 해소한다.</p><p><strong>대안 검토 기록</strong>: 콘텐츠를 축으로 삼는 안도 검토했으나, 심각도 &#x27;상&#x27; 문제 9건 중 <strong>1건만 커버</strong>하고 CMS 개선이 계약 범위 밖(124 #23)이라 실행 수단이 제한돼 채택하지 않았다.</p><hr><h2>4. 개선방향·컨셉 — 문제 → 방향 → 기대효과</h2><h3>K1. 「어느 점포인가」로 시작한다 <em>(주축)</em></h3><div class='tw'><table><thead><tr><th></th><th>내용</th></tr></thead><tbody><tr><td>문제</td><td><strong>P1</strong> 두 채널의 진입 모델이 다르다 · 검색결과가 진입 문맥을 반영하지 않는다(최대 21경로 → 화면 1)</td></tr><tr><td>방향</td><td>양 채널 공통 진입에 <strong>지점 컨텍스트</strong>를 두고, 검색·목록·상세가 선택된 지점을 유지한다. 지점 무관 정보(IR·ESG)는 <strong>명시적으로 축 밖</strong>에 둔다</td></tr><tr><td>기대효과</td><td>채널을 오갈 때 멘탈모델이 이어진다 · 검색 결과가 문맥을 갖는다 · <strong>오프라인 방문 유도 + 분산 콘텐츠의 허브</strong>라는 채널 목적과 구조가 일치한다</td></tr></tbody></table></div><h3>K2. 한 번 만들고 지점마다 붙인다 <em>(주축)</em></h3><div class='tw'><table><thead><tr><th></th><th>내용</th></tr></thead><tbody><tr><td>문제</td><td><strong>P2</strong> 2대 영역 52.8%가 반복 구조 · 증설 예정 3건</td></tr><tr><td>방향</td><td>지점 하위·카드 혜택을 <strong>템플릿 + 데이터</strong>로. 신규 지점·신규 브랜드가 <strong>템플릿 인스턴스</strong>로 처리되는지가 설계 합격 기준</td></tr><tr><td>기대효과</td><td><strong>증설해도 화면 수가 늘지 않는다</strong> · 등급·혜택 개편이 화면 수정 없이 반영 · 운영 변경(워크숍 4건)을 구조가 흡수</td></tr><tr><td>유의</td><td><strong>구조는 통일하되 점포별 특성은 모듈로 표현</strong>한다. 플래그십(더현대 서울)의 개성을 닫지 않는다</td></tr></tbody></table></div><h3>K3. 계정으로 할 수 있는 일을 채널이 가르지 않는다 <em>(부축)</em></h3><div class='tw'><table><thead><tr><th></th><th>내용</th></tr></thead><tbody><tr><td>문제</td><td><strong>P1</strong> 계정 기능 결손 9건 · <strong>P4</strong> H.Point 전환이 PC 전용</td></tr><tr><td>방향</td><td>로그인·마이페이지 <strong>기능 집합을 채널 동일</strong>로. <strong>H.Point 전환 경로를 모바일에도.</strong> 채널 차이를 남기려면 <strong>결정 근거를 화면명세에 기록</strong></td></tr><tr><td>기대효과</td><td>&quot;어디서 되는지&quot;를 학습할 필요가 없어진다 · 전환 시점에 모바일 이용자가 배제되지 않는다</td></tr></tbody></table></div><h3>K4. 막혔을 때 갈 곳을 먼저 만든다</h3><div class='tw'><table><thead><tr><th></th><th>내용</th></tr></thead><tbody><tr><td>문제</td><td><strong>P3</strong> 오류 화면 0건 · 취소 경로 0건</td></tr><tr><td>방향</td><td>예외 화면군(404·권한없음·세션만료·결제실패·정원초과)을 <strong>공통 컴포넌트로 선설계</strong>. 사후 처리를 <strong>사전 경고</strong>로 전환</td></tr><tr><td>기대효과</td><td>1,003화면이 같은 방식으로 실패를 처리한다 · 거래 완주율 개선</td></tr></tbody></table></div><hr><h2>5. 해결대안 사례 — <strong>제시하지 않음</strong></h2><p>OSSP는 &quot;필요한 경우 해결대안의 사례를 포함&quot;을 허용하나, 이 프로젝트에서는 <strong>제시할 근거가 없다.</strong></p><div class='tw'><table><thead><tr><th>사례 출처</th><th>상태</th></tr></thead><tbody><tr><td>221 서비스비교분석서</td><td><strong>축소</strong> — 2022년 시점 경쟁사 화면 확보 실패</td></tr><tr><td>222 심층벤치마킹</td><td><strong>시뮬레이션 미수행</strong> — 2022 시점 경쟁사 화면 부재. ⚠️ <strong>원 프로젝트는 수행했다</strong>(방향성분석에 통합, 14개+ 서비스)</td></tr></tbody></table></div><p>표준 규칙(<em>&quot;임의 사례 날조 금지&quot;</em>)에 따라, <strong>레퍼런스 사례 없이 방향만 제시</strong>한다. 사례가 필요하면 고객사가 벤치마킹 대상을 지정하는 절차가 선행되어야 한다.</p><hr><h2>6. 비즈니스 가치·기대효과</h2><blockquote>⚠️ <strong>정량 목표치는 제시할 수 없다.</strong> 126 §1이 밝힌 대로 <strong>성공기준의 근거가 0</strong>이다 — 125 경영진인터뷰·123 VOC·214 이용로그가 전부 결손이라 이탈률·전환·만족도의 기준선 자체가 없다. 아래는 <strong>정성 가치와 구조적 근거</strong>뿐이다.</blockquote><div class='tw'><table><thead><tr><th>#</th><th>가치</th><th>근거</th><th>정량화</th></tr></thead><tbody><tr><td>V-1</td><td><strong>증설 비용 억제</strong> — 지점·브랜드가 늘어도 화면이 곱해지지 않는다</td><td>K2 · 증설 예정 3건 확인</td><td>템플릿 수렴률로 사후 측정 가능</td></tr><tr><td>V-2</td><td><strong>운영 변경 흡수</strong> — 등급·혜택 개편이 화면 수정 없이 반영</td><td>212 등급 6종·혜택 12종·마일리지 예외 20여</td><td>어드민 갱신 비율</td></tr><tr><td>V-3</td><td><strong>전환기 리스크 완화</strong> — H.Point 전환(23.1.1)에 모바일 이용자 포함</td><td>122 A3 · 212 G2</td><td><code>[확인필요]</code></td></tr><tr><td>V-4</td><td><strong>거래 완주</strong> — 예외 경로 부재로 인한 이탈 방지</td><td>122 H9 오류 화면 0건</td><td><strong>214 로그 없이는 기준선 없음</strong></td></tr><tr><td>V-5</td><td><strong>오프라인 방문 유도와 구조 일치</strong></td><td>채널 성격(I1·126) · 121 S6 리오프닝</td><td><code>[확인필요]</code></td></tr></tbody></table></div><p><strong>정량 기준을 세우려면</strong>: 경영진이 정의한 성공 · VOC 정량 분포 · 현행 이용 지표 중 최소 하나가 필요하다. <strong>지금 확보 가능한 것은 214 이용로그뿐</strong>이며(123은 원자료 부재, 125는 인간 활동), 로그 수급 요청은 이미 발송돼 있다(214 데이터추출요청).</p><hr><h2>7. 이해관계자 우려·대응</h2><div class='tw'><table><thead><tr><th>#</th><th>예상 우려</th><th>이 전략의 대응</th></tr></thead><tbody><tr><td>U-1</td><td>&quot;지점 중심으로 가면 <strong>카드·멤버십(최대 영역)이 밀리는 것 아닌가</strong>&quot;</td><td>그래서 계정을 <strong>부축</strong>으로 뒀다. K3가 카드·멤버십의 계정 측면을, K2가 반복 구조를 다룬다. 밀리지 않는다</td></tr><tr><td>U-2</td><td>&quot;모바일에 PC급 기능을 다 넣으면 <strong>무거워지지 않나</strong>&quot;</td><td>K3는 <strong>기능 집합의 동일</strong>이지 화면 구성의 동일이 아니다. 표현은 채널별로 다를 수 있고, 차이를 둘 때 <strong>사유를 기록</strong>하는 것이 규율이다</td></tr><tr><td>U-3</td><td>&quot;예외 화면을 먼저 만들면 <strong>눈에 보이는 성과가 늦다</strong>&quot;</td><td>사실이다(K4 trade-off에 명시). 다만 오류 화면 0건 상태로 오픈하면 <strong>운영 단계에서 더 큰 비용</strong>이 든다</td></tr><tr><td>U-4</td><td>&quot;<strong>회원 메뉴는 제외</strong>라고 회신했는데 K3가 성립하나&quot;</td><td><strong>성립하지 않는다.</strong> §8-1 참조 — 이 전략의 최우선 선결 조건이다</td></tr><tr><td>U-5</td><td>&quot;VIP프로그램은 이미 <strong>MWEB만 개선</strong>으로 정했다&quot;</td><td>K3와 정면 충돌한다. §8-2 참조 — 재협의 대상이다</td></tr></tbody></table></div><hr><h2>8. 선결 조건 — <strong>✅ 2건 모두 해소 (2026-08-06)</strong></h2><p>V0.1에서 &quot;정해지지 않으면 부축 K3가 성립하지 않는다&quot;고 올린 2건이 결정됐다.</p><h3>8-1. ✅ 회원 메뉴 개편 경계 — <strong>부분 포함으로 확정</strong></h3><p>68화면을 기능 성격으로 재분류하고 <strong>C 회원정보관리만 개편 대상</strong>으로 정했다.</p><div class='tw'><table><thead><tr><th>분류</th><th>화면</th><th>처리</th></tr></thead><tbody><tr><td>A 법정고지·정책</td><td><strong>17</strong></td><td>손대지 않음 — 회원 체계 전환과 무관</td></tr><tr><td>B 인증진입</td><td><strong>21</strong></td><td>제외 — 23.1.1 H.Point 전환 시 통째로 바뀜</td></tr><tr><td><strong>C 회원정보관리</strong></td><td><strong>30</strong></td><td>✅ <strong>개편 대상 = K3 적용 범위</strong></td></tr></tbody></table></div><p><strong>→ K3는 성립한다. 단 축소된 형태다.</strong> 채널 결손 9건 중 <strong>3건 해소</strong>(비밀번호 변경·H.Point 전환·차량번호) + <strong>1건 의도적 차이 확정</strong>(로그인 기록 보기) = 4건을 다룬다. 3건은 전환·법정 사유로 범위 밖, 2건(사이트맵·웹접근성 안내)은 회원 영역이 아니라 K1·354로 이관.</p><blockquote>📎 <strong>대상 화면 목록</strong>: <code>_결정근거_회원영역_화면분류.md</code>(240 폴더) — 68화면 전건 분류표<br><br>⚠️ <strong>수치 정정</strong>: 결정 시점 개략 분류로는 23건이었으나 재분류 결과 <strong>30건</strong>이다. 결정 취지는 동일하고 대상 수만 정정됐다.</blockquote><h3>8-2. ✅ 채널 통일 상충 2건 — <strong>해소</strong></h3><div class='tw'><table><thead><tr><th>건</th><th>결정</th><th>근거</th></tr></thead><tbody><tr><td><strong>VIP프로그램</strong></td><td><strong>PC도 2Tab으로 통일</strong> — PC 작업 등급 <code>스킨변경 → 개선</code> 상향</td><td>1차 워크숍의 &quot;구조 통일 필요(PC/M.web 동일)&quot;를 실제로 이행. 2차의 MWEB 단독 개선이 만든 구조 이격을 해소</td></tr><tr><td><strong>마이페이지 &#x27;로그인 기록 보기&#x27;</strong></td><td><strong>PC 전용 유지 + 사유를 화면명세에 기록</strong></td><td>K3의 &quot;다르게 두려면 사유를 적는다&quot; 규율 적용. <strong>방치가 아니라 결정</strong>으로 전환</td></tr></tbody></table></div><h3>8-3. ✅ 규모 재산정 완료 (2026-08-06) — <strong>V0.3의 서술을 정정</strong></h3><p>V0.3에서 &quot;공수 증가 3항목&quot;으로 적었으나, <strong>132 재산정 실측 결과 1항목은 감소</strong>였다.</p><div class='tw'><table><thead><tr><th>#</th><th>결정</th><th>실측 영향</th><th>방향</th></tr></thead><tbody><tr><td>R1</td><td>회원 경계 확정 (A 17 + B 21 = 38화면 제외)</td><td>고유 −38 · <strong>본화면 −26</strong></td><td><strong>감소</strong> ← 정정</td></tr><tr><td>R2</td><td>VIP PC 등급 상향</td><td>화면 수 불변, <strong>공수 계수 상승</strong>(본화면 7)</td><td>증가</td></tr><tr><td>R3</td><td>K4 예외 화면군 신규</td><td><strong><code>[규모미상]</code></strong></td><td>증가(미상)</td></tr></tbody></table></div><p><strong>회원 68화면이 이미 574 기준선에 포함돼 있었기 때문</strong>이다 — 126이 제외로 선언했는데 132가 규모에서 빼지 않은 상태였다. 결정이 그 불일치를 해소하면서 <strong>처음으로 실제 In-Scope 규모가 확정</strong>됐다.</p><div class='tw'><table><thead><tr><th></th><th>AS-IS 현행</th><th><strong>In-Scope 확정</strong></th></tr></thead><tbody><tr><td>고유 화면</td><td>1,003</td><td><strong>965</strong></td></tr><tr><td><strong>본화면</strong></td><td><strong>574</strong></td><td><strong>548</strong></td></tr><tr><td>종속 화면</td><td>429</td><td>417</td></tr></tbody></table></div><p><strong>부수 효과 — 2대 영역 편중이 심해졌다</strong>: 회원 영역이 빠져 분모가 줄면서 카드 29.8%→<strong>31.2%</strong>, 지점안내 23.0%→<strong>24.1%</strong>, 합계 52.8%→<strong>55.3%</strong>. <strong>K2(템플릿화)의 중요도가 재산정으로 더 올라갔다.</strong></p><p>상세: 132 §2-B · §11 인용값 대장</p><h2>9. 다음 단계 (높은 수준)</h2><pre>243 승인\n  ↓\n312 유저플로우 ── K1(지점 컨텍스트 유지) · K4(예외 경로 폐포)가 판단 기준\n  ↓\n321 기능정의 ── K3(채널 동일 기능 집합) · I-7 재방문 장치 판단\n  ↓\n322 IA ── K1(진입 모델) · K2(템플릿 단위) · I-6·I-10 이관분\n  ↓\n331 와이어프레임 → 334 시안 → 351 스타일가이드\n  ↓\n341 화면명세서 ── K2 템플릿 수렴률이 여기서 측정된다</pre><p><strong>이 전략서는 위 과정을 거치며 갱신된다</strong>(living document). 특히 <strong>K2의 템플릿 수렴률</strong>은 341 화면명세서 시점에 처음 검증 가능하며, 목표를 밑돌면 전략을 재검토한다.</p><hr><h2>9-B. ⚠️ 분석 공백 — 메인 화면</h2><p><strong>메인의 콘텐츠 구성을 분석하지 못했다.</strong> 122가 원자료 등급 C(캡처 0장)라 화면 목록만 있고 화면 안을 볼 수 없었다. 메인은 진입 지점이라 콘텐츠 구성이 곧 전략인데, 4개 키워드 중 <strong>메인의 콘텐츠 전략을 직접 지시하는 것이 없다.</strong></p><p>→ <strong>331 와이어프레임·334 시안 단계에서 메인을 별도 검토 대상</strong>으로 다룬다. 특히 <strong>로그인 전/후 개인화 여부</strong>는 이 전략에서 판단되지 않았다.</p><h2>10. ⚠️ 이 전략의 근거 한계</h2><p><strong>4개 컨셉키워드는 전부 구조·정책·발주처 근거에서 나왔다. 사용자 조사 근거가 0건이다.</strong></p><div class='tw'><table><thead><tr><th>결손</th><th>분류</th><th>검증되지 않은 것</th></tr></thead><tbody><tr><td>231 UT·심층인터뷰</td><td>인간 활동 필수</td><td><strong>K1의 전제</strong> — 사용자가 실제로 지점 기준으로 생각하는가</td></tr><tr><td>232 감성/이미지조사</td><td>개입대기</td><td>감성 톤 정합 (351에서 재점검 필요)</td></tr><tr><td>233 필드리서치</td><td>인간 활동 필수</td><td>방문 전 온라인 이용 맥락</td></tr><tr><td>123 VOC</td><td>원자료 부재</td><td><strong>K4의 전제</strong> — 실제 불만이 실패 경로에 있는가</td></tr><tr><td>214 이용로그</td><td>미확보</td><td>K1·K2의 우선순위 · V-4 정량 기준선</td></tr></tbody></table></div><p><strong>K1이 가장 취약하다.</strong> &quot;사용자가 지점 기준으로 생각한다&quot;는 가정 위에 서 있는데, 근거는 ① MWEB이 이미 지점 기점 구조를 갖고 있다 ② 채널 성격이 오프라인 방문 유도다 ③ 리오프닝 국면 — <strong>셋 다 사용자 관찰이 아니다.</strong></p><p>→ 231이 확보되면 <strong>K1을 최우선 재검토</strong>한다. 214 로그가 들어오면 <strong>K1·K2의 우선순위와 V-4 기준선</strong>을 세운다.</p><hr><h2>11. 승인 요청</h2><div class='tw'><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td>요청</td><td><strong>UX 전략 방향</strong> — 주축 K1·K2 / 부축 K3(축소 적용) + K4</td></tr><tr><td>결정권자</td><td>클라이언트 최고의사결정자</td></tr><tr><td>선결</td><td>✅ <strong>2건 모두 해소</strong> (§8) — 조건부 아님</td></tr><tr><td>승인 전 확인</td><td>§8-3 규모 재산정 완료 — <strong>In-Scope 본화면 548</strong> 기준 승인 여부</td></tr><tr><td>승인 시</td><td>300 Define 착수 (312 유저플로우부터)</td></tr></tbody></table></div><p><strong>상태: <code>승인 대기</code></strong> — 선결 조건은 해소됐으나 <strong>최종 승인은 여전히 사람의 결정</strong>이다. 이 문서는 승인을 대신 확정하지 않는다.</p><div class='tw'><table><thead><tr><th>버전</th><th>일자</th><th>변경</th></tr></thead><tbody><tr><td>V0.1</td><td>2026-08-06</td><td>최초 작성 (242 컨셉키워드 4종 기반)</td></tr><tr><td>V0.2</td><td>2026-08-06</td><td>대조 반영 — K1 목표 보완 · K2 유의 추가 · §9-B 메인 공백 명시</td></tr><tr><td>V0.3</td><td>2026-08-06</td><td><strong>선결 조건 2건 해소</strong> — 회원 경계 C 30화면 확정 · VIP PC 2Tab 통일 · 로그인기록 사유 기록</td></tr><tr><td>V0.4</td><td>2026-08-06</td><td><strong>132 재산정 반영</strong> — §8-3 정정(R1은 증가가 아니라 감소). In-Scope 본화면 <strong>548</strong> 확정. 2대 영역 55.3%로 상승</td></tr></tbody></table></div>", "bytes": 16564, "deliv": ""}, {"name": "UX컨셉키워드.md", "path": "sim-project/200_Discover/240_분석종합및UX전략수립/UX컨셉키워드.md", "html": "<h1>UX컨셉키워드 — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>입력: 241 고객여정맵·분석시사점 · 215 요구사항정의서(78) · 212 정책요건 · 126 범위정의서 · 122 AS-IS<br><strong>방향 결정</strong>: 사용자 개입(§4-6)으로 <strong>선택지 4 — A 지점 축(주) + B 회원·혜택 축(부)</strong> 확정 (2026-08-06)<br><strong>성격</strong>: 방향까지. 구체 화면·기능 설계는 300 Define.</blockquote><hr><h2>1. 수렴 과정 (논리 사슬)</h2><p>OSSP는 이 단계에 &quot;논리적·종합적 접근&quot;을 요구한다. 241의 5개 테마가 어떻게 4개 키워드로 좁혀졌는지를 남긴다.</p><pre>241 테마 5개\n  T-A 두 채널이 하나의 서비스로 작동하지 않는다        [상]\n  T-B 규모의 정체가 화면 수가 아니라 반복 구조다        [상]\n  T-C 실패했을 때 갈 곳이 없다                        [상]\n  T-D 회원 체계 전환이 설계 위에 걸쳐 있다             [상]\n  T-E 요건이 계속 움직인다                            [중]\n        │\n        │  ① 선택된 방향(A 주 + B 부)으로 축을 고정\n        │     — 통일의 기준을 「지점」으로 두고, 계정 동등성을 부축으로\n        ▼\n  T-A ─┬─ 진입·구조의 통일  ────────────────→ K1\n       └─ 계정 기능의 통일  ────────────────→ K3\n  T-B ──── 반복을 자산으로  ────────────────→ K2\n  T-E ──── 변동 흡수        ───────(K2에 흡수)\n  T-C ──── 실패 경로        ────────────────→ K4\n  T-D ─┬─ 채널 전환 경로   ───────(K3에 흡수)\n       └─ 범위 경계 68화면 ───────→ ✕ 컨셉으로 해소 불가 (§4)</pre><p><strong>수렴 판단 2가지</strong></p><ol><li><strong>T-E(변동)를 독립 키워드로 두지 않았다.</strong> 변동 흡수는 그 자체가 방향이 아니라 <strong>템플릿 구조의 결과</strong>다. K2가 성립하면 T-E는 따라온다. 독립시키면 키워드가 5개가 되면서 판단 기준으로서의 예리함이 떨어진다.</li><li><strong>T-D를 둘로 쪼갰다.</strong> 채널 전환 경로(설계 문제)는 K3로 흡수 가능하지만, <strong>회원 메뉴 제외 경계 68화면은 범위 결정 사항</strong>이라 컨셉이 답할 수 없다. 억지로 덮지 않고 미결로 남긴다.</li></ol><hr><h2>2. UX컨셉키워드 — 4개</h2><h3>K1. <strong>「어느 점포인가」로 시작한다</strong> <em>(주축)</em></h3><div class='tw'><table><thead><tr><th>필드</th><th>내용</th></tr></thead><tbody><tr><td><strong>정의</strong></td><td>두 채널 모두 <strong>지점 컨텍스트를 진입의 기준</strong>으로 삼는다. 사용자가 무엇을 찾든 &quot;어느 점포의 것인가&quot;가 먼저 정해지고, 그 위에서 정보·서비스가 펼쳐진다. <strong>지점과 무관한 정보(IR·ESG·기업)는 이 축 밖에 별도로 둔다</strong> — 억지로 지점에 걸지 않는다.</td></tr><tr><td><strong>근거 문제</strong></td><td>241 <strong>I-1</strong> 채널 진입 모델 불일치(PC 1st depth 32 vs MWEB 6) · <strong>I-6</strong> 검색결과가 진입 문맥 무반영(최대 21경로 → 화면 1) · 여정맵 <strong>O-1·O-2</strong> · 122 H4·H2</td></tr><tr><td><strong>설계 함의</strong></td><td>① 양 채널 공통 진입에 지점 선택을 배치 — MWEB의 <code>MSS</code>가 이미 그 형태다 ② 검색·목록·상세가 <strong>선택된 지점을 유지</strong>한다(문맥 상실 금지) ③ PC GNB 32개 평면 구조를 지점 컨텍스트가 관통하도록 재편 ④ 지점 무관 영역(PIV·PES)은 <strong>명시적으로 축 밖</strong>임을 IA에 표기</td></tr><tr><td><strong>trade-off</strong></td><td><strong>우선</strong>: 오프라인 방문 유도 <strong>+ 허브·아카이브로서의 체류</strong>(126 O-2) · 두 채널의 멘탈모델 일치&lt;br&gt;<strong>덜 중시</strong>: 지점 무관 정보로의 직행 속도 · 지점 미정 상태의 브라우징&lt;br&gt;⚠️ 이 채널의 목표는 방문 유도<strong>만</strong>이 아니다 — <strong>분산된 자사 콘텐츠가 모이는 허브</strong>이기도 하다</td></tr></tbody></table></div><h3>K2. <strong>한 번 만들고 지점마다 붙인다</strong> <em>(주축)</em></h3><div class='tw'><table><thead><tr><th>필드</th><th>내용</th></tr></thead><tbody><tr><td><strong>정의</strong></td><td>반복되는 영역은 <strong>화면을 그리지 않고 템플릿 + 데이터</strong>로 만든다. 지점·카드·브랜드가 늘어도 <strong>화면 수가 늘지 않는 구조</strong>를 만드는 것이 이 프로젝트의 규모 대응이다.</td></tr><tr><td><strong>근거 문제</strong></td><td>241 <strong>I-5</strong> 2대 영역 52.8%(지점 본화면 132 = 23.0% · 카드 171 = 29.8%) · <strong>I-13</strong> 요건 변동(증설 예정 3건) · <strong>T-B</strong> 요건 밀도 불일치(카드 본화면 171 vs 요건 14건) · 여정맵 <strong>O-6·O-8</strong></td></tr><tr><td><strong>설계 함의</strong></td><td>① 지점 하위(층별·행사·오시는길)를 <strong>지점 템플릿 1종</strong>으로 ② 카드·혜택을 <strong>혜택 데이터 템플릿</strong>으로 — 등급 6종·혜택 12종·마일리지 예외 20여(212)가 화면 수정 없이 갱신 ③ 신규 지점(더현대 대구)·신규 브랜드 입점이 <strong>템플릿 인스턴스</strong>로 처리되는지가 설계 합격 기준 ④ 종속 화면 429건(레이어·탭)도 <strong>공통 패턴으로 수렴</strong> 대상</td></tr><tr><td><strong>trade-off</strong></td><td><strong>우선</strong>: 확장성 · 일관성 · 운영 변경 흡수&lt;br&gt;<strong>덜 중시</strong>: 지점별 <strong>레이아웃</strong>의 자유도 · 특정 지점만을 위한 별도 화면&lt;br&gt;⚠️ <strong>개성을 포기하는 것이 아니다</strong> — <strong>구조는 통일하고 특성은 모듈로 표현</strong>한다(이벤트 모듈·아트&amp;컬처 모듈 등). 더현대 서울 같은 플래그십의 표현 여지를 닫지 않는다</td></tr></tbody></table></div><h3>K3. <strong>계정으로 할 수 있는 일을 채널이 가르지 않는다</strong> <em>(부축)</em></h3><div class='tw'><table><thead><tr><th>필드</th><th>내용</th></tr></thead><tbody><tr><td><strong>정의</strong></td><td>같은 계정이면 <strong>어느 채널에서든 같은 일을 할 수 있다.</strong> 채널 차이를 두려면 그것은 방치가 아니라 <strong>명시적 결정</strong>이어야 하고, 사유가 문서에 남아야 한다.</td></tr><tr><td><strong>적용 범위</strong> <em>(2026-08-06 확정)</em></td><td>로그인·마이페이지 68화면 중 <strong>C 회원정보관리 30화면만.</strong> A 법정고지·정책 17건은 손대지 않고, B 인증진입 21건은 H.Point 전환 후 기준이라 이번 개편에서 제외 (§4 결정 1)</td></tr><tr><td><strong>근거 문제</strong></td><td>241 <strong>I-3</strong> 채널 동등성 결손 9건(모바일 비밀번호 변경 불가·PC 차량번호 등록 불가) · <strong>I-2</strong> 통일 방침과 개별 결정의 어긋남 · <strong>I-11</strong> H.Point 전환이 PC 전용 · 122 A3 · 여정맵 <strong>O-12·O-13</strong> · 발주처 니즈 <strong>B-7</strong>(마이페이지 일원화)·<strong>B-5</strong>(VIP 구조 통일)</td></tr><tr><td><strong>설계 함의</strong></td><td>① <strong>C 30화면의 기능 집합을 채널 동일</strong>로 정의 ② <strong>H.Point 전환 경로를 모바일에도</strong> — 전환 시점(23.1.1)에 모바일 이용자가 배제되지 않도록 ③ 채널 차이를 남기려면 <strong>결정 근거를 화면명세에 기록</strong>(I-2 재발 방지) ④ VIP프로그램은 <strong>양 채널 2Tab 동일 구조</strong> — PC 작업 등급을 <code>스킨변경 → 개선</code>으로 상향 (§4 결정 2 확정)</td></tr><tr><td><strong>trade-off</strong></td><td><strong>우선</strong>: 예측 가능성 · 학습 비용 절감&lt;br&gt;<strong>덜 중시</strong>: 채널별 최적화 · 모바일 경량화</td></tr></tbody></table></div><h3>K4. <strong>막혔을 때 갈 곳을 먼저 만든다</strong></h3><div class='tw'><table><thead><tr><th>필드</th><th>내용</th></tr></thead><tbody><tr><td><strong>정의</strong></td><td>정상 경로보다 <strong>예외 경로를 먼저 설계</strong>한다. 실패·중단·복구의 화면이 공통 자산으로 존재해야, 1,003화면 전체가 같은 방식으로 실패를 처리한다.</td></tr><tr><td><strong>근거 문제</strong></td><td>241 <strong>I-8</strong> 오류·404 화면 명세 <strong>0건</strong>(양 채널) · <strong>I-9</strong> 카드신청 64화면 중 취소·이전 경로 0건 · 수강 정원 초과가 사후 처리 · <strong>I-10</strong> 도움말 산재(PC 4 / MWEB 3) · 122 H9·H3·H5·H10 · 212 G3(수강 취소·환불 표시)</td></tr><tr><td><strong>설계 함의</strong></td><td>① <strong>예외 화면군을 공통 컴포넌트로 선설계</strong> — 404·권한없음·세션만료·결제실패·정원초과·자격미달 ② 거래 흐름(수강신청 S1~S3 · 카드신청 S1~S3)에 <strong>취소·이전 경로를 명시적 스텝</strong>으로 ③ 사후 처리(<code>수강 인원 초과F</code>)를 <strong>사전 경고</strong>로 전환 ④ 산재한 도움말을 <strong>하나의 진입점</strong>으로</td></tr><tr><td><strong>trade-off</strong></td><td><strong>우선</strong>: 완주율 · 신뢰&lt;br&gt;<strong>덜 중시</strong>: 초기 가시적 산출물(예외 화면은 데모에서 안 보인다) · 정상 경로 설계 속도</td></tr></tbody></table></div><hr><h2>3. 키워드 ↔ 문제 매핑 · 고아 이슈 점검</h2><h3>심각도 상 (9건) — 전건 판정</h3><div class='tw'><table><thead><tr><th>이슈</th><th>커버</th><th>판정</th></tr></thead><tbody><tr><td>I-1 채널 진입 모델 불일치</td><td><strong>K1</strong></td><td>✅</td></tr><tr><td>I-2 통일 방침 ↔ 개별 결정 어긋남</td><td><strong>K3</strong></td><td>✅ 부분 — 설계 함의 ③으로 재발 방지. 단 <strong>기존 상충 2건은 재협의 필요</strong>(§4)</td></tr><tr><td>I-3 채널 동등성 결손 9건</td><td><strong>K3</strong></td><td>✅</td></tr><tr><td>I-5 2대 영역 52.8% 템플릿화</td><td><strong>K2</strong></td><td>✅</td></tr><tr><td>I-8 예외·오류 화면 0건</td><td><strong>K4</strong></td><td>✅</td></tr><tr><td>I-9 거래 취소·복구 경로 없음</td><td><strong>K4</strong></td><td>✅</td></tr><tr><td>I-11 H.Point PC 전용 + 동의 공백</td><td><strong>K3</strong></td><td>✅ 부분 — 전환 경로는 K3가 다루나 <strong>212 G2(개인정보 동의 재획득)는 정책 결정</strong>이라 컨셉 밖</td></tr><tr><td><strong>I-12 회원 메뉴 제외 경계 68화면</strong></td><td><strong>✕</strong></td><td><strong>커버 불가 — 범위 결정 사항.</strong> 컨셉이 아니라 고객 합의로 정해진다. K3는 &quot;포함될 경우&quot;를 전제로 서 있다</td></tr><tr><td><strong>I-14 사용자 근거 0건</strong></td><td><strong>✕</strong></td><td><strong>커버 불가 — 근거 결손.</strong> 4개 키워드 전부가 이 위에 서 있다. §5</td></tr></tbody></table></div><h3>심각도 중 (5건) — 이관 지정</h3><div class='tw'><table><thead><tr><th>이슈</th><th>커버</th><th>이관</th></tr></thead><tbody><tr><td>I-4 브랜드 표기 채널 불일치</td><td>고아</td><td><strong>332 컨텐츠가이드</strong> — 명칭 사전 단일화. K2(템플릿)와 층위가 다름</td></tr><tr><td>I-6 검색결과 문맥 무반영</td><td>K1 부분</td><td>322 정보구조설계</td></tr><tr><td>I-7 재방문 지원 장치 0건</td><td>고아</td><td><strong>321 기능상세정의</strong> — 최근본·즐겨찾기는 기능 추가 판단</td></tr><tr><td>I-10 도움말 산재</td><td>K4 부분</td><td>322 정보구조설계</td></tr><tr><td>I-13 요건 변동 4건</td><td><strong>K2</strong></td><td>✅ (템플릿이 흡수) · 911 변경관리</td></tr></tbody></table></div><blockquote><strong>고아를 0으로 만들려고 키워드를 늘리지 않았다</strong>(표준 규칙). I-4·I-7은 컨셉이 아니라 하류 작업의 판단이다.</blockquote><hr><h2>4. 결정 기록 · 잔여 미결</h2><h3>✅ 결정 1 — 회원 메뉴 개편 경계 (2026-08-06 확정)</h3><p>로그인·마이페이지 <strong>68화면을 기능 성격으로 재분류</strong>하고, <strong>C만 개편 대상</strong>으로 확정했다.</p><div class='tw'><table><thead><tr><th>분류</th><th>화면 수</th><th>내용</th><th>처리</th></tr></thead><tbody><tr><td><strong>A 법정고지·정책</strong></td><td><strong>17</strong></td><td>이용약관 · 개인정보처리방침(+제3자·취급위탁·열람정정삭제) · 영상정보처리기기 운영방침 · 이메일무단수집거부 · 공인인증서/키보드 보안 안내</td><td><strong>손대지 않음</strong> — 회원 체계 전환과 무관</td></tr><tr><td><strong>B 인증진입</strong></td><td><strong>21</strong></td><td>로그인 · 아이디 찾기 · 비밀번호 찾기 · 이메일 인증 · OTP · H.Point 통합회원 로그인 · 회원가입 안내</td><td><strong>제외</strong> — 23.1.1 H.Point 전환 시 통째로 바뀜</td></tr><tr><td><strong>C 회원정보관리</strong></td><td><strong>30</strong></td><td>마이페이지 · 회원정보변경 · 비밀번호 변경 · 이메일 변경 · 회원탈퇴 · 로그인 기록보기 · 차량번호등록 · 개인정보 관리 · H.Point 전환 · 본인확인</td><td>✅ <strong>개편 대상 — K3 적용 범위</strong></td></tr></tbody></table></div><blockquote>📎 <strong>대상 화면 목록</strong>: <code>_결정근거_회원영역_화면분류.md</code> — 68화면 전건의 화면ID·화면명·경로·분류. <strong>목록 없는 결정은 검증할 수 없다.</strong><br><br>⚠️ <strong>수치 정정</strong>: 결정 시점의 개략 분류로는 &quot;23건&quot;이었으나, <strong>기능 성격으로 재분류하니 30건</strong>이다(비밀번호 변경·본인확인 등이 인증 그룹에서 회원정보 그룹으로 이동). <strong>결정 취지는 그대로</strong>이고 대상 화면 수만 정정됐다. → 132 규모·411 공수에 반영 필요.</blockquote><h3>✅ 결정 2 — 채널 통일 상충 (2026-08-06 확정)</h3><div class='tw'><table><thead><tr><th>건</th><th>결정</th><th>후속 조치</th></tr></thead><tbody><tr><td><strong>VIP프로그램</strong></td><td><strong>PC도 2Tab으로 통일</strong></td><td>PC 작업 등급 <code>스킨변경 → 개선</code> 상향. <strong>공수 증가</strong> → 132·411 반영. 1차 워크숍의 &quot;구조 통일 필요&quot;를 실제로 이행</td></tr><tr><td><strong>마이페이지 &#x27;로그인 기록 보기&#x27;</strong></td><td><strong>PC 전용 유지 + 사유 기록</strong></td><td>화면명세(341)에 PC 전용 사유를 명시. K3의 &quot;다르게 두려면 사유를 적는다&quot; 규율 적용 — 방치가 아니라 결정</td></tr></tbody></table></div><h3>결정에 따른 채널 결손 9건 재판정</h3><div class='tw'><table><thead><tr><th>#</th><th>결손</th><th>분류</th><th>판정</th></tr></thead><tbody><tr><td>1</td><td><strong>비밀번호 변경</strong> (모바일 없음)</td><td>C</td><td>✅ <strong>해소</strong> — 모바일에 추가</td></tr><tr><td>2</td><td><strong>H.Point 통합회원 전환</strong> (모바일 없음)</td><td>C</td><td>✅ <strong>해소</strong> — 모바일에 추가</td></tr><tr><td>3</td><td><strong>차량번호 등록·관리</strong> (PC 없음)</td><td>C</td><td>✅ <strong>해소</strong> — PC에 추가</td></tr><tr><td>4</td><td>로그인 기록 보기 (모바일 없음)</td><td>C</td><td>⚖️ <strong>의도적 차이로 확정</strong> — 사유 기록 (결정 2)</td></tr><tr><td>5</td><td>OTP 인증번호 로그인 (모바일 없음)</td><td>B</td><td>⏸ <strong>미해소</strong> — H.Point 전환 후 기준</td></tr><tr><td>6</td><td>H.Point 통합회원 로그인 (PC 없음)</td><td>B</td><td>⏸ <strong>미해소</strong> — 동일 사유</td></tr><tr><td>7</td><td>공인인증서·키보드 보안 안내 (모바일 없음)</td><td>A</td><td>⏸ <strong>미해소</strong> — 법정 고지, 손대지 않음</td></tr><tr><td>8</td><td>사이트맵 (모바일 없음)</td><td>회원 밖</td><td>→ <strong>K1·322 IA</strong>로 이관</td></tr><tr><td>9</td><td>웹접근성 안내 (모바일 없음)</td><td>회원 밖</td><td>→ <strong>354 접근성가이드</strong>로 이관</td></tr></tbody></table></div><p><strong>K3가 실제로 다루는 것은 9건 중 4건</strong>(해소 3 + 의도적 차이 확정 1)이다. 3건은 전환·법정 사유로 이번 범위 밖이고, 2건은 회원 영역이 아니라 다른 작업으로 넘긴다. <strong>K3는 성립하되 축소된 형태</strong>다.</p><h3>잔여 미결</h3><div class='tw'><table><thead><tr><th>#</th><th>미결</th><th>왜 컨셉이 답할 수 없나</th><th>확인 주체</th></tr></thead><tbody><tr><td>1</td><td>H.Point 전환 시 <strong>개인정보 동의 재획득</strong>(212 G2)</td><td>법적 판단·정책 결정</td><td>고객사 법무</td></tr><tr><td>2</td><td>예외 화면군의 <strong>분량 산정</strong></td><td>K4가 요구하는 신규 화면 수가 미상 → 132 규모 재산정 영향</td><td>PM</td></tr><tr><td>3</td><td><strong>B 인증진입 21화면의 전환 후 처리</strong></td><td>H.Point 전환 이후 별건 프로젝트가 될 것인지</td><td>PM ↔ 고객사</td></tr></tbody></table></div><hr><h2>5. 감성 톤 정합 — <strong>미확인</strong></h2><div class='tw'><table><thead><tr><th>항목</th><th>상태</th></tr></thead><tbody><tr><td>232 감성/이미지조사 무드보드</td><td><strong>부재</strong> (개입대기)</td></tr><tr><td>감성 키워드</td><td><strong>부재</strong></td></tr><tr><td>정합 확인</td><td><strong>불가</strong></td></tr></tbody></table></div><p>242 표준은 &quot;232 무드보드·감성키워드와 UX 방향이 어긋나지 않는지 확인&quot;을 요구하나, <strong>232가 수행되지 않아 대조 대상이 없다.</strong> 위 4개 키워드는 <strong>경험 구조의 방향</strong>이지 감성 톤이 아니며, 351 스타일가이드 단계에서 감성 방향이 정해질 때 <strong>재점검이 필요</strong>하다.</p><hr><h2>5-B. ⚠️ 분석 공백 — 메인 화면의 콘텐츠 구성</h2><p><strong>메인을 화면 수(본화면 6 · 공수 1.0%)로만 다뤘고, 화면 안의 콘텐츠 구성은 보지 못했다.</strong></p><p>122가 <strong>원자료 등급 C</strong>(캡처 0장)였기 때문이다. 화면명세서에는 화면 목록만 있고 <strong>무엇이 어떤 순서로 배치돼 있는지가 없다.</strong> 메인은 진입 지점이라 콘텐츠 구성이 곧 전략인데, 그 층을 통째로 보지 못했다.</p><div class='tw'><table><thead><tr><th>못 본 것 (캡처가 있었다면 판정 가능)</th></tr></thead><tbody><tr><td>메인 콘텐츠의 맥락·순서 — 나열인가 조망인가</td></tr><tr><td><strong>로그인 전/후 콘텐츠 차이</strong> — 개인화 여부</td></tr><tr><td>게이트성 화면이 Depth로 느껴지는지</td></tr><tr><td>프로모션 이미지의 의미 전달</td></tr></tbody></table></div><p>→ <strong>331 와이어프레임·334 시안 단계에서 메인이 별도 검토 대상</strong>임을 명시한다. 4개 키워드 중 메인의 콘텐츠 전략을 직접 지시하는 것은 없다.</p><h2>6. ⚠️ 전 키워드 공통 한계 — 사용자 근거 0건</h2><p>241 §5가 넘긴 경고를 그대로 상속한다.</p><div class='tw'><table><thead><tr><th>결손</th><th>분류</th><th>이 컨셉에 미치는 영향</th></tr></thead><tbody><tr><td>231 UT·심층인터뷰</td><td>B 인간 활동 필수</td><td>K1이 실제로 사용자의 진입 방식과 맞는지 미검증</td></tr><tr><td>232 감성/이미지조사</td><td>개입대기</td><td>§5 정합 확인 불가</td></tr><tr><td>233 필드리서치</td><td>B 인간 활동 필수</td><td>지점 방문 전 온라인 이용 맥락 미확인</td></tr><tr><td>123 VOC</td><td>C 원자료 부재</td><td>K4가 실제 불만 지점과 맞는지 미검증</td></tr><tr><td>214 이용로그</td><td>미확보</td><td>K1·K2의 우선순위(어느 영역이 실제로 많이 쓰이는가) 미검증</td></tr></tbody></table></div><p><strong>4개 키워드는 전부 구조·정책·발주처 근거에서 나왔다.</strong> 특히 <strong>K1은 &quot;사용자가 지점 기준으로 생각한다&quot;는 가정 위에 서 있는데, 그 가정을 뒷받침하는 사용자 데이터가 없다.</strong> 근거는 ① MWEB이 이미 지점 기점 구조를 갖고 있다는 사실 ② 채널 성격이 오프라인 방문 유도라는 계약 정의 ③ 리오프닝 국면(121 S6) — 셋 다 사용자 관찰이 아니다.</p><p>→ <strong>231이 확보되면 K1을 최우선 재검토 대상으로 한다.</strong></p><hr><h2>7. 다음 단계</h2><p><strong>243 UX전략보고서</strong>로 서술·근거화해 최고의사결정자 승인 요청 → 승인 후 300 Define(312 유저플로우 · 321 기능정의 · 322 IA)의 판단 기준으로 사용.</p>", "bytes": 17292, "deliv": ""}, {"name": "_개입요청_UX컨셉방향_후보안.md", "path": "sim-project/200_Discover/240_분석종합및UX전략수립/_개입요청_UX컨셉방향_후보안.md", "html": "<h1>[개입요청] UX 컨셉 방향 후보안 — 242·243 · <strong>241 기반 재작성</strong></h1><blockquote>재작성: 2026-08-06 · 실행계획서 §4-6(크리에이티브 개입 프로토콜)<br><strong>이 문서는 산출물이 아니라 의사결정 요청서다.</strong> 방향이 확정되면 그 위에서 242 UX컨셉키워드 · 243 UX전략보고서를 작성한다.</blockquote><hr><h2>0. 어떤 방향을 골라도 반드시 답해야 하는 5가지 (241 §5)</h2><p>241 분석시사점이 242에 넘긴 필수 항목이다. <strong>세 후보안은 이 5개에 각기 다르게 답한다.</strong></p><div class='tw'><table><thead><tr><th>#</th><th>질문</th><th>근거 테마</th></tr></thead><tbody><tr><td><strong>Q1</strong></td><td><strong>채널 통일의 수준</strong> — 어디까지 같게, 어디를 다르게</td><td>T-A (I-1·I-2·I-3)</td></tr><tr><td><strong>Q2</strong></td><td><strong>반복 구조의 처리</strong> — 2대 영역 52.8%를 템플릿으로 볼 것인가</td><td>T-B (I-5)</td></tr><tr><td><strong>Q3</strong></td><td><strong>실패 경로의 지위</strong> — 예외를 공통 자산으로 볼 것인가</td><td>T-C (I-8·I-9)</td></tr><tr><td><strong>Q4</strong></td><td><strong>회원 전환기의 설계 태도</strong> — 전환 전/후 어느 쪽 기준인가</td><td>T-D (I-11·I-12)</td></tr><tr><td><strong>Q5</strong></td><td><strong>변동 흡수 구조</strong> — 증설·운영 변경을 구조가 흡수하는가</td><td>T-B·T-E (I-13)</td></tr></tbody></table></div><h2>0-B. 정정된 사실 (초판 대비)</h2><div class='tw'><table><thead><tr><th></th><th>초판</th><th><strong>정본</strong></th></tr></thead><tbody><tr><td>최대 영역</td><td>카드/멤버십 <strong>39% 단일 편중</strong></td><td><strong>카드 29.8% + 지점안내 23.0% = 2대 영역 52.8%</strong></td></tr><tr><td>지점안내</td><td>&quot;MWEB 147화면 1위&quot;</td><td><strong>본화면 132 · 고유 192</strong></td></tr><tr><td>규모 기준선</td><td>1,344화면</td><td>명세 행 1,344 / 고유 1,003 / <strong>본화면 574</strong></td></tr><tr><td>채널 결손</td><td>미확인</td><td><strong>동등성 결손 9건 확정</strong> (모바일 비밀번호 변경 불가 등)</td></tr><tr><td>예외 처리</td><td>미확인</td><td><strong>오류·404 화면 명세 0건</strong></td></tr></tbody></table></div><h2>0-C. ⚠️ 세 안의 공통 리스크 — 사용자 근거 0건</h2><p>241 §5가 경고한 대로, <strong>아래 후보안은 전부 구조·정책·발주처 근거에서 나왔다.</strong> 231 UT·232 감성·233 필드·123 VOC·214 로그가 전부 결손이라 <strong>사용자가 무엇을 원하는지에 대한 근거가 하나도 없다.</strong></p><p>어느 안을 고르시든 이 한계는 그대로 상속되며, 242 컨셉키워드에 명시됩니다.</p><hr><h2>후보 A — &quot;어느 점포인가&quot; · <strong>지점을 통일 축으로</strong></h2><blockquote><strong>한 줄</strong>: 온라인은 목적지가 아니라 <strong>오프라인 방문의 관문</strong>이다. 두 채널을 &quot;어느 점포인가&quot;라는 하나의 기준으로 정렬한다.</blockquote><h3>5가지에 대한 답</h3><div class='tw'><table><thead><tr><th></th><th>답</th></tr></thead><tbody><tr><td><strong>Q1 채널 통일</strong></td><td><strong>지점 선택을 양 채널의 공통 진입점으로</strong> 통일. MWEB의 지점선택(MSS)을 PC에도 도입해 진입 모델을 맞춘다</td></tr><tr><td><strong>Q2 반복 구조</strong></td><td>지점 하위(층별·행사·오시는길)를 <strong>지점 템플릿 1종</strong>으로. 본화면 132가 소수 템플릿으로 수렴 → <strong>증설 시 화면이 곱해지지 않음</strong></td></tr><tr><td><strong>Q3 실패 경로</strong></td><td>지점 문맥 위에서 공통 예외 처리(해당 지점에 없는 서비스·휴점 등)</td></tr><tr><td><strong>Q4 회원 전환</strong></td><td>회원을 <strong>부차 축으로</strong> 두어 전환기 리스크를 회피. 68화면 경계 미정의 영향을 최소화</td></tr><tr><td><strong>Q5 변동 흡수</strong></td><td><strong>가장 강함</strong> — 더현대 대구 등 지점 증설이 템플릿에 흡수됨 (워크숍 확인 예정 3건)</td></tr></tbody></table></div><h3>근거</h3><ul><li>지점안내 <strong>본화면 132 = 23.0%</strong>, 지점수×하위페이지 곱셈 구조 (122 · 241 T-B)</li><li>MWEB에 이미 지점선택(MSS)이 독립 화면으로 존재 — <strong>모바일은 이미 지점 기점</strong> (122)</li><li>워크숍: 더현대 대구 신규 · 지점 분류 변경(<code>현대백화점&gt;대구점</code>→<code>더현대&gt;대구점</code>) · <strong>분류 게이트 화면 불필요</strong> (I4)</li><li>121 S6: 리오프닝으로 오프라인 방문 수요 회복 국면</li></ul><h3>무엇을 포기하는가</h3><ul><li><strong>카드·멤버십 29.8%가 주변부로 밀린다.</strong> 최대 볼륨 영역이 통일 축에서 벗어남</li><li>지점과 무관한 이용(투자정보·ESG·브랜드 탐색)이 어색해짐</li><li>H.Point 전환기 이슈(I-11)를 정면으로 다루지 않음 — <strong>미룰 뿐 해소되지 않음</strong></li></ul><hr><h2>후보 B — &quot;내 혜택&quot; · <strong>회원·혜택을 통일 축으로</strong></h2><blockquote><strong>한 줄</strong>: 채널이 갈라진 근본 원인은 <strong>계정 경험이 갈라져 있기 때문</strong>이다. H.Point 전환을 계기로 회원 경험을 통일 축으로 세운다.</blockquote><h3>5가지에 대한 답</h3><div class='tw'><table><thead><tr><th></th><th>답</th></tr></thead><tbody><tr><td><strong>Q1 채널 통일</strong></td><td><strong>계정으로 할 수 있는 일을 완전 동일화.</strong> 결손 9건 전부 해소가 통일의 정의</td></tr><tr><td><strong>Q2 반복 구조</strong></td><td>카드·멤버십 <strong>본화면 171 = 29.8%</strong>(요건 14건)의 반복 구조를 <strong>혜택 데이터 템플릿</strong>으로. 등급·혜택 변경이 화면 수정 없이 반영</td></tr><tr><td><strong>Q3 실패 경로</strong></td><td>인증·결제·자격 실패를 <strong>공통 예외 자산</strong>으로 우선 구축 (거래 흐름이 축이므로 필수)</td></tr><tr><td><strong>Q4 회원 전환</strong></td><td><strong>정면 대응.</strong> H.Point 전환(23.1.1) 후를 기준으로 설계. 212 G2(동의 재획득)를 설계 전제로</td></tr><tr><td><strong>Q5 변동 흡수</strong></td><td>등급·혜택 개편을 어드민 데이터로 흡수 (212: 등급 6종·혜택 12종·마일리지 예외 20여)</td></tr></tbody></table></div><h3>근거</h3><ul><li>카드/멤버십 <strong>본화면 171 = 29.8%</strong>, 최대 단일 영역 (122 · 241 T-B)</li><li><strong>채널 동등성 결손 9건</strong>이 전부 계정 영역에 몰려 있음 — 비밀번호 변경·로그인 기록·차량번호·H.Point 전환 (122 A3 · 241 T-A)</li><li><strong>H.Point 전환이 PC 전용</strong> + 212 G2 동의 재획득 공백 (241 T-D · I-11)</li><li>워크숍: &quot;마이페이지 <strong>일원화 필요</strong>&quot; · &quot;VIP프로그램 <strong>구조 통일 필요</strong>&quot; (I4 · B-5·B-7)</li></ul><h3>무엇을 포기하는가</h3><ul><li><strong>가장 큰 미확정 덩어리 위에 선다</strong> — 회원 메뉴 제외 경계 68화면이 미정이고(I-12), 124 #14는 &quot;회원 관련 메뉴 제외&quot;라고 회신돼 있다. <strong>범위 재협의가 선행되지 않으면 성립 불가</strong></li><li>전환 일정(23.1.1)이 오픈(23.1Q)과 겹쳐 <strong>일정 리스크가 컨셉에 직결</strong></li><li>비회원 이용자(지점 정보·전시 탐색)의 경험이 부차화</li></ul><hr><h2>후보 C — &quot;보러 오게 만든다&quot; · <strong>콘텐츠를 통일 축으로</strong></h2><blockquote><strong>한 줄</strong>: 이 채널은 커머스가 아니라 <strong>브랜딩·아카이빙 채널</strong>이다. 콘텐츠 경험을 축으로 두 채널을 정렬한다.</blockquote><h3>5가지에 대한 답</h3><div class='tw'><table><thead><tr><th></th><th>답</th></tr></thead><tbody><tr><td><strong>Q1 채널 통일</strong></td><td><strong>콘텐츠 표현 규칙을 통일.</strong> 브랜드 표기 불일치(I-4 <code>위마켓</code>/<code>위마캣</code>)를 명칭 사전 단일화로 해소. 구조보다 <strong>표현층 통일</strong></td></tr><tr><td><strong>Q2 반복 구조</strong></td><td>문화·전시·브랜드 콘텐츠를 <strong>콘텐츠 타입 템플릿</strong>으로. 단 2대 영역(52.8%)은 직접 다루지 않음</td></tr><tr><td><strong>Q3 실패 경로</strong></td><td>우선순위 낮음 — 탐색형 이용이 축이라 거래 실패의 비중이 작다고 봄</td></tr><tr><td><strong>Q4 회원 전환</strong></td><td>회피 — 콘텐츠 열람은 비회원 중심</td></tr><tr><td><strong>Q5 변동 흡수</strong></td><td>콘텐츠 증설(브랜드 입점·ESG 1p·전시 개선)을 CMS 구조로 흡수. <strong>단 CMS 개선이 범위 밖</strong>(124 #23)</td></tr></tbody></table></div><h3>근거</h3><ul><li>채널 성격 = <strong>브랜딩·콘텐츠 아카이빙 + 그룹사 허브</strong> (I1 제안서 · 126)</li><li>121 S6: 업계 공통으로 <strong>경험형 콘텐츠 리뉴얼 경쟁</strong> 진행 중</li><li>워크숍: <strong>Sounds Forest·ALT.1 내재화</strong> 필요(현재 마이크로사이트) · 전시/공연 페이지 개선 예정 · 브랜드 추가 입점 (I4 · B-4)</li><li>발주처 니즈 B-1: 메인 상단에 채널(SNS) 부각 — <strong>단 사용자 근거 없음</strong></li></ul><h3>무엇을 포기하는가</h3><ul><li><strong>Q2·Q3·Q4를 사실상 다루지 않는다.</strong> 241이 심각도 &#x27;상&#x27;으로 판정한 T-B·T-C·T-D 중 어느 것도 정면으로 해소하지 않음</li><li><strong>CMS 개선이 계약 범위 밖</strong>(124 #23)이라 콘텐츠 축의 실행 수단이 제한됨</li><li>발주처 니즈 B-1에 기대는 부분이 있는데, <strong>B-1은 사용자 근거가 없는 항목</strong>이다 (241 §4)</li></ul><hr><h2>비교표</h2><div class='tw'><table><thead><tr><th></th><th><strong>A 지점 축</strong></th><th><strong>B 회원·혜택 축</strong></th><th><strong>C 콘텐츠 축</strong></th></tr></thead><tbody><tr><td>Q1 채널 통일</td><td>진입점 통일</td><td><strong>기능 완전 동일화</strong></td><td>표현층 통일</td></tr><tr><td>Q2 반복 구조 (52.8%)</td><td>지점 132 해소</td><td>카드 171 해소</td><td>다루지 않음</td></tr><tr><td>Q3 실패 경로</td><td>부분</td><td><strong>우선 구축</strong></td><td>낮음</td></tr><tr><td>Q4 회원 전환</td><td>회피</td><td><strong>정면 대응</strong></td><td>회피</td></tr><tr><td>Q5 변동 흡수</td><td><strong>가장 강함</strong></td><td>데이터 흡수</td><td>CMS 제약</td></tr><tr><td>심각도 &#x27;상&#x27; 5건 커버</td><td>3 / 5</td><td><strong>5 / 5</strong></td><td>1 / 5</td></tr><tr><td><strong>실행 리스크</strong></td><td>낮음</td><td><strong>높음</strong> (68화면 경계 미정 · 일정 겹침)</td><td>중 (CMS 범위 밖)</td></tr></tbody></table></div><p><strong>A와 B는 상호 배타가 아니다</strong> — 2대 영역이 52.8%로 비등하므로 <strong>주+부 조합</strong>이 가능하다. 예: <strong>A를 주축(진입·구조), B를 부축(계정 동등성 해소)</strong>. 이 경우 Q1~Q5를 5/5 커버하면서 B 단독의 실행 리스크는 낮춘다.</p><hr><h2>선택지</h2><div class='tw'><table><thead><tr><th></th><th>선택</th><th>결과</th></tr></thead><tbody><tr><td><strong>1</strong></td><td><strong>A</strong> 단독</td><td>안전. 단 T-D(회원 전환)를 미룸</td></tr><tr><td><strong>2</strong></td><td><strong>B</strong> 단독</td><td>문제 커버 최대. 단 <strong>범위 재협의 선행 필수</strong></td></tr><tr><td><strong>3</strong></td><td><strong>C</strong> 단독</td><td>심각도 상 5건 중 1건만 커버 — <strong>권장하지 않음</strong></td></tr><tr><td><strong>4</strong> ⭐</td><td><strong>A 주 + B 부</strong></td><td>Q1~Q5 전부 커버 + 실행 리스크 분산</td></tr><tr><td><strong>5</strong></td><td>제4안 제시</td><td>위 5가지 질문에 다르게 답하는 방향</td></tr></tbody></table></div><p><strong>선택하시면</strong> 그 방향으로 242 UX컨셉키워드(문제→방향 추적 포함) → 243 UX전략보고서를 작성하고, <strong>그 시점에 <code>방향성분석 V0.4</code> 봉인을 해제해 126·242·243을 일괄 대조</strong>합니다.</p>", "bytes": 9840, "deliv": ""}, {"name": "_결정근거_회원영역_화면분류.md", "path": "sim-project/200_Discover/240_분석종합및UX전략수립/_결정근거_회원영역_화면분류.md", "html": "<h1>결정 근거 — 회원 영역 68화면 분류 (D-2)</h1><blockquote><strong>왜 이 문서가 필요한가</strong>: 240 결정 D-2가 &quot;C 회원정보관리 30화면만 개편 대상&quot;으로 확정했으나, <strong>어느 30화면인지가 어느 산출물에도 없었다.</strong> 대상 목록 없는 결정은 검증할 수 없고 하류가 실행할 수 없다.</blockquote><h2>배경</h2><p>124 #14 고객 회신: <em>&quot;현대백화점 회원 관련 메뉴 제외 (23.1.1 H.Point 통합회원 전환 예정) — <strong>단 로그인 진입 동선은 별도 확인</strong>&quot;</em></p><p>&quot;회원 관련 메뉴&quot;가 화면 단위로 정의되지 않아 로그인·마이페이지 <strong>68화면</strong>이 경계 미정으로 남았다(126 C-1). 2026-08-06 결정으로 <strong>기능 성격 3분류</strong> 후 C만 개편 대상으로 확정했다.</p><h2>분류 기준</h2><div class='tw'><table><thead><tr><th>분류</th><th>기준</th><th>처리</th></tr></thead><tbody><tr><td><strong>A 법정고지·정책</strong></td><td>회원 체계가 바뀌어도 남는 법정 고지·방침 페이지</td><td>손대지 않음</td></tr><tr><td><strong>B 인증진입</strong></td><td>로그인·아이디/비밀번호 찾기 등 <strong>인증 흐름</strong> — H.Point 전환 시 통째로 대체</td><td>이번 개편 제외</td></tr><tr><td><strong>C 회원정보관리</strong></td><td>로그인 <strong>이후</strong> 마이페이지에서 자기 정보를 보고 바꾸는 기능</td><td>✅ <strong>개편 대상 = K3 적용 범위</strong></td
