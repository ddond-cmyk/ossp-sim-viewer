</style>

>수급 실적 실측</strong>(50건/116파일)</li></ul><div class='tw'><table><thead><tr><th>군</th><th>항목</th><th>수급 ✅</th><th>부분 ◐</th><th>미수급 ❌</th></tr></thead><tbody><tr><td>R1 기획</td><td>14</td><td>12</td><td>1</td><td>1</td></tr><tr><td>R2 디자인</td><td>6</td><td>5</td><td>0</td><td>1</td></tr><tr><td>R3 개발·시스템</td><td>5</td><td>2</td><td>2</td><td>1</td></tr><tr><td>R4 퍼블리싱·운영</td><td>5</td><td>2</td><td>0</td><td>3</td></tr><tr><td>R5 행정·산출물</td><td>4</td><td>1</td><td>1</td><td>2</td></tr><tr><td><strong>계</strong></td><td><strong>34</strong></td><td><strong>22</strong></td><td><strong>4</strong></td><td><strong>8</strong></td></tr></tbody></table></div><h2>도출된 인사이트</h2><p><strong>미수급 8건 중 5건이 비기능·행정 요건이다.</strong> 기획 자료는 거의 다 들어왔는데 성능·보안·외국어 영향·검수 절차·승인 권한이 통째로 비었다. <strong>&quot;무엇을 만드는가&quot;는 물었고 &quot;얼마나 잘 해야 하는가·무엇으로 합격을 판정하는가&quot;는 묻지 않았다.</strong> 그리고 이건 요청했는데 안 온 게 아니라 <strong>요청 목록에 없었을 가능성이 높다</strong> — 112가 별도 산출물로 존재하지 않아 요청의 완전성을 점검할 문서 자체가 없었다.</p><p><strong>「수급 완료」는 1회 이벤트가 아니다.</strong> VIP 프로그램은 <strong>4번</strong>(1128·1201·230113·230324), GA 태깅은 <strong>3번</strong> 나눠 들어왔고 VIP 마지막 수급이 오픈 25일 전이다. 체크박스 하나로 관리하면 이 실태를 못 잡는다 — 항목별 <strong>버전·최종 수급일</strong>이 필요하다.</p><p><strong>최장 수급 공백 24일이 요건 클로징 직후다.</strong> 10/14 이후 3주 넘게 끊겼다가 11/07 <code>추후변경페이지</code>로 재개됐다. <strong>클로징이 실제로 닫히지 않았다는 신호</strong>이고, 215 §5의 &quot;보류 14건&quot; 리스크와 정합한다. 잔여업무리스트가 12일간 4판(221215~221227) 갱신된 것도 같은 이야기다.</p><p><strong>수급의 54%가 2023년에 들어왔다.</strong> 설계·디자인이 진행 중인 시점이다 — 911 변경관리 상시 가동의 실측 근거.</p><p><strong>건수와 부피가 비례하지 않는다.</strong> <code>0916_개발산출물템플릿</code> 1건이 34파일 = 전체의 29%다. 수급 관리는 건수가 아니라 항목 단위여야 한다.</p><h2>⚠️ 발견 — 매달린 의존 (dangling dependency)</h2><p><code>112</code>를 <code>ossp_tasks</code>로 갖는 스킬이 <strong>0건</strong>인데, <strong>5개 스킬의 <code>depends_on</code>이 &quot;자료수집요청서/수집자료(112)&quot;를 명시</strong>한다: <code>as-is-analysis</code> · <code>environment-scan</code> · <code>process-tailoring</code> · <code>execution-plan</code> · <code>research-plan</code>.</p><p><s .</p><hr><h2>6-A. 제외 판정 재검토 — 「인간 활동 필수」 관점 (2026-08-07)</h2><p>131·232·335·344 네 건이 <strong>PDP는 제외인데 로스터·§4-B는 수행 대상</strong>으로 적혀 있던 것을 계기로, <strong>제외 15건을 전수 재검토</strong>했다.</p><h3>6-A-1. 사실 확인 — PDP에 「인간 활동 필수」를 사유로 제외한 항목은 <strong>하나도 없다</strong></h3><p>제외 사유를 층위로 분류하면 5종이고, 그중 인간 활동은 없다.</p><div class='tw'><table><thead><tr><th>사유 층위</th><th>작업</th><th>성격</th></tr></thead><tbody><tr><td><strong>E1 행정·조직</strong></td><td>111 TFT구성 · 113 프로젝트승인 · 115 내부킥오프 · 134 계약체결</td><td>산출물이 문서가 아님</td></tr><tr><td><strong>E2 원자료 부재</strong></td><td>123 VOC(앱리뷰·CS 미확보)</td><td>확보되면 수행 가능</td></tr><tr><td><strong>E3 미계약·범위 밖</strong></td><td>131 · 231 · 232 · 355 · 431·432·433 · 441·442 · 500 전체</td><td>계약이 다르면 포함</td></tr><tr><td><strong>E4 표준 제외 ○</strong></td><td>233 · 311</td><td>개편형이 아니면 포함</td></tr><tr><td><strong>E5 원본 미수행</strong></td><td>125 · 335 · 344 · 424</td><td>흔적이 없어 대조 불가</td></tr></tbody></table></div><p>§4-B가 <strong>125·231·233을 「B 인간 활동 필수」로 부른 것은 §4-B의 재해석</strong>이고, PDP의 1차 사유(E5·E3·E4)와 다르다.</p><h3>6-A-2. 사유가 다르면 리포트의 결론이 뒤집힌다</h3><div class='tw'><table><thead><tr><th>작업</th><th>PDP 사유</th><th>§4-B 사유</th><th>&quot;인풋을 주면 되나?&quot;</th></tr></thead><tbody><tr><td><strong>125</strong> 경영진인터뷰</td><td>E5 원본 미수행</td><td>B 인간 활동</td><td>PDP: 원본이 했으면 검토 가능 ↔ §4-B: <strong>영원히 불가</strong></td></tr><tr><td><strong>231</strong> UT·심층인터뷰</td><td>E3 리서치 미계약</td><td>B 인간 활동</td><td>PDP: 계약했으면 수행 ↔ §4-B: <strong>계약해도 AI는 못 함</strong></td></tr><tr><td><strong>233</strong> 사용자심층리서치</td><td>E4 개편형 표준 ○</td><td>B 인간 활동</td><td>PDP: 신규형이면 포함 ↔ §4-B: <strong>유형 무관 불가</strong></td></tr></tbody></table></div><p>둘 다 참일 수 있으나 <strong>61스킬 리포트의 함의가 정반대</strong>다.</p><ul><li>E3·E4·E5 → <strong>&quot;이 프로젝트가 안 샀다&quot;</strong> = 커버리지의 <strong>일시적 공백</strong></li><li>B 인간 활동 → <strong>&quot;AI가 대체할 수 없다&quot;</strong> = 커버리지의 <strong>구조적 상한</strong></li></ul><p><strong>판정: §4-B의 B 분류가 과잉이다.</strong> 세 건 모두 1차 사유는 계약·범위·원본이지 AI 능력의 한계가 아니다.</p><h3>6-A-3. ⚠️ 진짜 문제 — 「인간 활동 필수」로 통째로 제외하면 <strong>AI 가능 부분까지 버린다</strong></h3><p>312에서 발견한 <strong>「작업 내부 A/B 혼재」</strong>(워크숍=사람, 문서 저작=AI)를 제외 판정에 적용하면, 이 작업들은 전부 <strong>부분 스킬</strong>이다. <strong>스킬 본문이 스스로 그렇게 규정한다.</strong></p><div class='tw'><table><thead><tr><th>작업</th><th>사람 몫</th><th><strong>AI 몫 — 스킬 본문 명시</strong></th></tr></thead><tbody><tr><td><strong>125</strong> 경영진인터뷰</td><td>인터뷰 진행·발언</td><td>인터뷰 가이드·질의 설계 · 결과 정리</td></tr><tr><td><strong>231</strong> UT</td><td>관찰·진행</td><td>UT 계획서 · 태스크 시나리오 · 측정 지표 설계</td></tr><tr><td><strong>232</strong> 감성/이미지조사</td><td>응답자 조사 · 이미지 수집</td><td><strong>질의서 3종 설계 · 무드보드 큐레이션 · 결과 정리</strong></td></tr><tr><td><strong>233</strong> 사용자심층리서치</td><td>필드 관찰</td><td>리서치 설계 · 가이드</td></tr></tbody></table></div><p><strong>시뮬레이션에서는 제외가 맞다</strong> — §4-B 조건 ③에 따라, 원본이 그 계획 문서들도 만들지 않았기 때문이다(리서치 미계약).</p><p><strong>그러나 PDP는 전사 재사용 문서다.</strong> 다음 프로젝트에서 리서치가 계약에 포함되면 이 PDP를 상속받는데, <strong>조작이 「삭제」로 적혀 있으면 AI 가능 부분까지 함께 버려진다.</strong></p><p>→ <strong>조작 표기 정정</strong>: 부분 스킬 작업의 제외는 <code>삭제</code>가 아니라 <strong><code>축소(사람 몫 분리)</code></strong> 여야 한다. 무엇을 왜 뺐는지가 남아야 다음 프로젝트가 복원할 수 있다.</p><h3>6-A-4. 「포함」 컬럼이 두 질문을 섞고 있다</h3><p><strong>222가 증거다</strong>: PDP <code>수행(통합)</code> ↔ 시뮬레이션 미수행(2022 시점 화면 부재). 한 컬럼에 두 답이 안 들어간다.</p><div class='tw'><table><thead><tr><th>질문</th><th>답하는 곳</th></tr></thead><tbody><tr><td><strong>원 프로젝트·계약이 수행했는가</strong></td><td>PDP 「포함」 컬럼 ← <strong>이것이 PDP의 본래 의미</strong></td></tr><tr><td><strong>시뮬레이션이 수행하는가</strong></td><td>실행계획서 §4-B · 뷰어 ROSTER</td></tr></tbody></table></div><p>그래서 정합 점검을 <strong>비대칭</strong>으로 설계했다(<code>scripts/check_pdp.py</code>):</p><ul><li><code>PDP 제외 → 시뮬 수행</code> = <strong>⛔ 위반.</strong> 프로젝트가 안 한 작업을 시뮬이 하면 원본 대조가 불가능하다</li><li><code>PDP 포함 → 시뮬 제외</code> = <strong>ℹ 정상.</strong> 시점 제약·인간 활동·원자료 부재로 못 할 수 있다. 단 <strong>사유 기재 필수</strong></li></ul><h3>6-A-5. 결론 — <strong>제외 판정 자체는 뒤집을 것이 0건</strong></h3><p>15건 전수 재검토 결과 제외를 철회해야 할 작업은 없다. 다만 <strong>표기 3건을 정정</strong>한다.</p><div class='tw'><table><thead><tr><th>#</th><th>정정</th><th>대상</th></tr></thead><tbody><tr><td>1</td><td>제외 사유를 <strong>E1~E5 층위로 명시</strong></td><td>제외 15건 전체 — &quot;인풋을 주면 되나&quot;를 답할 수 있게</td></tr><tr><td>2</td><td>부분 스킬 작업의 조작을 <code>삭제</code> → <strong><code>축소(사람 몫 분리)</code></strong></td><td>125 · 231 · 232 · 233</td></tr><tr><td>3</td><td>「포함」 컬럼이 <strong>원 프로젝트·계약 기준</strong>임을 명시</td><td>표 머리말</td></tr></tbody></table></div><h3>6-A-6. 잔여 확인 사항 2건</h3><div class='tw'><table><thead><tr><th>#</th><th>항목</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td><strong>133 내부착수보고</strong></td><td>PDP <code>포함</code>(932 회의록으로 대체 산출)인데 시뮬 미수행. 91.회의록 16건 전수 확인 결과 <strong>내부 착수보고 회의록 없음</strong>(전부 고객 대면 회의) → 조건 ③ 적용 시 <code>제외 E1</code>이 맞다. <strong>다음 PDP 개정에서 정정 대상</strong></td></tr><tr><td>2</td><td><strong>211 이해관계자인터뷰</strong></td><td>PDP <code>포함</code>인데 로스터 <code>skip(124로 흡수)</code>. 실제로는 <code>vinylc_customer-requirements-interview</code>가 <code>ossp_tasks: [&quot;124&quot;,&quot;211&quot;]</code>로 <strong>둘 다 담당</strong>해 124 실행 시 함께 수행됐다 → <strong><code>흡수 수행</code>이지 미수행이 아니다.</strong> 로스터 라벨이 실태를 과소 표기</td></tr></tbody></table></div><hr>", "skill_info": [{"name": "vinylc_process-tailoring", "version": "0.1.0-c2202500.1", "local": false}], "docs": [{"name": "프로젝트표준프로세스.md", "path": "sim-project/100_Orientate/110_수행준비/114_프로젝트프로세스정의/프로젝트표준프로세스.md", "html": "<h1>프로젝트표준프로세스 (PDP) — 현대백화점 자사채널(홈페이지) 개선 [AI 생성]</h1><blockquote><strong>상태: <code>draft</code> — PMO 확정 전.</strong> 확정일·확정자 미기입 (표준 절차 5: 자동 확정 금지)<br>인풋: I7 <code>.ax-project.yaml</code> · OSSP v4.1 태스크 카탈로그(70작업, 유형별 ●◐○ + 책임자)</blockquote><hr><h2>1. 테일러링 기준</h2><div class='tw'><table><thead><tr><th>축</th><th>값</th><th>파생 규칙</th></tr></thead><tbody><tr><td>프로젝트 유형</td><td><strong>개편</strong></td><td>OSSP 카탈로그 <code>개편</code> 컬럼(●필수/◐선택/○제외)을 초기값으로 상속</td></tr><tr><td>담당 범위</td><td>기획 + 디자인 + <strong>프론트엔드(퍼블리싱)</strong></td><td>백엔드·앱 개발 작업 제외. 400은 410·420만</td></tr><tr><td>수행 기간</td><td>2022-09-19 ~ 2023-04-18 (7개월)</ >투입 인풋</h2><ul><li>I7 .ax-project.yaml</li><li>OSSP v4.1 태스크 카탈로그(64태스크)</li></ul><h2>산출물</h2><ul><li><code>프로젝트표준프로세스.md</code></li></ul><h2>AS-IS 대조</h2><ul><li>상태: <strong>부분대조</strong></li><li>원본: HDDS_산출물목록_바이널씨_220914.doc</li><li>원 프로젝트엔 PDP 문서가 없고 &#x27;산출물 목록&#x27; 1종으로 갈음. AI 산출물이 테일러링 판정까지 포함해 범위가 더 넓다.</li></ul><h2>이후 어디에 쓰이나</h2><ul><li>전 작업의 수행/제외 판정 근거 — 뷰어 로스터의 상태값이 여기서 나온다</li><li>132 수행계획수립 — 단계 구성</li><li>411 작업계획수립 — 활동 범위</li></ul><h2>도출된 인사이트</h2><p>원 프로젝트에는 PDP가 없고 &#x27;산출물 목록&#x27; 1종뿐이었다. 그 목록에는 <strong>산출물 양식</strong>(엑셀/PPT/PDF/Zeplin)이 지정돼 있는데 AI 테일러링에는 그 축이 없다. 산출물 형식은 실무 합의 사항이라 테일러링 단계에서 함께 정해야 한다.</p><h2>스킬 고도화 (이번 작업에서 수행)</h2><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>제외 연쇄 점검표</strong> 신설</td><td>원 스킬 절차 4에 &quot;끊긴 사슬 없음을 확인하라&quot;는 지시는 있으나 <strong>확인 방법이 없다.</strong> 초판은 제외를 사유 한 줄로만 적었고, <strong>123·125 제외가 3단계를 타고 내려가 계약의 검수조건을 비운다</strong>는 사실이 어디에도 안 남았다</td></tr><tr><td>2</td><td><strong>서식 원본 미확보 시 처리</strong> 신설</td><td>서식 마스터 위치가 미확정이자 초판은 <strong>산출물 2(프로젝트표준서식)를 통째로 생략</strong>했다(<code>produces</code> 2건 중 1건 미이행). 실물이 없어도 요구 목록·구성요소·변수 명세까지는 만들도록 고정</td></tr></tbody></table></div><p><strong>전사 환류 판단</strong>: 2건 모두 유효 (레지스트리 반영 승인 대기)</p><h2>도출된 인사이트 (재실행본)</h2><p><strong>테일러링의 진짜 산출물은 &quot;뺀 목록&quot;이 아니라 &quot;뺀 대가&quot;다.</strong> 필수● 제외가 14건인데, 초판은 그걸 사유 한 줄씩으로 처리했다. 연쇄를 추적하니 6건이 하류 산출물에 실제 영향을 주고, 그중 <strong>3건(123·125·214)이 계약의 검수 가능성까지 무너뜨린다</strong> — 성공기준 부재 → 인수기준 정성화 → 검수조건 3건 검수 불가 → 계약 별첨.</p><p><strong>이건 PDP 단계에서 잡혔어야 한다.</strong> &quot;리서치 미계약&quot;을 그대로 받는 대신 최소 대체 수단(간이 VOC·경영진 서면 확인·로그 수급)을 계약 전에 협의할 수 있었다. 테일러링이 리스크 은폐가 되지 않으려면 제외의 대가를 문서에 남겨야 한다.</p><p><strong>규모 축이 초판에 없었다.</strong> 122 재실행으로 고유 1,003화면이 확인되면서, 이 프로젝트는 tailoring <strong>down</strong>이 아니라 <strong>up</strong>(343 설계리뷰 강화) 방향임이 드러났다.</p>"}, {"task_id": "121", "task_name": "제안및거시환경분석", "skill": "vinylc_environment-scan", "state": "done", "verdict": "pass (보완완료)", "skill_loaded": "full", "next_use": ["221 서비스분석 — 경쟁 맥락", "242 UX컨셉 — 사용자·업계 흐름 근거", "353 UI개발가이드 · 423 퍼블리싱 — IE10 제약"], "has_insight": "true", "todo": "1", "inputs": ["I8 OSSP 표준 프로세스(v4.1)", "I1 제안서", "I2 고객수급 자료", "I3 기초질의서", "W 조건부 외부검색(2022-09 이전 한정)"], "outputs": ["환경분석보고서.md", "뉴스클리핑.md"], "asis_state": "원본없음", "asis_file": null, "asis_note": "원 프로젝트에 환경분석·뉴스클리핑 산출물 없음. 개편형에서 121이 ◐(선택)이고 실제 미수행 — 테일러링 판정과 정합.", "meta_html": "<h2>6. ⚠️ 검색 중 발견한 오염 위험 (기록 유지)</h2><p>첫 검색(<code>현대백화점 홈페이지 리뉴얼</code>)에서 <strong>수행사 자사 포트폴리오 페이지</strong>가 상위 노출됐고, 여기에 <strong>이 프로젝트의 완성 결과와 디자인 컨셉</strong>이 서술돼 있었다.</p><ul><li>이는 <strong>242 UX컨셉·243 UX전략의 정답지</strong>다. 미열람 처리하고 <code>vinylc.com</code>을 차단 도메인으로 지정했다.</li><li><strong>일반 규칙</strong>: 완료 프로젝트를 재수행하는 시뮬레이션에서 &quot;수행사명 + 고객사명&quot; 조합 검색은 자사 레퍼런스를 통해 정답을 노출시킨다. <strong>시점 한정만으로는 막을 수 없고 주체 기준 차단이 함께 필요하다.</strong> (실행계획서 §4-2에 반영)</li></ul>", "skill_info": [{"name": "vinylc_environment-scan", "version": "0.1.0-draft", "local": false}], "docs": [{"name": "뉴스클리핑.md", "path": "sim-project/100_Orientate/120_기초분석/121_제안및거시환경분석/뉴스클리핑.md", "html": "<h1>뉴스클리핑 — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>사용 인풋: W(조건부 검색 — 2022-09-19 이전 발행분 한정 · vinylc.com 차단), I1 제안서, I3 기초질의 회신</blockquote><h2>0. 검색 설계</h2><div class='tw'><table><thead><tr><th>질의 축</th><th>실제 사용 질의</th><th>결과</th></tr></thead><tbody><tr><td>대상 서비스 동향</td><td>현대백화점 홈페이지 개편 / 자사채널 디지털 전환</td><td>⚠️ 채택 0 — §4 참조</td></tr><tr><td>시장·카테고리</td><td>2022 백화점 업계 리오프닝 · 소비 트렌드 · MZ</td><td>3건 채택</td></tr><tr><td>기술 환경</td><td>IE 지원 종료 · 웹 접근성 품질인증 · 브라우저 점유율</td><td>2건 채택</td></tr><tr><td>경쟁사 동향</td><td>롯데·신세계 공식 홈페이지 개편 (2022)</td><td>⚠️ 1건만 채택(2019년 건)</td></tr></tbody></table></div><p><strong>시점 상한</strong>: 2022-09-19(착수일). 발행일 불명 소스는 채택하지 않음.</p><h2>1. 서비스 동향 (대상 서비스 자체)</h2><p><strong>채택 0건.</strong></p><p>검색으로 확인된 2022년 이전 발행 기사 중 <strong>현대백화점 공식 홈페이지(ehyundai.com) 자체의 개편·기능·이슈를 다룬 것이 없다.</strong> 공식 홈페이지는 커머스(더현대닷컴)와 달리 언론 보도 대상이 되는 빈도가 낮은 것으로 보인다.</p><p>→ <code>[미확인]</code> — 서비스 동향은 외부 보도가 아니라 <strong>고객사 내부 자료(I2 수급자료)에서 확인</strong>해야 한다. 실제로 수급자료에 <code>2022.07.웹페이지변경.pdf</code>, <code>23년 변경사항.xlsx</code> 등 운영 변경 이력이 있어 이것이 사실상의 서비스 동향 소스다.</p><h2>2. 경쟁사 동향</h2><div class='tw'><table><thead><tr><th>#</th><th>요지</th><th>날짜</th><th>출처</th><th>CRAAP 등급</th></tr></thead><tbody><tr><td>C1</td><td>신세계백화점이 공식 홈페이지 &#x27;신세계닷컴&#x27;을 개편</td><td>2019-04-29</td><td><a href=\"https://www.metroseoul.co.kr/article/2019042900067\" target=\"_blank\" rel=\"noopener\">메트로신문</a></td><td><strong>C=하</strong>(3년 전) · R=중 · A=중(일간지) · Ac=중 · P=보도 → <strong>참고용</strong>, 2022 시점 비교 근거로는 부적합</td></tr><tr><td>C2</td><td>롯데백화점 공식 채널이 지점별 쇼핑정보·매장안내·우수고객 제도·문화센터·웨딩센터·갤러리 구성을 운영</td><td>시점 불명(현행)</td><td><a href=\"https://www.lotteshopping.com/contents/shpgInfo\" target=\"_blank\" rel=\"noopener\">롯데백화점</a></td><td><strong>C=불명(현행 페이지)</strong> → <strong>평가 근거 불채택.</strong> 영역 구성 확인 목적만</td></tr></tbody></table></div><p><strong>경쟁사 동향 채택 = 실질 0건.</strong> 2022년 하반기 시점의 롯데·신세계 공식 채널 개편 동향을 다룬 기사를 찾지 못했다.</p><p>→ <code>[미확인]</code> — 221 서비스분석에서 <strong>고객 지정 벤치마킹 대상</strong>을 받거나, 웹 아카이브(과거 캡처)로 확보해야 한다.</p><h2>3. 시장·업계 동향 (거시 — 환경분석보고서 PESTEL 입력)</h2><div class='tw'><table><thead><tr><th>#</th><th>요지</th><th>날짜</th><th>출처</th><th>CRAAP 등급</th><th>우선순위</th></tr></thead><tbody><tr><td>M1</td><td>사회적 거리두기 해제·리오프닝으로 백화점 실적 반등. 신세계 패션 +27%·명품 +21%, 롯데·현대 패션·아웃도어·레저 20%대 성장</td><td>2022-04~05</td><td><a href=\"https://www.etnews.com/20220413000168\" target=\"_blank\" rel=\"noopener\">전자신문 2022-04-13</a> · <a href=\"http://news.bizwatch.co.kr/article/consumer/2022/05/19/0001\" target=\"_blank\" rel=\"noopener\">비즈워치 2022-05-19</a></td><td>C=상(착수 4~5개월 전) · R=상 · A=상(경제지) · Ac=상(수치 인용) · P=보도 → <strong>채택</strong></td><td><strong>영향도 상 / 시급성 중</strong></td></tr><tr><td>M2</td><td>백화점을 &#x27;쇼핑&#x27;이 아닌 <strong>체험·라이프스타일 공간</strong>으로 재정의하는 경험형 콘텐츠 리뉴얼이 업계 공통 전략. 식음·라이프스타일 결합, MZ 전문관 신설</td><td>2022 상반기</td><td><a href=\"https://m.newsprime.co.kr/section_view.html?no=574125\" target=\"_blank\" rel=\"noopener\">프라임경제</a></td><td>C=상 · R=상 · A=중 · Ac=중 · P=보도 → <strong>채택</strong></td><td><strong>영향도 상 / 시급성 상</strong></td></tr><tr><td>M3</td><td>신규 소비층 2030(MZ) 공략이 업계 최우선 과제. 현대백화점도 목동점 지하3~1층 리뉴얼로 MZ 전문관 계획</td><td>2022 상반기</td><td><a href=\"https://m.newsprime.co.kr/section_view.html?no=574125\" target=\"_blank\" rel=\"noopener\">프라임경제</a></td><td>C=상 · R=중 · A=중 · Ac=중 · P=보도 → <strong>채택(단 §5 유보)</strong></td><td><strong>영향도 중 / 시급성 중</strong></td></tr></tbody></table></div><h2>4. 기술·제도 동향</h2><div class='tw'><table><thead><tr><th>#</th><th>요지</th><th>날짜</th><th>출처</th><th>CRAAP 등급</th><th>우선순위</th></tr></thead><tbody><tr><td>T1</td><td><strong>인터넷 익스플로러 11 지원 2022-06-15 종료.</strong> 이후 보안 패치 중단, Edge의 IE 모드로 대체</td><td>예고 2021-05-20 / 종료 2022-06-15</td><td><a href=\"https://www.hankyung.com/article/202105202942g\" target=\"_blank\" rel=\"noopener\">한국경제 2021-05-20</a> · <a href=\"https://ko.wikipedia.org/wiki/%EC%9D%B8%ED%84%B0%EB%84%B7_%EC%9D%B5%EC%8A%A4%ED%94%84%EB%A1%9C%EB%9F%AC_11\" target=\"_blank\" rel=\"noopener\">위키백과</a></td><td>C=상 · R=<strong>상(직접 제약)</strong> · A=상 · Ac=상 · P=보도/백과 → <strong>채택</strong></td><td><strong>영향도 상 / 시급성 상</strong></td></tr><tr><td>T2</td><td>웹 접근성 품질인증은 과기정통부 지정 인증기관 심사로 마크 부여. 기관 예: 한국웹접근성인증평가원·한국디지털접근성진흥원</td><td>제도 상시</td><td><a href=\"https://www.mcst.go.kr/site/s_etc/webAccess/accessibility.jsp\" target=\"_blank\" rel=\"noopener\">문화체육관광부</a> · <a href=\"http://www.kwacc.or.kr/Accessibility/Certification\" target=\"_blank\" rel=\"noopener\">한국디지털접근성진흥원</a></td><td>C=상 · R=상 · A=<strong>상(정부·인증기관)</strong> · Ac=상 · P=제도 안내 → <strong>채택</strong></td><td>영향도 중 / 시급성 하</td></tr></tbody></table></div><h2>5. 강·약점 키워드 (위 사실에서 귀납 — 단정 아님, 관찰된 신호)</h2><h3>강점 신호</h3><div class='tw'><table><thead><tr><th>키워드</th><th>근거</th><th>신호 강도</th></tr></thead><tbody><tr><td><strong>오프라인 회복 국면</strong></td><td>M1 — 리오프닝으로 방문 수요 반등 중. 방문 유도 채널의 가치 상승</td><td>강</td></tr><tr><td><strong>콘텐츠 자산 보유</strong></td><td>I2·215 — CH1985·문화센터·전시·공연, Sounds Forest·ALT.1 등 실물 콘텐츠 다수</td><td>강</td></tr><tr><td><strong>멤버십 체계 정교함</strong></td><td>212 — VIP 등급 6종·혜택 12종·마일리지 매트릭스. 경쟁사 대비 정교도 추정</td><td>중</td></tr></tbody></table></div><h3>약점 신호</h3><div class='tw'><table><thead><tr><th>키워드</th><th>근거</th><th>신호 강도</th></tr></thead><tbody><tr><td><strong>레거시 브라우저 부채</strong></td><td>T1 — 지원 종료된 IE10을 계약 기준에 포함. 구현 기법 제한</td><td>강</td></tr><tr><td><strong>채널 분산</strong></td><td>121 §1-2 — 공식홈·더현대닷컴·그룹·재단·H.Point·패밀리앱·솔루션으로 분산</td><td>강</td></tr><tr><td><strong>채널 간 구조 불일치</strong></td><td>122 — PC 12영역 vs MWEB 15영역, 진입 모델 상이</td><td>중</td></tr><tr><td><strong>회원 체계 전환기</strong></td><td>212 — H.Point 통합(2023-01-01)이 오픈과 근접</td><td>중</td></tr><tr><td><strong>외부 노출 부재</strong></td><td>§1 — 공식 홈페이지 자체의 보도가 없다 = 채널의 대외 인지 신호가 약함</td><td>약(관찰 한계)</td></tr></tbody></table></div><h3>⚠️ 유보 항목</h3><p><strong>M3(MZ 담론)은 그대로 적용하지 않는다.</strong> 고객 제공 실측은 <strong>30대 36.5% + 40대 33% = 70%, 여성 69.2%</strong> 로, 업계 담론(2030 중심)과 층이 다르다. 업계 흐름을 근거로 타깃을 2030으로 잡으면 실제 사용자와 어긋난다. → <strong>실측 우선.</strong></p><h2>7. 다음 단계로 넘기는 것</h2><ul><li><strong>M1·M2 → 환경분석보고서 §1 PESTEL(S: 사회)·§2 시장·트렌드</strong></li><li><strong>T1 → §1 PESTEL(T: 기술) + 리스크 승격</strong> (353 UI개발가이드·423 퍼블리싱의 기술 선택 제약)</li><li><strong>T2 → §1 PESTEL(L: 법·제도)</strong> (354 접근성가이드의 준수 기준)</li><li><strong>강·약점 키워드 → §3 브랜드 · §6 시사점</strong>, 그리고 242 UX컨셉의 재료</li><li><code>[미확인]</code> 2건(서비스 동향·경쟁사 동향) → <strong>221 서비스분석에서 고객 지정 대상 확보 후 보완</strong></li></ul>", "bytes": 8269, "deliv": "121_제안및거시환경분석/뉴스클리핑.html"}, {"name": "환경분석보고서.md", "path": "sim-project/100_Orientate/120_기초분석/121_제안및거시환경분석/환경분석보고서.md", "html": "<h1>환경분석보고서 — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>사용 인풋: I1 제안서 · I2 고객수급 자료 · I3 기초질의 회신 · I8 OSSP 표준 · W 조건부 검색 · 뉴스클리핑(같은 작업 산출물 1)<br>[미확인] 5건 · [확인필요] 2건</blockquote><hr><h2>1. 거시환경 (PESTEL)</h2><p>요인은 검색·인풋에서 도출한 것만 기재하고, <strong>영향도 / 시급성</strong>으로 우선순위화했다. 일반론 나열은 하지 않는다.</p><div class='tw'><table  명세서에는 User Flow도 휴리스틱 평가도 없다. §4·§5는 원본 초과분이다.</li></ul><hr>", "skill_info": [{"name": "vinylc_as-is-analysis", "version": "0.1.0-c2202500.1", "local": false}], "docs": [{"name": "AS-IS_화면덤프_UserFlow.md", "path": "sim-project/100_Orientate/120_기초분석/122_현시스템기초분석/AS-IS_화면덤프_UserFlow.md", "html": "<h1>AS-IS 화면덤프 · User Flow — 현대백화점 자사채널 현행 시스템 [AI 생성]</h1><blockquote><strong>미참조(인풋 동결 규약)</strong>: 업무중요도 · 업무범위(개선/리디자인/삭제) · 업무 수용여부 · 기능정의/개선사항 메모 · 문의/고객의견 — 모두 TO-BE 결정이라 122에서 참조 금지</blockquote><hr><h2>0. 원자료 등급 판정 — <strong>등급 C</strong></h2><div class='tw'><table><thead><tr><th>항목</th><th>확보 여부</th></tr></thead><tbody><tr><td>현행 화면 캡처 이미지</td><td>❌ <strong>0장</strong></td></tr><tr><td>화면명세서(화면ID·명칭·정보구조 10Depth·관리주체)</td><td>✅ 1,344행</td></tr><tr><td>현행 사이트 실접속</td><td>❌ 불가 (2022년 시점 대상, 접근 불가)</td></tr></tbody></table></div><p>→ 표준 §「원자료 등급 판정」의 <strong>등급 C</strong>. 이 등급에서 산출 가능한 범위는 다음과 같이 <strong>제한</strong>된다.</p><ul><li>화면덤프 — <strong>전수 목록화 가능</strong>, 단 화면별 시각 근거 없음</li><li>User Flow — <strong>문서상 동선 = 가설</strong>. 실제 클릭 동선 검증 불가 → <code>[확인필요]</code></li><li>휴리스틱 — <strong>구조 판정 계열(S)만 평가.</strong> 시각 판정 계열(V)은 <strong>「미판정」으로 남기고 추정하지 않는다</strong></li></ul><blockquote>캡처 확보 시 재검증 대상: §5 표에서 <code>유형 V</code>·<code>S+V</code>로 표시된 항목 전부.</blockquote><hr><h2>1. 규모 기준선 — <strong>하나의 숫자로 쓰면 안 된다</strong></h2><p>표준 §「규모 기준선 3중 산정」에 따라 세 기준을 분리 산정했다.</p><div class='tw'><table><thead><tr><th>기준선</th><th>PC</th><th>MWEB</th><th>합계</th><th>이 숫자를 쓰는 곳</th></tr></thead><tbody><tr><td>① <strong>명세 행 수</strong> (진입경로×화면)</td><td>818</td><td>526</td><td><strong>1,344</strong></td><td>기획 명세·검수 항목 수</td></tr><tr><td>② <strong>고유 화면 수</strong> (화면ID 중복 제거)</td><td>618</td><td>385</td><td><strong>1,003</strong></td><td>설계·검수 대상 수</td></tr><tr><td>③ <strong>본화면 수</strong> (레이어·탭·팝업 제외)</td><td>350</td><td>224</td><td><strong>574</strong></td><td><strong>디자인·퍼블리싱 공수</strong></td></tr></tbody></table></div><p><strong>①과 ③의 차이는 2.34배다.</strong> 초판이 1,344를 단일 &quot;화면 수&quot;로 제시했고 그 숫자가 이미 132 수행계획에 인용돼 있다 → <strong>132 재산정 필요</strong>(§6-2).</p><h3>차이가 나는 이유</h3><p><strong>① → ②: 하나의 화면이 여러 진입경로에서 재사용된다</strong> (341행 = 25%)</p><div class='tw'><table><thead><tr><th>화면ID</th><th>화면명</th><th>진입경로 수</th><th>채널</th></tr></thead><tbody><tr><td><code>MSE1.2</code></td><td>검색 결과</td><td><strong>21</strong></td><td>MWEB</td></tr><tr><td><code>PSE1.1.1</code></td><td>검색결과</td><td><strong>18</strong></td><td>PC</td></tr><tr><td><code>PCU1.1.4.1.2.1T</code></td><td>압구정본점(T1)</td><td>17</td><td>PC</td></tr><tr><td><code>PCA1.1.4.2.1T</code></td><td>전체(T1)</td><td>12</td><td>PC</td></tr><tr><td><code>MSI1.1.1.4.2.1</code></td><td>신촌점U-PLEX</td><td>10</td><td>MWEB</td></tr><tr><td><code>PSC1.3.2.1T</code></td><td>전체(T1)</td><td>10</td><td>PC</td></tr></tbody></table></div><p>검색결과 화면은 <strong>브랜드 19개 각각의 하위 경로에서 동일 화면으로 도달</strong>한다. 즉 브랜드별 검색결과가 따로 있는 게 아니라 <strong>문맥과 무관한 단일 결과 화면</strong>이다 → §5 H2·H7의 근거.</p><p><strong>② → ③: 종속 화면(레이어·탭·팝업) 비중이 43%</strong></p><div class='tw'><table><thead><tr><th>접미 관례</th><th>PC</th><th>MWEB</th><th>의미</th></tr></thead><tbody><tr><td>(없음) 본화면</td><td>350</td><td>224</td><td>독립 페이지</td></tr><tr><td><code>L</code> 레이어</td><td>151</td><td>41</td><td>모달·레이어팝업</td></tr><tr><td><code>T</code> 탭</td><td>114</td><td>114</td><td>탭 전환</td></tr><tr><td><code>P</code> 팝업</td><td>3</td><td>0</td><td>별창</td></tr><tr><td><code>F</code> 전체화면</td><td>0</td><td>6</td><td>전체화면 오버레이</td></tr></tbody></table></div><p><code>P</code>는 PC에만, <code>F</code>는 MWEB에만 있다 — <strong>접미 관례 자체가 채널마다 다르다</strong>(§5 H4).</p><hr><h2>2. 영역별 인벤토리</h2><p>규모가 1,003화면(원문 기준 300p 초과)이므로 표준 규정대로 <strong>전수 나열 대신 영역 집계 + 핵심 플로우 표본</strong>으로 제시한다. 전수 목록은 원자료(I5)가 그대로 보유.</p><h3>PC — 12영역 / 고유 618</h3><div class='tw'><table><thead><tr><th>코드</th><th>영역</th><th>고유</th><th>행</th><th>재사용률</th><th>Admin</th><th>CMS</th></tr></thead><tbody><tr><td>PCA</td><td>카드/상품권/멤버십</td><td>257</td><td>321</td><td>20%</td><td>12</td><td>0</td></tr><tr><td>PSI</td><td d>MEN</td><td>이벤트/공지사항</td><td>9</td><td>17</td><td>47%</td><td>3</td><td>0</td></tr><tr><td>MMA</td><td>메인</td><td>5</td><td>6</td><td>17%</td><td>2</td><td>0</td></tr><tr><td>MSE</td><td>검색</td><td><strong>3</strong></td><td><strong>23</strong></td><td><strong>87%</strong></td><td>0</td><td>0</td></tr><tr><td>MSS</td><td>지점선택</td><td>2</td><td>3</td><td>33%</td><td>0</td><td>0</td></tr><tr><td>MFA</td><td>패밀리앱</td><td>2</td><td>3</td><td>33%</td><td>0</td><td>0</td></tr><tr><td>MAM</td><td>전체메뉴</td><td>1</td><td>1</td><td>0%</td><td>1</td><td>0</td></tr></tbody></table></div><blockquote><strong>Admin/CMS 연동도 3중으로 다르다</strong> — 행 기준 233건이지만 <strong>고유 화면 기준 Admin 122 / CMS 17</strong>. 계약상 Admin은 기획·퍼블리싱만(디자인 제외) 수행하므로 이 122건은 산출물 체인이 Front와 다르게 흐른다.</blockquote><h3>계층 깊이 분포</h3><div class='tw'><table><thead><tr><th>채널</th><th>평균 depth</th><th>최대</th><th>depth 7 이상</th></tr></thead><tbody><tr><td>PC</td><td>5.17</td><td>9</td><td>67건 (11%)</td></tr><tr><td>MWEB</td><td><strong>6.41</strong></td><td><strong>11</strong></td><td><strong>171건 (44%)</strong></td></tr></tbody></table></div><p>MWEB이 구조적으로 1단계 깊다 — 모든 경로가 <code>메인 &gt; 전체메뉴 &gt; …</code>를 거치기 때문. §5 H7의 근거.</p><h3>핵심 플로우 표본 인벤토리 (문화센터 수강신청 · PC)</h3><p>스텝 표기 관례(<code>S1/S2/S3</code>)가 원자료에 이미 존재한다.</p><div class='tw'><table><thead><tr><th>화면ID</th><th>depth</th><th>위치(경로)</th><th>유형</th></tr></thead><tbody><tr><td><code>PCU1.1.4.1.1T</code></td><td>4</td><td>CH 1985·문화센터 &gt; 수강신청 &gt; _클래스 1985</td><td>탭</td></tr><tr><td><code>PCU1.1.4.1.1.1L</code></td><td>7</td><td>… &gt; 강좌찾기(T1) &gt; 항목 선택L</td><td>레이어</td></tr><tr><td><code>PCU1.1.5.4</code></td><td>7</td><td>… &gt; 강좌찾기(T1) &gt; 장바구니 등록L &gt; 장바구니</td><td>본화면</td></tr><tr><td><code>PCU1.1.4.1.1.3.1</code></td><td>7</td><td>… &gt; _일반강좌 &gt; 신청하기 &gt; <strong>수강정보 확인S1</strong></td><td>본화면</td></tr><tr><td><code>PCU1.1.4.1.1.3.2.1</code></td><td>8</td><td>… &gt; <strong>결제정보 입력S2</strong> &gt; 무료강좌 결제정보 입력</td><td>본화면</td></tr><tr><td><code>PCU1.1.4.1.1.3.2.2.1</code></td><td>9</td><td>… &gt; 결제정보 입력S2 &gt; 유료강좌 &gt; 현대백화점카드</td><td>본화면</td></tr><tr><td><code>PCU1.1.4.1.1.3.3</code></td><td>7</td><td>… &gt; 신청하기 &gt; <strong>수강신청 완료S3</strong></td><td>본화면</td></tr><tr><td><code>PCU1.1.4.1.1.5L</code></td><td>6</td><td>… &gt; 강좌찾기(T1) &gt; 수강 신청 대기 신청L</td><td>레이어</td></tr></tbody></table></div><hr><h2>3. 주요 태스크 식별</h2><p>화면덤프에서 도출한 현행 시스템의 핵심 사용자 태스크 5종.</p><div class='tw'><table><thead><tr><th>#</th><th>태스크</th><th>관련 영역</th><th>고유 화면</th><th>스텝 명세</th></tr></thead><tbody><tr><td>T1</td><td>지점 정보 확인 (행사·시설·오시는길)</td><td>PSI/MSI</td><td>192</td><td>없음</td></tr><tr><td>T2</td><td>브랜드·매장 찾기</td><td>PBR/MBR + PSE/MSE</td><td>44</td><td>없음</td></tr><tr><td>T3</td><td>문화센터 강좌 신청</td><td>PCU/MCU</td><td>135</td><td><strong>S1→S2→S3</strong></td></tr><tr><td>T4</td><td>카드 신청·멤버십 조회</td><td>PCA/MCA</td><td>343</td><td><strong>S1→S2→S3</strong></td></tr><tr><td>T5</td><td>로그인·회원정보 관리</td><td>PLO/MLO + PMY/MMY</td><td>68</td><td>부분</td></tr></tbody></table></div><p>T3·T4만 명시적 스텝 관례를 갖는다 — <strong>거래성 태스크에만 단계 설계가 되어 있고 정보탐색 태스크(T1·T2)에는 없다.</strong></p><hr><h2>4. AS-IS User Flow</h2><h3>4-1. 진입 모델 (채널별)</h3><figure class=\"uf-wrap\"><div class=\"uf-legend\"><span class=\"uf-lg\"><i class=\"uf-i uf-start\"></i>시작</span><span class=\"uf-lg\"><i class=\"uf-i uf-page\"></i>페이지</span><span class=\"uf-lg\"><i class=\"uf-i uf-arrow\">→</i>유저가 이동하는 흐름</span><span class=\"uf-count\">노드 18 · 흐름 17 · 구간 2</span></div><div class=\"uf-canvas\"><svg class=\"uf\" viewBox=\"0 0 1348 1096\" width=\"100%\" preserveAspectRatio=\"xMinYMin meet\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"유저플로우\"><defs><marker id=\"ufa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#767676\"/></marker></defs><line x1=\"0\" y1=\"0\" x2=\"1348\" y2=\"0\" stroke=\"#E5E5E5\" stroke-width=\"1\"/><text x=\"28\" y=\"26\" font-size=\"11\" f  y=\"46.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"2900.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"2900.0\" dy=\"0\">신청 강좌 취소 완료</tspan></text><rect x=\"716.0\" y=\"150.0\" width=\"240\" height=\"60\" rx=\"4\" fill=\"#F0F0F0\" stroke=\"#CFCFCF\" stroke-width=\"1\"/><text x=\"836.0\" y=\"184.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#111111\"><tspan x=\"836.0\" dy=\"0\">수강 인원 초과 대기신청L</tspan></text></svg></div></figure><div class='tw'><table><thead><tr><th>구분</th><th>경로</th></tr></thead><tbody><tr><td><strong>정상 경로</strong></td><td>강좌찾기 → 신청 → S1 → S2 → S3 → 수강내역</td></tr><tr><td><strong>우회 경로</strong></td><td>장바구니 경유(별도 화면 <code>PCU1.1.5.4</code>, depth 7)</td></tr><tr><td><strong>막다른 길</strong></td><td>정원 초과 → 대기신청 레이어에서 종료(<code>수강 인원 초과 대기신청L</code>). 대기 상태 조회 화면 <code>[확인필요]</code></td></tr><tr><td><strong>되돌아옴</strong></td><td>S1에서 나의회원이 없으면 <code>나의회원추가L</code>로 나갔다 복귀 — <strong>결제 흐름 중 회원등록이 끼어든다</strong></td></tr></tbody></table></div><blockquote>실제 클릭 동선·이탈 지점은 <strong><code>[확인필요]</code></strong> — 등급 C에서는 문서상 연결만 확인 가능. 214 이용로그가 확보되면 이 흐름의 실제 이탈률로 검증할 것(현재 로그 미확보).</blockquote><hr><h2>5. 문제점 분석 — 휴리스틱 평가</h2><p>표준 고정 세트(Nielsen 10 + 접근성 4) 적용. <strong>등급 C이므로 <code>유형 V</code> 항목은 「미판정」이며, 아래는 전부 문서 구조에서 나온 근거를 갖는다.</strong></p><div class='tw'><table><thead><tr><th>#</th><th>휴리스틱</th><th>판정</th><th>문제</th><th>위치(화면ID)</th><th>심각도</th><th>근거</th></tr></thead><tbody><tr><td>H1</td><td>시스템 상태 가시성</td><td><strong>미판정</strong></td><td>—</td><td>—</td><td>—</td><td>시각 자료 필요</td></tr><tr><td>H2</td><td>현실과의 일치</td><td>위반</td><td>검색결과가 진입 문맥을 반영하지 않음 — 브랜드 19곳에서 들어와도 동일 화면</td><td><code>PSE1.1.1</code>(18경로) <code>MSE1.2</code>(21경로)</td><td>중</td><td>§1 재사용 표</td></tr><tr><td>H3</td><td>사용자 제어와 자유</td><td>부분위반</td><td>취소 경로가 강좌·대관에만 존재(PC 7 / MWEB 4). 카드신청 S1–S3 중 <strong>취소·이전 화면 정의 없음</strong></td><td><code>PCA1.1.2.1.1.*</code></td><td>중</td><td>카드 영역 64화면 중 취소 0</td></tr><tr><td>H4</td><td><strong>일관성과 표준</strong></td><td><strong>위반(다중)</strong></td><td>↓ 아래 별도 표</td><td>—</td><td><strong>상</strong></td><td>↓</td></tr><tr><td>H5</td><td>오류 예방</td><td>부분위반</td><td>결제 직전 확인 단계는 있음(S1). 단 <strong>정원초과·중복신청 사전 경고 화면 없음</strong></td><td><code>MCU1.2.1.2.1</code></td><td>중</td><td>초과는 사후 F화면으로만 처리</td></tr><tr><td>H6</td><td>회상보다 인식</td><td>위반</td><td><strong>최근 본 / 즐겨찾기 화면이 양 채널 0건.</strong> 1,003화면 규모에서 재방문 지원 장치 부재</td><td>전역</td><td>중</td><td>명칭 검색 0건</td></tr><tr><td>H7</td><td>유연성·효율성</td><td>위반</td><td>MWEB 전 경로가 전체메뉴 경유 → depth 7 이상 <strong>44%</strong> (PC 11%). 단축 진입 없음</td><td><code>MAM</code> 전역</td><td>상</td><td>§2 깊이 분포</td></tr><tr><td>H8</td><td>심미적·미니멀</td><td><strong>미판정</strong></td><td>—</td><td>—</td><td>—</td><td>시각 자료 필요</td></tr><tr><td>H9</td><td>오류 인식·진단·복구</td><td><strong>위반</strong></td><td><strong>오류·에러·404 화면이 명세에 0건</strong>(양 채널). 예외 상황의 화면 정의가 통째로 없음</td><td>전역</td><td><strong>상</strong></td><td>명칭 정규식 0건</td></tr><tr><td>H10</td><td>도움말과 문서</td><td>위반</td><td>도움말 관련 화면 PC 4 / MWEB 3으로 <strong>산재</strong>. 통합 고객센터 화면 없음</td><td><code>IR FAQ</code>·<code>이용안내</code>·<code>주요문의처</code></td><td>중</td><td>영역이 제각각</td></tr><tr><td>A1</td><td>제목 제공</td><td>부분위반</td><td>화면명 표기 혼재 — <code>_</code>로 시작하는 조건부 화면명 다수(<code>_카드보유Y</code>, <code>_지점정보 영역</code>)</td><td>전역</td><td>하</td><td>내부 메모성 명칭</td></tr><tr><td>A2</td><td>반복영역 건너뛰기</td><td><strong>미판정</strong></td><td>—</td><td>—</td><td>—</td><td>마크업 필요</td></tr><tr><td>A3</td><td><strong>채널 동등성</strong></td><td><strong>위반</strong></td><td>↓ 아래 별도 표</td><td>—</td><td><strong>상</strong></td><td>↓</td></tr><tr><td>A4</td><td>접근성 안내</td><td>위반</td><td><strong><code>웹접근성안내</code>가 PC에만 존재, MWEB 0건</strong></td><td>PC 1st depth</td><td>중</td><td>명칭 검색</td></tr></tbody></table></div><h3>H4 상세 — 채널 간 일관성 위반 4건</h3><div class='tw'><table><thead><tr><th>유형</th><th>PC</th><th>MWEB</th><th>영향</th></tr></thead><tbody><tr><td><strong>브랜드 표기</strong></td><td><code>PEER</code> <code>BASH</code> <code>LABELS</code> <code>위마켓</code> <code>르쁠라H</code></td><td><code>피어</code> <code>바쉬 (BASH)</code> <code>레이블스</code> <code>위마캣</code> <code>르쁠라</code></td><td>동일 브랜드가 채널마다 다른 이름. <strong><code>위마켓</code>/<code>위마캣</code>은 둘 중 하나가 오기</strong>로 보임 <code>[확인필요]</code></td></tr><tr><td><strong>진입 모델</strong></td><td>GNB 평면 32</td><td>전체메뉴 허브 6</td><td>IA 1:1 대응 불가</td></tr><tr><td><strong>화면ID 접미</strong></td><td><code>L</code> <code>T</code> <code>P</code></td><td><code>L</code> <code>T</code> <code>F</code></td><td>종속화면 관례가 채널마다 다름</td></tr><tr><td><strong>영역 구성</strong></td><td>12영역, <code>Footer</code> 독립</td><td>15영역, <code>지점선택</code>·<code>패밀리앱</code>·<code>전체메뉴</code> 독립</td><td>매핑 테이블 없이는 대응 불가</td></tr></tbody></table></div><h3>A3 상세 — 채널별 기능 결손 (양방향)</h3><div class='tw'><table><thead><tr><th>기능</th><th>PC</th><th>MWEB</th><th>비고</th></tr></thead><tbody><tr><td>사이트맵</td><td>✅</td><td>❌</td><td>전체메뉴가 대체하나 동등하지 않음</td></tr><tr><td>웹접근성 안내</td><td>✅</td><td>❌</td><td>A4와 동일 건</td></tr><tr><td>OTP 인증번호 로그인</td><td>✅</td><td>❌</td><td><strong>인증 수단이 채널마다 다름</strong></td></tr><tr><td>H.Point 통합회원 <strong>로그인</strong></td><td>❌</td><td>✅</td><td>역방향 결손</td></tr><tr><td>H.Point 통합회원 <strong>전환</strong></td><td>✅</td><td>❌</td><td>전환은 PC에서만 가능</td></tr><tr><td>로그인 기록보기</td><td>✅</td><td>❌</td><td>보안 기능</td></tr><tr><td>비밀번호 변경</td><td>✅</td><td>❌</td><td><strong>모바일에서 비밀번호를 못 바꾼다</strong></td></tr><tr><td>차량번호 등록·관리</td><td>❌</td><td>✅</td><td>역방향 결손</td></tr><tr><td>공인인증서·키보드 보안 안내</td><td>✅</td><td>❌</td><td></td></tr></tbody></table></div><blockquote><strong>H.Point 전환이 PC에서만 가능</strong>한 점은 212 정책요건의 <strong>G2(개인정보 동의 재획득)</strong> 와 직결된다. 모바일 이용자는 전환 경로 자체가 없다.</blockquote><hr><h2>6. 개선 가설 (확정 아님 — Define 단계 몫)</h2><div class='tw'><table><thead><tr><th>#</th><th>가설</th><th>근거 휴리스틱</th></tr></thead><tbody><tr><td>G-1</td><td>검색결과를 진입 문맥(브랜드·지점·카테고리)으로 필터링된 상태로 진입시키면, 21경로가 공유하는 단일 화면의 부적합이 해소된다</td><td>H2</td></tr><tr><td>G-2</td><td>채널 간 <strong>명칭 사전(brand·메뉴 표기)</strong> 을 단일 소스로 관리하면 H4 브랜드 표기 위반이 구조적으로 재발하지 않는다</td><td>H4</td></tr><tr><td>G-3</td><td>MWEB에 GNB 또는 고정 하단 내비를 도입해 전체메뉴 경유를 우회하면 depth 7+ 44%가 유의하게 감소한다</td><td>H7</td></tr><tr><td>G-4</td><td>예외·오류 화면군(404·권한없음·세션만료·결제실패)을 공통 컴포넌트로 신설한다</td><td>H9</td></tr><tr><td>G-5</td><td>채널 동등성 매트릭스를 요구사항에 명시적 항목으로 넣어 결손 9건을 개별 판정한다</td><td>A3</td></tr></tbody></table></div><blockquote>이 가설들은 215 요구사항정의·322 정보구조설계의 <strong>입력 후보</strong>일 뿐, 여기서 확정하지 않는다.</blockquote><hr><h2>8. 하류 영향 — 재산정이 필요한 작업</h2><div class='tw'><table><thead><tr><th>작업</th><th>무엇이 바뀌나</th></tr></thead><tbody><tr><td><strong>132 수행계획</strong></td><td>규모 기준선 1,344 인용 중 → <strong>디자인·퍼블리싱은 574 기준으로 재산정 필요</strong></td></tr><tr><td><strong>215 요구사항정의</strong></td><td>채널 동등성 결손 9건 · 오류화면 부재 → 요구 후보 신규</td></tr><tr><td><strong>322 정보구조설계</strong></td><td>진입 모델 통일 여부, 검색결과 문맥화가 최대 분기점</td></tr><tr><td><strong>341 화면명세서</strong></td><td>커버리지 기준을 1,003(고유)로. 접미 관례 채널 통일 필요</td></tr><tr><td><strong>411 작업계획</strong></td><td>공수는 574 본화면 + 429 종속화면을 다른 단가로 분리 산정</td></tr></tbody></table></div><hr><h2>10. [확인필요]</h2><div class='tw'><table><thead><tr><th>#</th><th>항목</th><th>확인 주체</th></tr></thead><tbody><tr><td>1</td><td>현행 사이트 실제 클릭 경로 — 문서상 계층과 다를 수 있음</td><td>고객사 / 현행 접속</td></tr><tr><td>2</td><td><code>위마켓</code>(PC) vs <code>위마캣</code>(MWEB) — 정식 브랜드명</td><td>고객사</td></tr><tr><td>3</td><td>오류·404 화면이 실제로 없는 것인지, 명세 누락인지</td><td>고객사 개발팀</td></tr><tr><td>4</td><td>대기신청 후 상태 조회 화면의 존재</td><td>고객사</td></tr><tr><td>5</td><td>MWEB <code>패밀리앱(MFA)</code> 연계 방식 (딥링크·웹뷰)</td><td>고객사 개발팀</td></tr><tr><td>6</td><td>Admin 고유 122건의 관리 주체·연동 방식</td><td>고객사 개발팀</td></tr><tr><td>7</td><td>접근성 인증 등급·심사기관 — 인증 대상이면 판정 권한이 외부 컨설팅에 있음</td><td>PM / 고객사</td></tr><tr><td>8</td><td>화면ID 접미 관례 정의(<code>P</code>·<code>F</code>)의 공식 문서</td><td>고객사</td></tr></tbody></table></div>", "bytes": 18998, "deliv": "122_현시스템기초분석/AS-IS_화면덤프_UserFlow.html"}], "asis_html": "<h2>HDDS_ASIS 화면명세서_V1.5_230223_최종.xlsm</h2><p><code>.xlsm · 1,046,066 bytes · 최종수정 2023-03-15</code> — <strong>열람 완료 · 단 입력과 동일 파일</strong></p><h3>원본 구조</h3><p>7개 시트: <code>Cover · 메뉴코드 · PC · MWEB · IA_PC · IA_M.WEB · 기준</code></p><div class='tw'><table><thead><tr><th>시트</th><th>내용</th></tr></thead><tbody><tr><td>메뉴코드</td><td>영역 코드 27종 (PC 12 / MWEB 15) — <code>PMA 메인</code>, <code>MSI 지점안내</code> 등</td></tr><tr><td>PC</td><td>1,353행 · 화면ID <strong>기재 818행 / 고유 618건</strong></td></tr><tr><td>MWEB</td><td>929행 · 화면ID <strong>기재 526행 / 고유 385건</strong></td></tr><tr><td>기준</td><td>유형값 관리 — 팝업유형·개발유형(Html/Jsp/Native)·직무구분·작업상태</td></tr></tbody></table></div><p>컬럼 구성 (PC 기준): <code>NO · 범위확인 · 업무중요도 · <strong>업무범위</strong> · 정보구조(1~10 Depth) · <strong>업무 수용여부</strong> · 화면ID · 관리(Admin/CMS) · 수급일정 · <strong>기능정의/메모</strong> · <strong>문의/고객의견</strong> · 비고</code></p><h3>⚠️ 대조가 성립하지 않는 이유</h3><p>이 파일이 <strong>122의 입력(I5)이자 동시에 122의 정답지</strong>다. 같은 파일에서 뽑았으니 화면 수는 정의상 일치한다 — 재현율 측정이 무의미하다.</p><h3>그럼에도 확인된 것</h3><ul><li><strong>굵게 표시한 4개 컬럼</strong>(업무범위·수용여부·기능정의/개선사항·고객의견)은 TO-BE 결정이라 <strong>의도적으로 미참조</strong>했다. AI 산출물에 개선 판정이 섞이지 않았음이 검증됨</li><li>원본은 화면 목록이 본체이고 <strong>User Flow가 없다.</strong> AI 산출물은 화면ID 계층에서 진입 동선을 도출해 추가 → 원본에 없던 정보</li><li><strong>휴리스틱 평가도 원본에 없다.</strong> 재실행분의 Nielsen 10 + 접근성 4 판정(위반 8 · 부분위반 3 · 미판정 3)은 전부 원본 초과 생성분</li><li><strong>원본이 스스로 드러내지 않은 사실</strong>: 원본은 화면ID를 행마다 반복 기재해 &quot;몇 화면인가&quot;를 알려주지 않는다. 중복 제거 결과 <strong>행 1,344 ≠ 고유 1,003 ≠ 본화면 574</strong>. 원 프로젝트가 어느 숫자로 공수를 산정했는지는 봉인 대상(수행계획서)이라 미확인</li></ul>", "inbox": {"required": ["현행 시스템 접근권/캡처 이미지(사람이 수집)", "자료수집요청서/수집자료(112)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/100_Orientate/120_기초분석/122_현시스템기초분석", "body_html": "<h1>122 현시스템기초분석 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_as-is-analysis</code> v0.1.0-<strong>c2202500.1</strong> → 로컬 포크 <code>.claude/skills/vinylc_as-is-analysis/SKILL.md</code></p><h2>스킬 고도화 (이번 작업에서 수행)</h2><p>원 스킬 <code>v0.1.0-draft</code>의 <strong>미완성 항목 2건이 이 작업을 직접 막았다.</strong> 로컬 포크를 고도화해 적용했다.</p><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>원자료 등급 판정 A~D 신설</strong></td><td>원 스킬은 &quot;캡처 없으면 사용자에게 요청&quot;만 규정 → 캡처 0장·화면명세서만 있는 이 프로젝트에서 <strong>122 전체가 중단</strong>된다</td></tr><tr><td>2</td><td><strong>규모 기준선 3중 산정 의무화</strong></td><td>원 스킬에 &quot;몇 개인가&quot;의 정의가 없어 초판이 1,344 단일 숫자를 냈고, <strong>실제 디자인·퍼블리싱 대상은 574</strong>(2.34배 차이). 그 틀린 숫자가 이미 132에 인용돼 있었다</td></tr><tr><td>3</td><td><strong>휴리스틱 세트 고정</strong> (Nielsen 10 + KWCAG 4, S/V 판정유형)</td><td>미완성 항목이던 세트가 없으면 등급 C에서 시각 항목을 <strong>추정으로 채우게 된다</strong> — 원 스킬의 &quot;하드코딩 금지&quot; 경고와 정면 충돌</td></tr></tbody></table></div><p><strong>전사 환류 판단</strong>: 3건 모두 전사 유효 (레지스트리 반영 승인 대기)</p><h2>투입 인풋</h2><ul><li>I5 ASIS 화면명세서 (구조 컬럼만 — 정보구조 1~10Depth · 화면ID · 관리주체)</li><li>캡처 이미지 <strong>0장</strong> → <strong>원자료 등급 C</strong></li></ul><h2>산출물</h2><ul><li><code>AS-IS_화면덤프_UserFlow.md</code></li></ul><h2>AS-IS 대조</h2><ul><li>상태: <strong>대조불가</strong></li><li>원본: HDDS_ASIS 화면명세서_V1.5_230223_최종.xlsm</li><li>입력과 정답지가 동일 파일이라 재현율 측정이 성립하지 않는다. 원본에는 User Flow도 휴리스틱 평가도 없어, 그 부분은 <strong>원본 초과 생성분</strong>이다.</li></ul><h2>이후 어디에 쓰이나</h2><ul><li><strong>132 수행계획 — 규모 기준선 재산정 필요</strong> (1,344 → 574 본화면 기준)</li><li>215 요구사항정의 — 채널 동등성 결손 9건 · 오류화면 부재</li><li>322 정보구조설계 — 진입 모델 통일 여부가 최대 분기점</li><li>341 화면명세서 — 커버리지 기준 1,003(고유 화면)</li><li>411 작업계획 — 본화면 574 / 종속화면 429 분리 단가</li></ul><h2>도출된 인사이트</h2><p><strong>규모 기준선이 하나가 아니다.</strong> 명세 행 1,344 / 고유 화면 1,003 / 본화면 574 — <strong>최대 2.34배 차이</strong>가 나고, 하류가 어느 것을 인용하느냐로 공수가 갈린다. 차이의 원인은 ①검색결과 같은 화면이 최대 21개 진입경로에서 재사용(341행) ②레이어·탭 등 종속화면이 43%.</p><p><strong>채널 동등성이 양방향으로 깨져 있다.</strong> 모바일에서는 비밀번호를 바꿀 수 없고, PC에서는 차량번호를 등록할 수 없다. 특히 <strong>H.Point 통합회원 전환이 PC에서만 가능</strong>해 212 정책요건의 G2(개인정보 동의 재획득)와 직결된다.</p><p><strong>오류·404 화면이 명세에 0건이다.</strong> 1,003화면 규모에서 예외 상황의 화면 정의가 통째로 없다 — 명세 누락인지 실제 able><thead><tr><th>항목</th><th>질의</th><th>도출 요구 태그</th></tr></thead><tbody><tr><td>공식 홈페이지 PC·Mobile Web 전체 페이지 UX/UI 개선</td><td>#6·#9</td><td><code>기능</code> <code>Must</code></td></tr><tr><td>&#x27;투자정보&#x27;·&#x27;ESG 경영&#x27; 포함</td><td>#9</td><td><code>기능</code> <code>Must</code></td></tr><tr><td>국문만 (영·중·일문 제외)</td><td>#10</td><td><code>범위</code> <code>Must</code></td></tr><tr><td>App 개선 4건: 메인/메뉴 UX·UI, h.point 바코드, TCP라운지 출입, 개인별 메뉴 커스터마이징</td><td>#11</td><td><code>기능</code> <code>Should</code> — <strong>별도 요건 그룹</strong></td></tr><tr><td>Admin: 신규/변경 발생 시 기획·퍼블리싱만 (디자인 제외)</td><td>#13·#19</td><td><code>프로세스</code> <code>Must</code></td></tr></tbody></table></div><h3>제외</h3><div class='tw'><table><thead><tr><th>항목</th><th>질의</th><th>도출 요구 태그</th></tr></thead><tbody><tr><td>더현대닷컴·현대백화점그룹·그룹사회복지재단 등 타 ehyundai 사이트</td><td>#6</td><td><code>범위</code></td></tr><tr><td>솔루션 기반 페이지(채팅·ebook·<strong>층별안내</strong> 레이어)</td><td>#7</td><td><code>범위</code> ⚠️ <strong>122 실측: 층별안내 8화면 실재</strong></td></tr><tr><td>IR 미팅 예약·기관투자자 가입</td><td>#8</td><td><code>범위</code> ⚠️ <strong>122 실측: MWEB에 실재</strong></td></tr><tr><td>현대백화점 회원 관련 메뉴 (23.1.1 H.Point 통합 예정) — 로그인 진입 동선은 별도 확인</td><td>#14</td><td><code>범위</code> ⚠️ <strong>경계 미정 · 68화면 영향</strong></td></tr><tr><td><strong>접근성 심사/인증 주관 — &quot;준수하는 수준&quot;으로만 진행</strong></td><td>#15</td><td><code>비기능</code> ⚠️ <strong>&quot;준수 수준&quot; 정의 없음</strong></td></tr><tr><td>오픈콘텐츠 제작 (필요 시 가이드성 GUI만 협의)</td><td>#12</td><td><code>범위</code></td></tr><tr><td>콘텐츠 마이그레이션 (점포안내·이벤트·강좌찾기 등) — CMS 개선 없음</td><td>#23</td><td><code>범위</code></td></tr></tbody></table></div><blockquote>⚠️ 표시 4건은 <strong>126 상충 검출 축③</strong>에서 문제로 확정됐다 — 제외 선언과 현행 명세가 어긋나거나 경계가 정의되지 않았다.</blockquote><hr><h2>3. 작업 환경·기준 (상태 = 확정)</h2><div class='tw'><table><thead><tr><th>항목</th><th>회신 내용</th><th>질의</th><th>태그</th></tr></thead><tbody><tr><td>툴</td><td>화면설계서=PPT, 디자인=Figma (진행 중 작업물은 운영사 비공개, 딜리버리 시 권한 협의)</td><td>#1</td><td><code>제약</code></td></tr><tr><td>폰트</td> <tr><td>1 프로젝트 목표·성공기준</td><td>❌ <strong>섹션 없음</strong></td><td>O-1~O-4 + 성공기준 작성 불가 사유</td></tr><tr><td>2 시스템범위</td><td>◐ 채널 나열만</td><td>규모 지표·연동 대상</td></tr><tr><td>3 업무범위</td><td>✅</td><td>+ <strong>규모 지표 6항목</strong></td></tr><tr><td>4 제외 + 규모</td><td>◐ 문장만</td><td>+ <strong>실제 덜어내는 규모 8항목</strong></td></tr><tr><td>5 제약·가정</td><td>✅</td><td>+ 근거 인용</td></tr><tr><td>6 인수기준</td><td>❌ <strong>섹션 없음</strong></td><td>A-1~A-5 + 정량 불가 사유</td></tr><tr><td>7 근거 추적 매핑</td><td>❌ <strong>섹션 없음</strong></td><td>섹션×근거 매핑</td></tr><tr><td>선행 결손 명세</td><td>❌ 헤더 한 줄</td><td>표 + 약화 섹션 지정</td></tr><tr><td><strong>상충 검출</strong></td><td>❌ <strong>0건</strong></td><td><strong>6건</strong></td></tr><tr><td>PM 확정 게이트</td><td>❌ 표기 없음</td><td><code>draft</code> 명시</td></tr></tbody></table></div><p><strong>7개 규정 섹션 중 3개가 통째로 빠져 있었다.</strong> 그리고 상충 6건 중 3건(C-1·C-3·C-4)은 <strong>122 실측과 대조해야만 나오는 것</strong>이라, 초판이 122를 인용하지 않은 것이 직접 원인이다.</p><hr>", "skill_info": [{"name": "vinylc_scope-definition", "version": "0.1.0-c2202500.1", "local": false}], "docs": [{"name": "범위정의서.md", "path": "sim-project/100_Orientate/120_기초분석/126_기초분석종합/범위정의서.md", "html": "<h1>범위정의서 — 현대백화점 자사채널(홈페이지) 개선 [AI 생성]</h1><blockquote><strong>상태: <code>draft</code> — PM 확정 전.</strong> 확정일·확정자 미기입 (표준 규칙 4: 자동 확정 금지)</blockquote><hr><h2>0. 선행 결손 명세</h2><div class='tw'><table><thead><tr><th>선행 산출물</th><th>확보</th><th>결손 시 약해지는 섹션</th></tr></thead><tbody><tr><td>121 환경분석보고서 · 뉴스클리핑</td><td>✅</td><td>—</td></tr><tr><td>122 AS-IS 화면덤프 · User Flow</td><td>✅ (등급 C)</td><td>—</td></tr><tr><td><strong>123 VOC 분석서</strong></td><td>❌ <strong>미수행</strong></td><td><strong>1 목표</strong>(사용자측 근거) · <strong>6 인수기준</strong></td></tr><tr><td>124 고객요구 인터뷰결과서</td><td>✅</td><td>—</td></tr><tr><td><strong>125 경영진 인터뷰결과서</strong></td><td>❌ <strong>미수행</strong></td><td><strong>1 목표·성공기준</strong> · 5 제약</td></tr><tr><td><code>.ax-project.yaml</code></td><td>✅</td><td>—</td></tr></tbody></table></div><p><strong>결손의 실제 영향</strong>: 이 프로젝트의 고객 접촉은 <strong>서면 기초질의 왕복</strong>(7/20 → 8/1·9/14 → 9/20 미팅) 형태였고, 경영진 대상 별도 인터뷰 기록은 확보하지 못했다. 따라서 <strong>§1 목표는 제안서(I1)에서 역산한 것</strong>이며 고객이 확인한 목표 진술이 아니다 → 전 항목 <code>[가정]</code>. 성공기준의 정량 목표치는 VOC·경영진 근거가 둘 다 없어 <strong>작성 불가</strong>.</p><blockquote>섹션은 삭제하지 않고 남긴다. 무엇이 비었는지가 132·215에 전달돼야 한다.</blockquote><hr><h2>1. 프로젝트 목표 <code>[가정 — 125·123 결손]</code></h2><div class='tw'><table><thead><tr><th>#</th><th>목표</th><th>근거</th><th>확실도</th></tr></thead><tbody><tr><td>O-1</td><td>현대백화점 공식 홈페이지 PC·MWEB <strong>전 페이지의 UX/UI를 개선</strong>해 브랜드 격에 맞는 경험을 확보한다</td><td>I1 제안서 · 124 #6·#9</td><td>높음(계약 문언)</td></tr><tr><td>O-2</td><td><strong>분산된 자사 채널의 허브</strong> 역할을 강화한다 — 지점·브랜드·문화센터·기업정보가 한 채널에 공존하는 구조를 정리</td><td>121 §3 약점 · 122 §2 영역 분포</td><td>중 <code>[가정]</code></td></tr><tr><td>O-3</td><td><strong>경험형 콘텐츠 흐름</strong>을 채널에 안착시킨다 (Sounds Forest·ALT.1 등 오프라인 자산의 온라인 내재화)</td><td>121 S6</td><td>중 <code>[가정]</code></td></tr><tr><td>O-4</td><td><strong>회원 체계 전환기</strong>(23.1.1 H.Point 통합)에 대응 가능한 구조로 남긴다</td><td>121 S4 · 124 #14</td><td>중 <code>[가정]</code></td></tr></tbody></table></div><h3>성공기준 — <strong>작성 불가</strong></h3><p>정량 목표치(이탈률·전환·만족도 등)를 세울 근거가 없다.</p><div class='tw'><table><thead><tr><th>필요한 것</th><th>상태</th></tr></thead><tbody><tr><td>경영진이 말한 성공의 정의</td><td>❌ 125 미수행</td></tr><tr><td>사용자 불만의 정량 분포</td><td>❌ 123 미수행</td></tr><tr><td>현행 이용 지표(GA 등)</td><td>❌ <strong>214 로그 미확보</strong> — 요구 78건 전부가 진술·정책·구조 기반</td></tr></tbody></table></div><p>→ <code>[확인필요 1]</code> 성공기준은 PM이 고객과 별도 합의해야 한다. <strong>인수기준(§6)이 정성 항목만으로 구성된 근본 원인.</strong></p><hr><h2>2. 시스템범위</h2><div class='tw'><table><thead><tr><th>구분</th><th>대상</th><th>규모 (출처)</th></tr></thead><tbody><tr><td><strong>주 대상</strong></td><td>현대백화점 공식 홈페이지 PC</td><td>고유 618 / 본화면 350 (122)</td></tr><tr><td><strong>주 대상</strong></td><td>현대백화점 공식 홈페이지 Mobile Web</td><td>고유 385 / 본화면 224 (122)</td></tr><tr><td><strong>부 대상</strong></td><td>Admin (기획·퍼블리싱 한정, 디자인 제외)</td><td>Admin 연동 고유 <strong>122</strong>화면 (122)</td></tr><tr><td><strong>부 대상</strong></td><td>CMS 연동 화면</td><td>고유 <strong>17</strong>화면 (122)</td></tr><tr><td><strong>부 대상</strong></td><td>App 특화 4건</td><td><code>[규모미상]</code> — 앱 화면 명세 미확보</td></tr><tr><td>경계 밖</td><td>타 ehyundai 도메인 · 솔루션 페이지 · 다국어</td><td>§4 참조</td></tr></tbody></table></div><p><strong>연동 대상</strong>: H.Point(멤버십·바코드) · 현대백화점카드 · 문화센터 수강/결제 · 그룹 WSG. 각 연동의 기술 스펙은 213 시스템요건 소관.</p><hr><h2>3. 업무범위 (In Scope) — 규모 지표 포함</h2><div class='tw'><table><thead><tr><th>#</th><th>업무</th><th>규모 지표</th><th>출처</th><th>추정가능</th></tr></thead><tbody><tr><td>S-1</td><td>PC·MWEB 국문 전 영역 UX·UI 개선 (요건분석→UX설계→디자인→퍼블리싱)</td><td><strong>본화면 574</strong> / 고유 1,003 / 명세 행 1,344</td><td>122 §1</td><td>✅</td></tr><tr><td>S-2</td><td>투자정보·ESG경영 영역 포함</td><td>고유 <strong>76</strong> (PIV 20·PES 17·MIV 22·MES 17)</td><td>122 §2</td><td>✅</td></tr><tr><td>S-3</td><td>App 특화 4건 (메인·메뉴 UX/UI, h.point 바코드, TCP라운지 출입, 개인별 메뉴 커스터마이징)</td><td><strong><code>[규모미상]</code></strong></td><td>—</td><td>❌</td></tr><tr><td>S-4</td><td>UX 개선에 따른 Admin 수정 — 기획·퍼블리싱만</td><td>고유 <strong>122</strong></td><td>122 §2</td><td>✅</td></tr><tr><td>S-5</td><td>웹접근성 지침 <strong>준수 수준</strong> 반영 (인증 심사 대응 아님)</td><td><strong><code>[규모미상]</code></strong></td><td>—</td><td>❌</td></tr><tr><td>S-6</td><td>구현가이드 산출 (설계가이드·스타일가이드·GUI가이드(Zeplin)·UI테스트케이스)</td><td>문서 <strong>4종+</strong></td><td>I1</td><td>◐</td></tr></tbody></table></div><h3><code>[규모미상]</code> 해소에 필요한 것</h3><div class='tw'><table><thead><tr><th>항목</th><th>받아야 할 것</th><th>확인 주체</th></tr></thead><tbody><tr><td>S-3 App 특화 4건</td><td>앱 현행 화면 목록 또는 4건 각각의 영향 화면 수</td><td>고객사 App 담당(김수현 선임)</td></tr><tr><td>S-5 접근성 준수 수준</td><td><strong>&quot;준수 수준&quot;의 정의</strong> — 어느 지침의 몇 개 항목을 어느 화면 범위에 적용하는가</td><td>PM ↔ 고객사</td></tr></tbody></table></div><blockquote>이 둘은 <strong>빈칸이 아니라 <code>[규모미상]</code>으로 132에 넘긴다.</strong> 빈칸이면 132가 0으로 취급한다.</blockquote><h3>담당 범위 (<code>.ax-project.yaml</code> scope)</h3><p>기획 · 디자인 · 프론트엔드(퍼블리싱) — <strong>백엔드·앱 네이티브 개발은 담당 밖</strong>. 213 시스템요건이 「부분」 운용된 근거.</p><hr><h2>4. 제외 범위 (Out of Scope) — 규모 지표 포함</h2><div class='tw'><table><thead><tr><th>#</th><th>제외</th><th>근거</th><th><strong>실제 덜어내는 규모</strong></th><th>판정</th></tr></thead><tbody><tr><td>X-1</td><td>타 ehyundai 도메인(더현대닷컴·그룹·재단)</td><td>124 #6</td><td>자사 명세엔 링크 레이어 2건뿐 (<code>더현대닷컴L</code>)</td><td>실질 0</td></tr><tr><td>X-2</td><td>솔루션 기반 페이지(채팅·ebook·<strong>층별안내</strong>)</td><td>124 #7</td><td><strong>⚠️ 층별안내가 현행 명세에 8건 실재</strong> (PC 3 / MWEB 5)</td><td><strong>상충 → §5 C-3</strong></td></tr><tr><td>X-3</td><td>IR 미팅 예약·기관투자자 가입</td><td>124 #8</td><td><strong>⚠️ <code>IR미팅예약(T1)</code>이 MWEB 명세에 실재</strong></td><td><strong>상충 → §5 C-3</strong></td></tr><tr><td>X-4</td><td>현대백화점 회원 관련 메뉴</td><td>124 #14</td><td><strong>⚠️ 로그인+마이페이지 고유 68화면</strong> (PLO 26·PMY 19·MLO 10·MMY 13) — 경계 미정</td><td><strong>상충 → §5 C-1</strong></td></tr><tr><td>X-5</td><td>영·중·일문</td><td>124 #10</td><td><strong>현행에 0건</strong></td><td><strong>실질 0 — 신규 제작 제외를 뜻함</strong></td></tr><tr><td>X-6</td><td>접근성 심사·인증 주관</td><td>124 #15</td><td>심사 대응 공수만 제외, 설계·구현 반영은 S-5로 포함</td><td>명확</td></tr><tr><td>X-7</td><td>오픈콘텐츠 제작 · 콘텐츠 마이그레이션</td><td>124 #12·#23</td><td>CMS 연동 고유 <strong>17</strong>화면의 콘텐츠는 현행 유지</td><td><strong>상충 → §5 C-4</strong></td></tr><tr><td>X-8</td><td>서버·앱 네이티브 개발 구현</td><td>시뮬레이션 규약</td><td>원 계약은 웹개발 포함 — <strong>본 시뮬레이션 한정 제외</strong></td><td>규약</td></tr></tbody></table></div><blockquote><strong>X-5는 제외 선언이 실질 공수를 0 덜어낸다.</strong> 제외 목록을 건수로 세면 8건이지만, 실제 범위를 좁히는 것은 X-6·X-8뿐이고 X-2·X-3·X-4·X-7은 <strong>경계가 확정되지 않아 오히려 리스크 항목</strong>이다.</blockquote><hr><h2>5. 상충 — PM 판단 필요 (봉합하지 않음)</h2><p>표준 §「상충 검출 3축」 적용 결과 <strong>6건</strong>.</p><div class='tw'><table><thead><tr><th>#</th><th>축</th><th>상충</th><th>A쪽</th><th>B쪽</th><th>영향</th></tr></thead><tbody><tr><td><strong>C-1</strong></td><td>③</td><td><strong>회원 메뉴 제외의 경계가 화면 단위로 미정</strong></td><td>124 #14 &quot;현대백화점 회원 관련 메뉴 제외(H.Point 전환 예정)&quot;</td><td>122 실측: 로그인·마이페이지 <strong>고유 68화면</strong>. 게다가 <strong>H.Point 전환 화면이 PC에만 존재</strong>(MWEB 결손)</td><td>최대 68화면(고유의 6.8%)이 범위 안팎으로 흔들림. <strong>최대 리스크</strong></td></tr><tr><td><strong>C-2</strong></td><td>②</td><td><strong>기술 하한선이 채널마다 어긋남</strong></td><td>121 S1: 계약 기준에 <strong>IE10</strong></td><td>124 #2: 모바일은 <strong>갤S22·아이폰13</strong> 기준</td><td>데스크톱은 2012년 브라우저, 모바일은 최신 2세대. 하나의 퍼블리싱 기준을 못 세움</td></tr><tr><td><strong>C-3</strong></td><td>③</td><td><strong>제외 선언한 화면이 현행 명세에 실재</strong></td><td>124 #7 층별안내 제외 / #8 IR 예약 제외</td><td>122 실측: 층별안내 8건 · <code>IR미팅예약(T1)</code> 1건</td><td>개선 대상인지 존치인지 미정. IA 재편 시 충돌</td></tr><tr><td><strong>C-4</strong></td><td>③</td><td><strong>전 페이지 개선 vs 콘텐츠 마이그레이션 제외</strong></td><td>S-1 전 영역 UX/UI 개선</td><td>X-7 콘텐츠 마이그레이션·CMS 개선 없음</td><td>CMS 연동 17화면은 <strong>껍데기만 바뀌고 내용은 현행</strong>. IA 재편 시 정합 문제</td></tr><tr><td><strong>C-5</strong></td><td>①</td><td><strong>타겟 인식 불일치</strong></td><td>업계 담론 MZ(2030)</td><td>124 #22 실측 <strong>30~40대 70% · 여성 69.2%</strong></td><td>242 UX컨셉·334 시안의 근거 선택. 121 S2에서 이미 경고</td></tr><tr><td><strong>C-6</strong></td><td>①</td><td><strong>목표는 채널 통일을 지향하나 현행은 채널이 갈라져 있다</strong></td><td>O-1·O-2</td><td>122 H4·A3: 진입 모델 상이 · 채널 동등성 결손 <strong>9건</strong>(비밀번호 변경이 모바일에 없음 등)</td><td>통일 범위를 어디까지로 할지가 322 IA 최대 분기점</td></tr></tbody></table></div><blockquote>6건 모두 <strong>임의 봉합 금지</strong>. C-1·C-3은 <strong>범위 확정 전 고객 합의가 필요한 항목</strong>이다.</blockquote><hr><h2>6. 인수기준 (초안) — 정성 항목만</h2><p>성공기준(§1)이 부재하므로 <strong>정량 인수기준을 세울 수 없다.</strong> 현재 세울 수 있는 것은 산출물 기반 정성 기준뿐이다.</p><div class='tw'><table><thead><tr><th>#</th><th>인수기준</th><th>검증 방법</th><th>유형</th></tr></thead><tbody><tr><td>A-1</td><td>In-Scope 화면(<strong>본화면 574</strong> 기준)의 UI 디자인·퍼블리싱 산출물이 화면명세서 커버리지 100%</td><td>341 화면명세서 ↔ 411 작업관리서 대조</td><td>정성(커버리지)</td></tr><tr><td>A-2</td><td>Admin 고유 122화면의 기획·퍼블리싱 산출물 완비 (디자인 산출물 없음이 정상)</td><td>산출물 체인 점검</td><td>정성</td></tr><tr><td>A-3</td><td>스타일가이드가 그룹 WSG를 상속하고 해피니스 산스를 적용</td><td>351 스타일가이드 검토</td><td>정성</td></tr><tr><td>A-4</td><td>접근성 <strong>준수 수준</strong> 충족 — <code>[확인필요]</code> 기준 미정으로 검증 불가</td><td>—</td><td><strong>미정</strong></td></tr><tr><td>A-5</td><td>퍼블리싱 결과가 타겟 디바이스에서 정상 동작 — <code>[확인필요]</code> C-2로 기준 미정</td><td>—</td><td><strong>미정</strong></td></tr><tr><td>—</td><td><strong>정량 인수기준 (이탈률·전환·만족도 등)</strong></td><td>—</td><td><strong>작성 불가</strong></td></tr></tbody></table></div><p>→ <code>[확인필요 2]</code> A-4·A-5는 기준이 정해져야 인수 판정이 가능하다. 이대로 계약에 들어가면 <strong>인수 시점에 분쟁 소지</strong>.</p><hr><h2>7. 전제·제약</h2><div class='tw'><table><thead><tr><th>구분</th><th>내용</th><th>근거</th></tr></thead><tbody><tr><td>일정</td><td>2022-09-19 ~ 2023-04-18 (7개월) · <strong>23.1Q 오픈 목표</strong></td><td>121 §5-3</td></tr><tr><td>기술</td><td>IE10+ · 해피니스 산스 필수(대체 불가) · 그룹 WSG 준수 · JSP 기반 레거시</td><td>121 §5-3 · 124 #20·#5</td></tr><tr><td>툴</td><td>화면설계서=PPT / 디자인=Figma (딜리버리 권한 별도 협의)</td><td>124 #1</td></tr><tr><td>디바이스</td><td>갤S22·아이폰13 기준 — 고객 제시 하한(갤S8·아이폰4s)은 재협의 중</td><td>124 #2 <code>[확인필요]</code></td></tr><tr><td>사용자</td><td>30대 36.5% + 40대 33% = <strong>약 70%</strong>, 여성 <strong>69.2%</strong> (고객 실측)</td><td>124 #22</td></tr><tr><td>조직</td><td>총괄 PM 김희진 책임 / PC·MW 김희진 책임 / App 김수현 선임 · 정기 보고 일정 없음</td><td>124 #4·#3</td></tr><tr><td>운영</td><td>진행 중 산출물의 운영사(펜타브리드) <strong>비공개 원칙</strong></td><td>124</td></tr><tr><td>자원</td><td><code>[확인필요]</code> 인력·M/M은 영업·원가 산정 소관</td><td>121 §5-3</td></tr><tr><td>회원</td><td><strong>23.1.1 H.Point 통합회원 전환</strong> — 오픈 시점과 근접</td><td>121 S4 · 124 #14</td></tr></tbody></table></div><hr><h2>8. 업무방식</h2><p>114 프로젝트표준프로세스(PDP)를 인용한다 — <strong>여기서 다시 정의하지 않는다</strong>(표준 경계 규칙).</p><ul><li>방법론: 자사 표준프로세스 <strong>OSSP 4.1</strong> 테일러링 (개편 유형)</li><li>단계: 요건분석 → 전략+와이어프레임 → 디자인전략(시안) → 공통 UX설계(App/MW) → 공통 UI디자인 → PC UX설계 → PC UI디자인 → 퍼블리싱 → (개발·테스트·오픈: 본 시뮬레이션 범위 외)</li><li>협업: 서면 기초질의 왕복 + 워크샵(1차 9/23 · 2차 9/29) · 정기 보고 일정 없음(현업 자율 공유)</li><li>산출물 서식: 114 프로젝트표준서식</li></ul><hr><h2>9. 근거 추적</h2><div class='tw'><table><thead><tr><th>섹션</th><th>근거 산출물</th><th> trong>: <code>vinylc_research-plan</code> (미실행)</p><h2>판정 이력</h2><div class='tw'><table><thead><tr><th>시점</th><th>분류</th><th>사유</th></tr></thead><tbody><tr><td>114 PDP 작성 시</td><td><strong>제외</strong></td><td><code>◐ 선택 → 제외 · 리서치 미계약(230 전체 제외와 연동) · §3 연쇄 C-3</code></td></tr><tr><td>§4-B 1차 개정</td><td>~~A 시뮬레이션 수행~~</td><td>⚠️ <strong>PDP와 어긋남</strong> — &quot;계획 문서 저작이므로 AI 수행 가능&quot;만 보고 판정</td></tr><tr><td><strong>2026-08-07 재판정</strong></td><td><strong>D 제외</strong></td><td>아래 3중 근거</td></tr></tbody></table></div><h2>제외 근거 3중</h2><ol><li><strong>114 PDP가 이미 제외했다.</strong> 리서치(230 사용자심층리서치 전체)가 미계약이므로 그 계획을 세울 대상이 없다. §3 제외 연쇄 C-3에 기록돼 있다.</li><li><strong>원본에 산출물이 없다.</strong> 필수산출물목록 21종 · <code>12.UX_분석／기초설계</code> 14폴더 · <code>98.산출물</code> 전수 확인. 기능은 <strong>132 수행계획서 + WBS(V1.0_230414)</strong> 에 흡수됐다.</li><li><strong>성립 근거가 하류다.</strong> 지금 이 문서를 쓰려면 우리가 만든 126 범위정의서·132 수행계획서가 있어야 한다. <strong>원본에 없던 과정을 소급 삽입</strong>하게 된다.</li></ol><h2>§4-B 조건 ③의 첫 적용 사례</h2><p>이 재판정으로 §4-B의 A 판정 조건에 <strong>③ 원본 프로젝트에서도 실제로 수행됐는가</strong> 를 추가했다.</p><blockquote>①②(AI 수행 가능 + 인풋 확보)만으로는 <strong>&quot;초기 동결 인풋에 원자료가 있는 경우&quot;(112)</strong> 와 <strong>&quot;우리 하류 산출물이 있어야 쓸 수 있는 경우&quot;(131)</strong> 가 구분되지 않는다.</blockquote><p><strong>C(원자료 부재)와 다르다.</strong> C는 자료를 받으면 A로 전환되지만, <strong>131은 자료를 받아도 원본에 없던 과정</strong>이라 전환되지 않는다.</p>"}, {"task_id": "132", "task_name": "수행계획수립", "skill": "vinylc_execution-plan", "skill_version": "0.1.0-c2202500.1", "skill_upgraded": "true", "state": "done", "verdict": "draft (사전노출·할인평가) · 재실행 완료", "skill_loaded": "full", "next_use": ["411 작업계획수립 — 규모 배분표", "921 진척관리", "941 주간보고 — 목표선 근거", "134 계약체결 — 검수조건 별첨"], "has_insight": "true", "todo": "9", "inputs": ["I1 제안서", "I3 기초질의서", "126 범위정의서(v2)", "114 PDP", "122 AS-IS 화면덤프(v2)", "121 환경분석보고서"], "outputs": ["프로젝트수행계획서.md"], "asis_state": "사전노출", "asis_file": "01_현대백화점_웹UXUI개편_수행계획서.doc", "asis_note": "계약범위 실측 단계에서 이미 열람 — 대조표에서 할인 평가. 원본 실측 95.25 M/M·20명(시뮬레이션 산출물에는 미기입).", "meta_html": ><th>확보</th><th>결손 영향</th></tr></thead><tbody><tr><td>126 범위정의서</td><td>✅ (v2, draft)</td><td>—</td></tr><tr><td>114 프로젝트표준프로세스(PDP)</td><td>✅</td><td>—</td></tr><tr><td>122 AS-IS 화면덤프</td><td>✅ (v2)</td><td>—</td></tr><tr><td><strong>131 리서치계획서</strong></td><td>❌ <strong>미수행</strong></td><td><strong>§2 일정에 리서치 구간을 배치할 근거 없음</strong></td></tr><tr><td>115 프로젝트가이드</td><td>❌ 미수행</td><td>§5 커뮤니케이션을 124 회신에서 직접 구성</td></tr><tr><td>111 TFT 구성 결과</td><td>❌ 미확보</td><td><strong>§3 투입 인원수 산정 불가</strong></td></tr></tbody></table></div><hr><h2>1. 범위 — 126 인용 (재정의하지 않음)</h2><div class='tw'><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td>프로젝트명</td><td>현대백화점 자사채널(홈페이지) 개선 프로젝트</td></tr><tr><td>유형</td><td>개편 (전체 페이지 UX/UI 개선)</td></tr><tr><td>대상</td><td>공식 홈페이지 PC · Mobile Web (국문) + App 특화 4건 + Admin(기획·퍼블리싱)</td></tr><tr><td>목표 오픈</td><td><strong>2023년 1분기</strong></td></tr><tr><td>방법론</td><td>자사 표준프로세스 <strong>OSSP 4.1</strong> 테일러링 (114 PDP)</td></tr><tr><td>담당 범위</td><td>기획 · 디자인 · 퍼블리싱 <em>(개발 구현은 본 시뮬레이션 범위 외)</em></td></tr></tbody></table></div><p><strong>In Scope 6건 / Out of Scope 8건</strong> — 상세는 126 §3·§4. <strong>제외 8건 중 실질 범위를 좁히는 것은 2건뿐</strong>이며 4건은 경계 미정 리스크다(§7 R-1).</p><hr><h2>2. 규모 기준선 — 작업 종류별로 다르게 쓴다</h2><p><strong>초판의 오류</strong>: 1,344를 단일 화면 수로 인용했다. 1,344는 <strong>명세 행 수</strong>이지 디자인·퍼블리싱 대상이 아니다.</p><div class='tw'><table><thead><tr><th>기준선</th><th>AS-IS 현행</th><th><strong>In-Scope (재산정 V2)</strong></th><th>이 계획서에서 쓰는 곳</th></tr></thead><tbody><tr><td>명세 행 수</td><td>1,344</td><td>—</td><td>기획 명세·검수 항목 수</td></tr><tr><td>고유 화면 수</td><td>1,003</td><td><strong>965</strong></td><td>설계(IA·화면명세·상세설계) 대상</td></tr><tr><td><strong>본화면 수</strong></td><td><strong>574</strong></td><td><strong>548</strong></td><td><strong>디자인·퍼블리싱 공수</strong></td></tr><tr><td>(종속 화면)</td><td>429</td><td>417</td><td>레이어·탭·팝업 — <strong>별도 단가 적용 필요</strong></td></tr><tr><td><strong>신규 (예외 화면군)</strong></td><td>—</td><td><strong><code>[규모미상]</code></strong></td><td>K4 — 404·세션만료·결제실패 등</td></tr></tbody></table></div><blockquote><strong>디자인·퍼블리싱 공수를 1,344로 잡으면 2.45배 과대 산정된다.</strong><br><strong>V1까지는 AS-IS 현행 수치를 그대로 In-Scope로 썼다.</strong> 126이 회원 68화면을 제외로 선언해놓고도 132가 규모에서 빼지 않았기 때문이다(제외 선언과 규모 차감의 불일치). 240 결정으로 경계가 확정돼 <strong>처음으로 실제 In-Scope 규모가 확정</strong>됐다.</blockquote><h3>2-B. 재산정 내역 (240 결정 반영)</h3><div class='tw'><table><thead><tr><th>#</th><th>결정</th><th>규모 영향</th><th>방향</th></tr></thead><tbody><tr><td><strong>R1</strong></td><td>회원 메뉴 경계 확정 — <strong>A 법정고지 17 + B 인증진입 21 = 38화면 제외</strong></td><td>고유 <strong>−38</strong> · 본화면 <strong>−26</strong> · 종속 <strong>−12</strong></td><td><strong>감소</strong></td></tr><tr><td><strong>R2</strong></td><td>VIP프로그램 PC 등급 상향 <code>스킨변경 → 개선</code></td><td>화면 수 불변 (PC 고유 11 · 본화면 7). <strong>공수 계수 상승</strong> — 디자인만 → 기획·디자인·퍼블·개발 전 공정</td><td><strong>증가</strong></td></tr><tr><td><strong>R3</strong></td><td>K4 예외 화면군 신규</td><td><strong><code>[규모미상]</code></strong> — 404·권한없음·세션만료·결제실패·정원초과·자격미달</td><td><strong>증가(미상)</strong></td></tr></tbody></table></div><blockquote>⚠️ <strong>R1은 공수 증가가 아니라 감소다.</strong> 243 V0.3 §8-3에서 &quot;공수 증가 3항목&quot;으로 적었으나, 실측하니 <strong>R1은 26 본화면 감소</strong>다. 회원 68화면이 이미 574 기준선에 포함돼 있었기 때문이다. <strong>정정한다.</strong></blockquote><p><strong>순효과</strong>: 본화면 <strong>574 → 548 (−4.5%)</strong> + VIP PC 7화면의 등급 상향 + 예외 화면군 <code>[규모미상]</code></p><h3>2-C. 아직 규모에서 빼지 않은 제외 항목 (경계 미정)</h3><p>126 §4의 제외 선언 중 <strong>경계가 확정되지 않아 여전히 기준선에 포함된 것</strong>이 남아 있다.</p><div class='tw'><table><thead><tr><th>항목</th><th>126 판정</th><th>현재 상태</th></tr></thead><tbody><tr><td>층별안내 (X-2)</td><td>제외 선언, 그러나 현행 명세에 <strong>8화면 실재</strong></td><td><strong>미차감</strong> — 존치/개선 여부 미정</td></tr><tr><td>IR 미팅예약 (X-3)</td><td>제외 선언, MWEB에 <strong>1화면 실재</strong></td><td><strong>미차감</strong></td></tr><tr><td>콘텐츠 마이그레이션 (X-7)</td><td>CMS 개선 없음</td><td>CMS 연동 고유 17화면의 <strong>콘텐츠</strong>만 제외, 화면은 대상</td></tr></tbody></table></div><p>→ 확정되면 최대 <strong>고유 −9</strong>가 추가로 빠진다.</p><h3>규모 배분표 (<strong>In-Scope 본화면 548 기준</strong> · PC+MWEB 합산)</h3><p>비중은 사실이다. <strong>총 M/M이 정해지면 배분은 이 비중을 따른다.</strong></p><div class='tw'><table><thead><tr><th>영역</th><th>본화면</th><th>종속</th><th>고유 계</th><th><strong>본화면 비중</strong></th></tr></thead><tbody><tr><td>카드/상품권/멤버십</td><td>171</td><td>172</td><td>343</td><td><strong>31.2%</strong></td></tr><tr><td>지점안내</td><td>132</td><td>60</td><td>192</td><td><strong>24.1%</strong></td></tr><tr><td>서비스/콘텐츠</td><td>67</td><td>46</td><td>113</td><td>12.2%</td></tr><tr><td>문화센터/공연/전시</td><td>64</td><td>71</td><td>135</td><td>11.7%</td></tr><tr><td>브랜드</td><td>31</td><td>10</td><td>41</td><td>5.7%</td></tr><tr><td>ESG경영</td><td>24</td><td>10</td><td>34</td><td>4.4%</td></tr><tr><td><strong>회원</strong>(로그인·마이페이지)</td><td><strong>19</strong></td><td><strong>11</strong></td><td><strong>30</strong></td><td><strong>3.5%</strong></td></tr><tr><td>투자정보</td><td>18</td><td>24</td><td>42</td><td>3.3%</td></tr><tr><td>메인</td><td>6</td><td>4</td><td>10</td><td>1.1%</td></tr><tr><td>이벤트/공지사항</td><td>5</td><td>4</td><td>9</td><td>0.9%</td></tr><tr><td>검색</td><td>4</td><td>2</td><td>6</td><td>0.7%</td></tr><tr><td>Footer</td><td>4</td><td>1</td><td>5</td><td>0.7%</td></tr><tr><td>패밀리앱</td><td>2</td><td>0</td><td>2</td><td>0.4%</td></tr><tr><td>전체메뉴</td><td>1</td><td>0</td><td>1</td><td>0.2%</td></tr><tr><td><strong>합계</strong></td><td><strong>548</strong></td><td><strong>417</strong></td><td><strong>965</strong></td><td>100%</td></tr></tbody></table></div><p><strong>회원 영역은 45→19 본화면으로 축소</strong>됐다(R1). 로그인·마이페이지를 하나로 묶은 이유는 결정의 A/B/C 분류가 두 영역에 걸쳐 있어서다 — 남는 30화면은 두 영역에서 섞여 나온다.</p><h3>2대 영역 편중이 오히려 심해졌다</h3><div class='tw'><table><thead><tr><th></th><th>V1 (574 기준)</th><th><strong>V2 (548 기준)</strong></th></tr></thead><tbody><tr><td>카드/상품권/멤버십</td><td>29.8%</td><td><strong>31.2%</strong></td></tr><tr><td>지점안내</td><td>23.0%</td><td><strong>24.1%</strong></td></tr><tr><td><strong>합계</strong></td><td>52.8%</td><td><strong>55.3%</strong></td></tr></tbody></table></div><p>회원 영역이 빠지면서 분모가 줄어 <strong>두 영역이 In-Scope의 55.3%</strong>가 됐다. K2(템플릿화)의 중요도가 재산정으로 더 올라간다 — <strong>별도 트랙 운영은 선택이 아니라 필수</strong>에 가까워졌다.</p><ul><li><strong>메인은 예외</strong> — 본화면 6개(1.1%)지만 모듈·컴포넌트 밀도로 공수가 결정된다. <strong>화면 수 기준 산정이 왜곡되는 영역</strong>으로 별도 취급. 게다가 <strong>콘텐츠 구성을 분석하지 못했다</strong>(243 §9-B).</li><li><strong>Admin 고유 122화면</strong>은 디자인 산출물이 없어 위 배분과 다른 체인으로 흐른다(§4).</li></ul><h3>규모 확정 후 산정 (<code>[규모미상]</code> — 126에서 이월)</h3><div class='tw'><table><thead><tr><th>항목</th><th>받아야 할 것</th><th>확인 주체</th></tr></thead><tbody><tr><td>App 특화 4건</td><td>앱 현행 화면 목록 또는 영향 화면 수</td><td>고객사 App 담당</td></tr><tr><td>접근성 준수 수준</td><td>&quot;준수 수준&quot;의 정의 — 지침·항목·적용 화면 범위</td><td>PM ↔ 고객사</td></tr></tbody></table></div><blockquote>이 2건은 <strong>0으로 취급하지 말 것.</strong> 일정·원가 모두 미결이다.</blockquote><hr><h2>3. 수행조직</h2><div class='tw'><table><thead><tr><th>구분</th><th>역할</th><th>주요 태스크</th><th>투입 인원</th></tr></thead><tbody><tr><td>관리</td><td>PM</td><td>총괄, 일정·이슈·변경 관리, 고객 커뮤니케이션</td><td><code>[미확정]</code></td></tr><tr><td>관리</td><td>CD(크리에이티브 디렉터)</td><td>디자인 디렉팅, 시안 방향 승인</td><td><code>[미확정]</code></td></tr><tr><td>기획</td><td>기획 PL</td><td>설계 가이드·산출물 관리, 품질 검토</td><td><code>[미확정]</code></td></tr><tr><td>기획</td><td>기획자</td><td>분석, 요구사항정의, IA·화면설계</td><td><code>[미확정]</code></td></tr><tr><td>디자인</td><td>디자인 PL</td><td>주요 시안·스타일가이드</td><td><code>[미확정]</code></td></tr><tr><td>디자인</td><td>디자이너</td><td>화면 GUI 디자인</td><td><code>[미확정]</code></td></tr><tr><td>디자인</td><td>인터랙션 디자이너</td><td>인터랙션·모션 정의</td><td><code>[미확정]</code></td></tr><tr><td>퍼블리싱</td><td>퍼블리싱 PL</td><td>퍼블리싱 가이드·산출물 관리</td><td><code>[미확정]</code></td></tr><tr><td>퍼블리싱</td><td>퍼블리셔</td><td>마크업·CSS·스크립트 구현</td><td><code>[미확정]</code></td></tr></tbody></table></div><blockquote><strong>인원수·M/M은 이 문서가 만들지 않는다.</strong> 영업·원가 산정에서 오는 값이며 앞 단계 산출물에서 도출되지 않는다(표준 규칙). §8에 자리를 남겼다.<br><em>(시뮬레이션 주: 원본 열람으로 실측값을 알고 있으나 인풋에서 도출되지 않는 수치는 기입하지 않는다.)</em></blockquote><h3>고객사 창구</h3><div class='tw'><table><thead><tr><th>구분</th><th>담당</th><th>근거</th></tr></thead><tbody><tr><td>프로젝트 총괄 PM</td><td>김희진 책임</td><td>124 #4</td></tr><tr><td>PC · Mobile Web</td><td>김희진 책임</td><td>124 #4</td></tr><tr><td>App</td><td>김수현 선임</td><td>124 #4</td></tr><tr><td>운영사</td><td>펜타브리드 — 진행 중 산출물 비공개, 딜리버리 시 권한 협의</td><td>124 #1</td></tr></tbody></table></div><hr><h2>4. 일정</h2><p><strong>계약 기간</strong>: 2022-09-19 ~ 2023-04-18 (7개월) · <strong>23.1Q 오픈 목표</strong> (121 §5-3)</p><h3>단계 구성 (114 PDP · I1 제안서 슬라이드 15)</h3><div class='tw'><table><thead><tr><th>단계</th><th>주요 활동</th><th>산출물 (114 PDP 인용)</th></tr></thead><tbody><tr><td>① 수행준비·기초분석</td><td>TF 구성, 자료 수급, 기초질의, 현행 분석</td><td>기초질의서 · AS-IS 화면명세 · 범위정의서 · 수행계획서</td></tr><tr><td>② 요건분석·전략</td><td>요구사항·정책·시스템 요건, 경쟁 분석, UX 전략</td><td>요구사항정의서 · UX전략 · 개선방향성</td></tr><tr><td>③ 설계</td><td>IA, 와이어프레임, 화면명세, 화면설계, 가이드</td><td>IA · 화면명세서 · 화면설계서 · 설계가이드</td></tr><tr><td>④ 디자인</td><td>시안, GUI 디자인, 스타일가이드, 인터랙션</td><td>시안 · 스타일가이드 · GUI가이드(Zeplin)</td></tr><tr><td>⑤ 퍼블리싱</td><td>WSG, 공통 → 메인 → 서브 순차 구현</td><td>퍼블리싱 산출물 · UI테스트케이스</td></tr></tbody></table></div><p><strong>병행 구조</strong>: App/MWEB 공통 UX·UI를 먼저 완료해 퍼블리싱에 인계하고 PC UX·UI가 뒤따르는 <strong>채널 시차 병행</strong>. 퍼블리싱은 디자인 완료 영역을 순차로 수신.</p><h3>WBS — <strong>미작성</strong></h3><div class='tw'><table><thead><tr><th>사유</th><th>상태</th></tr></thead><tbody><tr><td>단계별 기간 배분</td><td><code>[미확정]</code> — 131 리서치계획서 결손으로 ② 단계 리서치 구간의 소요를 배치할 근거가 없음</td></tr><tr><td>마일스톤 일자</td><td><code>[미확정]</code> — 계약 착수일·종료일만 확정, 중간 마일스톤 미합의</td></tr><tr><td>태스크 단위 일정</td><td><strong>placeholder</strong> — 자동 WBS 생성 로직 없음(표준 미비). 규모 배분표(§2)를 입력으로 PM이 작성</td></tr></tbody></table></div><blockquote>일정 수치를 지어내지 않는다. 대신 <strong>§2 규모 배분표가 산정 입력</strong>이다.</blockquote><hr><h2>5. 산출물 관리</h2><ul><li><strong>버전 규칙</strong>: <code>V0.x</code>=내부 검토본 / <code>V1.0</code>=고객 확정본. 확정 후 변경은 별도 이력 관리</li><li><strong>딜리버리</strong>: 산출물 도출(V0.1~0.5) → 고객사 UX 검토 → 개발 검토(V0.8~) → PM 협의체 합의·확정(V1.0)</li><li><strong>변경 관리</strong>: 설계서를 개발에 전달한 시점부터 개시. 변경분은 문서 말미 간지 추가 후 해당 장표만 복제 갱신하여 재전달</li><li><strong>작업 툴</strong>: 화면설계서=PPT / 디자인=Figma / 화면명세=Excel (124 #1)</li><li><strong>Admin 체인 분리</strong>: Admin 고유 122화면은 <strong>기획→퍼블리싱</strong> 직행. 디자인 산출물이 없는 것이 정상이며, 검수 시 결손으로 오판하지 않도록 산출물 목록에 명시 (124 #13·#19)</li></ul><hr><h2>6. 커뮤니케이션</h2><div class='tw'><table><thead><tr><th>항목</th><th>내용</th><th>근거</th></tr></thead><tbody><tr><td>정기 보고</td><td><strong>없음</strong> — 현업 내부 자율 공유</td><td>124 #3</td></tr><tr><td>주간보고서</td><td>산출물 목록에 포함되므로 문서로는 작성 (941)</td><td>114 PDP</td></tr><tr><td>회신 기준</td><td><code>[미확정]</code> — 질의 회신 기한 미합의</td></tr><tr><td>공유 위치</td><td><code>[미확정]</code> — Figma 권한(운영사 부여 여부)에 종속</td><td>124 #1</td></tr><tr><td>워크샵</td><td>1차 2022-09-23 · 2차 2022-09-29</td><td>932 회의록</td></tr></tbody></table></div><blockquote><strong>정기 보고가 없다</strong>는 점이 리스크다 — 진척 이슈가 늦게 드러난다(§7 R-6).</blockquote><hr><h2>7. 검수조건</h2><p>126 §6 인수기준을 산출물 단위로 내렸다. <strong>정량 기준은 세울 수 없다</strong> — 126 §1 성공기준이 부재하기 때문이다(125·123·214 전부 결손).</p><div class='tw'><table><thead><tr><th>#</th><th>산출물</th><th>검수조건</th><th>유형</th><th>분쟁 위험</th></tr></thead><tbody><tr><td>V-1</td><td>화면명세서(341)</td><td><strong>In-Scope 고유 965</strong>화면 커버리지 100%</td><td>정량(커버리지)</td><td>낮음</td></tr><tr><td>V-2</td><td>UI디자인(421)</td><td><strong>In-Scope 본화면 548</strong> 전건 · 스타일가이드 값 정합</td><td>정량(커버리지)</td><td>낮음</td></tr><tr><td>V-3</td><td>퍼블리싱(423)</td><td>V-2 대상 전건 마크업 완료 · UI테스트케이스 통과</td><td>정량</td><td>중 — 테스트케이스 미정</td></tr><tr><td>V-4</td><td>Admin 산출물</td><td>고유 122화면 기획·퍼블리싱 완비 (<strong>디자인 없음이 정상</strong>)</td><td>정성</td><td>낮음</td></tr><tr><td>V-5</td><td>스타일가이드(351)</td><td>그룹 WSG 상속 · 해피니스 산스 적용</td><td>정성</td><td>낮음</td></tr><tr><td>V-6</td><td>접근성</td><td><strong>기준 미정 — 검수 불가</strong></td><td>—</td><td><strong>높음</strong></td></tr><tr><td>V-7</td><td>디바이스 호환</td><td><strong>하한선 미합의 — 검수 불가</strong></td><td>—</td><td><strong>높음</strong></td></tr><tr><td>—</td><td><strong>정량 성과 기준</strong>(이탈률·전환·만족도)</td><td><strong>작성 불가</strong> — 근거 0</td><td>—</td><td><strong>높음</strong></td></tr></tbody></table></div><blockquote>⚠️ <strong>V-6·V-7과 정량 성과 기준은 이대로 계약에 들어가면 인수 시점 분쟁 소지다.</strong> 표준 규칙 4(모호하면 위험 표시)에 따라 명시한다.</blockquote><hr><h2>8. 가정·제약·리스크</h2><h3>제약 (126 §7 인용)</h3><p>일정 7개월 · IE10+ · 해피니스 산스 필수 · 그룹 WSG · JSP 레거시 · 갤S22·아이폰13 기준(재협의 중) · 운영사 비공개 원칙</p><h3>가정</h3><div class='tw'><table><thead><tr><th>#</th><th>가정</th><th>깨지면</th></tr></thead><tbody><tr><td>A-1</td><td>목표(126 O-1~O-4)가 고객 의사와 일치한다</td><td><strong>125 미수행이라 미검증</strong> — 방향 재설정</td></tr><tr><td>A-2</td><td>23.1.1 H.Point 통합이 예정대로 진행된다</td><td>로그인·마이페이지 설계 기준 변경</td></tr><tr><td>A-3</td><td>Admin 화면 수가 현행(고유 122)에서 크게 늘지 않는다</td><td>퍼블리싱 공수 증가</td></tr></tbody></table></div><h3>리스크</h3><div class='tw'><table><thead><tr><th>#</th><th>리스크</th><th>근거</th><th>대응</th></tr></thead><tbody><tr><td><strong>R-1</strong></td><td><strong>범위 경계 재협의 반복</strong> — 제외 8건 중 4건이 경계 미정. 특히 회원 메뉴 <strong>68화면</strong>(6.8%)이 안팎으로 흔들림</td><td>126 C-1·C-3</td><td>범위 확정 전 고객 합의 필수. 911 변경관리대장 등록</td></tr><tr><td><strong>R-2</strong></td><td><strong>H.Point 통합(23.1.1)이 오픈과 근접</strong> · 전환 화면이 PC에만 존재</td><td>121 S4 · 122 A3</td><td>통합 후 기준 설계, 전환 일정 상시 확인</td></tr><tr><td><strong>R-3</strong></td><td><strong>기술 하한선 불일치</strong> — 데스크톱 IE10 vs 모바일 최신 2세대</td><td>126 C-2</td><td>351·353 가이드에서 대체 기법 방침 선결</td></tr><tr><td><strong>R-4</strong></td><td><strong>2대 영역 편중</strong> — 카드 29.8% + 지점안내 23.0% = <strong>52.8%</strong></td><td>§2 배분표</td><td><strong>두 영역 모두</strong> 별도 트랙·템플릿화</td></tr><tr><td><strong>R-5</strong></td><td><strong>오류·예외 화면이 현행에 0건</strong> — 신규 설계 필요 분량이 미상</td><td>122 H9</td><td>공통 컴포넌트로 선설계, 규모 확정 후 일정 반영</td></tr><tr><td><strong>R-6</strong></td><td><strong>정기 보고 없음</strong> — 진척 이슈 지연 노출</td><td>124 #3</td><td>주간보고서를 문서로 상시 발행, 미수급 항목 노출</td></tr><tr><td><strong>R-7</strong></td><td><strong>자료 수급 지연</strong></td><td>124 §4 미결 4건</td><td>수급 일정 리스트 추적</td></tr><tr><td><strong>R-8</strong></td><td><strong>Figma 권한 미확정</strong></td><td>124 #1</td><td>9/20 미팅 협의 후 딜리버리 방식 확정</td></tr><tr><td><strong>R-9</strong></td><td><strong>검수 기준 2건 미정</strong>(접근성·디바이스)</td><td>§7 V-6·V-7</td><td>계약 전 기준 합의</td></tr></tbody></table></div><hr><h2>9. 사업성검증 입력 — <strong>결과는 사람이 채운다</strong></h2><p>OSSP 132의 두 번째 산출물인 <strong>사업성검증결과</strong>는 이 표준이 만들지 않는다(내부원가·VRMS 접근 필요). 아래는 재무·PM에게 넘기는 <strong>입력 요약</strong>이다.</p><div class='tw'><table><thead><tr><th>입력 항목</th><th>값</th><th>출처</th></tr></thead><tbody><tr><td>계약 기간</td><td>7개월 (2022-09-19 ~ 2023-04-18)</td><td>121 §5-3</td></tr><tr><td>담당 범위</td><td>기획 · 디자인 · 프론트엔드</td><td><code>.ax-project.yaml</code></td></tr><tr><td><strong>디자인·퍼블리싱 대상</strong></td><td><strong>본화면 548</strong> + 종속 417(별도 단가)</td><td>122 + 240 결정</td></tr><tr><td>설계 대상</td><td>고유 <strong>965</strong></td><td>122 + 240 결정</td></tr><tr><td><strong>등급 상향분</strong></td><td>VIP프로그램 PC 본화면 7 (<code>스킨변경 → 개선</code>)</td><td>240 결정 D-3</td></tr><tr><td><strong>신규 예외 화면군</strong></td><td><strong><code>[규모미상]</code></strong></td><td>242 K4</td></tr><tr><td>기획 명세 대상</td><td>명세 행 1,344</td><td>122</td></tr><tr><td>Admin (디자인 제외)</td><td>고유 122</td><td>122</td></tr><tr><td>영역별 배분</td><td>§2 배분표</td><td>122</td></tr><tr><td>미확정 규모</td><td>App 특화 4건 · 접근성 준수 수준</td><td>126</td></tr></tbody></table></div><div class='tw'><table><thead><tr><th>재무·PM이 채울 자리</th><th>상태</th></tr></thead><tbody><tr><td>총 투입 M/M</td><td>⬜</td></tr><tr><td>역할별 인원·기간</td><td>⬜</td></tr><tr><td>직능별 단가</td><td>⬜</td></tr><tr><td>종속 화면 단가 계수</td><td>⬜</td></tr><tr><td>내부원가 대비 수익성 판정</td><td>⬜</td></tr></tbody></table></div><hr><h2>11. 인용값 대장 — <strong>상류가 바뀌면 여기부터 훑는다</strong></h2><p>이 계획서의 수치·판정은 거의 전부 다른 산출물에서 온 것이다. <strong>상류가 갱신되면 이 표의 「출처 버전」과 대조해 갱신 대상을 찾는다.</strong></p><div class='tw'><table><thead><tr><th>인용값</th><th>쓰이는 곳</th><th>출처</th><th>출처 버전·일자</th><th>갱신일</th></tr></thead><tbody><tr><td>명세 행 1,344 / 고유 1,003 / 본화면 574 (AS-IS)</td><td>§2</td><td>122 AS-IS 화면덤프</td><td>v2 · 2026-08-06</td>< 115 프로젝트가이드 · 111 TFT 구성 결과 미확보 → 인원 산정 불가</li></ul><h2>투입 인풋</h2><ul><li>I1 제안서 · I3 기초질의서 · 114 PDP</li><li><strong>126 범위정의서 v2</strong> (규모 지표·상충 6건)</li><li><strong>122 AS-IS 화면덤프 v2</strong> (3중 기준선)</li><li>121 환경분석보고서 (제약·리스크)</li></ul><h2>산출물</h2><ul><li><code>프로젝트수행계획서.md</code> — <strong>상태 <code>draft</code>, PM·고객 확정 전</strong></li></ul><h2>AS-IS 대조</h2><ul><li>상태: <strong>사전노출</strong></li><li>원본: 01_현대백화점_웹UXUI개편_수행계획서.doc</li><li>계약범위 실측 단계에서 이미 열람 — 대조표에서 할인 평가. 원본 실측값(95.25 M/M·20명)은 인풋에서 도출되지 않으므로 산출물에 기입하지 않음.</li></ul><h2>이후 어디에 쓰이나</h2><ul><li><strong>411 작업계획수립 — 규모 배분표를 화면 단위 진척관리로 전개</strong></li><li>921 진척관리 · 941 주간보고 — 목표선 근거</li><li>134 계약체결 — 검수조건이 계약 별첨</li></ul><h2>도출된 인사이트</h2><p><strong>상류를 고치니 이 문서의 두 가지 사실이 뒤집혔다.</strong></p><ol><li><strong>디자인·퍼블리싱 대상은 1,344가 아니라 574다.</strong> 초판 기준의 <strong>43%</strong>. 초판이 인용한 1,344는 명세 행 수였고, 그대로 공수를 잡으면 2.34배 과대 산정된다.</li><li><strong>&quot;카드 영역 39% 단일 편중&quot;이라는 초판의 리스크 진단이 틀렸다.</strong> 본화면 기준으로는 카드 29.8% · 지점안내 23.0%로 <strong>2대 영역 구조</strong>(합 52.8%)다. 대응도 &quot;카드만 별도 트랙&quot;이 아니라 두 영역 모두여야 한다.</li></ol><p><strong>그리고 이건 132의 잘못이 아니다.</strong> 132는 상류가 준 값을 규칙대로 인용했을 뿐이다. <strong>스킬 체인 어디에도 인용값의 갱신 책임이 없다</strong> — 상류를 고치면 하류가 조용히 낡는다. CONVENTIONS 차원의 역전파 규칙이 필요하다.</p><p><strong>검수 불가 항목이 3건 남았다.</strong> 접근성 기준·디바이스 하한선·정량 성과 기준. 셋 다 이대로 계약 별첨이 되면 인수 시점 분쟁 소지다. 근본 원인은 126 §1 성공기준 부재이고, 그 원인은 125·123·214 결손이다 — <strong>결손이 3단계를 타고 내려와 계약 리스크가 됐다.</strong></p>"}]}, {"id": "200", "name": "Discover", "ko": "요건분석 · 경쟁환경 · UX전략", "roster": [{"id": "211", "name": "이해관계자인터뷰", "state": "skip", "note": "124로 흡수", "has": false}, {"id": "212", "name": "정책요건분석", "state": "done", "note": "", "has": true}, {"id": "213", "name": "시스템요건분석", "state": "done", "note": "", "has": true}, {"id": "214", "name": "이용로그분석", "state": "done", "note": "", "has": true}, {"id": "215", "name": "요구사항정의", "state": "done", "note": "★ 첫 정량 대조점 (봉인 유지)", "has": true}, {"id": "221", "name": "서비스분석", "state": "done", "n "path": "sim-project/200_Discover/210_자사고객요건분석/212_정책요건분석/정책요건정의서.md", "html": "<h1>정책요건정의서 — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>사용 인풋: I2 고객수급 자료 · I3 기초질의서 · I8 OSSP 표준 · 121 환경분석 · 122 AS-IS · 126 범위정의서<br>⚠️ <strong>결정 책임 경계</strong>: 비즈니스·서비스 정책의 결정 책임은 <strong>고객사</strong>에 있다. 이 문서는 정리·구조화·공백 제시까지이며 참고안은 전부 <code>제안(미확정)</code> 라벨을 붙였다.</blockquote><h2>1. 정책 인벤토리</h2><div class='tw'><table><thead><tr><th>#</th><th>정책 자료</th><th>버전·일자</th><th>출처</th><th>확보</th></tr></thead><tbody><tr><td>D1</td><td>홈페이지_용어통일</td><td>2022-12</td><td>I2 수급 (15슬라이드)</td><td>✅</td></tr><tr><td>D2</td><td>VIP 프로그램 (등급·혜택·마일리지)</td><td>VIP최종 · 1128 업데이트 · TCP 1차/02</td><td>I2 수급</td><td>✅</td></tr><tr><td>D3</td><td>해피니스 산스 서체 사용 가이드</td><td>—</td><td>I2 수급</td><td>✅</td></tr><tr><td>D4</td><td>BI·로고 사용 가이드 (더현대 국/영문)</td><td>—</td><td>I2 수급</td><td>✅</td></tr><tr><td>D5</td><td>현대백화점그룹 웹 UI/UX 가이드라인</td><td>2022.01 (현대IT&amp;E)</td><td>I2 수급</td><td>✅</td></tr><tr><td>D6</td><td>웹 접근성 품질인증 표준심사 지침</td><td>22.1</td><td>I2 수급</td><td>✅</td></tr><tr><td>D7</td><td>웹페이지 어드민관리 (화면별 모듈 매핑)</td><td>2022.09</td><td>I2 수급 (24슬라이드)</td><td>✅</td></tr><tr><td>D8</td><td>23년 변경사항 / 추후변경페이지</td><td>2022-11 · 2023-01</td><td>I2 수급</td><td>✅</td></tr><tr><td>D9</td><td>H.Point 회원Y/통합회원N 레이어</td><td>2023-03</td><td>I2 수급</td><td>✅</td></tr><tr><td><strong>D10</strong></td><td><strong>회원 이용약관 · 개인정보처리방침</strong></td><td>—</td><td>—</td><td>⛔ <strong>미확보</strong></td></tr><tr><td><strong>D11</strong></td><td><strong>운영정책</strong>(콘텐츠 게시·수정 권한·승인 절차)</td><td>—</td><td>—</td><td>⛔ <strong>미확보</strong></td></tr><tr><td><strong>D12</strong></td><td><strong>문화센터 수강 신청·취소·환불 정책</strong></td><td>—</td><td>—</td><td>⛔ <strong>미확보</strong></td></tr></tbody></table></div><p>→ <strong>미확보 3건이 §4 정책 공백의 직접 원인</strong>이다. 초판은 확보분만 정리해 이 결손을 드러내지 못했다.</p><h2>2. 정책 항목 정리</h2><p><code>상태</code>: 확정 = 고객 회신·자료로 확정 / 미정 = 결정 대기 / 부분 = 일부만 확정</p><h3>2-1. 용어·표기 정책 (P-TERM)</h3><div class='tw'><table><thead><tr><th>정책ID</th><th>정책명</th><th>적용 대상 화면·기능</th><th>규칙 요약</th><th>상태</th><th>근거</th></tr></thead><tbody><tr><td>P-TERM-01</td><td>점포 지칭 통일</td><td>마이페이지·전 채널</td><td><code>주 이용 백화점</code>·<code>자주 찾는 지점</code> → <strong><code>지금 보는 점포</code></strong></td><td>확정</td><td>D1</td></tr><tr><td>P-TERM-02</td><td>등급 표기</td><td>마이페이지</td><td><code>나의 등급</code> → <code>나의 VIP 등급</code></td><td>확정</td><td>D1</td></tr><tr><td>P-TERM-03</td><td>쿠폰 표기</td><td>마이페이지</td><td><code>할인 쿠폰</code> → <code>카드 할인 쿠폰</code></td><td>확정</td><td>D1</td></tr><tr><td>P-TERM-04</td><td>차량 표기</td><td>마이페이지·주차</td><td><code>자동정산 차량번호</code> → <code>나의 차량 번호</code></td><td>확정</td><td>D1</td></tr><tr><td>P-TERM-05</td><td>강좌 표기</td><td>문화센터·마이페이지</td><td><code>수강 내역</code> → <code>나의 강좌</code></td><td>확정</td><td>D1</td></tr><tr><td>P-TERM-06</td><td>포인트 표기</td><td>마이페이지</td><td><code>사용 가능한 H.Point</code> → <code>H.Point</code></td><td>확정</td><td>D1</td></tr><tr><td>P-TERM-07</td><td>연락처 표기</td><td>회원정보</td><td><code>연락처</code>·<code>휴대폰</code> → <code>휴대전화</code></td><td>확정</td><td>D1</td></tr><tr><td>P-TERM-08</td><td>띄어쓰기</td><td>전 채널</td><td>PC·MO 동일 규칙 적용</td><td><strong>부분</strong> — 규칙 세부 미기재</td><td>D1</td></tr><tr><td>P-TERM-09</td><td>명칭 변경</td><td>지점안내</td><td>더현대대구·현대시티아울렛 명칭 변경, 날짜 표기 규칙</td><td>확정</td><td>I2 수급 3건</td></tr></tbody></table></div><h3>2-2. 회원·등급 정책 (P-MBR)</h3><div class='tw'><table><thead><tr><th>정책ID</th><th>정책명</th><th>적용 대상</th><th>규칙 요약</th><th>상태</th><th>근거</th></tr></thead><tbody><tr><td>P-MBR-01</td><td>회원 체계 전환</td><td>로그인·마이페이지·회원 메뉴</td><td>2023-01-01부로 H.Point 통합회원 전환. 현대백화점 자체 회원 메뉴는 개편 범위 제외</td><td>확정</td><td>I3 #14</td></tr><tr><td>P-MBR-02</td><td>로그인 동선 유지</td><td>로그인 진입</td><td>회원 메뉴는 제외지만 로그인 진입 동선은 범위 내</td><td>확정</td><td>I3 #14</td></tr><tr><td>P-MBR-03</td><td>전환 예외 처리</td><td>로그인 레이어</td><td><code>H.Point 회원 Y / 통합회원 N</code> 케이스 레이어 제공</td><td>확정</td><td>D9</td></tr><tr><td>P-MBR-04</td><td>VIP 등급 체계</td><td>VIP프로그램·마이페이지</td><td>6등급 — JASMIN BLACK(1억2천↑) / BLUE(8천↑) / JASMIN(5,500↑) / SAGE(3,000↑) / CLUB YP(20~39세) / GREEN(3기준·분기선정)</td><td>확정</td><td>D2</td></tr><tr><td>P-MBR-05</td><td>등급 혜택</td><td>VIP프로그램</td><td>등급별 혜택 12종(라운지·발레파킹·쇼핑할인·매거진·문화센터 할인·계열사 등급 부여 등)</td><td>확정</td><td>D2</td></tr><tr><td>P-MBR-06</td><td>등급 갱신 주기</td><td>VIP프로그램</td><td>선정 기준·서비스 기간은 <strong>매년 변경</strong>(&quot;매년 변경될 수 있습니다&quot; 명시)</td><td>확정</td><td>D2</td></tr><tr><td>P-MBR-07</td><td>마일리지 적립</td><td>마일리지 안내</td><td>적립처×결제수단 차등(현대백화점카드 1점 / 기타 0.2점 / 투홈 0.5점)</td><td>확정</td><td>D2</td></tr><tr><td>P-MBR-08</td><td>마일리지 예외</td><td>마일리지 안내</td><td>50% 적립군(가전·식품·여행사 등)·적립 제외군(임대매장·서비스상품·상품권 등 20여 항목)</td><td>확정</td><td>D2</td></tr><tr><td>P-MBR-09</td><td>TCP 라운지 출입</td><td>앱 특화</td><td>등급 연동 출입 기능</td><td><strong>미정</strong> — 판정 데이터 연동 방식</td><td>I3 #11</td></tr></tbody></table></div><h3>2-3. 브랜드·표현 정책 (P-BRD)</h3><div class='tw'><table><thead><tr><th>정책ID</th><th>정책명</th><th>적용 대상</th><th>규칙 요약</th><th>상태</th><th>근거</th></tr></thead><tbody><tr><td>P-BRD-01</td><td>서체</td><td>전 채널</td><td>해피니스 산스 필수. 대체 제안 불가. VIP 등급 로고 외 텍스트도 해피니스 산스 허용</td><td>확정</td><td>I3 #20 · D3</td></tr><tr><td>P-BRD-02</td><td>BI·로고</td><td>전 채널</td><td>더현대 로고타입 국/영문 사용 가이드 준수</td><td>확정</td><td>D4</td></tr><tr><td>P-BRD-03</td><td>그룹 가이드</td><td>전 채널</td><td>현대백화점그룹 웹 UI/UX 가이드라인(2022.01) 준수</td><td>확정</td><td>D5</td></tr><tr><td>P-BRD-04</td><td>캐릭터</td><td>로딩 화면</td><td>&#x27;흰디&#x27; 활용 검토</td><td><strong>미정</strong> — 자료 수급 대기</td><td>I4 2차WS</td></tr></tbody></table></div><h3>2-4. 접근성 정책 (P-A11Y)</h3><div class='tw'><table><thead><tr><th>정책ID</th><th>정책명</th><th>적용 대상</th><th>규칙 요약</th><th>상태</th><th>근거</th></tr></thead><tbody><tr><td>P-A11Y-01</td><td>준수 수준</td><td>전 채널</td><td><strong>인증 취득 제외.</strong> &quot;인증 심의 일정 이슈로 준수하는 수준으로 진행&quot;</td><td>확정</td><td>I3 #15</td></tr><tr><td>P-A11Y-02</td><td>준수 기준</td><td>전 채널</td><td>웹 접근성 품질인증 표준심사 지침(22.1)</td><td>확정</td><td>D6</td></tr><tr><td>P-A11Y-03</td><td>심사 주도권</td><td>—</td><td>고객사 측 (검토
