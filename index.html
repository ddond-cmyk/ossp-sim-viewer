>FG-K·FG-J + 각 행 태그</td><td>NFR-08·09·10은 목표치 부재</td></tr><tr><td><strong>합계</strong></td><td><strong>78</strong></td><td><strong>78</strong></td><td>✅ <strong>요구 고아 0</strong></td></tr></tbody></table></div><h3>7-1-1. ⚠️ 215의 [확인필요] 13건 — 승계 점검 결과 <strong>전건 승계가 아니다</strong></h3><p>상류의 미결이 자동으로 내려오지 않는다. 13건을 하나씩 대조했다.</p><div class='tw'><table><thead><tr><th>215 [확인필요]</th><th>321 처리</th><th>판정</th></tr></thead><tbody><tr><td>#6 앱 Native/Hybrid</td><td><strong>D1-16</strong></td><td>✅ 승계</td></tr><tr><td>#7 VIP 등급 판정 연동</td><td><strong>D1-11</strong></td><td>✅ 승계</td></tr><tr><td>#11 용어통일 소급 반영 범위</td><td><strong>D1-14</strong>(띄어쓰기)에 부분 흡수</td><td>◐ <strong>부분</strong> — 소급 범위 자체는 안 다룸</td></tr><tr><td>#13 VIP 채널 통일 기준</td><td>FN-E10 · <strong>240 결정 D-3으로 해소</strong></td><td>✅ <strong>닫힘</strong></td></tr><tr><td>#2 더현대 대구 R&amp;R</td><td>FN-B05·D2-1 인근이나 <strong>명시 안 함</strong></td><td>⚠️ <strong>누락</strong></td></tr><tr><td>#3 PC 문화센터 서브메인 어드민 영역</td><td>—</td><td>⚠️ <strong>누락</strong></td></tr><tr><td>#4 PC 카드 서브메인 어드민 영역</td><td>—</td><td>⚠️ <strong>누락</strong></td></tr><tr><td>#5 온라인 신청 가이드 처리 방식</td><td>—</td><td>⚠️ <strong>누락</strong></td></tr><tr><td>#8 어드민 신규/변경 시 작업 범위</td><td>FN-J01 인근이나 <strong>명시 안 함</strong></td><td>⚠️ <strong>누락</strong></td></tr><tr><td>#9 H.Point 전환 전/후 이중 시나리오</td><td>FN-F08·F09가 <strong>전환 후만</strong> 다룸</td><td>⚠️ <strong>누락</strong> — 전환 전 기간 설계 공백</td></tr><tr><td>#1 요건 클로징 시점</td><td>911 변경관리</td><td>— 기능 아님</td></tr><tr><td>#10 외국어 채널 영향 범위</td><td>NFR-07</td><td>— 기능 아님</td></tr><tr><td>#12 개발계 산출물 작성주체</td><td>132 이슈</td><td>— 기능 아님</td></tr></tbody></table></div><p><strong>승계 2 / 부분 1 / 닫힘 1 / 누락 6 / 기능 아님 3.</strong></p><blockquote><strong>누락 6건은 전부 &quot;기능 자체는 있는데 그 기능의 미결 조건이 안 따라온 것&quot;</strong> 이다. FN-D14 MWEB 문화센터 서브메인은 만들었지만 <em>&quot;PC 서브메인의 어드민 영역이 미확정&quot;</em>(#3)이라는 조건이 함께 오지 않았다. <strong>기능은 상속됐고 조건은 상속되지 않았다.</strong><br><br>이건 132에서 이미 겪은 <strong>역전파 부재</strong>와 같은 계열이다. <code>depends_on</code>은 무엇을 받는지는 정하지만 <strong>받은 것의 미결 상태를 어떻게 끌고 갈지는 정하지 않는다.</strong></blockquote><p>→ <strong>누락 6건을 D1-17 ~ D1-22로 추가 등재한다.</strong></p><div class='tw'><table><thead><tr><th>#</th><th>항목</th><th>관련 FN</th><th>닫는 주체</th><th>시점</th></tr></thead><tbody><tr><td>D1-17</td><td>더현대 대구 업무 R&amp;R (마이크로사이트 vs 본 채널)</td><td>FN-B05</td><td>고객·PM</td><td>11월 중순</td></tr><tr><td>D1-18</td><td>PC 문화센터 서브메인 어드민 관리 영역</td><td>FN-D14 · FN-J01</td><td>고객</td><td>요건 클로징</td></tr><tr><td>D1-19</td><td>PC 카드 서브메인 어드민 관리 영역</td><td>FN-E01 · FN-J01</td><td>고객</td><td>요건 클로징</td></tr><tr><td>D1-20</td><td>온라인 신청 가이드 처리 방식</td><td>FN-D13</td><td>고객</td><td>요건 클로징</td></tr><tr><td>D1-21</td><td>어드민 신규/변경 시 작업 범위 (I3 #19)</td><td>FN-J01</td><td>고객·PM</td><td>요건 클로징</td></tr><tr><td>D1-22</td><td><strong>H.Point 전환 전 기간의 이중 시나리오 필요 여부</strong></td><td>FN-F08 · FN-F09</td><td>고객</td><td><strong>2023-01-01 이전</strong> ⛔</td></tr></tbody></table></div><p><strong>미정의사항 총계가 28 → 34건이 된다.</strong> 차단성 ⛔도 6 → <strong>7건</strong>(D1-22 추가) — 전환일 이전에 닫혀야 하는 유일한 항목이다.</p><h3>7-2. 유저플로우(312) → 기능</h3><div class='tw'><table><thead><tr><th>312 산출</th><th>기능 반영</th></tr></thead><tbody><tr><td>노드 72 · 흐름 7</td><td>전 노드가 1개 이상 기능에 대응</td></tr><tr><td><strong>신규 발견 5건</strong></td><td>① 잔여 정원 → <strong>FN-D02</strong> ② 대기 상태 조회 → <strong>FN-D09</strong> ③ 검색 범위 확장 → <strong>FN-C02</strong> ④ 최근본·즐겨찾기 → <strong>FN-C07</strong> ⑤ 통합 고객센터 → <strong>FN-H08</strong> — ✅ <strong>5/5 반영</strong></td></tr><tr><td><strong>흐름 무관 28건</strong>(341 이관)</td><td>화면 속성·범위 판정이므로 기능으로 만들지 않았다. 341에서 처리</td></tr><tr><td><strong>미폐포 1건</strong>(로그아웃)</td><td>FG-F 경계 밖 — §4 FG-F 하단에 명시</td></tr></tbody></table></div><h3>7-3. AS-IS 문제(122 휴리스틱) → 해소</h3><div class='tw'><table><thead><tr><th>문제</th><th>해소 기능</th><th>판정</th></tr></thead><tbody><tr><td><strong>H2</strong> 검색결과 문맥 무반영</td><td>FN-C01</td><td>✅</td></tr><tr><td><strong>H3</strong> 취소·이전 경로 없음</td><td>FN-E08 · FN-D11</td><td>✅</td></tr><tr><td><strong>H4</strong> 진입 모델 불일치</td><td>FN-A01·A02·A07</td><td>✅</td></tr><tr><td><strong>H4</strong> 브랜드 표기 불일치</td><td>FN-C06 (→332)</td><td>✅</td></tr><tr><td><strong>H5</strong> 오류 예방 없음</td><td>FN-D02 · FN-E04</td><td>✅</td></tr><tr><td><strong>H6</strong> 재방문 지원 0건</td><td>FN-A06 · FN-C07</td><td>◐ <strong>둘 다 <code>[가정]</code></strong> — 요구 근거 없음</td></tr><tr><td><strong>H9</strong> 오류 화면 0건</td><td>FG-H 9건</td><td>✅</td></tr><tr><td><strong>H10</strong> 도움말 산재</td><td>FN-H08 · CT-22</td><td>✅</td></tr><tr><td><strong>A3</strong> MWEB 사이트맵 부재</td><td>FN-A08</td><td>◐ <strong>322로 이관</strong></td></tr><tr><td><strong>A4</strong> MWEB 접근성 안내 부재</td><td>FN-K04</td><td>◐ <strong>354로 이관</strong></td></tr></tbody></table></div><h3>7-4. 컨셉(242 K1~K4) → 기능</h3><div class='tw'><table><thead><tr><th>컨셉</th><th>기능</th><th>검증 조건</th></tr></thead><tbody><tr><td><strong>K1</strong> 「어느 점포인가」로 시작</td><td>FG-A 8 · FN-B09 · FN-C01</td><td><code>FN-A02</code> 컨텍스트가 전 영역에 전달되는가. <strong>FG-I는 축 밖으로 명시</strong></td></tr><tr><td><strong>K2</strong> 한 번 만들고 지점마다 붙인다</td><td><strong>FN-B05·B06</strong> · FN-E02·E09·E11 · FN-J03</td><td><strong>⛔ <code>FN-B05</code>가 성립하지 않으면 K2 실패.</strong> 지점·카드가 늘어도 화면이 안 늘어야 한다</td></tr><tr><td><strong>K3</strong> 계정으로 할 수 있는 일을 채널이 가르지 않는다</td><td><strong>FN-F03·F04·F08</strong> · FN-E10 · FN-D14 · FN-E01</td><td>채널 차이는 <code>FN-F06</code> 1건만 남고 <strong>사유가 341에 기록</strong>되는가</td></tr><tr><td><strong>K4</strong> 막혔을 때 갈 곳을 먼저 만든다</td><td><strong>FG-H 9</strong> · FN-D07·D09·D11 · FN-E04·E06·E08 · FN-C03 · FN-B08</td><td>모든 예외가 <code>FN-H07</code> 복귀 또는 <code>FN-H08</code> 고객센터로 닫히는가</td></tr></tbody></table></div><p><strong>컨셉 고아 0건.</strong> 반대로 <strong>어떤 컨셉에도 걸리지 않는 기능</strong>은 FG-I(3) · FG-L(4) · FG-G 일부 — 전부 <strong>컨셉 축 밖임이 명시된 영역</strong>이다.</p><h3>7-5. 322 핸드오프 </h3><p>322 정보구조설계가 재해석 없이 받는다.</p><ul><li><strong>기능 행</strong>: <code>FN-ID · 기능구분 · 기능명 · 변경등급 · 컨텐츠ID · 근거</code> → §4</li><li><strong>컨텐츠 행</strong>: <code>CT-ID · 컨텐츠명 · 데이터군 · 갱신 주체 · 관련 FN · 채널</code> → §5</li><li><strong>ID 발급은 321이 한다.</strong> 322에서 새 항목이 필요하면 321로 되돌려 FN/CT를 받는다.</li><li><strong>322에서 항목이 사라지면 사유를 321로 회신한다.</strong> 통폐합은 정상이지만 기록 없는 소실은 누락과 구별되지 않는다.</li></ul><hr><h2>8. 하류로 넘기는 것</h2><div class='tw'><table><thead><tr><th>대상</th><th>내용</th></tr></thead><tbody><tr><td><strong>322 IA</strong></td><td>기능 106 · 컨텐츠 24 (§7-5 스키마) · D3-1 사이트맵 · D3-3 고객센터 범위 · <strong>FG-I를 K1 축 밖으로 표기</strong></td></tr><tr><td><strong>331 와이어프레임</strong></td><td>D3-2 지점 특성 모듈 · FG-H 예외 컴포넌트 세트</td></tr><tr><td><strong>332 컨텐츠가이드</strong></td><td><strong>CT-20 용어·명칭 사전</strong> · <strong>CT-21 오류 메시지 사전</strong></td></tr><tr><td><strong>341 화면명세서</strong></td><td>312의 흐름 무관 28건 · <code>FN-F06</code> <strong>PC 전용 사유 기록</strong>(D-4 의무) · D3-4 Footer 경계</td></tr><tr><td><strong>354 접근성가이드</strong></td><td>FN-K04 · 122 A4 MWEB 안내 신설</td></tr><tr><td><strong>132 재산정</strong></td><td><strong>FG-H 예외 화면군 규모</strong> — 기능은 9건으로 확정했으나 <strong>화면 수는 331에서 확정</strong>된다. 132 §2-B R3 미완 유지</td></tr><tr><td><strong>911 변경관리</strong></td><td>차단성 ⛔ 6건</td></tr></tbody></table></div><h3>8-1. ⚠️ 132 재산정 — 이번에도 못 닫는다</h3><p>312가 남긴 <code>UF-07 [규모미상]</code>을 321에서 닫으려 했으나 <strong>닫지 못했다.</strong></p><p>기능은 9건으로 확정됐지만 <strong>기능 1건 = 화면 1건이 아니다.</strong> 예외 화면을 공통 컴포넌트 1세트로 만들지, 영역별로 변형을 둘지는 <strong>331 와이어프레임의 판단</strong>이다. 321에서 화면 수를 쓰면 <strong>수치 창작</strong>이다.</p><blockquote><strong>132 회신 시점을 312 → 321에서 → 331로 이관한다.</strong> 근거 없이 앞당기지 않는다.</blockquote><hr>", "bytes": 51994, "deliv": "321_기능상세정의/기능정의서.html"}], "asis_html": "", "inbox": {"required": ["퍼소나(vinylc_persona)", "유저플로우(vinylc_user-flow)", "요구사항정의서(vinylc_requirements-definition)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/300_Define/320_정보구조설계/321_기능상세정의", "body_html": "<h1>321 기능상세정의 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_functional-spec</code> v0.1.0-<strong>c2202500.1</strong> → 로컬 포크 <code>.claude/skills/vinylc_functional-spec/SKILL.md</code></p><h2>스킬 고도화 (이번 작업에서 수행)</h2><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>「개편형 — 인벤토리 갈래 + 흐름 갈래」 신설 · <code>depends_on</code>에 AS-IS 추가 · 변경등급 4표기</strong></td><td>OSSP 원문이 <em>&quot;퍼소나·유저플로우에서 도출&quot;</em> 만 규정 — <strong>신규 구축 전제</strong>다. 개편형에서는 흐름에 안 걸린 기존 기능이 통째로 누락된다. <strong>312 스킬에도 같은 결손(<code>depends_on</code>에 122 없음)이 있었다</strong> — 인접 스킬 반복</td></tr><tr><td>2</td><td><strong>「미정의사항 4분류 + 닫는 주체·시점」 신설</strong></td><td>OSSP가 미정의사항을 필수로 규정하나 형식이 없다. 상류 <code>[확인필요]</code>가 성격 구분 없이 누적되면 닫을 수 없는 목록이 된다. <strong>D4(근거 부재)를 D1(고객 결정)으로 위장 금지</strong></td></tr><tr><td>3</td><td><strong>「322 핸드오프 공유 스키마」 고정</strong></td><td>미완성 항목 2번 해소. 322가 ★정량 대조점이라 재해석 지점을 없애야 한다. ID 발급 주체·컨텐츠 독립 ID·소실 회신 3규칙</td></tr></tbody></table></div><p><strong>신설 미완성 항목</strong>: 기능 분해의 <strong>정지 조건이 없다</strong> — 입도 기준을 스킬이 규정하지 않아 담당자마다 달라진다 <strong>전사 환류 판단</strong>: 3건 모두 유효. ①은 개편형 전반 점검 대상</p><h2>산출물</h2><ul><li><code>기능정의서.md</code> — <strong>기능 106 · 컨텐츠 24 · 미정의사항 34(⛔ 7)</strong></li></ul><div class='tw'><table><thead><tr><th>기능구분</th><th>AS-IS 화면</th><th>기능</th><th>특징</th></tr></thead><tbody><tr><td>FG-A 진입·컨텍스트</td><td>13</td><td>8</td><td>K1 실행 장치</td></tr><tr><td>FG-B 지점 정보</td><td>192</td><td>10</td><td>K2 검증 지점 (템플릿)</td></tr><tr><td>FG-C 브랜드·매장·검색</td><td>47</td><td>7</td><td></td></tr><tr><td>FG-D 문화센터</td><td>135</td><td>18</td><td>거래 흐름</td></tr><tr><td>FG-E 카드·멤버십</td><td>343</td><td>17</td><td>최대 영역</td></tr><tr><td>FG-F 회원·계정</td><td>68 → <strong>30</strong></td><td>12</td><td>K3 주축 (C만)</td></tr><tr><td>FG-G 서비스·이벤트</td><td>122</td><td>9</td><td></td></tr><tr><td><strong>FG-H 예외·복구</strong></td><td><strong>0</strong></td><td><strong>9</strong></td><td><strong>전면 신설</strong></td></tr><tr><td>FG-I 기업정보</td><td>81</td><td>3</td><td>K1 축 밖</td></tr><tr><td>FG-J·K 횡단</td><td>—</td><td>9</td><td>어드민·전역 규칙</td></tr><tr><td>FG-L 앱</td><td>2</td><td>4</td><td>범위 표기만</td></tr></tbody></table></div><p><strong>변경 등급</strong>: 유지 26 · 개선 41 · <strong>신설 34</strong> · 제거 3 · 미정 2</p><h2>이후 어디에 쓰이나</h2><ul><li><strong>322 IA</strong> — 기능·컨텐츠 핸드오프 스키마(§7-5) · D3-1 사이트맵 · D3-3 고객센터 범위 · <strong>FG-I를 K1 축 밖으로 표기</strong></li><li><strong>331 와이어프레임</strong> — FG-H 예외 컴포넌트 세트 · D3-2 지점 특성 모듈</li><li><strong>332 컨텐츠가이드</strong> — CT-20 용어·명칭 사전 · CT-21 오류 메시지 사전</li><li><strong>341 화면명세</strong> — FN-F06 PC 전용 <strong>사유 기록 의무</strong>(D-4) · D3-4 Footer 경계</li><li><strong>132</strong> — FG-H 규모는 <strong>331에서 확정</strong>(321에서 못 닫음)</li></ul><h2>도출된 인사이트</h2><p><strong>두 갈래로 나눈 것의 효과가 FG-H 하나로 증명된다.</strong> AS-IS 인벤토리에 예외·오류 기능이 <strong>0건</strong>이다(122 H9). 인벤토리 갈래로는 절대 안 나오는 9개 기능이 흐름 갈래에서만 나왔다. 반대로 흐름 갈래만 썼다면 FG-B 192화면·FG-E 343화면의 기존 기능 대부분이 사라졌을 것이다. <strong>한 갈래로는 어느 쪽이든 절반이 빠진다.</strong></p><p><strong>제거가 3건뿐이고 그중 2건은 삭제가 아니다.</strong> FN-D15 E-카탈로그는 강좌 화면으로 소구 이동, FN-G06 VOC는 개발 숨김 처리(추후 사용 가능성). <strong>실제로 없어지는 기능은 1건</strong>이다. 개편은 빼기가 아니라 재배치라는 것이 수치로 나왔다.</p><p><strong>⚠️ 215 [확인필요] 13건의 승계를 점검했더니 6건이 누락돼 있었다.</strong> 기능은 상속됐는데 그 기능의 <strong>미결 조건이 함께 오지 않았다</strong> — FN-D14 MWEB 문화센터 서브메인은 만들었지만 <em>&quot;PC 서브메인 어드민 영역 미확정&quot;</em> 조건이 안 따라왔다. <strong>132에서 겪은 역전파 부재와 같은 계열</strong>이고, <code>depends_on</code>이 &quot;무엇을 받는가&quot;는 정하지만 <strong>&quot;받은 것의 미결 상태를 어떻게 끌고 가는가&quot;</strong> 는 정하지 않기 때문이다. D1-17~22로 복구했다.</p><p><strong>압축률이 균일하지 않다.</strong> FG-I 27.0화면/기능 vs FG-F 2.5 — <strong>13배 차이</strong>다. 개편 강도가 다르므로 의도된 비대칭이지만, <strong>FG-E 20.2는 재점검 여지</strong>가 있다(343화면 · 요건 14건의 밀도 불일치는 241 T-B가 이미 지적).</p><p><strong>132 재산정을 이번에도 못 닫았다.</strong> FG-H 기능은 9건으로 확정했지만 <strong>기능 1건 = 화면 1건이 아니다.</strong> 예외 화면을 공통 1세트로 만들지 영역별 변형을 둘지는 331의 판단이다. 여기서 화면 수를 쓰면 수치 창작이므로 <strong>회신 시점을 331로 이관</strong>했다.</p>"}, {"task_id": "322", "task_name": "정보구조설계", "skill": "vinylc_information-architecture", "skill_version": "0.1.0-c2202500.1", "skill_upgraded": "true", "state": "done", "verdict": "pass ● — 노드 74 · 이동 8 · 창작 0. 가설 IA(실사용자 검증 불가), Co-Creative 미준수", "skill_loaded": "full", "next_use": ["331 와이어프레임 — 전역 8 선설계·지점 특성 모듈", "332 컨텐츠가이드 — 라벨 표기·명칭 사전", "341 화면명세 — 노드당 화면 수·PC전용 사유 2건", "353 UI개발가이드 — 이동 8건 리다이렉트", "132 — 예외 화면군 규모는 331에서"], "has_insight": "true", "todo": "3", "inputs": ["321 기능정의서(기능 106·컨텐츠 24)", "122 AS-IS IA(PC 12영역/MWEB 15영역·1st depth 32 vs 6)", "312 유저플로우 7흐름", "242 UX컨셉 K1~K4", "215 요구 78", "212 정책요건", "240 결정 D-2·D-3·D-4"], "outputs": ["정보구조도.md"], "asis_state": "봉인", "asis_file": "12.UX_분석／기초설계/03.IA (HDDS_IA xlsx)", "asis_note": "🔒 ★ 첫 IA 정량 대조점. 수급 이력상 원본 IA는 최소 5회 개정(0721 AsIs → 0725 → 221216 반영건 → 230103 최종 → 230222 어드민). 본 문서는 1회 작성 가설 IA — 성숙도 차이 감안 필요", "meta_html": "<h2>1. 카드 나열과 분할</h2><h3>1-1. 카드 수 — 권장 상한의 2.6배</h3><div class='tw'><table><thead><tr><th>항목</th><th>수</th></tr></thead><tbody><tr><td>기능 카드 (321 FN)</td><td>106</td></tr><tr><td>컨텐츠 카드 (321 CT)</td><td>24</td></tr><tr><td><strong>계</strong></td><td><strong>130</strong></td></tr><tr><td>웹 근거 권장</td><td>30~50</td></tr></tbody></table></div><p>스킬 고도화 ②의 판정 순서를 적용했다.</p><h3>1-2. 실사용자 세션 없음 → 그래도 분할한다</h3><p>카드소팅 실사용자를 붙일 수 없다(리서치 미계약 · 231·232 제외). <strong>피로 제약은 없지만 130장을 한 번에 소팅하면 결과가 임의적이 된다</strong> — 동시에 붙들 수 있는 항목 수를 넘기 때문이다.</p><h3>1-3. 분할 축 — <strong>③ 확정/미확정을 먼저 적용</strong></h3><p>고도화 ②: <em>&quot;③을 먼저 적용해 카드 수를 줄이는 것이 가장 안전하다. <strong>소팅은 정해지지 않은 것에만 한다.</strong>&quot;</em></p><div class='tw'><table><thead><tr><th>세션</th><th>카드</th><th>성격</th></tr></thead><tbody><tr><td><strong>S0 확정 배치 — 소팅 대상 아님</strong></td><td><strong>58</strong></td><td>요구·정책·240 결정이 소속을 이미 지정</td></tr><tr><td>S1 지점·브랜드·검색</td><td>23</td><td></td></tr><tr><td>S2 문화센터·서비스</td><td>27</td><td></td></tr><tr><td>S3 카드·멤버십</td><td>22</td><td></td></tr><tr><td><strong>소팅 대상 계</strong></td><td><strong>72</strong></td><td>세션당 22~27 = <strong>권장 범위 내</strong></td></tr></tbody></table></div><p><strong>S0 58장의 내역</strong></p><div class='tw'><table><thead><tr><th>근거</th><th>카드</th><th>예</th></tr></thead><tbody><tr><td>215 요구가 메뉴 위치를 직접 지정</td><td>30</td><td><code>REQ-SC-003</code> 공지사항 → 서비스/이벤트 · <code>REQ-CA-002</code> 더클럽웨딩 이동</td></tr><tr><td>240 결정 D-2 (회원 C 30화면만)</td><td>12</td><td>FG-F 전건</td></tr><tr><td>횡단 — 구조 노드가 아님</td><td>9</td><td>FG-J 어드민 4 · FG-K 전역 규칙 5</td></tr><tr><td>범위 밖 표기만</td><td>4</td><td>FG-L 앱</td></tr><tr><td>K1 축 밖 명시</td><td>3</td><td>FG-I 기업정보</td></tr></tbody></table></div><blockquote>⚠️ <strong>S1~S3의 분할 축은 ①(도메인)이다.</strong> 고도화 ②가 경고한 <em>&quot;기존 구조를 그대로 재생산한다&quot;</em> 는 함정에 해당한다. <strong>의식적으로 감수했다</strong> — 이 프로젝트의 구조 재편은 <strong>L1의 재조직이 아니라 채널 통일·전역 승격·소속 이동</strong>이고, 그 판단은 S0에서 이미 요구로 확정돼 있기 때문이다. 도메인 내부의 그룹핑만 S1~S3에서 정했다.<br><br><strong>교차 배치 점검 실시</strong>: 세 세션 간 중복 배치 <strong>0건</strong> · 그룹 경계 충돌 <strong>0건</strong>.</blockquote><hr><h2>7. 정량 대체 검증 3종</h2><p><strong>실사용자 카드소팅·트리테스트를 못 했다.</strong> 그래도 측정 가능한 것 3가지를 수치로 남긴다.</p><h3>7-1. V1 동선 도달 깊이 — 유저플로우 7흐름</h3><div class='tw'><table><thead><tr><th>흐름</th><th>목표 노드</th><th>이동 횟수</th><th>판정</th></tr></thead><tbody><tr><td>UF-01 지점 정하고 들어가기</td><td><code>IA-001</code> 전역</td><td><strong>1</strong></td><td>✅</td></tr><tr><td>UF-02 지점 정보 확인</td><td><code>IA-011</code> 층별안내</td><td><strong>2</strong></td><td>✅</td></tr><tr><td>UF-03 브랜드·매장 찾기</td><td><code>IA-022</code> 브랜드 상세</td><td><strong>1</strong>(검색) / 2(메뉴)</td><td>✅</td></tr><tr><td><strong>UF-04 문화센터 강좌 신청</strong></td><td><code>IA-036</code> 수강신청</td><td><strong>4</strong></td><td>◐ <strong>최장</strong></td></tr><tr><td>UF-05 카드·멤버십</td><td><code>IA-053</code> 카드 신청</td><td><strong>3</strong></td><td>✅</td></tr><tr><td>UF-06 회원정보 관리</td><td><code>IA-081</code>~<code>090</code></td><td><strong>2</strong></td><td>✅</td></tr><tr><td>UF-07 막혔을 때</td><td><code>IA-007</code> 전역</td><td><strong>0</strong></td><td>✅</td></tr></tbody></table></div><p><strong>최장 4단계(UF-04).</strong> <code>문화센터 → 강좌 찾기 → 강좌 상세 → 신청</code>이고 <strong>거래 흐름이라 단계가 의미를 갖는다</strong>(S1→S2→S3 관례). 단축 대상이 아니다.</p><p><strong>AS-IS 대비</strong>: T3 문화센터 수강신청이 AS-IS에서 <strong>depth 7~9</strong>였다(122 표본). TO-BE 4단계.</p><h3>7-2. V2 AS-IS 대비 이동 거리</h3><div class='tw'><table><thead><tr><th>지표</th><th>값</th></tr></thead><tbody><tr><td><code>이동</code> 노드</td><td><strong>8 / 74 (11%)</strong></td></tr><tr><td>그중 <strong>승격</strong>(더 얕아짐)</td><td>3 — 검색·FAQ·지점선택</td></tr><tr><td><strong>강등</strong>(더 깊어짐)</td><td><strong>1</strong> — U-PLEX</td></tr><tr><td>횡이동(깊이 동일)</td><td>4</td></tr><tr><td><strong>무근거 이동</strong></td><td><strong>0</strong> ✅</td></tr></tbody></table></div><p><strong>강등 1건(U-PLEX)이 유일한 학습 비용 발생 지점</strong>이다. GNB 1st depth에서 지점 하위로 내려간다. REQ-SI-014의 명시적 요구이고, U-PLEX가 <strong>특정 지점(신촌점)의 시설</strong>이라 지점 하위가 구조적으로 옳다.</p><blockquote><strong>이동 11%는 낮은 편이다.</strong> 학습된 위치를 대체로 지켰다 — 이 개편의 성격이 <strong>구조 재편이 아니라 채널 통일</strong>임을 수치가 보여준다.</blockquote><h3>7-3. V3 출처 커버리지 (양방향)</h3><p><strong>순방향 — 321의 기능·컨텐츠가 모두 배치됐는가</strong></p><div class='tw'><table><thead><tr><th>구분</th><th>수</th><th>배치</th><th>미배치</th></tr></thead><tbody><tr><td>기능 (구조 대상)</td><td>93</td><td><strong>92</strong></td><td><strong>1</strong> ⚠️</td></tr><tr><td>기능 (횡단 FG-J·K)</td><td>9</td><td>—</td><td>구조 노드 아님(명시)</td></tr><tr><td>기능 (범위 밖 FG-L)</td><td>4</td><td>—</td><td>범위 표기(명시)</td></tr><tr><td><strong>컨텐츠 CT</strong></td><td><strong>24</strong></td><td><strong>24</strong></td><td><strong>0</strong> ✅</td></tr></tbody></table></div><p><strong>미배치 1건 — <code>FN-F12</code> 개인정보 동의 재획득</strong></p><div class='tw'><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td>왜 배치 못 하나</td><td>212 공백 <strong>G2</strong> — <strong>기능 존재 여부 자체가 미정</strong>이다. 있을지 없을지 모르는 기능에 구조상 자리를 줄 수 없다</td></tr><tr><td>처리</td><td>321 미정의 <strong>D1-12 ⛔</strong> 승계. <strong>H.Point 전환일(2023-01-01) 전에 닫혀야 한다</strong></td></tr><tr><td>닫히면</td><td><code>IA-087</code> H.Point 전환 하위로 편입 예정</td></tr></tbody></table></div><blockquote>⚠️ <strong>V3 검증이 실제로 미배치를 잡아냈다.</strong> 최초 작성 시 <code>FN-A05</code>(컨텍스트 없이 진입) · <code>FN-B08</code>(지점 미제공 안내) · <code>FN-D07</code>(결제 실패 재시도) · <code>FN-B10</code>(어드민 전환) 4건이 어느 노드에도 안 걸려 있었다. 앞의 3건은 <strong><code>IA-007</code> 예외·복구로 공통화</strong>되면서 출처 인용이 누락된 것이었고, <code>FN-B10</code>은 <code>IA-010</code>의 운영 속성이었다. <strong>4건 다 보완했고, 남은 1건은 닫을 수 없는 것이다.</strong><br><br>실사용자 검증을 못 하는 대신 넣은 장치가 <strong>첫 실행에서 4건을 잡았다</strong> — 고도화 ③의 값이 여기서 나왔다.</blockquote><p><strong>역방향 — 출처 없는 노드가 있는가</strong></p><div class='tw'><table><thead><tr><th>구분</th><th>수</th></tr></thead><tbody><tr><td>구조 노드</td><td>74</td></tr><tr><td>출처(FN·CT·REQ) 있음</td><td><strong>74</strong></td></tr><tr><td><strong>창작 노드</strong></td><td><strong>0</strong> ✅</td></tr></tbody></table></div><h3>7-4. ⚠️ 이 3종이 대체하지 못하는 것</h3><p><strong>라벨이 이해되는지는 여전히 모른다.</strong> 트리테스트의 본질은 <em>&quot;이 이름을 보고 원하는 걸 찾을 수 있는가&quot;</em> 이고, V1~V3은 전부 <strong>구조의 내부 정합</strong>만 잰다.</p><p>특히 위험한 라벨:</p><div class='tw'><table><thead><tr><th>라벨</th><th>우려</th></tr></thead><tbody><tr><td><code>서비스/이벤트</code></td><td>이벤트·공지·배송조회·서비스제도·챗봇이 한 그릇 — <strong>잡동사니 범주</strong>일 수 있다</td></tr><tr><td><code>지점 안내</code> (구 이용안내)</td><td>문화센터 하위인데 L1 <code>지점</code>과 이름이 겹친다 — <strong>혼동 가능</strong></td></tr><tr><td><code>기업정보</code></td><td>AS-IS에 없던 상위 묶음 — 사용자가 IR·ESG를 여기서 찾을지 미검증</td></tr></tbody></table></div><p>→ <strong>트리테스트 대상 3건으로 등재</strong>(§8 D3-6).</p><hr><h2>10. ⚠️ 이 산출물의 한계</h2><div class='tw'><table><thead><tr><th>#</th><th>한계</th><th>결과</th></tr></thead><tbody><tr><td>1</td><td><strong>실사용자 카드소팅 없음</strong></td><td>그룹핑이 <strong>사용자 멘탈모델이 아니라 요구·정책·도메인 논리</strong>에서 나왔다. 「가설 IA」</td></tr><tr><td>2</td><td><strong>트리테스트 없음</strong></td><td>라벨 이해도 미검증. V1~V3은 구조 내부 정합만 잰다(§7-4)</td></tr><tr><td>3</td><td><strong>분할 축 ①(도메인) 사용</strong></td><td>고도화 ②가 경고한 <em>&quot;기존 구조 재생산&quot;</em> 에 해당. 의식적 감수(§1-3)이나 <strong>L1 재조직의 가능성을 닫았다</strong></td></tr><tr><td>4</td><td><strong>Co-Creative 아님</strong></td><td>OSSP는 <em>&quot;카드소팅 등을 통해 Co-Creative 방식으로 구조화&quot;</em> 를 규정한다. 고객·사용자 참여 없이 단독 수렴 — <strong>312와 같은 미준수</strong></td></tr><tr><td>5</td><td>구조 노드 ≠ 화면</td><td>74노드가 965화면으로 어떻게 펼쳐지는지는 341에서 확정</td></tr></tbody></table></div><blockquote><strong>한계 4가 312와 같은 자리에서 반복됐다.</strong> 312는 Co-Creative 워크숍, 322는 Co-Creative 카드소팅. <strong>300 Define의 협업 규정이 시뮬레이션에서 구조적으로 재현 불가능하다</strong> — 이 문서도 워크숍 <strong>입력 초안</strong>이지 결과물이 아니다.</blockquote><hr><h2>11. ★ 원본 대조 예고 — 첫 IA 정량 대조점</h2><p>원본 <code>12.UX_분석／기초설계/03.IA (HDDS_IA)</code> <strong>봉인 유지.</strong></p><p>수급 이력(112)에서 확인된 원본 IA의 진화:</p><div class='tw'><table><thead><tr><th>시점</th><th>파일</th></tr></thead><tbody><tr><td>2022-07-21</td><td><code>0721_AsIs IA</code> — <strong>현행 IA 수급</strong></td></tr><tr><td>2022-07-25</td><td><code>0725_현대백화점_ehyundai_IA_.xlsx</code></td></tr><tr><td>2022-12-16</td><td><code>HDDS_IA 반영건_221216.xlsx</code> — <strong>변경분 대장</strong></td></tr><tr><td>2023-01-03</td><td><code>230103_IA수정 최종</code></td></tr><tr><td>2023-02-22</td><td><code>230222_PC IA 어드민 확인 문서</code></td></tr></tbody></table></div><blockquote><strong>원본도 「변경분(반영건)」을 별도 관리했다.</strong> 고도화 ①-3의 변경분 대장이 실무 관행과 일치한다는 방증이다.</blockquote><h3>측정 지표</h3><div class='tw'><table><thead><tr><th>축</th><th>지표</th></tr></thead><tbody><tr><td><strong>구조</strong></td><td>L1 개수·구성 일치도 · 계층 깊이 · 전역/계층 구분 여부</td></tr><tr><td><strong>내용</strong></td><td><strong>노드 재현율 / 과잉률</strong> · 라벨 일치도 · 소속(경로) 일치도</td></tr><tr><td><strong>변경분</strong></td><td>이동·신설·제거 판정 일치도 — <strong>원본 「반영건」과 직접 대조</strong></td></tr><tr><td><strong>차이 원인</strong></td><td>입력 부족 / 사람 판단 / 스킬 결함 / 시점 제약</td></tr></tbody></table></div><p>⚠️ 본 문서는 <strong>1회 작성 가설 IA</strong>이고 원본은 <strong>최소 5회 개정본</strong>이다. 성숙도 차이를 감안해 해석해야 한다.</p><hr>", "skill_info": [{"name": "vinylc_information-architecture", "version": "0.1.0-c2202500.1", "local": false}], "docs": [{"name": "정보구조도.md", "path": "sim-project/300_Define/320_정보구조설계/322_정보구조설계/정보구조도.md", "html": "<h1>정보구조도 (IA) — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>입력: <strong>321 기능정의서</strong>(기능 106·컨텐츠 24, 핸드오프 스키마) · <strong>122 AS-IS IA</strong>(PC 12영역/MWEB 15영역) · 312 유저플로우(7흐름) · 242 UX컨셉 K1~K4 · 215 요구 78 · 212 정책 · 240 결정 D-2·D-3·D-4<br>⚠️ <strong>가설 IA</strong> — 실사용자 카드소팅·트리테스트 미실시. 대신 정량 대체 검증 3종 실시(§7)<br>⚠️ <strong>331 와이어프레임·341 화면명세의 상류 SSOT.</strong> 구조가 바뀌면 하류가 상속한다</blockquote><hr><h2>0. 핵심 판단 — <strong>지점을 계층에 넣지 않는다</strong></h2><p>242 <strong>K1</strong>은 「어느 점포인가」로 시작한다이고, 그 설계함의 ③은 <em>&quot;PC GNB 32개 평면 구조를 <strong>지점 컨텍스트가 관통</strong>하도록 재편&quot;</em> 이다.</p><p><strong>「관통한다」는 「최상위에 둔다」가 아니다.</strong> 이 구분이 이번 IA의 전부다.</p><div class='tw'><table><thead><tr><th>안</th><th>구조</th><th>결과</th></tr></thead><tbody><tr><td>❌ <strong>지점을 L1으로</strong></td><td><code>지점 &gt; 층별 / 행사 / 브랜드 / 문화센터 …</code></td><td>지점 16개 × 하위 = <strong>화면이 곱해진다.</strong> 241 <strong>O-6</strong>이 지적한 AS-IS의 병이 그대로 재생산되고 <strong>K2(한 번 만들고 지점마다 붙인다)와 정면 충돌</strong></td></tr><tr><td>✅ <strong>지점을 컨텍스트 축으로</strong></td><td>트리는 도메인으로 계층화 · <strong>지점은 모든 노드에 붙는 속성</strong></td><td>지점이 늘어도 노드가 안 는다. K1과 K2가 동시에 성립</td></tr></tbody></table></div><p><strong>채택: 지점은 트리 노드가 아니라 전역 컨텍스트다.</strong> 모든 구조 노드에 <strong><code>지점종속</code> / <code>지점무관</code></strong> 속성을 단다.</p><blockquote>312에서 <em>&quot;채널로 나누지 않는 것 자체가 설계였다&quot;</em> 고 적었다. <strong>322에서는 「지점으로 나누지 않는 것」이 같은 자리에 온다.</strong> 컨셉이 통일을 말할 때, 그 축으로 트리를 쪼개면 컨셉을 부순다.</blockquote><hr><h2>2. TO-BE 최상위 구조 — <strong>양 채널 동일</strong></h2><p>AS-IS는 채널마다 최상위가 달랐다. TO-BE는 하나다 — <strong>K1·K3의 실행</strong>이다.</p><div class='tw'><table><thead><tr><th></th><th>AS-IS PC</th><th>AS-IS MWEB</th><th><strong>TO-BE (양 채널)</strong></th></tr></thead><tbody><tr><td>1st depth</td><td><strong>32</strong> (GNB 평면)</td><td><strong>6</strong> (전체메뉴 허브)</td><td><strong>7 + 전역 8</strong></td></tr><tr><td>진입 모델</td><td>GNB 직행</td><td>허브 경유</td><td><strong>동일</strong></td></tr></tbody></table></div><h3>2-1. L1 7개</h3><div class='tw'><table><thead><tr><th>#</th><th>L1</th><th>지점</th><th>근거 흐름</th><th>AS-IS 영역</th></tr></thead><tbody><tr><td>1</td><td><strong>지점</strong></td><td>지점종속</td><td>UF-02</td><td>PSI 91 / MSI 101</td></tr><tr><td>2</td><td><strong>브랜드·매장</strong></td><td>혼합</td><td>UF-03</td><td>PBR 19 / MBR 22</td></tr><tr><td>3</td><td><strong>문화센터·공연·전시</strong></td><td>지점종속</td><td>UF-04</td><td>PCU 85 / MCU 50</td></tr><tr><td>4</td><td><strong>카드·상품권·멤버십</strong></td><td>지점무관</td><td>UF-05</td><td>PCA 257 / MCA 86</td></tr><tr><td>5</td><td><strong>서비스·이벤트</strong></td><td>혼합</td><td>—</td><td>PSC 71 / MSV 42 / MEN 9</td></tr><tr><td>6</td><td><strong>마이페이지</strong></td><td>지점무관</td><td>UF-06</td><td>PMY 19 / MMY 13 (C 30만)</td></tr><tr><td>7</td><td><strong>기업정보</strong></td><td><strong>지점무관 — K1 축 밖 명시</strong></td><td>—</td><td>PIV 20 / MIV 22 / PES 17 / MES 17</td></tr></tbody></table></div><h3>2-2. 전역 8개 — 계층 밖</h3><p><strong>전역은 L1이 아니다.</strong> 모든 화면에서 도달 가능한 컴포넌트·진입점이다.</p><div class='tw'><table><thead><tr><th>노드</th><th>성격</th><th>AS-IS</th></tr></thead><tbody><tr><td>지점 선택</td><td><strong>컨텍스트 확립 (K1)</strong></td><td>MWEB만 <code>MSS</code></td></tr><tr><td>통합검색</td><td><strong>영역 → 전역 승격</strong></td><td>PSE 3 / MSE 3</td></tr><tr><td>GNB·전체메뉴</td><td>진입 구조</td><td>PC GNB / MWEB <code>MAM</code></td></tr><tr><td>사이트맵</td><td>구조 조망</td><td>PC만</td></tr><tr><td><strong>통합 고객센터</strong></td><td><strong>신설</strong> — 도움말 단일 진입점</td><td>산재 (PC 4 / MWEB 3)</td></tr><tr><td>로그인</td><td>인증 (B 21화면 — 범위 밖)</td><td>PLO 26 / MLO 10</td></tr><tr><td><strong>예외·복구 화면군</strong></td><td><strong>전면 신설</strong></td><td><strong>0건</strong></td></tr><tr><td>Footer·약관</td><td>법정 고지 (A 17 — 범위 밖)</td><td>PFO 5</td></tr></tbody></table></div><hr><h2>2-3. 뎁스 범례 — <strong>각 계층이 어떤 내비게이션에 대응하는가</strong></h2><p>뎁스를 추상 계층으로 두지 않고 <strong>내비게이션 소속으로 정의</strong>한다. 이 범례가 없으면 331·341이 계층을 임의로 화면에 매핑한다.</p><div class='tw'><table><thead><tr><th>계층</th><th>내비게이션</th><th>성격</th></tr></thead><tbody><tr><td><strong>전역</strong></td><td>헤더 유틸 · 푸터 · 전역 오버레이</td><td>계층 밖. 어느 화면에서든 도달</td></tr><tr><td><strong>L1</strong></td><td><strong>GNB (양 채널 동일 7)</strong></td><td>업무 도메인</td></tr><tr><td><strong>L2</strong></td><td>LNB / SNB</td><td>도메인 내 분류 또는 화면</td></tr><tr><td><strong>L3</strong></td><td>화면 내 이동 · 서브 목록</td><td>대부분 화면</td></tr><tr><td><strong>L4</strong></td><td>거래 스텝 (S1→S2→S3)</td><td>화면</td></tr><tr><td><em>탭·레이어·팝업</em></td><td><strong>IA 트리에 노출하지 않음</strong></td><td>341 화면 원장에서 행으로 전개</td></tr></tbody></table></div><blockquote><strong>탭·레이어를 트리에 올리지 않는다.</strong> VIP프로그램 2Tab은 <code>IA-059</code> 한 노드의 속성이지 두 노드가 아니다. 이 규율이 깨지면 IA가 화면 목록이 되어 322와 341의 경계가 사라진다.</blockquote><h2>2-4. 영역 코드 사전 — <strong>채번 전에 먼저 확정한다</strong></h2><p><code>IA-NNN</code> 평면 채번은 임시다. <strong>331 착수 전에 영역 코드로 재부여</strong>한다(§12-2 갭 ⑥).</p><div class='tw'><table><thead><tr><th>영역</th><th>코드</th><th>L1</th><th>기준 노드</th></tr></thead><tbody><tr><td>전역·공통</td><td><strong><code>COM</code></strong></td><td>(전역)</td><td>IA-001~009</td></tr><tr><td>지점</td><td><strong><code>STR</code></strong></td><td>L1-1</td><td>IA-010~018</td></tr><tr><td>브랜드·매장</td><td><strong><code>BRD</code></strong></td><td>L1-2</td><td>IA-020~026</td></tr><tr><td>문화센터·공연·전시</td><td><strong><code>CUL</code></strong></td><td>L1-3</td><td>IA-030~044</td></tr><tr><td>카드·상품권·멤버십</td><td><strong><code>CRD</code></strong></td><td>L1-4</td><td>IA-050~063</td></tr><tr><td>서비스·이벤트</td><td><strong><code>SVC</code></strong></td><td>L1-5</td><td>IA-070~075</td></tr><tr><td>마이페이지</td><td><strong><code>MYP</code></strong></td><td>L1-6</td><td>IA-080~090</td></tr><tr><td>기업정보</td><td><strong><code>CRP</code></strong></td><td>L1-7</td><td>IA-095~097</td></tr><tr><td>예외·복구</td><td><strong><code>ERR</code></strong></td><td>(전역)</td><td>IA-007 전개분</td></tr></tbody></table></div><p><strong>9영역.</strong> 채번 문법은 <code>{채널}-{영역코드}{2자리 그룹}{2자리 순번}</code> — 예: <code>HD-CRD0101</code>(카드 종류·혜택 본판) → <code>HD-CRD0102</code>(파생 레이어).</p><p>⚠️ <strong>채번은 트리가 안정된 뒤 별도 이벤트로 일괄 수행한다.</strong> 지금 부여하면 331에서 구조가 흔들릴 때마다 ID가 바뀐다.</p><hr><h2>3. 구조 노드 (74) — 계층·경로·변경 등급</h2><p>표기: <code>유지</code> / <code>개명</code> / <strong><cod ode>지점선택L</code></td><td><code>브랜드 &gt; 오프웍스</code></td><td>횡이동</td><td>REQ-SI-007</td></tr><tr><td>IA-041 자주하는 질문</td><td><code>문화센터 &gt; 이용안내 &gt; FAQ</code></td><td><strong>전역 고객센터</strong></td><td><strong>승격</strong></td><td>122 H10</td></tr><tr><td>IA-063 더클럽웨딩</td><td><code>서비스 &gt; 더클럽웨딩</code></td><td><code>카드·멤버십 &gt; 더클럽웨딩</code></td><td>횡이동</td><td>REQ-CA-002</td></tr><tr><td>IA-071·072 이벤트·공지</td><td>MWEB <code>이벤트/공지사항</code></td><td><code>서비스·이벤트 &gt; …</code></td><td>횡이동</td><td>REQ-SC-002·003</td></tr></tbody></table></div><blockquote><strong>이동 8건 전부 근거가 있다.</strong> 무근거 이동 0건 — V2 검증(§7-2).</blockquote><h3>4-3. <strong>제거 5건</strong> — 삭제인가 숨김인가</h3><div class='tw'><table><thead><tr><th>노드</th><th>처리</th><th>구분</th><th>근거</th></tr></thead><tbody><tr><td>행사안내 &gt; 추천정보 탭</td><td>삭제</td><td><strong>삭제</strong></td><td>REQ-SI-010</td></tr><tr><td>문화센터 소식</td><td>삭제</td><td><strong>삭제</strong></td><td>REQ-CU-005</td></tr><tr><td>E-카탈로그 메뉴</td><td><strong>메뉴만 제거</strong></td><td><strong>이관</strong> — 강좌 화면에서 버튼 소구</td><td>REQ-CU-006</td></tr><tr><td>VOC 위원회</td><td><strong>개발 숨김 처리</strong></td><td><strong>숨김</strong> — 추후 사용 가능성</td><td>REQ-SC-008</td></tr><tr><td>서비스·콘텐츠 &gt; 채널</td><td><strong>메뉴 제거</strong></td><td><strong>이관</strong> — 메인 소구 / MWEB 전체메뉴 아이콘</td><td>REQ-MA-003 · SC-011</td></tr></tbody></table></div><blockquote><strong>실제로 없어지는 것은 2건뿐이다.</strong> 나머지 3건은 이관·숨김이다. 321에서 발견한 것과 같은 패턴 — <strong>개편은 빼기가 아니라 재배치다.</strong></blockquote><h3>4-4. <strong>신설 10건</strong></h3><div class='tw'><table><thead><tr><th>노드</th><th>라벨</th><th>근거</th></tr></thead><tbody><tr><td><code>IA-001</code></td><td>지점 선택 (전역)</td><td><strong>K1</strong> 실행 장치</td></tr><tr><td><code>IA-005</code></td><td>통합 고객센터</td><td>122 <strong>H10</strong> 도움말 산재</td></tr><tr><td><code>IA-007</code></td><td>예외·복구</td><td>122 <strong>H9</strong> 오류 화면 0건 · <strong>K4</strong></td></tr><tr><td><code>IA-015</code></td><td>지점 특성 모듈</td><td><strong>K2</strong> trade-off R-1</td></tr><tr><td><code>IA-016</code></td><td>Sounds Forest · ALT.1</td><td>REQ-SI-005</td></tr><tr><td><code>IA-018</code></td><td>더현대 대구</td><td>REQ-SI-006 · <strong>K2 검증 사례</strong></td></tr><tr><td><code>IA-023</code></td><td>패션/뷰티 브랜드</td><td>REQ-BR-001</td></tr><tr><td><strong><code>IA-026</code></strong></td><td><strong>최근본·즐겨찾기</strong></td><td>122 H6 · 242 I-7 — <strong><code>[가정]</code> 요구 근거 없음</strong></td></tr><tr><td><code>IA-033</code></td><td>MWEB 문화센터 서브메인</td><td>REQ-CU-007</td></tr><tr><td><code>IA-038</code></td><td>대기 상태 조회</td><td>312 신규발견 ②</td></tr><tr><td><code>IA-044</code></td><td>공식 SNS 채널</td><td>REQ-CU-003</td></tr><tr><td><code>IA-050</code></td><td>MWEB 카드 서브메인</td><td>REQ-CA-005·006</td></tr><tr><td><code>IA-054</code></td><td>카드 신청 취소</td><td>122 <strong>H3</strong> · 241 I-9</td></tr><tr><td><code>IA-097</code></td><td>그린 경영활동 상세</td><td>REQ-ES-001</td></tr></tbody></table></div><p><strong>근거 없는 신설은 <code>IA-026</code> 최근본·즐겨찾기 1건뿐</strong>이고 <code>[가정]</code> 라벨 + 미정의 D1-3으로 등재돼 있다.</p><hr><h2>5. 채널 통일 실적 (K1·K3)</h2><div class='tw'><table><thead><tr><th>항목</th><th>AS-IS</th><th>TO-BE</th></tr></thead><tbody><tr><td>1st depth</td><td>PC <strong>32</strong> / MWEB <strong>6</strong></td><td><strong>양 채널 7 + 전역 8</strong></td></tr><tr><td>진입 모델</td><td>GNB 직행 ↔ 허브 경유</td><td><strong>동일</strong></td></tr><tr><td>지점 선택</td><td>MWEB만</td><td><strong>양 채널 전역</strong></td></tr><tr><td>검색 위치</td><td>영역 하위</td><td><strong>양 채널 전역</strong></td></tr><tr><td>사이트맵</td><td>PC만</td><td><strong>양 채널</strong></td></tr><tr><td>비밀번호 변경</td><td>PC만</td><td><strong>양 채널</strong></td></tr><tr><td>차량번호</td><td>MWEB만</td><td><strong>양 채널</strong></td></tr><tr><td>H.Point 전환</td><td>PC만</td><td><strong>양 채널</strong></td></tr><tr><td>VIP프로그램</td><td>PC 1P ↔ MWEB 1P</td><td><strong>양 채널 2Tab</strong> (D-3)</td></tr><tr><td>카드·문화센터 서브메인</td><td>PC만</td><td><strong>양 채널</strong></td></tr></tbody></table></div><h3>5-1. 남는 채널 차이 <strong>2건 — 전부 명시적 결정</strong></h3><div class='tw'><table><thead><tr><th>노드</th><th>차이</th><th>결정 근거</th><th>사유 기록</th></tr></thead><tbody><tr><td><code>IA-085</code> 로그인 기록</td><td><strong>PC 전용</strong></td><td>240 결정 D-4</td><td><strong>341 화면명세 의무</strong></td></tr><tr><td><code>IA-073</code> 배송조회</td><td><strong>PC 전용</strong></td><td>REQ-SC-007</td><td><strong>341 화면명세 의무</strong> ⚠️ 신규</td></tr></tbody></table></div><blockquote><strong>K3는 &quot;차이를 없애라&quot;가 아니라 &quot;다르게 두려면 사유를 적어라&quot;다.</strong> AS-IS의 채널 결손 9건(241 I-3) 중 <strong>7건 해소 · 2건은 결정으로 유지</strong>. 방치와 결정을 구분한 것이 K3의 실행이다.<br><br>⚠️ <strong><code>IA-073</code> 배송조회는 240에서 판정한 적이 없다.</strong> REQ-SC-007이 &quot;PC만 진행&quot;이라 했을 뿐 K3 관점 검토를 거치지 않았다 → <strong>D3-5 신설</strong>(§8).</blockquote><hr><h2>6. 계층 깊이 — AS-IS 대비</h2><div class='tw'><table><thead><tr><th>채널</th><th>AS-IS 평균 depth</th><th>AS-IS 최대</th><th>depth 7+</th><th><strong>TO-BE 최대</strong></th></tr></thead><tbody><tr><td>PC</td><td>5.17</td><td>9</td><td>67건 (11%)</td><td><strong>L4</strong></td></tr><tr><td>MWEB</td><td><strong>6.41</strong></td><td><strong>11</strong></td><td><strong>171건 (44%)</strong></td><td><strong>L4</strong></td></tr></tbody></table></div><p>MWEB이 깊었던 구조적 원인은 <em>&quot;모든 경로가 <code>메인 &gt; 전체메뉴 &gt; …</code>를 거치기 때문&quot;</em>(122 H7)이다. <strong>전역 진입점 8개를 계층 밖에 두면서 이 경유가 사라진다.</strong></p><p>⚠️ <strong>단서</strong>: 위 AS-IS depth는 <strong>화면 경로 기준</strong>(1,003화면)이고 TO-BE는 <strong>구조 노드 기준</strong>(74노드)이다. <strong>구조 노드 ≠ 화면</strong>이므로 직접 비교가 아니다. 실제 화면 depth는 341에서 확정된다.</p><hr><h2>8. 미정의사항 — 321에서 승계 + 신규</h2><p><strong>321 §7-1-1에서 배운 것을 적용했다</strong>: 상류 미결을 승계·닫힘·해당없음으로 <strong>명시 판정</strong>한다(관찰 7).</p><h3>8-1. 321 미정의 34건 승계 점검</h3><div class='tw'><table><thead><tr><th>판정</th><th>건수</th><th>내역</th></tr></thead><tbody><tr><td><strong>승계</strong>(IA에 그대로)</td><td>28</td><td>D1-1~16 대부분 · D2 6건 · D4 2건</td></tr><tr><td><strong>닫힘</strong></td><td><strong>2</strong></td><td><strong>D3-1 MWEB 사이트맵 → <code>IA-004</code>로 신설 확정</strong> · <strong>D3-3 통합 고객센터 범위 → <code>IA-005</code>로 확정</strong>(FAQ·챗봇·ARS 집약)</td></tr><tr><td>해당없음(구조 무관)</td><td>4</td><td>D1-14 띄어쓰기 · D1-15 폰트 폴백 · D2-6 흰디 · D1-5 결제 연동</td></tr></tbody></table></div><p><strong>소실 0건.</strong></p><h3>8-2. 322 신규 3건</h3><div class='tw'><table><thead><tr><th>#</th><th>항목</th><th>관련 노드</th><th>닫는 주체</th><th>시점</th><th>⛔</th></tr></thead><tbody><tr><td><strong>D3-5</strong></td><td><strong><code>IA-073</code> 배송조회 PC 전용 — K3 관점 미검토</strong></td><td>IA-073</td><td>기획PL·고객</td><td>341 화면명세</td><td></td></tr><tr><td><strong>D3-6</strong></td><td><strong>트리테스트 대상 라벨 3건</strong> (<code>서비스/이벤트</code>·<code>지점 안내</code>·<code>기업정보</code>)</td><td>IA-070·039·L1-7</td><td>기획자 (실사용자 확보 시)</td><td><strong>미정 — 실검증 불가</strong></td><td></td></tr><tr><td><strong>D3-7</strong></td><td><strong><code>이동</code> 8건의 리다이렉트 처리 주체</strong></td><td>이동 8노드</td><td>개발PL·퍼블리싱PL</td><td>353 UI개발가이드</td><td></td></tr></tbody></table></div><blockquote><strong>D3-7은 표준의 미완성 항목이기도 하다</strong> — IA가 구 경로→신 경로를 남기는 것까지는 정했으나, <strong>실제 301 처리를 누가 하는지 경계가 없다.</strong></blockquote><hr><h2>9. 하류로 넘기는 것</h2><div class='tw'><table><thead><tr><th>대상</th><th>내용</th></tr></thead><tbody><tr><td><strong>331 와이어프레임</strong></td><td>구조 노드 74 · <strong>전역 8을 먼저 설계</strong>(모든 화면이 상속) · <code>IA-015</code> 지점 특성 모듈 종류(D3-2)</td></tr><tr><td><strong>332 컨텐츠가이드</strong></td><td><code>IA-022</code> 브랜드 명칭 사전(CT-20) · <code>IA-007</code> 오류 메시지 사전(CT-21) · <strong>라벨 표기 규칙</strong></td></tr><tr><td><strong>341 화면명세</strong></td><td><strong>구조 노드 ≠ 화면</strong> — 노드당 화면 수 확정 · <code>IA-085</code>·<code>IA-073</code> <strong>PC 전용 사유 기록 의무</strong> · D3-4 Footer 경계</td></tr><tr><td><strong>353 UI개발가이드</strong></td><td><strong><code>이동</code> 8건 리다이렉트 매핑</strong>(D3-7)</td></tr><tr><td><strong>132</strong></td><td>⚠️ 여전히 못 닫음 — §9-1</td></tr></tbody></table></div><h3>9-1. ⚠️ 132 재산정 — 3회째 이월</h3><p>FG-H 예외 화면군 규모를 312 → 321 → <strong>322에서도 확정하지 못했다.</strong></p><p><code>IA-007</code> 예외·복구를 <strong>전역 노드 1개</strong>로 잡았지만, <strong>구조 노드 1개가 화면 1개가 아니다.</strong> 404·권한·세션·결제실패·정원초과·자격미달 6종을 공통 템플릿 1세트로 만들지 영역별 변형을 둘지는 <strong>331 와이어프레임의 판단</strong>이다.</p><p>→ <strong>회신 시점 331 유지.</strong> 322에서 화면 수를 쓰면 수치 창작이다.</p><hr><h2>12. 재사용 자산 대조 — <code>spec-harness</code> 증류 규칙 27종</h2><p>완료 프로젝트 4건(신한카드 올댓 · mPOP · m.ALL · NCP-2025)에서 <strong>실측 근거와 함께 역추출된 IA 작성 규칙</strong>과 대조했다. 참조 경계는 <code>sim-project/_재사용자산-매핑.md</code> §3.</p><h3>12-1. ✅ 이미 지킨 것 (5)</h3><div class='tw'><table><thead><tr><th>규칙</th><th>이 문서의 대응</th></tr></thead><tbody><tr><td><strong>①-2</strong> To-Be IA는 <strong>업무 도메인 기준</strong>으로 재편성 (As-Is는 UI 존 기준)</td><td>L1 7개가 전부 업무 도메인. AS-IS의 UI 존(GNB 32 평면)을 그대로 쓰지 않았다</td></tr><tr><td><strong>①-3</strong> 유틸리티·공통 영역은 <strong>업무 트리와 분리된 별도 그룹</strong>으로</td><td><strong>전역 8개</strong> (§2-2). 실측 원천도 동일 — m.ALL은 GNB 밖 그룹, 올댓은 <code>Util.</code> 열</td></tr><tr><td><strong>②-8</strong> 탭·레이어·화면 내 하위항목은 <strong>IA 트리에 노출하지 않는다</strong></td><td>VIP 2Tab을 <code>IA-059</code> 속성으로. §2-3 범례에 명문화</td></tr><tr><td><strong>③-13</strong> 삭제 행도 <strong>지우지 않고 마킹만 하고 보존</strong></td><td>제거 5건을 §3 표에 취소선으로 남김 + §4-3 별표</td></tr><tr><td><strong>④-18</strong> 요건 1건 ≠ 화면 1개 · <strong>요건ID↔노드 다대다 연결 컬럼</strong></td><td><code>출처</code> 열이 FN·CT·REQ 다대다. V3 커버리지 검증의 기반</td></tr></tbody></table></div><h3>12-2. ⚠️ 미적용 갭 (6) — 하류에서 닫는다</h3><div class='tw'><table><thead><tr><th>#</th><th>규칙</th><th>왜 못 했나 / 어디서 닫나</th></tr></thead><tbody><tr><td><strong>①-4</strong></td><td><strong>분류 체계가 논점이면 대안을 병렬 검토 후 확정</strong> (mPOP <code>메뉴체계</code> 시트: As-Is 5분류 + To-Be 1안/2안 비교표)</td><td><strong>안 했다.</strong> 단일안으로 직행. §1-3에서 분할 축 ①(도메인)을 감수한 것과 같은 문제 — <strong>L1 재조직의 대안을 검토하지 않았다.</strong> Co-Creative 워크숍이 없어 비교표를 세울 자리도 없었다 → <strong>한계로 기록</strong></td></tr><tr><td><strong>③-10</strong></td><td>판정 전 <strong>As-Is 전량 원장 + 행마다 처분 플래그</strong> (mPOP 510행)</td><td>122가 규모 때문에 표본화(영역 집계). <strong>행 단위 처분 판정이 불가능하다</strong> → <strong>341 화면명세에서 965행 원장으로</strong></td></tr><tr><td><strong>③-11</strong></td><td>판정의 <strong>1차 근거는 이용 실측 데이터</strong> (mPOP <code>참고.메뉴순위</code> 조회수·사용비중)</td><td><strong>214 로그 부재</strong> — D4-1 확정. 이 규칙이 요구하는 근거가 원천적으로 없다</td></tr><tr><td><strong>③-12</strong></td><td>통합(N:1)은 신규 행의 <strong>「구메뉴 통합목록」 컬럼</strong>에 구화면명 나열</td><td><code>이동</code> 8건은 1:1 매핑만. <strong>N:1 통합 기록 컬럼 없음</strong> → 341에서 신설</td></tr><tr><td><strong>⑤-19·20</strong></td><td><strong>사이트맵형 + 원장형 이원 표현</strong>, 원장형이 SSOT</td><td>원장형(§3 표)만 있다. <strong>합의용 사이트맵형 미작성</strong> → 331에서 메뉴맵 렌더</td></tr><tr><td><strong>⑥-23·24·25</strong></td><td><strong>영역 코드 사전 먼저 → <code>{채널}-{영역코드}{계층}</code> 채번 · ID는 화면에만</strong></td><td>§2-4에 사전은 만들었으나 <strong>채번 미적용</strong>(IA-NNN 평면, 분류 노드에도 부여). <strong>331 착수 전 일괄 재부여</strong></td></tr></tbody></table></div><h3>12-3. 🔍 발견 — 처분 어휘가 실측과 다르다</h3><div class='tw'><table><thead><tr><th>계열</th><th>실측 열거값</th><th>쓰는 단계</th></tr></thead><tbody><tr><td><strong>설계 단계</strong></td><td>`신규 \\</td><td>개선 \\</td><td>유지 \\</td><td>재활용` (mPOP 실측: 개선166·유지20·신규8·재활용2)</td><td>신규 구축·전면 개편</td></tr><tr><td><strong>운영·변경 단계</strong></td><td>`추가 \\</td><td>삭제 \\</td><td>이동` (올댓 실측: 추가152·삭제125·이동22)</td><td>운영 중 변경</td></tr><tr><td><strong>이 문서</strong></td><td>`유지 \\</td><td>개명 \\</td><td>이동 \\</td><td>신설 \\</td><td>제거`</td><td><strong>두 계열을 섞었다</strong></td></tr></tbody></table></div><p><strong>섞은 것이 틀렸다고 보지 않는다</strong> — 이 프로젝트는 「전면 개편」이 아니라 <strong>채널 통일 중심 개편</strong>이라 설계 어휘(신규/개선)와 운영 어휘(이동/삭제)가 <strong>둘 다 필요</strong>하다. 다만 실측 관행과 다르므로 <strong>명시적 선택임을 기록</strong>한다.</p><p>⚠️ 실측에 있고 이 문서에 없는 값: <strong><code>재활용</code></strong>(구 자산을 그대로 재사용). 이 프로젝트에도 해당분이 있을 수 있으나 판정 기준이 없어 <code>유지</code>로 흡수했다 → 341에서 분리 검토.</p><h3>12-4. 구조적으로 배운 것 — <strong>작성자와 판정자를 나눈다</strong></h3><p><code>spec-harness</code>의 <code>agents/02-ia.md</code> 원문:</p><blockquote><em>&quot;당신은 IA 산출물을 <strong>작성</strong>한다. <strong>판정하지 않는다</strong> — 합격 여부는 verifier가 판정한다.&quot;</em><br><em>&quot;이전 단계 산출물과 모순을 발견하면 <strong>작성을 멈추고 총괄에 보고</strong>한다 (임의 조정 금지).&quot;</em></blockquote><p><strong>두 번째가 이 프로젝트에서 실제로 문제가 된 지점을 겨눈다.</strong> 132 인용값 미갱신·321 상류 미결 승계 누락은 전부 <strong>상류 모순을 하류가 스스로 봉합한 결과</strong>였다. 상세는 <code>_재사용자산-매핑.md</code> §2-1·2-2.</p>", "bytes": 41282, "deliv": "322_정보구조설계/정보구조도.html"}], "asis_html": "", "inbox": {"required": ["기능정의서(vinylc_functional-spec)", "유저플로우(vinylc_user-flow)", "퍼소나(vinylc_persona)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/300_Define/320_정보구조설계/322_정보구조설계", "body_html": "<h1>322 정보구조설계 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_information-architecture</code> v0.1.0-<strong>c2202500.1</strong> → 로컬 포크</p><h2>스킬 고도화 (이번 작업에서 수행)</h2><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>「개편형 — 현행 IA를 받아 고친다」 · <code>depends_on</code>에 AS-IS 추가 · 변경 등급 5종 · 변경분 대장</strong></td><td>원 스킬은 백지 신규 절차만 규정. <strong>개편 IA의 실사용 형태는 전체 트리가 아니라 변경분 목록</strong>이다 — 원본도 <code>HDDS_IA 반영건</code>을 따로 관리했다. <code>이동</code>을 <code>제거+신설</code>로 쓰면 리다이렉트·콘텐츠 이관이 무너진다</td></tr><tr><td>2</td><td><strong>「카드가 권장 상한을 넘을 때 — 분할 기준」</strong></td><td>웹 근거 30~50장인데 이 프로젝트는 <strong>130장</strong>(2.6배). 원 스킬은 &quot;세션 분할&quot;만 적고 <strong>분할 축이 없다.</strong> 게다가 30~50은 <strong>실사용자 피로 기준</strong>이라 가정 소팅엔 그대로 적용 안 됨. 축 4종 + <strong>&quot;③ 확정/미확정을 먼저&quot;</strong></td></tr><tr><td>3</td><td><strong>「실사용자 검증 불가 시 — 정량 대체 검증 3종」</strong></td><td>원 스킬은 &quot;미검증-가설 라벨&quot;로 끝나 <strong>품질을 못 잰다.</strong> V1 동선 도달 깊이 · V2 AS-IS 대비 이동 거리 · V3 출처 커버리지 양방향</td></tr></tbody></table></div><p><strong>전사 환류 판단</strong>: 3건 유효. ①은 <strong><code>depends_on</code>에 AS-IS 누락 3연속</strong>(312·321·322)의 세 번째</p><h2>산출물</h2><ul><li><code>정보구조도.md</code> — <strong>구조 노드 74</strong> · L1 7 + 전역 8 · 변경분 대장</li></ul><div class='tw'><table><thead><tr><th>등급</th><th>유지</th><th>개선</th><th>개명</th><th><strong>이동</strong></th><th><strong>신설</strong></th><th>(제거)</th></tr></thead><tbody><tr><td>노드</td><td>24</td><td>20</td><td>8</td><td><strong>8</strong></td><td><strong>14</strong></td><td>5</td></tr></tbody></table></div><h2>이후 어디에 쓰이나</h2><ul><li><strong>331</strong> 전역 8 선설계(모든 화면이 상속) · <code>IA-015</code> 지점 특성 모듈 종류</li><li><strong>332</strong> 라벨 표기 규칙 · <code>CT-20</code> 명칭 사전 · <code>CT-21</code> 오류 메시지 사전</li><li><strong>341</strong> 노드당 화면 수 확정 · <code>IA-085</code>·<code>IA-073</code> <strong>PC 전용 사유 기록 의무</strong></li><li><strong>353</strong> <code>이동</code> 8건 리다이렉트 매핑 (D3-7)</li><li><strong>132</strong> 예외 화면군 규모 — <strong>3회째 이월</strong>(331로)</li></ul><h2>도출된 인사이트</h2><p><strong>지점을 계층에 넣지 않은 것이 이번 설계의 전부다.</strong> K1의 <em>&quot;지점 컨텍스트가 관통하도록&quot;</em> 을 &quot;지점을 최상위로&quot;로 읽으면 <code>지점 16개 × 하위</code>가 되어 <strong>K2와 정면 충돌</strong>하고 241 O-6이 지적한 AS-IS의 병을 재생산한다. 지점을 <strong>트리 노드가 아니라 전역 컨텍스트 속성</strong>으로 두면 K1과 K2가 동시에 성립한다. 312에서 <em>&quot;채널로 나누지 않는 것 자체가 설계&quot;</em> 였던 것과 같은 자리다 — <strong>컨셉이 통일을 말할 때 그 축으로 트리를 쪼개면 컨셉을 부순다.</strong></p><p><strong>1st depth가 PC 32 / MWEB 6에서 양 채널 7+전역 8로 통일됐다.</strong> MWEB이 구조적으로 1.24 depth 깊었던 원인(<code>메인 &gt; 전체메뉴 &gt; …</code> 경유)이 <strong>전역 8개를 계층 밖에 두면서</strong> 사라진다.</p><p><strong>이동이 74노드 중 8건(11%)뿐이다.</strong> 학습된 위치를 대체로 지켰다 — 이 개편의 성격이 <strong>구조 재편이 아니라 채널 통일</strong>임을 수치가 보여준다. 강등(더 깊어짐)은 U-PLEX 1건뿐이고 그것도 &quot;특정 지점의 시설&quot;이라 구조적으로 옳다.</p><p><strong>제거 5건 중 실제로 없어지는 것은 2건이다.</strong> E-카탈로그·채널은 이관, VOC는 숨김. 321에서 본 것과 같은 패턴 — <strong>개편은 빼기가 아니라 재배치다.</strong></p><p><strong>⚠️ V3 검증이 첫 실행에서 미배치 4건을 잡았다.</strong> <code>FN-A05</code>·<code>B08</code>·<code>D07</code>이 <code>IA-007</code> 예외·복구로 공통화되면서 출처 인용이 누락됐고, <code>FN-B10</code>은 <code>IA-010</code>의 운영 속성이었다. <strong>실사용자 검증을 못 하는 대신 넣은 장치가 값을 했다.</strong> 남은 미배치 <code>FN-F12</code>(개인정보 동의 재획득)는 <strong>기능 존재 여부 자체가 미정</strong>(212 G2)이라 자리를 줄 수 없는 건이다.</p><p><strong>K3의 채널 차이가 1건에서 2건으로 늘었다.</strong> <code>IA-085</code> 로그인 기록(D-4 결정)에 더해 <strong><code>IA-073</code> 배송조회(REQ-SC-007 &quot;PC만 진행&quot;)가 K3 관점 검토를 거친 적이 없다.</strong> 요구를 그대로 받으면 채널 차이가 조용히 늘어난다 → D3-5 신설.</p><p><strong>⚠️ Co-Creative 미준수가 312에 이어 반복됐다.</strong> 312는 워크숍, 322는 카드소팅. <strong>300 Define의 협업 규정이 시뮬레이션에서 구조적으로 재현 불가능</strong>하다 — 이 문서도 워크숍 입력 초안이지 결과물이 아니다.</p>"}, {"task_id": "331", "task_name": "와이어프레임설계", "skill": "vinylc_wireframe", "skill_version": "0.1.0-c2202500.1", "skill_upgraded": "true", "state": "done", "verdict": "pass ● — 주요화면 15 · 미커버 0 · 막다른 0. 단 Co-Creative 3연속 미실시(보류 선택 4건) · 워킹프로토타입 미제작", "skill_loaded": "full", "next_use": ["332 컨텐츠가이드 — 예외 메시지 사전·명칭 사전", "333 UI가이드 — 반복 컴포넌트 6종", "334 시안 — 보류 선택 4건·W-02 재검토 1순위", "341 화면명세 — 원형 상속 41노드 전개", "132 — 예외 화면군 규모는 341에서(4회째)"], "has_insight": "true", "todo": "3", "inputs": ["322 정보구조도(노드 74·전역 8)", "321 기능정의서(106·24)", "312 유저플로우(7흐름)", "242 UX컨셉 K1~K4", "215 요구 78", "122 AS-IS 영역 인벤토리", "240 결정 D-2·D-3·D-4"], "outputs": ["와이어프레임.md", "워킹프로토타입_동선맵.md"], "asis_state": "봉인", "asis_file": "12.UX_분석／기초설계/07.와이어프레임", "asis_note": "🔒 원본 와이어프레임 봉인 유지. 342 UI상세설계 생성 후 함께 대조 예정", "meta_html": "<h2>8. ⚠️ 이 산출물의 한계</h2><div class='tw'><table><thead><tr><th>#</th><th>한계</th><th>결과</th></tr></thead><tbody><tr><td>1</td><td><strong>Co-Creative 워크숍 없음 — 3연속</strong></td><td>대안 발산이 문서상 2안씩이고 <strong>손으로 그린 발산이 없다.</strong> 실제 워크숍은 훨씬 많은 안을 낸다</td></tr><tr><td>2</td><td><strong>워킹프로토타입 미제작</strong></td><td>동선맵·체크리스트까지만(<code>워킹프로토타입_동선맵.md</code>). 실제 툴 연결·시연은 사람 몫</td></tr><tr><td>3</td><td><strong>W-02 메인의 근거가 약하다</strong></td><td>242 R-2 분석 공백 위에 서 있다. 요구에서만 도출, 사용자 근거 0</td></tr><tr><td>4</td><td><strong>AS-IS 화면 캡처 없음</strong></td><td>122가 구조 컬럼만 썼으므로 <strong>현행 레이아웃을 본 적이 없다.</strong> &quot;무엇이 바뀌는지&quot;를 <strong>구조 수준</strong>에서만 말할 수 있다</td></tr><tr><td>5</td><td><strong>반응형 표기 한계</strong></td><td>12칼럼 1종이라 PC/MWEB이 갈리는 화면은 2개로 그렸다. 중간 브레이크포인트는 미표현</td></tr></tbody></table></div><blockquote><strong>한계 4가 이번 작업의 가장 큰 제약이다.</strong> 개편 와이어프레임인데 <strong>현행 화면을 못 봤다.</strong> 영역 인벤토리(122 §2)로 무엇이 있는지는 알지만 <strong>어떻게 배치돼 있었는지는 모른다.</strong> 따라서 이 문서의 <code>유지</code>/<code>개선</code> 판정은 <strong>구조 기준</strong>이지 레이아웃 기준이 아니다.</blockquote>", "skill_info": [{"name": "vinylc_wireframe", "version": "0.1.0-c2202500.1", "local": false}], "docs": [{"name": "와이어프레임.md", "path": "sim-project/300_Define/330_기본설계/331_와이어프레임설계/와이어프레임.md", "html": "<h1>와이어프레임 (TO-BE) — 현대백화점 자사채널 개선 [AI 생성]</h1><blockquote>입력: 322 정보구조도(노드 74) · 321 기능정의서(기능 106·컨텐츠 24) · 312 유저플로우(7흐름) · 242 UX컨셉 K1~K4 · 215 요구 78 · 122 AS-IS · 240 결정 D-2·D-3·D-4<br>충실도: <strong>저충실도</strong> — 색·타이포·아이콘·실제 문구 없음. Description 없음(341의 몫)<br>표기: <code>sim-project/_와이어프레임-표기규약.md</code><br>⚠️ <strong>332 컨텐츠가이드·333 UI가이드·334 시안·341 화면명세의 상류 SSOT.</strong> 바뀌면 하류가 상속한다</blockquote><hr><h2>1. 주요화면 선정 — <strong>4축 판정</strong></h2><p>전 화면(In-Scope 965)이 아니라 <strong>의사결정·원형·신설·전역</strong>이 걸리는 화면만 고른다.</p><div class='tw'><table><thead><tr><th>축</th><th>판정 기준</th><th>해당</th></tr></thead><tbody><tr><td><strong>① 분기</strong></td><td>사용자 선택이 이후 경로를 가른다</td><td>7</td></tr><tr><td><strong>② 레이아웃 원형</strong></td><td>이 골격을 다른 화면 N개가 상속한다</td><td>6</td></tr><tr><td><strong>③ 신설</strong></td><td>AS-IS에 참조할 현행 화면이 없다</td><td>6</td></tr><tr><td><strong>④ 전역</strong></td><td>모든 화면이 상속한다</td><td>4</td></tr></tbody></table></div><p>중복을 걷어낸 <strong>주요화면 15개</strong>. 축별 내역은 §3 각 화면의 <code>선정</code> 열.</p><blockquote><strong>②가 규모 대응의 핵심이다.</strong> 지점 16개를 16번 그리지 않고 <strong>지점 템플릿 1개</strong>(W-04)를 그린다. 원형을 못 잡으면 주요화면이 전 화면 수로 발산한다. <code>W-04</code>·<code>W-05</code>·<code>W-06</code>·<code>W-08~10</code> 여섯 개가 <strong>965화면 중 상당수의 골격을 대신</strong>한다.</blockquote><h3>1-1. 주요화면 목록</h3><div class='tw'><table><thead><tr><th>ID</th><th>화면</th><th>선정축</th><th>IA 노드</th><th>변경</th></tr></thead><tbody><tr><td><strong>W-01</strong></td><td>지점 선택 (전역)</td><td>①③④</td><td>IA-001</td><td><strong>신설</strong></td></tr><tr><td><strong>W-02</strong></td><td>메인 (지점 반영)</td><td>①④</td><td>IA-009</td><td>개선</td></tr><tr><td><strong>W-03</strong></td><td>검색 결과</td><td>①③</td><td>IA-002</td><td>개선</td></tr><tr><td><strong>W-04</strong></td><td><strong>지점 템플릿</strong></td><td>②</td><td>IA-010~018</td><td>개선</td></tr><tr><td><strong>W-05</strong></td><td><strong>목록형 원형</strong></td><td>②</td><td>IA-021·034·052 등</td><td>개선</td></tr><tr><td><strong>W-06</strong></td><td><strong>상세형 원형</strong></td><td>②</td><td>IA-022·035·052 등</td><td>개선</td></tr><tr><td><strong>W-07</strong></td><td>문화센터 강좌 목록</td><td>①②</td><td>IA-034</td><td>개선</td></tr><tr><td><strong>W-08</strong></td><td>거래 S1 — 정보 확인</td><td>①②</td><td>IA-036·053</td><td>개선</td></tr><tr><td><strong>W-09</strong></td><td>거래 S2 — 결제·입력</td><td>①②</td><td>IA-036·053</td><td>개선</td></tr><tr><td><strong>W-10</strong></td><td>거래 S3 — 완료</td><td>②</td><td>IA-036·053</td><td>유지</td></tr><tr><td><strong>W-11</strong></td><td>카드·멤버십 허브</td><td>②③</td><td>IA-050</td><td><strong>신설</strong>(MWEB)</td></tr><tr><td><strong>W-12</strong></td><td>VIP프로그램 2Tab</td><td>①②</td><td>IA-059</td><td>개선</td></tr><tr><td><strong>W-13</strong></td><td>마이페이지</td><td>①④</td><td>IA-080</td><td>개선</td></tr><tr><td><strong>W-14</strong></td><td>예외·복구 화면군</td><td>③④</td><td>IA-007</td><td><strong>신설</strong></td></tr><tr><td><strong>W-15</strong></td><td>통합 고객센터</td><td>③④</td><td>IA-005</td><td><strong>신설</strong></td></tr></tbody></table></div><h3>1-2. 채널 — <strong>대부분 공통</strong></h3><p>K1·K3이 채널 통일이므로 <strong>15개 중 13개가 양 채널 공통 골격</strong>이다. 갈리는 2개만 따로 그린다.</p><div class='tw'><table><thead><tr><th>화면</th><th>사유</th></tr></thead><tbody><tr><td><code>W-02</code> 메인</td><td>PC는 가로 폭이 넓어 지점 정보와 배너가 병렬, MWEB은 세로 스택</td></tr><tr><td><code>W-13</code> 마이페이지</td><td><code>IA-085</code> 로그인 기록이 PC 전용(D-4) — 항목 수가 다름</td></tr></tbody></table></div><hr><h2>2. 공통 골격 — <strong>전역 영역이 먼저다</strong></h2><p>322가 전역 8개를 계층 밖에 뒀다. <strong>모든 화면이 이 골격을 상속하므로 여기부터 그린다.</strong></p><div class=\"wf\" style=\"overflow-x:auto\"><svg viewBox=\"0 0 722 497\" width=\"100%\" style=\"max-width:722px;height:auto;display:block\" xmlns=\ >최후</text>\n<rect x=\"2.0\" y=\"314\" width=\"718.0\" height=\"60\" fill=\"#F4F4F4\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n<text x=\"361.0\" y=\"348.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">통합 고객센터</text>\n<text x=\"715.0\" y=\"325\" font-size=\"8\" fill=\"#767676\" text-anchor=\"end\">신설</text>\n<text x=\"1\" y=\"395\" font-size=\"10.5\" fill=\"#767676\">· 선정축 ③신설 ④전역</text>\n<text x=\"1\" y=\"414\" font-size=\"10.5\" fill=\"#767676\">· 122 H9 — AS-IS 명세에 오류·404 화면이 0건. 통째로 신설</text>\n<text x=\"1\" y=\"433\" font-size=\"10.5\" fill=\"#767676\">· 원형 1개 + 유형별 문구·대안 행동만 갈린다 → 6종을 6화면으로 그리지 않는다</text>\n<text x=\"1\" y=\"452\" font-size=\"10.5\" fill=\"#767676\">· ⚠️ 이 화면군의 실제 화면 수는 여기서 확정하지 않는다 — §7-1</text></svg></div><h3>W-15 통합 고객센터 <code>신설</code> — 산재한 도움말의 단일 진입점</h3><div class=\"wf\" style=\"overflow-x:auto\"><svg viewBox=\"0 0 722 612\" width=\"100%\" style=\"max-width:722px;height:auto;display:block\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\"><text x=\"1\" y=\"22\" font-size=\"12.5\" font-weight=\"700\" fill=\"#111111\">W-15 통합 고객센터 · 양 채널</text>\n<rect x=\"1\" y=\"34\" width=\"720\" height=\"478\" fill=\"none\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"-5\" y=\"51\" font-size=\"9\" fill=\"#767676\" text-anchor=\"end\">헤더</text>\n<rect x=\"2.0\" y=\"38\" width=\"718.0\" height=\"46\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"361.0\" y=\"65.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">전역 헤더</text>\n<text x=\"-5\" y=\"107\" font-size=\"9\" fill=\"#767676\" text-anchor=\"end\">검색</text>\n<rect x=\"2.0\" y=\"94\" width=\"718.0\" height=\"70\" fill=\"#F4F4F4\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n<text x=\"361.0\" y=\"133.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">무엇을 도와드릴까요 — 도움말 검색</text>\n<text x=\"715.0\" y=\"105\" font-size=\"8\" fill=\"#767676\" text-anchor=\"end\">신설</text>\n<text x=\"-5\" y=\"187\" font-size=\"9\" fill=\"#767676\" text-anchor=\"end\">분류</text>\n<rect x=\"2.0\" y=\"174\" width=\"232.7\" height=\"130\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"118.3\" y=\"243.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">문화센터</text>\n<text x=\"229.7\" y=\"185\" font-size=\"8\" fill=\"#767676\" text-anchor=\"end\">이동</text>\n<rect x=\"244.7\" y=\"174\" width=\"232.7\" height=\"130\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"361.0\" y=\"243.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">카드·멤버십</text>\n<text x=\"472.3\" y=\"185\" font-size=\"8\" fill=\"#767676\" text-anchor=\"end\">이동</text>\n<rect x=\"487.3\" y=\"174\" width=\"232.7\" height=\"130\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"603.7\" y=\"243.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">회원·기타</text>\n<text x=\"-5\" y=\"327\" font-size=\"9\" fill=\"#767676\" text-anchor=\"end\">FAQ</text>\n<rect x=\"2.0\" y=\"314\" width=\"718.0\" height=\"110\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"361.0\" y=\"373.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">자주하는 질문~  (영역별 FAQ가 여기로 집약)</text>\n<text x=\"-5\" y=\"447\" font-size=\"9\" fill=\"#767676\" text-anchor=\"end\">연결</text>\n<rect x=\"2.0\" y=\"434\" width=\"232.7\" height=\"70\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"118.3\" y=\"473.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">챗봇 상담</text>\n<rect x=\"244.7\" y=\"434\" width=\"232.7\" height=\"70\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"361.0\" y=\"473.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">ARS 카드 상담</text>\n<text x=\"472.3\" y=\"445\" font-size=\"8\" fill=\"#767676\" text-anchor=\"end\">유지</text>\n<rect x=\"487.3\" y=\"434\" width=\"232.7\" height=\"70\" fill=\"#F4F4F4\" stroke=\"#D8D8D8\" stroke-width=\"1\"/>\n<text x=\"603.7\" y=\"473.0\" font-size=\"11\" fill=\"#111111\" text-anchor=\"middle\">1:1 문의</text>\n<text x=\"1\" y=\"525\" font-size=\"10.5\" fill=\"#767676\">· 선정축 ③신설 ④전역</text>\n<text x=\"1\" y=\"544\" font-size=\"10.5\" fill=\"#767676\">· 122 H10 \"도움말 산재 PC 4곳 · MWEB 3곳\" → 단일 진입점(FN-H08)</text>\n<text x=\"1\" y=\"563\" font-size=\"10.5\" fill=\"#767676\">· 원 위치에도 링크를 남긴다 — 문화센터 이용안내에서 FAQ를 찾던 사용자를 잃지 않게</text>\n<text x=\"1\" y=\"582\" font-size=\"10.5\" fill=\"#767676\">· ⚠️ 통합 범위가 미정이었다(322 D3-3) — 여기서 FAQ·챗봇·ARS·1:1 4종으로 확정</text></svg></div><hr><h2>4. 원형 상속 — <strong>15화면이 무엇을 대신하나</strong></h2><div class='tw'><table><thead><tr><th>원형</th><th>상속 대상</th><th>AS-IS 화면 규모</th></tr></thead><tbody><tr><td><code>W-04</code> 지점 템플릿</td><td>지점 16개 × 층별·행사·시설·특성</td><td><strong>192</strong></td></tr><tr><td><code>W-05</code> 목록형</td><td>브랜드·강좌·카드·행사·이벤트 목록</td><td>다수</td></tr><tr><td><code>W-06</code> 상세형</td><td>브랜드·강좌·카드 상세</td><td>다수</td></tr><tr><td><code>W-08~10</code> 거래 3스텝</td><td>문화센터 수강신청 + 카드 신청</td><td><strong>거래 2계열</strong></td></tr><tr><td><code>W-14</code> 예외 원형</td><td>404·권한·세션·결제실패·정원초과·자격미달</td><td><strong>6종</strong></td></tr></tbody></table></div><blockquote><strong>원형 6개가 안 잡혔으면 주요화면이 수십 개로 발산했을 것이다.</strong> 선정 4축의 ②가 한 일이다.</blockquote><hr><h2>5. ⚖️ 보류 선택 4건 — <strong>대안을 만들고 골랐다. 확정이 아니다</strong></h2><p>OSSP 331은 <em>&quot;다양한 대안을 협력적으로 설계해 최적안을 도출&quot;</em> 하는 Co-Creative 과정이다. <strong>워크숍을 열 수 없었다</strong>(312 워크숍·322 카드소팅에 이어 3연속).</p><p>임의 확정도 공백도 오답이므로 <strong>대안을 실제로 만들고, 작업자가 고르되 <code>보류 선택</code>으로 표기</strong>한다. 하류는 가정으로 상속하고 진행한다.</p><h3>5-1. W-01 지점 선택의 표현 방식</h3><div class='tw'><table><thead><tr><th>안</th><th>트레이드오프</th></tr></thead><tbody><tr><td><strong>A. 전면 오버레이</strong> ✅ <strong>보류 선택</strong></td><td>지점 선택이 &quot;진입의 기준&quot;임을 형태로 말한다(K1). 단 매 진입 시 뜨면 재방문자에게 마찰</td></tr><tr><td>B. 헤더 드롭다운</td><td>마찰 최소. 단 <strong>지점이 부차적 필터처럼 보여 K1이 약해진다</strong></td></tr><tr><td>C. 별도 페이지</td><td>명확하나 단계가 하나 늘고 뒤로가기 문제</td></tr></tbody></table></div><p><strong>선택 근거</strong>: K1이 주축이고 AS-IS의 병이 &quot;지점 컨텍스트 없이 헤매는 것&quot;이므로 <strong>처음 한 번은 강하게</strong> 물어야 한다. 재방문 마찰은 <code>FN-A06</code> 최근 지점 제안으로 완화. <strong>되돌림 비용</strong>: 낮음 — 332·333까지. 341 착수 전이면 B로 전환 가능. <strong>결정권자·시점</strong>: 기획PL·크리에이티브디렉터 / 334 시안 착수 전</p><h3>5-2. W-02 메인의 지점 정보 배치</h3><div class='tw'><table><thead><tr><th>안</th><th>트레이드오프</th></tr></thead><tbody><tr><td><strong>A. 컨텍스트 바(상시) + 요약 카드</strong> ✅ <strong>보류 선택</strong></td><td>어느 지점인지 항상 보임. 단 상단 고정 영역이 하나 늘어 콘텐츠 면적 감소</td></tr><tr><td>B. 히어로 영역에 통합</td><td>면적 효율. 단 스크롤하면 지점이 사라진다</td></tr><tr><td>C. 요약 카드만</td><td>가장 가벼움. 단 하위 화면에서 컨텍스트가 안 보인다</td></tr></tbody></table></div><p><strong>선택 근거</strong>: 122 H2·241 I-6이 &quot;문맥 상실&quot;을 지적했다. <strong>하위 화면까지 따라가는 바</strong>가 그 해소책이다. <strong>⚠️ 근거 한계</strong>: <strong>242 R-2가 「메인 콘텐츠 구성」을 분석 공백으로 남겼다.</strong> 이 배치는 요구(REQ-MA-001·002·003)에서만 나왔고 <strong>사용자 근거가 없다.</strong> 봉인 해제 대조에서 원본이 메인에 5슬라이드를 쓴 것과 대비된다 — <strong>이 화면은 재검토 1순위</strong>. <strong>되돌림 비용</strong>: 중간 — 전역 골격이라 전 화면에 영향. <strong>결정권자·시점</strong>: 크리에이티브디렉터 / 334 시안</p><h3>5-3. W-04 지점 템플릿의 내비게이션</h3><div class='tw'><table><thead><tr><th>안</th><th>트레이드오프</th></tr></thead><tbody><tr><td><strong>A. 지점 LNB (좌측/상단 고정)</strong> ✅ <strong>보류 선택</strong></td><td>지점 내 이동이 빠르고 REQ-SI-004의 &quot;순서&quot; 요구를 형태로 표현 가능</td></tr><tr><td>B. 탭</td><td>가볍고 MWEB 친화. 단 항목이 늘면(특성 모듈 추가) 탭이 넘친다</td></tr><tr><td>C. 세로 스택 (한 페이지)</td><td>스크롤로 전부 봄. 단 층별안내처럼 무거운 콘텐츠엔 부적합</td></tr></tbody></table></div><p><strong>선택 근거</strong>: <code>REQ-SI-004</code>가 <em>&quot;행사안내를 층별안내 다음 순서로 상단 배치&quot;</em> 라고 <strong>순서 자체를 요구</strong>했다. 순서를 표현하려면 항목이 나열돼야 한다. <strong>되돌림 비용</strong>: 낮음 — W-04 단일 화면. <strong>결정권자·시점</strong>: 기획PL / 334 시안</p><h3>5-4. W-12 VIP 2Tab의 구성 축</h3><div class='tw'><table><thead><tr><th>안</th><th>트레이드오프</th></tr></thead><tbody><tr><td><strong>A. 등급 안내 / 혜택 안내</strong> ✅ <strong>보류 선택</strong></td><td>정책 구조(등급 6종 × 혜택 12종)와 일치. 어드민 갱신 단위와도 맞음</td></tr><tr><td>B. 나의 등급 / 전체 등급</td><td>개인화 우선. 단 <strong>비로그인 사용자에게 첫 탭이 비어 보인다</strong></td></tr></tbody></table></div><p><strong>선택 근거</strong>: <code>REQ-CA-013</code>이 <em>&quot;템플릿 1종 + 등급별 데이터&quot;</em> 를 요구했고, 그 데이터 구조가 등급/혜택으로 갈린다. B는 화면 구조와 데이터 구조가 어긋난다. <strong>되돌림 비용</strong>: 낮음. <strong>결정권자·시점</strong>: 기획PL / 341 화면명세</p><blockquote><strong>네 건 모두 「보류 선택」이다.</strong> 산출물은 진행 가능하되, 워크숍이 열리면 <strong>가장 먼저 뒤집힐 후보</strong>다. 특히 <strong>5-2는 근거가 약하다는 것을 알고 고른 것</strong>이다.</blockquote><hr><h2>6. 커버리지 점검</h2><h3>6-1. 유저플로우 7흐름 → 화면</h3><div class='tw'><table><thead><tr><th>흐름</th><th>커버 화면</th><th>미커버</th></tr></thead><tbody><tr><td>UF-01 지점 정하고 들어가기</td><td>W-01 · W-02</td><td>0</td></tr><tr><td>UF-02 지점 정보 확인</td><td>W-04</td><td>0</td></tr><tr><td>UF-03 브랜드·매장 찾기</td><td>W-03 · W-05 · W-06</td><td>0</td></tr><tr><td>UF-04 문화센터 강좌 신청</td><td>W-07 · W-08 · W-09 · W-10</td><td>0</td></tr><tr><td>UF-05 카드·멤버십</td><td>W-11 · W-06 · W-08~10 · W-12</td><td>0</td></tr><tr><td>UF-06 회원정보 관리</td><td>W-13</td><td>0</td></tr><tr><td>UF-07 막혔을 때</td><td>W-14 · W-15</td><td>0</td></tr></tbody></table></div><p><strong>미커버 경로 0.</strong></p><h3>6-2. IA 노드 → 화면</h3><p>74 노드 중 <strong>주요화면으로 직접 그린 것 15</strong>, <strong>원형이 상속하는 것 41</strong>, <strong>원형 없이 341로 넘기는 것 18</strong>(단순 콘텐츠 페이지 — 약관·IR·ESG 등 골격 판단이 필요 없는 것).</p><h3>6-3. 막다른 화면 점검</h3><div class='tw'><table><thead><tr><th>화면</th><th>나가는 경로</th></tr></thead><tbody><tr><td>W-10 거래 완료</td><td>2 (내역 / 계속) ✅</td></tr><tr><td>W-14 예외</td><td>2 (복귀 / 고객센터) ✅</td></tr><tr><td>W-03 빈 상태</td><td>2 (범위 확장 / 재검색) ✅</td></tr><tr><td>W-04 미제공 안내</td><td>1 (다른 지점) ✅</td></tr></tbody></table></div><p><strong>막다른 화면 0.</strong></p><hr><h2>7. 하류로 넘기는 것</h2><div class='tw'><table><thead><tr><th>대상</th><th>내용</th></tr></thead><tbody><tr><td><strong>332 컨텐츠가이드</strong></td><td>플레이스홀더 라벨 → 실제 문구 규칙 · 예외 6종의 메시지 사전(CT-21) · 명칭 사전(CT-20)</td></tr><tr><td><strong>333 UI가이드</strong></td><td>반복 컴포넌트 후보 — 카드 · 필터 · 스텝 인디케이터 · 컨텍스트 바 · 빈 상태 · 탭</td></tr><tr><td><strong>334 시안디자인</strong></td><td>보류 선택 4건 · <strong>W-02 메인 재검토 1순위</strong></td></tr><tr><td><strong>341 화면명세</strong></td><td>원형이 상속하는 41노드의 화면 단위 전개 · <code>W-13</code> PC 전용 사유 기록</td></tr><tr><td><strong>132</strong></td><td>§7-1</td></tr></tbody></table></div><h3>7-1. ⚠️ 132 재산정 — 4회째 이월</h3><p>예외 화면군 규모를 312 → 321 → 322 → <strong>331에서도 확정하지 못했다.</strong></p><p><code>W-14</code>를 <strong>원형 1개</strong>로 잡았지만, 그것이 <strong>실제 화면 몇 개가 되는지는 341의 판정</strong>이다. 유형별 문구만 갈리면 1화면(파라미터)이고, 레이아웃이 갈리면 6화면이다. 그 판단은 332가 메시지 사전을 만든 뒤에 가능하다.</p><blockquote><strong>회신 시점을 341로 이관한다.</strong> 다만 <strong>4회째 이월</strong>이므로, 341에서도 못 닫히면 132는 미확정을 안고 계약 종료까지 간다. <strong>이 사실 자체를 리스크로 등재해야 한다.</strong></blockquote><hr>", "bytes": 25401, "deliv": "331_와이어프레임설계/와이어프레임.html"}, {"name": "워킹프로토타입_동선맵.md", "path": "sim-project/300_Define/330_기본설계/331_와이어프레임설계/워킹프로토타입_동선맵.md", "html": "<h1>와이어프레임 워킹프로토타입 — 동선맵 · 점검 체크리스트 [AI 생성]</h1><blockquote>입력: 331 와이어프레임(주요화면 15) · 312 유저플로우(7흐름) · 322 정보구조도<br>⚠️ <strong>이 문서는 준비물이지 프로토타입이 아니다.</strong> 실제 툴 배치·링크 연결·시연은 <strong>사람(기획자)</strong> 이 한다 — OSSP 331 산출물 #2의 부분 작업 구분</blockquote><hr><h2>1. 이 문서가 하는 일</h2><p>OSSP는 워킹프로토타입의 목적을 <strong>동선 점검</strong>으로 규정한다 — <em>&quot;작성된 와이어프레임에 대해서 동선점검을 위해 inVision·POP·marvelapp 등의 툴로 작성하는 동작 가능한 프로토타입.&quot;</em></p><div class='tw'><table><thead><tr><th>하는 것 (AI)</th><th>하는 것 (사람)</th></tr></thead><tbody><tr><td>화면 연결 맵 — 어느 요소 → 어느 화면</td><td>툴에 화면 이미지 배치</td></tr><tr><td>동선 시나리오 — 무엇을 눌러 어디까지 가는가</td><td>핫스팟·링크 연결</td></tr><tr><td>점검 체크리스트 — 막다른 길·순환·누락</td><td>시연·관찰·기록</td></tr></tbody></table></div><blockquote><strong>툴 계정·파일 위치가 확정되지 않았다.</strong> inVision·POP·marvelapp 중 무엇을 쓸지, 계정이 있는지 미확인 → <code>[확인필요]</code></blockquote><hr><h2>2. 화면 연결 맵</h2><p><code>요소 → 도착 화면</code> · <strong>되돌아오는 경로가 있는지</strong>를 함께 표기한다.</p><h3>2-1. 전역 (모든 화면에서)</h3><div class='tw'><table><thead><tr><th>출발 요소</th><th>도착</th><th>복귀</th></tr></thead><tbody><tr><td>헤더 · 지점 선택</td><td><code>W-01</code></td><td>✅ 닫기 → 직전</td></tr><tr><td>헤더 · 통합검색</td><td><code>W-03</code></td><td>✅ 뒤로</td></tr><tr><td>헤더 · 로고</td><td><code>W-02</code></td><td>—</td></tr><tr><td>헤더 · GNB 7항목</td><td>각 L1</td><td>✅</td></tr><tr><td>컨텍스트 바 · 지점 변경</td><td><code>W-01</code></td><td>✅</td></tr><tr><td>푸터 · 고객센터</td><td><code>W-15</code></td><td>✅</td></tr><tr><td><strong>(모든 실패)</strong></td><td><code>W-14</code></td><td>✅ 복귀 / 고객센터</td></tr></tbody></table></div><h3>2-2. UF-01 지점 정하고 들어가기</h3><pre>진입 → W-02(지점 미선택) → [지점 선택] → W-01 → [지점 확정] → W-02(지점 반영)\n                                                                    ↓\n                                          하위 영역 (컨텍스트 없이 진입 시 → W-01로 유도)</pre><h3>2-3. UF-04 문화센터 강좌 신청 — <strong>가장 긴 동선</strong></h3><pre>W-02 → [문화센터] → W-07 강좌 목록\n                      ├─ 잔여 정원 있음 → W-06 상세 → [신청] ─┐\n                      └─ 정원 초과 → [대기 신청] → 대기 상태 조회\n                                                                │\n        비로그인 → 로그인 → 복귀 ──────────────────────────────┤\n                                                                ↓\n                              W-08 S1 → W-09 S2 → W-10 S3 → 나의 강좌\n                                 │        │\n                                 │        ├─ 결제 실패 → W-14 → [재시도] → W-09\n                                 └─ 취소 → W-07 (목록 복귀)</pre><p><strong>점검 포인트</strong>: 로그인 분기가 <code>W-08</code> <strong>앞</strong>에 있는가. AS-IS는 S1 중간에 끼어들었다(122 H3).</p><h3>2-4. UF-05 카드·멤버십</h3><pre>W-02 → [카드·멤버십] → W-11 허브\n                          ├─ 카드 종류 → W-06 상세 → [신청] → W-08 → W-09 → W-10\n                          │                                      ├─ 자격 미달 → W-14 → 다른 카드\n                          │                                      └─ 배송 불가 → W-09 (주소 변경)\n                          ├─ VIP프로그램 → W-12\n                          └─ 포인트 조회 → (마이페이지 연계)</pre><h3>2-5. UF-06 회원정보 관리</h3><pre>로그인 → [통합회원 전환 여부]\n          ├─ 미전환 → H.Point 전환 → W-13\n          └─ 전환됨 → W-13 마이페이지\n                        └─ 각 관리 항목 (PC 5 / MWEB 4)</pre><hr><h2>3. 동선 점검 체크리스트</h2><p>시연 시 항목별로 ✅/⛔를 기록한다.</p><h3>3-1. 폐포 — 막다른 화면이 없는가</h3><div class='tw'><table><thead><tr><th>#</th><th>점검</th><th>대상</th></tr></thead><tbody><tr><td>C-1</td><td>거래 완료 후 갈 곳이 2개 이상인가</td><td><code>W-10</code></td></tr><tr><td>C-2</td><td>모든 예외에서 복귀·고객센터로 나갈 수 있는가</td><td><code>W-14</code></td></tr><tr><td>C-3</td><td>검색 0건에서 대안이 제시되는가</td><td><code>W-03</code></td></tr><tr><td>C-4</td><td>지점 미제공 안내에서 다른 지점으로 가는가</td><td><code>W-04</code></td></tr><tr><td>C-5</td><td><strong>대기 신청 후 상태를 조회할 수 있는가</strong></td><td><code>W-07</code> — AS-IS 막다른 길</td></tr><tr><td>C-6</td><td><strong>거래 중 취소하면 목록으로 돌아오는가</strong></td><td><code>W-08</code>·<code>W-09</code> — AS-IS 0건</td></tr></tbody></table></div><h3>3-2. 컨텍스트 — 지점을 잃지 않는가 (K1)</h3><div class='tw'><table><thead><tr><th>#</th><th>점검</th></tr></thead><tbody><tr><td>C-7</td><td>지점 선택 후 하위 전 영역에서 컨텍스트 바가 보이는가</td></tr><tr><td>C-8</td><td>검색 결과가 선택 지점을 반영하는가</td></tr><tr><td>C-9</td><td>컨텍스트 없이 지점 종속 화면에 도달하면 <code>W-01</code>로 유도되는가</td></tr><tr><td>C-10</td><td>지점 무관 영역(기업정보)에서 <strong>억지로 지점을 요구하지 않는가</strong> — K1 축 밖</td></tr></tbody></table></div><h3>3-3. 채널 동등 — 같은 일을 양쪽에서 할 수 있는가 (K3)</h3><div class='tw'><table><thead><tr><th>#</th><th>점검</th></tr></thead><tbody><tr><td>C-11</td><td>비밀번호 변경이 MWEB에서 되는가 (AS-IS PC만)</td></tr><tr><td>C-12</td><td>차량번호 등록이 PC에서 되는가 (AS-IS MWEB만)</td></tr><tr><td>C-13</td><td>H.Point 전환이 MWEB에서 되는가 (AS-IS PC만)</td></tr><tr><td>C-14</td><td>VIP프로그램이 양 채널 2Tab 동일한가 (D-3)</td></tr><tr><td>C-15</td><td><strong>차이가 남은 2건에 사유가 붙어 있는가</strong> — 로그인 기록·배송조회</td></tr></tbody></table></div><h3>3-4. 순환 — 되돌이표가 없는가</h3><div class='tw'><table><thead><tr><th>#</th><th>점검</th></tr></thead><tbody><tr><td>C-16</td><td><code>W-01</code> ↔ <code>W-02</code> 사이를 오가며 갇히지 않는가</td></tr><tr><td>C-17</td><td>로그인 → 복귀가 원래 지점으로 정확히 돌아오는가</td></tr><tr><td>C-18</td><td>예외 → 복귀 → 같은 예외 재발 시 무한 반복되지 않는가</td></tr></tbody></table></div><hr><h2>4. 시연 시나리오 3종</h2><p>프로토타입으로 처음부터 끝까지 눌러볼 경로. <strong>각 시나리오는 위 체크리스트를 몇 개씩 소진한다.</strong></p><div class='tw'><table><thead><tr><th>#</th><th>시나리오</th><th>경로</th><th>소진 체크</th></tr></thead><tbody><tr><td><strong>S-1</strong></td><td>처음 오는 사람이 지점을 정하고 행사를 본다</td><td><code>W-02</code> → <code>W-01</code> → <code>W-02</code> → <code>W-04</code></td><td>C-7·C-9·C-16</td></tr><tr><td><strong>S-2</strong></td><td>정원이 찬 강좌를 신청하려다 대기하고, 다른 강좌를 결제한다</td><td><code>W-07</code> → 대기 → 조회 → <code>W-07</code> → <code>W-06</code> → <code>W-08~10</code></td><td>C-1·C-5·C-6·C-8</td></tr><tr><td><strong>S-3</strong></td><td>모바일에서 비밀번호를 바꾸고, 없는 페이지로 들어갔다 돌아온다</td><td><code>W-13</code>(MWEB) → <code>W-14</code> → 복귀</td><td>C-2·C-11·C-15·C-18</td></tr></tbody></table></div><hr><h2>5. [확인필요]</h2><div class='tw'><table><thead><tr><th>#</th><th>항목</th><th>확인 주체</th></tr></thead><tbody><tr><td>1</td><td><strong>프로토타입 툴</strong> — inVision·POP·marvelapp 중 무엇을 쓰는가. 계정 보유 여부</td><td>PM·기획PL</td></tr><tr><td>2</td><td>시연 대상·일정 — 고객사 참석 여부</td><td>PM</td></tr><tr><td>3</td><td>화면 이미지 형식 — 와이어프레임 SVG를 그대로 쓸지, 툴에서 다시 그릴지</td><td>기획자</td></tr></tbody></table></div><hr><h2>6. ⚠️ 한계</h2><p><strong>이 문서는 프로토타입이 아니다.</strong> 동선맵과 체크리스트까지다.</p><p>동선 점검의 본질은 <em>&quot;눌러보니 이상하더라&quot;</em> 를 발견하는 것인데, 그건 <strong>실제로 눌러봐야 나온다.</strong> 문서상 폐포 점검(§3-1)은 논리적 누락만 잡고, <strong>감각적 어색함</strong>(단계가 많다·되돌아가기 번거롭다)은 잡지 못한다.</p><p>→ <strong>§4 시나리오 3종을 실제로 시연하기 전까지 331은 완료로 보지 않는 것이 맞다.</strong></p>", "bytes": 7378, "deliv": "331_와이어프레임설계/워킹프로토타입_동선맵.html"}], "asis_html": "", "inbox": {"required": ["기능정의서(321 vinylc 기능상세정의)", "정보구조도(322 vinylc 정보구조설계)", "유저플로우(312 유저플로우)", "퍼소나(311 vinylc_persona)", "요구사항정의서(215 vinylc_requirements-definition)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []}, "dir": "sim-project/300_Define/330_기본설계/331_와이어프레임설계", "body_html": "<h1>331 와이어프레임설계 — 작업 정의</h1><p><strong>배치 스킬</strong>: <code>vinylc_wireframe</code> v0.1.0-<strong>c2202500.1</strong> → 로컬 포크</p><h2>스킬 고도화 (이번 작업에서 수행)</h2><div class='tw'><table><thead><tr><th>#</th><th>고도화</th><th>왜 필요했나</th></tr></thead><tbody><tr><td>1</td><td><strong>「주요화면 도출 규칙」 4축</strong>(분기·<strong>레이아웃 원형</strong>·신설·전역)</td><td>원 스킬은 <em>&quot;의사결정·핵심 과업이 일어나는 화면&quot;</em> 이라고만 적어 <strong>판정 기준이 없다.</strong> 965화면 앞에서 못 고른다. <strong>②원형 축이 없으면 주요화면이 전 화면으로 발산</strong></td></tr><tr><td>2</td><td><strong>「개편형 — 현행 레이아웃을 받아 고친다」 · <code>depends_on</code>에 AS-IS 추가 · 변경 등급 5종</strong></td><td>개편 와이어프레임은 <strong>학습된 배치를 바꾸는 것</strong>. 현행이 없으면 무엇이 바뀌는지 못 적는다</td></tr><tr><td>3</td><td><strong>「Co-Creative 불가 시 — 보류 선택」</strong></td><td>원 스킬은 <em>&quot;임의로 정하지 말고 질문하라&quot;</em> 로 끝난다. <strong>질문할 상대가 없는 상황</strong>에 임의 확정도 공백도 오답. 대안 2안+트레이드오프+선택근거+되돌림 비용+결정권자</td></tr><tr><td>4</td><td><strong>저충실도 표기 규약 + 렌더러</strong>(<code>_와이어프레임-표기규약.md</code> · <code>scripts/wireframe_svg.py</code>)</td><td>문서로 낼 때 저충실도 계약이 슬금슬금 깨진다. <strong>문법에 색·문구·아이콘을 두지 않아 넣고 싶어도 못 넣게</strong> 함</td></tr></tbody></table></div><p><strong>전사 환류 판단</strong>: 4건 유효. ②는 <strong><code>depends_on</code> AS-IS 누락 4연속</strong>(312·321·322·331)이라 <strong>CONVENTIONS 승격 제안</strong>으로 전환</p><h2>산출물</h2><ul><li><code>와이어프레임.md</code> — <strong>주요화면 15</strong> (SVG 14블록·화면 18개 포함) · 보류 선택 4건</li><li><code>워킹프로토타입_동선맵.md</code> — 연결맵 5흐름 · 점검 체크리스트 18항 · 시연 시나리오 3종</li></ul><div class='tw'><table><thead><tr><th>선정축</th><th>건수</th></tr></thead><tbody><tr><td>① 분기</td><td>7</td></tr><tr><td>② <strong>레이아웃 원형</strong></td><td>6</td></tr><tr><td>③ 신설</td><td>6</td></tr><tr><td>④ 전역</td><td>4</td></tr><tr><td><strong>중복 제거 후</strong></td><td><strong>15</strong></td></tr></tbody></table></div><p><strong>커버리지</strong>: 유저플로우 7흐름 <strong>미커버 0</strong> · <strong>막다른 화면 0</strong> · 저충실도 팔레트 위반 <strong>0</strong></p><h2>이후 어디에 쓰이나</h2><ul><li><strong>332</strong> 예외 6종 메시지 사전(CT-21) · 명칭 사전(CT-20) · 플레이스홀더 → 실제 문구 규칙</li><li><strong>333</strong> 반복 컴포넌트 6종 — 카드·필터·스텝 인디케이터·<strong>컨텍스트 바</strong>·빈 상태·탭</li><li><strong>334</strong> 보류 선택 4건 · <strong>W-02 메인 재검토 1순위</strong></li><li><strong>341</strong> 원형이 상속하는 41노드 전개 · <code>W-13</code> PC 전용 사유 기록</li><li><strong>132</strong> 예외 화면군 규모 — <strong>4회째 이월</strong>(341로)</li></ul><h2>도출된 인사이트</h2><p><strong>원형 6개가 주요화면 발산을 막았다.</strong> <code>W-04</code> 지점 템플릿 하나가 <strong>AS-IS 192화면</strong>의 골격을 대신하고, <code>W-08~10</code> 거래 3스텝이 문화센터·카드 두 계열을 함께 받는다. 선정 4축 중 <strong>②레이아웃 원형</strong>이 없었으면 주요화면이 수십 개로 늘었을 것이다. 이게 K2(한 번 만들고 지점마다 붙인다)의 와이어프레임 층위 실행이다.</p><p><strong>전역 골격을 먼저 그린 것이 322 판단의 직접 결과다.</strong> 322가 전역 8개를 계층 밖에 뒀으므로 331은 헤더·컨텍스트 바·푸터부터 그렸다. <strong>컨텍스트 바가 신설</strong>인데, 이게 K1(&quot;지점 컨텍스트가 관통&quot;)을 화면에서 실제로 구현하는 유일한 장치다 — 트리에 지점을 안 넣기로 한 대가를 여기서 치른다.</p><p><strong>⚠️ Co-Creative가 3연속 불가다.</strong> 312 워크숍 · 322 카드소팅 · 331 대안 발산. 개별 작업의 한계가 아니라 <strong>Phase 300 전체에 걸린 구조적 상한</strong>이다. 이번엔 「보류 선택」 장치로 진행 가능하게 만들었지만, <strong>문서상 2안씩은 실제 워크숍의 발산량에 못 미친다.</strong></p><p><strong>⚠️ 현행 화면을 본 적이 없다.</strong> 122가 구조 컬럼만 썼으므로 <strong>영역 인벤토리는 알아도 배치는 모른다.</strong> 따라서 이 문서의 <code>유지</code>/<code>개선</code> 판정은 <strong>구조 기준이지 레이아웃 기준이 아니다.</strong> 개편 와이어프레임에서 이건 심각한 제약이고, 스킬 고도화 ②를 넣어도 <strong>입력이 없으면 규칙만 있고 실행이 안 된다</strong> — 규칙과 자료는 별개 문제라는 것을 보여준다.</p><p><strong>보류 선택 4건 중 W-02가 가장 약하다.</strong> 242 R-2가 「메인 콘텐츠 구성」을 분석 공백으로 남겼는데, 봉인 해제 대조에서 <strong>원본은 메인에 5슬라이드를 썼다.</strong> 우리는 요구 3건만으로 배치를 정했다 — <strong>약한 걸 알면서 고른 것</strong>이므로 재검토 1순위로 명시했다.</p>"}, {"task_id": "332", "task_name": "컨텐츠가이드설계", "skill": "vinylc_content-guide", "state": "pending", "verdict": "미실행", "todo": "0", "inputs": [], "outputs": [], "asis_state": "미정", "asis_file": null, "asis_note": "", "meta_html": "", "skill_info": [{"name": "vinylc_content-guide", "version": "0.1.0-draft", "local": false}], "docs": [], "asis_html": "", "inbox": {"required": ["와이어프레임(331 vinylc_wireframe)", "정보구조도(322 vinylc 정보구조설계)", "기능정의서(321)", "요구사항정의서(215 vinylc_requirements-definition)", ".ax-project.yaml (vinylc_project-init)"], "provided": [], "extra": 0, "onhand": []},
