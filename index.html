<script>
(function(){
const D=window.DATA,P=D.project,PH=D.phases,SL=D.stateLabel;
const $=s=>document.querySelector(s), esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt=p=>{const r=p.roster;return{done:r.filter(x=>x.state==='done').length,pend:r.filter(x=>x.state==='pending').length,
  intv:r.filter(x=>x.state==='intervene').length,skip:r.filter(x=>x.state==='skip').length,live:r.filter(x=>x.state!=='skip').length};};
$('#bp').innerHTML=`<b>${esc(P.name)}</b><br>${esc(P.code)} · ${esc(P.type)}<br>${esc(P.period)}`;
$('#built').textContent='생성 '+D.built;
const T=PH.reduce((a,p)=>{const c=cnt(p);a.done+=c.done;a.live+=c.live;a.intv+=c.intv;return a;},{done:0,live:0,intv:0});
const ndoc=PH.reduce((a,p)=>a+p.tasks.reduce((b,t)=>b+t.docs.length,0),0);
const ntodo=PH.reduce((a,p)=>a+p.tasks.reduce((b,t)=>b+(+t.todo||0),0),0);
let view='dash', focus=null;

function nav(){
  let h=`<div class="lbl">시뮬레이션</div><button data-v="dash" aria-current="${view==='dash'}"><span class="n">·</span><span class="t">대시보드</span></button><div class="lbl">OSSP PHASE</div>`;
  PH.forEach((p,i)=>{const c=cnt(p);
    h+=`<button data-v="${i}" aria-current="${view===i}"><span class="n">${p.id}</span><span class="t">${esc(p.name)}</span><span class="c">${c.done}/${c.live}</span></button>`;
    if(view===i&&p.tasks.length){h+='<div class="sub">'+p.tasks.map(t=>
      `<button data-v="${i}" data-f="${t.task_id}"><span class="n">${t.task_id}</span><span class="t">${esc(t.task_name)}</span></button>`).join('')+'</div>';}});
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    view=b.dataset.v==='dash'?'dash':+b.dataset.v; focus=b.dataset.f||null; render();
    if(focus){const el=document.getElementById('t'+focus); if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
    else window.scrollTo({top:0});});
}
$('#sf').innerHTML=`<div><span>봉인 위반</span><b>0건</b></div><div><span>임베드 문서</span><span>${ndoc}건</span></div><div><span>개입 대기</span><span>${T.intv}건</span></div>`;

function node(r,pi){
  const cls=r.state+(r.has?' clickable':'');
  const tip=`${r.id} ${r.name} — ${SL[r.state]}${r.note?' · '+r.note:''}`;
  return `<span class="node ${cls}" title="${esc(tip)}"${r.has?` data-go="${pi}:${r.id}"`:''}><i class="dot"></i><span class="nid">${r.id}</span><span>${esc(r.name)}</span></span>`;
}
function flow(){
  return `<div class="sect">OSSP 파이프라인 — 전체 작업 중 실행 현황 (완료 노드 클릭 시 이동)</div><div class="flow">`+
   PH.map((p,pi)=>{const c=cnt(p),pct=c.live?Math.round(c.done/c.live*100):0;
    return `<div class="frow"><div class="fph"><div class="id">${p.id}</div><div class="nm">${esc(p.name)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="pc">${c.done}/${c.live} · ${pct}%</div></div>
      <div class="fnodes">${p.roster.map((r,i)=>(i?'<span class="arrow">›</span>':'')+node(r,pi)).join('')}</div></div>`;}).join('')+
   `</div><div class="legend">
     <span><i style="background:var(--done)"></i>완료</span><span><i style="background:var(--pend)"></i>대기</span>
     <span><i style="background:var(--sim)"></i>시뮬레이션 수행 — 원 프로젝트는 안 했지만 스킬로 수행</span>
     <span><i style="background:var(--intv)"></i>개입필요 — 창작 판단, 사용자 확정 후</span>
     <span><i style="background:var(--skip)"></i>미수행·제외</span><span>★ 핵심 대조점</span></div>`;
}
function inputsBox(){
  return `<details class="inputs" open><summary>인풋 자료 — 이 목록만 입력으로 사용한다 (인풋 동결)</summary>`+
   D.inputs.map(i=>`<div class="irow"><div class="iid">${i.id}</div><div>${esc(i.label)}</div>
     <div class="idesc"><code>${esc(i.file)}</code><br>${esc(i.desc)}</div></div>`).join('')+`</details>`;
}
function preview(html){
  const d=document.createElement('div'); d.innerHTML=String(html||'');
  const txt=(d.textContent||'').replace(/\s+/g,' ').trim();   // 엔티티까지 실제 문자로
  return txt.length>150?txt.slice(0,150)+'…':txt;
}
function insightOf(t){
  const m=(t.body_html||'').match(/<h2>도출된 인사이트<\/h2>([\s\S]*)$/);
  return m?m[1]:'';
}
function inbox(t){
  const b=t.inbox||{}; const req=(b.required||[]).length, on=(b.onhand||[]).length;
  const dir=`${t.dir}/_inputs/`;
  let h=`<span class="chip" title="${esc(dir)} — 여기에 자료를 넣으면 됩니다">📂 ${esc(dir)}</span>`;
  h+=`<span class="chip" title="배치 스킬의 depends_on — 이 작업이 필요로 하는 선행 자료 종류">스킬이 요구하는 자료 ${req}종</span>`;
  h+= on ? `<span class="chip" style="border-color:var(--done);color:var(--done)" title="${esc((b.onhand||[]).join(', '))}">이 폴더에 넣은 파일 ${on}개</span>`
         : `<span class="chip" style="color:var(--muted)">이 폴더에 넣은 파일 없음</span>`;
  if(b.extra) h+=`<span class="chip" style="border-color:var(--intv);color:var(--intv)" title="manifest.json에 기록되지 않은 파일 — 동결 목록 외 추가 가능성">미기록 ${b.extra}개</span>`;
  return h;
}
const ASIS={부분대조:['s-ok','부분 대조 가능'],대조불가:['s-stop','대조 불가 (구조적)'],'입력=원본':['s-warn','입력 = 원본'],
  봉인:['s-seal','🔒 봉인 유지'],원본없음:['s-none','원본 없음'],사전노출:['s-warn','⚠ 사전 노출']};
const vcls=v=>/^pass/.test(v)?'v-pass':(/^축소/.test(v)?'v-red':'v-cond');

function task(t){
  const [sc,sl]=ASIS[t.asis_state]||['s-none',t.asis_state||''];
  const skills=t.skill_info.map(s=>`<span class="chip sk" title="로컬 포크: .claude/skills/${esc(s.name)}/SKILL.md">${esc(s.name)} <b>v${esc(s.version)}</b>${s.local?' ✎':''}${t.skill_loaded==='full'?' <span style=\"color:var(--done)\" title=\"SKILL.md 본문 전체를 로드해 수행\">●</span>':' <span style=\"color:var(--intv)\" title=\"frontmatter만 참조 — 본문 미로드\">◐</span>'}</span>`).join('');
  const inputs=(t.inputs||[]).map(i=>`<span class="chip">${esc(i)}</span>`).join('');
  const docs=t.docs.length?t.docs.map((d,i)=>`
      <div class="docbar"><code>${esc(d.name)}</code>
        <span class="tools">
          ${d.deliv?`<button class="dlbtn pop" data-src="${esc(D.docBase+'/'+d.deliv)}" data-title="${esc(t.task_id+' '+t.task_name+' · '+d.name)}">제출본 팝업 ⧉</button>`:''}
          <button class="exp" data-doc="${t.task_id}-${i}">전체 펼치기</button>
        </span></div>
      <div class="doc" id="d${t.task_id}-${i}">${d.html}</div>`).join('')
    :`<div class="asis">산출물 없음</div>`;
  return `<section class="task" id="t${t.task_id}">
    <div class="thead"><span class="tid">${t.task_id}</span><span class="tname">${esc(t.task_name)}</span>
      <span class="verdict ${vcls(t.verdict)}">${esc(t.verdict)}</span></div>
    <div class="meta"><span class="mk">Skill</span><span>${skills}</span>
      <span class="mk">Input</span><span>${inputs||'<span style="color:var(--muted)">—</span>'}</span>
      <span class="mk">Inbox</span><span>${inbox(t)}</span></div>
    <div class="cols">
      <div class="col"><div class="ctag"><span>AI 생성 산출물 — 본문</span><span>${t.docs.length}건 · [확인필요] ${t.todo}</span></div>${docs}</div>
      <div class="col"><div class="ctag"><span>AS-IS 원본 산출물</span><span class="state ${sc}">${sl}</span></div>
        ${t.asis_html?`<div class="docbar"><code>${esc(t.asis_file||'원본 없음')}</code><button class="exp" data-doc="a${t.task_id}">전체 펼치기</button></div>
        <div class="doc ${t.asis_state==='봉인'?'sealed':''}" id="da${t.task_id}">${t.asis_html}</div>`
        :`<div class="asis"><div class="f">${esc(t.asis_file||'해당 산출물 없음')}</div>${esc(t.asis_note||'')}</div>`}</div>
    </div>
    ${(t.has_insight==='true'||t.meta_html)?(()=>{
      const ins=t.has_insight==='true'?insightOf(t):'';
      const parts=[]; if(ins)parts.push('인사이트'); if(t.meta_html)parts.push('AS-IS 대조');
      return `<details class="ins">
      <summary><span class="cv">▶</span><span>${parts.join(' · ')}</span>
        <span class="pv">${esc(preview(ins||t.meta_html))}</span>
        <span class="ct">펼치기</span></summary>
      <div class="insbody">
        ${ins?`<span class="mk2">도출된 인사이트</span>${ins}`:''}
        ${t.meta_html?`<div class="simeta"><span class="mk2">AS-IS 대조 · 시뮬레이션 기록</span>
          <p class="why">아래는 <b>실제 프로젝트 산출물에는 들어가지 않는 내용</b>입니다 — 원본 대조·재실행 diff·스킬 고도화 적용 기록. 위 산출물 본문에서 분리했습니다.</p>
          ${t.meta_html}</div>`:''}
      </div></details>`;})():''}
    </section>`;
}

function render(){
  nav();
  if(view==='dash'){
    $('#tbar').textContent='대시보드';
    $('#inner').innerHTML=`<div class="stage">Overview</div><h2 class="pt">파이프라인 대시보드</h2>
      <p class="lead">${esc(P.note)}</p>
      <div class="kpis">
        <div class="kpi"><div class="k">실행 완료</div><div class="v">${T.done}<small>/${T.live}</small></div><div class="s">제외 뺀 유효 작업</div></div>
        <div class="kpi"><div class="k">읽을 수 있는 산출물</div><div class="v">${ndoc}<small>건</small></div><div class="s">본문 전체 임베드</div></div>
        <div class="kpi"><div class="k">누적 [확인필요]</div><div class="v">${ntodo}<small>건</small></div><div class="s">인풋 근거 없어 비움</div></div>
        <div class="kpi"><div class="k">개입 대기</div><div class="v" style="color:var(--intv)">${T.intv}</div><div class="s">창작 판단 필요</div></div>
      </div>
      <div class="sect">대상 프로젝트</div><div class="rtable">
      ${[['대상',P.name+' · '+P.code],['유형 / 기간',P.type+' · '+P.period],['수행 범위',P.scope],['현행 규모',P.scale]]
        .map(([k,v])=>`<div class="rr" style="grid-template-columns:120px 1fr"><div style="color:var(--muted);font-size:12px">${k}</div><div>${esc(v)}</div></div>`).join('')}
      </div>${flow()}${inputsBox()}`;
  } else {
    const p=PH[view],c=cnt(p);
    $('#tbar').textContent=`Phase ${p.id} · ${p.name}`;
    $('#inner').innerHTML=`<div class="stage">Phase ${p.id} · ${esc(p.ko)}</div><h2 class="pt">${p.id} ${esc(p.name)}</h2>
      <div class="kpis">
        <div class="kpi"><div class="k">실행 완료</div><div class="v">${c.done}<small>/${c.live}</small></div></div>
        <div class="kpi"><div class="k">대기</div><div class="v">${c.pend}</div></div>
        <div class="kpi"><div class="k">개입필요</div><div class="v" style="color:var(--intv)">${c.intv}</div></div>
        <div class="kpi"><div class="k">미수행·제외</div><div class="v" style="color:var(--muted)">${c.skip}</div></div>
      </div>
      <div class="sect">작업 · 배치 스킬 · 상태</div>
      <div class="rtable">${p.roster.map(r=>{const t=p.tasks.find(x=>x.task_id===r.id);
        return `<div class="rr ${r.state==='skip'?'skip':''}"><div class="rid">${r.id}</div>
          <div>${esc(r.name)}${r.note?`<span style="color:var(--muted);font-size:12px"> — ${esc(r.note)}</span>`:''}</div>
          <div class="rsk">${t?t.skill_info.map(s=>esc(s.name)).join(', '):'—'}</div>
          <div class="rno" style="color:var(--${r.state==='done'?'done':r.state==='intervene'?'intv':'muted'})">${SL[r.state]}</div></div>`;}).join('')}</div>
      <div class="sect">산출물 대조 — 좌: AI 생성 본문 / 우: AS-IS 원본</div><div style="height:16px"></div>
      ${p.tasks.length?p.tasks.map(task).join(''):'<div class="pendbox">이 Phase는 아직 실행하지 않았습니다.</div>'}`;
  }
  document.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{
    const [pi,tid]=n.dataset.go.split(':'); view=+pi; focus=tid; render();
    const el=document.getElementById('t'+tid); if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
  document.querySelectorAll('.exp').forEach(b=>b.onclick=()=>{
    const d=document.getElementById('d'+b.dataset.doc);
    d.classList.toggle('expanded'); b.textContent=d.classList.contains('expanded')?'접기':'전체 펼치기';});
  document.querySelectorAll('.pop').forEach(b=>b.onclick=()=>openDoc(b.dataset.src,b.dataset.title));
}

/* 제출본 팝업 — 렌더된 HTML을 iframe으로 띄운다 */
function openDoc(src,title){
  $('#motitle').textContent=title||'산출물 제출본';
  $('#monew').href=src; $('#mof').src=src; $('#mo').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeDoc(){ $('#mo').classList.remove('on'); $('#mof').src='about:blank';
  document.body.style.overflow=''; }
$('#moclose').onclick=closeDoc;
$('#mo').onclick=e=>{ if(e.target.id==='mo') closeDoc(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#mo').classList.contains('on')) closeDoc(); });
$('#dlidx').href=D.docBase+'/index.html';
$('#allins').onclick=()=>{
  const ds=document.querySelectorAll('details.ins'); if(!ds.length)return;
  const open=[...ds].some(d=>!d.open);
  ds.forEach(d=>d.open=open);
  $('#allins').textContent=open?'인사이트 모두 접기':'인사이트 모두 펼치기';
};
$('#tb').onclick=()=>{const r=document.documentElement;
  const now=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme',now==='dark'?'light':'dark');};
render();
})();
</script>
</body>
</html>
